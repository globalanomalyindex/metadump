<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tide Player</title>
<style>
  @property --c1 { syntax: '<color>'; inherits: true; initial-value: #8fe2ff; }
  @property --c2 { syntax: '<color>'; inherits: true; initial-value: #1f86f2; }
  @property --c3 { syntax: '<color>'; inherits: true; initial-value: #0a2a8f; }

  :root {
    --ink: #0b3a86;
    --glass-hi: rgba(255,255,255,.72);
    --glass-lo: rgba(255,255,255,.08);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; min-height: 100%; }

  body {
    min-height: 100vh;
    background: #0a4fc4;
    font-family: "Segoe UI", "Helvetica Neue", Helvetica, system-ui, sans-serif;
    color: #fff;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Background: saturated blue sky over hyperreal grass ---------- */
  .sky {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 60% 38% at 72% 12%, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 80% 50% at 30% 0%, rgba(120,220,255,.55) 0%, rgba(120,220,255,0) 70%),
      linear-gradient(180deg, #0a46c8 0%, #1276ea 42%, #3fb0fb 70%, #a8e6ff 90%, #d9f5ff 100%);
  }
  .glare {
    position: fixed; z-index: 0; top: -260px; right: -180px;
    width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.85) 0%, rgba(255,255,255,.25) 35%, rgba(255,255,255,0) 65%);
    filter: blur(6px);
    pointer-events: none;
  }
  .orb {
    position: fixed; z-index: 0; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 34% 30%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 18%, rgba(190,240,255,.14) 55%, rgba(255,255,255,.06) 72%, rgba(255,255,255,.42) 80%, rgba(255,255,255,0) 84%);
    box-shadow: inset 0 -6px 14px rgba(0,90,220,.18);
    animation: float 16s ease-in-out infinite alternate;
  }
  .o1 { width: 130px; height: 130px; left: 6%;  top: 14%; }
  .o2 { width: 58px;  height: 58px;  left: 18%; top: 62%; animation-duration: 12s; }
  .o3 { width: 96px;  height: 96px;  right: 9%; top: 40%; animation-duration: 19s; }
  .o4 { width: 36px;  height: 36px;  right: 24%; top: 18%; animation-duration: 10s; }
  .o5 { width: 74px;  height: 74px;  left: 42%; top: 8%;  animation-duration: 14s; }
  @keyframes float {
    from { transform: translate3d(0,0,0); }
    to   { transform: translate3d(14px,-22px,0); }
  }

  .grass {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 0;
    width: 100%; height: 300px; display: block; pointer-events: none;
  }

  /* ---------- Stage ---------- */
  .stage {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: grid; place-items: center;
    padding: 36px 16px;
  }

  /* ---------- Player card: blue acrylic / vinyl ---------- */
  .player {
    position: relative;
    width: 384px; max-width: 100%;
    padding: 18px 18px 18px;
    border-radius: 30px;
    background:
      linear-gradient(168deg, rgba(255,255,255,.52) 0%, rgba(255,255,255,.06) 40%, rgba(0,70,190,0) 62%, rgba(0,60,170,.26) 100%),
      linear-gradient(180deg, rgba(130,218,255,.46) 0%, rgba(20,118,240,.40) 100%);
    backdrop-filter: blur(22px) saturate(190%) brightness(1.08);
    -webkit-backdrop-filter: blur(22px) saturate(190%) brightness(1.08);
    border: 1.5px solid rgba(255,255,255,.72);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.95),
      inset 0 -2px 0 rgba(0,50,160,.35),
      inset 0 0 42px rgba(110,210,255,.5),
      inset 0 -30px 50px -20px rgba(0,80,230,.45),
      0 34px 60px -14px rgba(0,30,110,.6),
      0 0 0 6px rgba(255,255,255,.14);
  }
  /* glossy top sheen */
  .player::before {
    content: "";
    position: absolute; left: 0; right: 0; top: 0; height: 46%;
    border-radius: 30px 30px 60% 60% / 30px 30px 22% 22%;
    background: linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.12) 70%, rgba(255,255,255,0) 100%);
    pointer-events: none;
  }
  /* subsurface color bleed from the bottom edge */
  .player::after {
    content: "";
    position: absolute; left: 10%; right: 10%; bottom: -10px; height: 40px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(120,255,140,.55), rgba(120,255,140,0) 70%);
    filter: blur(8px);
    pointer-events: none; z-index: -1;
  }

  .top {
    position: relative; z-index: 1;
    display: flex; align-items: center; justify-content: space-between;
    height: 22px; margin-bottom: 14px;
  }
  .brand { display: flex; align-items: center; gap: 7px; font-weight: 700; letter-spacing: .02em; font-size: 14px; text-shadow: 0 1px 0 rgba(0,60,170,.45), 0 0 10px rgba(190,240,255,.7); }
  .brand svg { width: 18px; height: 18px; filter: drop-shadow(0 1px 1px rgba(0,50,160,.5)); }

  .eq { display: flex; align-items: flex-end; gap: 3px; height: 16px; }
  .eq i {
    display: block; width: 3px; height: 14px; border-radius: 2px;
    background: linear-gradient(180deg, #ffffff, #b8f7ff);
    box-shadow: 0 0 6px rgba(160,240,255,.9);
    transform-origin: bottom;
    animation: eq .9s ease-in-out infinite alternate;
    animation-play-state: paused;
    transform: scaleY(.3);
  }
  .eq i:nth-child(2) { animation-delay: -.3s; animation-duration: .7s; }
  .eq i:nth-child(3) { animation-delay: -.55s; animation-duration: 1.1s; }
  .eq i:nth-child(4) { animation-delay: -.15s; animation-duration: .8s; }
  .is-playing .eq i { animation-play-state: running; }
  @keyframes eq { from { transform: scaleY(.25); } to { transform: scaleY(1); } }

  /* ---------- Artwork: vinyl-glass panel ---------- */
  @property --c1 { syntax: '<color>'; inherits: true; initial-value: #8fe2ff; }
  .art {
    position: relative; z-index: 1;
    height: 168px; border-radius: 22px; overflow: hidden;
    --c1: #8fe2ff; --c2: #1f86f2; --c3: #0a2a8f;
    transition: --c1 .9s ease, --c2 .9s ease, --c3 .9s ease;
    box-shadow:
      inset 0 0 0 1.5px rgba(255,255,255,.75),
      inset 0 -18px 30px rgba(0,40,140,.28),
      0 16px 26px -10px rgba(0,30,110,.6);
  }
  .art svg { width: 100%; height: 100%; display: block; }
  .art::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 48%);
    border-radius: 22px;
  }
  .art .bub { animation: drift 7s ease-in-out infinite alternate; animation-play-state: paused; }
  .art .sun { animation: glow 5s ease-in-out infinite alternate; animation-play-state: paused; }
  .art .b2 { animation-duration: 5s; animation-delay: -2s; }
  .art .b3 { animation-duration: 9s; animation-delay: -4s; }
  .art.is-playing .bub, .art.is-playing .sun { animation-play-state: running; }
  @keyframes drift { from { transform: translate(0,0); } to { transform: translate(6px,-9px); } }
  @keyframes glow { from { opacity: .75; } to { opacity: 1; } }

  /* ---------- Meta ---------- */
  .meta { position: relative; z-index: 1; margin: 14px 2px 12px; min-width: 0; }
  .meta h1 {
    margin: 0; font-size: 22px; font-weight: 760; letter-spacing: -.01em; line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 0 rgba(0,60,170,.5), 0 0 14px rgba(190,240,255,.7);
  }
  .meta p {
    margin: 3px 0 0; font-size: 14px; font-weight: 500; opacity: .92;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 0 rgba(0,60,170,.4);
  }

  /* ---------- Seek ---------- */
  .seek { position: relative; z-index: 1; }
  .progress {
    position: relative; height: 22px; cursor: pointer; touch-action: none;
    outline: none; border-radius: 999px;
  }
  .progress:focus-visible { box-shadow: 0 0 0 2px rgba(255,255,255,.9); }
  .track {
    position: absolute; left: 0; right: 0; top: 50%; height: 12px; margin-top: -6px;
    border-radius: 999px; overflow: visible;
    background: linear-gradient(180deg, rgba(0,40,120,.55), rgba(0,70,190,.28));
    box-shadow:
      inset 0 2px 4px rgba(0,30,100,.55),
      inset 0 -1px 0 rgba(255,255,255,.35),
      0 1px 0 rgba(255,255,255,.8);
  }
  .fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    border-radius: 999px;
    background: linear-gradient(180deg, #e9fdff 0%, #6ff3ff 38%, #18cfff 62%, #0a86e8 100%);
    box-shadow: 0 0 12px rgba(120,240,255,.9), inset 0 1px 0 rgba(255,255,255,.95);
  }
  .knob {
    position: absolute; top: 50%; left: 0%;
    width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, #ffffff 0%, #d8f8ff 40%, #6fd6ff 78%, #2aa0f2 100%);
    border: 1px solid rgba(255,255,255,.95);
    box-shadow: 0 2px 6px rgba(0,40,120,.55), 0 0 10px rgba(150,240,255,.85);
    transition: transform .15s ease;
    pointer-events: none;
  }
  .progress:hover .knob, .progress.dragging .knob { transform: scale(1.2); }
  .times {
    display: flex; justify-content: space-between; margin-top: 4px;
    font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 0 rgba(0,60,170,.45);
  }

  /* ---------- Controls ---------- */
  .controls {
    position: relative; z-index: 1;
    display: flex; align-items: center; justify-content: center; gap: 24px;
    margin: 14px 0 14px;
  }
  .btn {
    position: relative; border: 0; padding: 0; cursor: pointer;
    display: grid; place-items: center;
    border-radius: 50%; color: #0a4fbf;
    background: radial-gradient(circle at 50% 28%, #ffffff 0%, #dff5ff 42%, #86cdfb 100%);
    box-shadow:
      inset 0 -5px 9px rgba(0,70,190,.38),
      inset 0 2px 3px rgba(255,255,255,.95),
      0 7px 14px -5px rgba(0,30,110,.65),
      0 0 0 1px rgba(255,255,255,.75);
    transition: transform .15s ease, filter .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn::before {
    content: ""; position: absolute; left: 14%; right: 14%; top: 6%; height: 44%;
    border-radius: 50%;
    background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0) 100%);
    opacity: .85; pointer-events: none;
  }
  .btn svg {
    position: relative; width: 40%; height: 40%; fill: currentColor;
    filter: drop-shadow(0 1px 0 rgba(255,255,255,.9));
  }
  .btn.side { width: 54px; height: 54px; }
  .btn.play {
    width: 78px; height: 78px; color: #fff;
    background: radial-gradient(circle at 40% 26%, #f6ffe2 0%, #8aff62 20%, #26df4c 52%, #0c8c2d 86%, #0a6e24 100%);
    box-shadow:
      inset 0 -7px 12px rgba(0,80,20,.45),
      inset 0 3px 5px rgba(255,255,255,.92),
      0 12px 24px -8px rgba(0,60,20,.7),
      0 0 0 1px rgba(255,255,255,.65),
      0 0 26px rgba(130,255,130,.5);
  }
  .btn.play svg { width: 34%; height: 34%; filter: drop-shadow(0 1px 2px rgba(0,60,20,.55)); }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: scale(.93); }
  .btn:focus-visible, .q-item:focus-visible, .vol input:focus-visible {
    outline: 3px solid rgba(255,255,255,.95); outline-offset: 3px;
  }

  /* ---------- Volume ---------- */
  .vol {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 10px;
    margin: 0 4px 16px;
  }
  .vol svg { width: 18px; height: 18px; flex: 0 0 auto; fill: #fff; filter: drop-shadow(0 1px 1px rgba(0,50,160,.5)); }
  .vol input[type=range] {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 22px; margin: 0; background: transparent; cursor: pointer;
    --v: 70%;
  }
  .vol input[type=range]::-webkit-slider-runnable-track {
    height: 10px; border-radius: 999px;
    background: linear-gradient(90deg, #eafcff 0, #7ef2ff var(--v), rgba(0,40,120,.35) var(--v), rgba(0,40,120,.35) 100%);
    box-shadow: inset 0 2px 3px rgba(0,30,100,.5), 0 1px 0 rgba(255,255,255,.75);
  }
  .vol input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 20px; height: 20px; margin-top: -5px; border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, #ffffff, #c8f5ff 40%, #3ab4f5 85%);
    border: 1px solid rgba(255,255,255,.95);
    box-shadow: 0 2px 5px rgba(0,40,120,.5);
  }
  .vol input[type=range]::-moz-range-track {
    height: 10px; border-radius: 999px;
    background: rgba(0,40,120,.35);
    box-shadow: inset 0 2px 3px rgba(0,30,100,.5), 0 1px 0 rgba(255,255,255,.75);
  }
  .vol input[type=range]::-moz-range-progress {
    height: 10px; border-radius: 999px;
    background: linear-gradient(90deg, #eafcff, #7ef2ff);
  }
  .vol input[type=range]::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, #ffffff, #c8f5ff 40%, #3ab4f5 85%);
    border: 1px solid rgba(255,255,255,.95);
    box-shadow: 0 2px 5px rgba(0,40,120,.5);
  }
  .vol-val { width: 26px; text-align: right; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; text-shadow: 0 1px 0 rgba(0,60,170,.45); }

  /* ---------- Queue ---------- */
  .queue { position: relative; z-index: 1; }
  .queue h2 {
    margin: 0 0 8px 4px; font-size: 11px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase; opacity: .95;
    text-shadow: 0 1px 0 rgba(0,60,170,.45);
  }
  .queue ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .q-item {
    width: 100%; display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 12px;
    padding: 5px 12px 5px 5px; border-radius: 16px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.55); color: #fff; font: inherit; text-align: left;
    background: linear-gradient(180deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,.14) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.85), inset 0 -6px 10px -6px rgba(0,60,190,.35), 0 5px 10px -7px rgba(0,30,110,.7);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: background .2s ease, transform .2s ease;
  }
  .q-item:hover { transform: translateX(3px); background: linear-gradient(180deg, rgba(255,255,255,.62) 0%, rgba(255,255,255,.22) 100%); }
  .q-thumb {
    position: relative; width: 36px; height: 36px; border-radius: 11px; overflow: hidden;
    background: linear-gradient(135deg, var(--c1) 0%, var(--c2) 55%, var(--c3) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 2px 6px rgba(0,30,100,.45);
  }
  .q-thumb::after {
    content: ""; position: absolute; left: 8%; right: 8%; top: 4%; height: 46%; border-radius: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,0));
  }
  .q-meta { min-width: 0; }
  .q-title { font-size: 14px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 0 rgba(0,60,170,.4); }
  .q-artist { font-size: 12px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .q-dur { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; opacity: .92; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="sky" aria-hidden="true"></div>
<div class="glare" aria-hidden="true"></div>
<div class="orb o1" aria-hidden="true"></div>
<div class="orb o2" aria-hidden="true"></div>
<div class="orb o3" aria-hidden="true"></div>
<div class="orb o4" aria-hidden="true"></div>
<div class="orb o5" aria-hidden="true"></div>

<svg class="grass" viewBox="0 0 1280 300" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="gBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9dff5e"/>
      <stop offset=".5" stop-color="#2fdc4a"/>
      <stop offset="1" stop-color="#0b7f25"/>
    </linearGradient>
    <linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4ff74"/>
      <stop offset=".35" stop-color="#40f257"/>
      <stop offset="1" stop-color="#06661c"/>
    </linearGradient>
    <pattern id="blades" width="22" height="46" patternUnits="userSpaceOnUse">
      <path d="M3 46 Q4 18 11 2 Q10 22 15 46 Z" fill="#0c8f2c" opacity=".5"/>
      <path d="M12 46 Q13 26 19 12 Q17 30 21 46 Z" fill="#8dff66" opacity=".35"/>
    </pattern>
  </defs>
  <path d="M0 118 C 180 66, 380 92, 600 64 S 1010 60, 1280 96 L1280 300 L0 300 Z" fill="url(#gBack)"/>
  <path d="M0 160 C 220 112, 470 150, 700 126 S 1080 118, 1280 150 L1280 300 L0 300 Z" fill="url(#gFront)"/>
  <path d="M0 160 C 220 112, 470 150, 700 126 S 1080 118, 1280 150 L1280 300 L0 300 Z" fill="url(#blades)"/>
  <path d="M0 160 C 220 112, 470 150, 700 126 S 1080 118, 1280 150" fill="none" stroke="#f0ffd0" stroke-width="2.5" opacity=".75"/>
</svg>

<main class="stage">
  <section class="player" id="player" aria-label="Tide music player">

    <header class="top">
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <linearGradient id="logoG" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff"/>
              <stop offset="1" stop-color="#7fe0ff"/>
            </linearGradient>
          </defs>
          <path d="M12 2c4 5.5 6.5 8.6 6.5 12a6.5 6.5 0 0 1-13 0C5.5 10.6 8 7.5 12 2z" fill="url(#logoG)"/>
        </svg>
        <span>Tide</span>
      </div>
      <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </header>

    <div class="art" id="art">
      <svg viewBox="0 0 344 168" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="artSky" x1="0" y1="0" x2=".6" y2="1">
            <stop offset="0" style="stop-color:var(--c1)"/>
            <stop offset=".55" style="stop-color:var(--c2)"/>
            <stop offset="1" style="stop-color:var(--c3)"/>
          </linearGradient>
          <radialGradient id="artSun">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
            <stop offset=".45" style="stop-color:var(--c1)" stop-opacity=".6"/>
            <stop offset="1" style="stop-color:var(--c1)" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="artBubble" cx="35%" cy="30%" r="70%">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
            <stop offset=".3" stop-color="#ffffff" stop-opacity=".18"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
          </radialGradient>
          <linearGradient id="artGrass" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" style="stop-color:var(--c2)"/>
            <stop offset="1" style="stop-color:var(--c3)"/>
          </linearGradient>
          <linearGradient id="artGloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".7"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <rect width="344" height="168" fill="url(#artSky)"/>
        <circle class="sun" cx="248" cy="46" r="92" fill="url(#artSun)"/>
        <path d="M0 124 C 80 90, 160 116, 230 100 S 320 86, 344 96 L344 168 L0 168 Z" fill="url(#artGrass)" opacity=".92"/>
        <path d="M0 124 C 80 90, 160 116, 230 100 S 320 86, 344 96" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="1.5"/>
        <circle class="bub b1" cx="74" cy="58" r="26" fill="url(#artBubble)"/>
        <circle class="bub b2" cx="152" cy="32" r="13" fill="url(#artBubble)"/>
        <circle class="bub b3" cx="302" cy="132" r="30" fill="url(#artBubble)"/>
        <path d="M0 0 H344 V62 C 240 78, 120 38, 0 68 Z" fill="url(#artGloss)" opacity=".42"/>
      </svg>
    </div>

    <div class="meta">
      <h1 id="title">Track</h1>
      <p id="artist">Artist</p>
    </div>

    <div class="seek">
      <div class="progress" id="progress" role="slider" tabindex="0"
           aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0:00">
        <div class="track">
          <div class="fill" id="fill"></div>
        </div>
        <div class="knob" id="knob"></div>
      </div>
      <div class="times">
        <span id="elapsed">0:00</span>
        <span id="remain">-0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn side" id="prev" type="button" aria-label="Previous track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="2.6" height="14" rx="1"/><path d="M19 5v14L8.2 12z"/></svg>
      </button>
      <button class="btn play" id="play" type="button" aria-label="Play">
        <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.6-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
      </button>
      <button class="btn side" id="next" type="button" aria-label="Next track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="16.4" y="5" width="2.6" height="14" rx="1"/><path d="M5 5v14l10.8-7z"/></svg>
      </button>
    </div>

    <div class="vol">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 9h4l5-4.5v15L7 15H3z"/>
        <g id="volWaves"><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
        <g id="volMuted" style="display:none"><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
      </svg>
      <input id="vol" type="range" min="0" max="100" value="70" aria-label="Volume">
      <span class="vol-val" id="volVal">70</span>
    </div>

    <section class="queue" aria-label="Up next">
      <h2>Up next</h2>
      <ul id="queue"></ul>
    </section>

  </section>
</main>

<script>
(function () {
  "use strict";

  var TRACKS = [
    { title: "Glass Horizon",      artist: "Lumen Coast",  dur: 214, c: ["#8fe2ff", "#1f86f2", "#0a2a8f"] },
    { title: "Chlorophyll Dreams", artist: "Verdant Hour", dur: 187, c: ["#c4ff7a", "#34d64c", "#0a6b2c"] },
    { title: "Overexposed",        artist: "Halo Static",  dur: 243, c: ["#ffffff", "#bfe4ff", "#4e9dff"] },
    { title: "Cerulean Vinyl",     artist: "Tide Choir",   dur: 198, c: ["#5fd0ff", "#0d56db", "#061e72"] },
    { title: "Bubble Print",       artist: "Aqua Index",   dur: 226, c: ["#e2ff8a", "#3fe6d2", "#0e74c2"] },
    { title: "Summer Vapor",       artist: "Neon Lagoon",  dur: 175, c: ["#b2f6ff", "#4a9bff", "#1c3dbc"] }
  ];
  var N = TRACKS.length;
  var QUEUE_LEN = 4;

  var PLAY_PATH  = "M8 5.5v13a1 1 0 0 0 1.5.86l10.6-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z";
  var PAUSE_PATH = "M6.5 5h4v14h-4zM13.5 5h4v14h-4z";

  var state = { index: 0, playing: false, pos: 62, volume: 70 };
  var dragging = false;

  var $ = function (s) { return document.querySelector(s); };
  var player = $("#player"), art = $("#art"), titleEl = $("#title"), artistEl = $("#artist");
  var bar = $("#progress"), fill = $("#fill"), knob = $("#knob");
  var elapsedEl = $("#elapsed"), remainEl = $("#remain");
  var playBtn = $("#play"), playIcon = $("#playIcon"), prevBtn = $("#prev"), nextBtn = $("#next");
  var vol = $("#vol"), volVal = $("#volVal"), volWaves = $("#volWaves"), volMuted = $("#volMuted");
  var queueEl = $("#queue");

  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function current() { return TRACKS[state.index]; }

  function setArtColors(t) {
    art.style.setProperty("--c1", t.c[0]);
    art.style.setProperty("--c2", t.c[1]);
    art.style.setProperty("--c3", t.c[2]);
  }

  function buildQueue() {
    queueEl.textContent = "";
    for (var k = 1; k <= QUEUE_LEN; k++) {
      var i = (state.index + k) % N;
      var t = TRACKS[i];

      var li = document.createElement("li");
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "q-item";
      btn.setAttribute("data-i", String(i));
      btn.setAttribute("aria-label", "Play " + t.title + " by " + t.artist);

      var thumb = document.createElement("span");
      thumb.className = "q-thumb";
      thumb.style.setProperty("--c1", t.c[0]);
      thumb.style.setProperty("--c2", t.c[1]);
      thumb.style.setProperty("--c3", t.c[2]);

      var meta = document.createElement("span");
      meta.className = "q-meta";
      var title = document.createElement("span");
      title.className = "q-title";
      title.style.display = "block";
      title.textContent = t.title;
      var artist = document.createElement("span");
      artist.className = "q-artist";
      artist.style.display = "block";
      artist.textContent = t.artist;
      meta.appendChild(title);
      meta.appendChild(artist);

      var dur = document.createElement("span");
      dur.className = "q-dur";
      dur.textContent = fmt(t.dur);

      btn.appendChild(thumb);
      btn.appendChild(meta);
      btn.appendChild(dur);
      li.appendChild(btn);
      queueEl.appendChild(li);
    }
  }

  function renderProgress() {
    var t = current();
    var pos = Math.min(Math.max(state.pos, 0), t.dur);
    var p = t.dur > 0 ? pos / t.dur : 0;
    fill.style.width = (p * 100) + "%";
    knob.style.left = (p * 100) + "%";
    elapsedEl.textContent = fmt(pos);
    remainEl.textContent = "-" + fmt(t.dur - pos);
    bar.setAttribute("aria-valuemax", String(t.dur));
    bar.setAttribute("aria-valuenow", String(Math.floor(pos)));
    bar.setAttribute("aria-valuetext", fmt(pos) + " of " + fmt(t.dur));
  }

  function renderTrack() {
    var t = current();
    titleEl.textContent = t.title;
    artistEl.textContent = t.artist;
    setArtColors(t);
    buildQueue();
    renderProgress();
  }

  function setPlaying(v) {
    state.playing = v;
    player.classList.toggle("is-playing", v);
    art.classList.toggle("is-playing", v);
    playIcon.firstElementChild.setAttribute("d", v ? PAUSE_PATH : PLAY_PATH);
    playBtn.setAttribute("aria-label", v ? "Pause" : "Play");
    playBtn.setAttribute("aria-pressed", v ? "true" : "false");
  }

  function togglePlay() { setPlaying(!state.playing); }

  function step(n) {
    state.index = (state.index + n + N) % N;
    state.pos = 0;
    renderTrack();
  }
  function next() { step(1); }
  function prev() {
    if (state.pos > 3) { state.pos = 0; renderProgress(); }
    else { step(-1); }
  }

  function selectIndex(i) {
    state.index = i;
    state.pos = 0;
    renderTrack();
  }

  function applyVolume() {
    vol.style.setProperty("--v", state.volume + "%");
    volVal.textContent = String(state.volume);
    var muted = state.volume === 0;
    volWaves.style.display = muted ? "none" : "";
    volMuted.style.display = muted ? "" : "none";
    vol.setAttribute("aria-valuetext", state.volume + " percent");
  }

  /* ---- Seek: click or drag ---- */
  function seekTo(clientX) {
    var r = bar.getBoundingClientRect();
    var f = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    state.pos = f * current().dur;
    renderProgress();
  }
  bar.addEventListener("pointerdown", function (e) {
    if (e.button !== 0) return;
    dragging = true;
    bar.classList.add("dragging");
    bar.setPointerCapture(e.pointerId);
    seekTo(e.clientX);
  });
  bar.addEventListener("pointermove", function (e) {
    if (dragging) seekTo(e.clientX);
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    bar.classList.remove("dragging");
  }
  bar.addEventListener("pointerup", endDrag);
  bar.addEventListener("pointercancel", endDrag);
  bar.addEventListener("lostpointercapture", endDrag);
  bar.addEventListener("keydown", function (e) {
    var dur = current().dur;
    var handled = true;
    if (e.key === "ArrowRight" || e.key === "ArrowUp") state.pos += 5;
    else if (e.key === "ArrowLeft" || e.key === "ArrowDown") state.pos -= 5;
    else if (e.key === "Home") state.pos = 0;
    else if (e.key === "End") state.pos = dur;
    else handled = false;
    if (handled) {
      e.preventDefault();
      state.pos = Math.min(Math.max(state.pos, 0), dur);
      renderProgress();
    }
  });

  /* ---- Controls ---- */
  playBtn.addEventListener("click", togglePlay);
  prevBtn.addEventListener("click", prev);
  nextBtn.addEventListener("click", next);

  queueEl.addEventListener("click", function (e) {
    var btn = e.target.closest(".q-item");
    if (!btn) return;
    selectIndex(parseInt(btn.getAttribute("data-i"), 10));
  });

  vol.addEventListener("input", function () {
    state.volume = parseInt(vol.value, 10);
    applyVolume();
  });

  document.addEventListener("keydown", function (e) {
    if (e.code !== "Space") return;
    var tag = e.target && e.target.tagName;
    if (tag === "BUTTON" || tag === "INPUT" || tag === "A") return;
    if (e.target && e.target.getAttribute && e.target.getAttribute("role") === "slider") return;
    e.preventDefault();
    togglePlay();
  });

  /* ---- Clock: advances progress while playing ---- */
  var last = performance.now();
  function tick(now) {
    var dt = Math.min(1, Math.max(0, (now - last) / 1000));
    last = now;
    if (state.playing && !dragging) {
      state.pos += dt;
      if (state.pos >= current().dur) {
        step(1);
        setPlaying(true);
      }
    }
    renderProgress();
    requestAnimationFrame(tick);
  }

  /* ---- Init ---- */
  renderTrack();
  setPlaying(false);
  applyVolume();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
