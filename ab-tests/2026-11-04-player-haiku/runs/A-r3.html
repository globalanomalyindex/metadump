<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tide Player</title>
<style>
  :root {
    --font: "Segoe UI", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    --ink-shadow: 0 1px 2px rgba(0, 40, 140, .45);
    --focus: rgba(200, 255, 140, .95);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font);
    color: #fff;
    display: grid;
    place-items: center;
    padding: 24px 16px 40px;
    overflow-x: hidden;
    background:
      radial-gradient(38% 34% at 74% 14%, rgba(255, 255, 255, .95), rgba(235, 250, 255, .55) 45%, rgba(235, 250, 255, 0) 100%),
      radial-gradient(60% 40% at 12% 8%, rgba(160, 230, 255, .55), rgba(160, 230, 255, 0) 70%),
      linear-gradient(180deg, #0f6bff 0%, #0a58ee 48%, #0a3fc0 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, .bar:focus-visible, input[type=range]:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 3px;
  }

  /* ---------- Scene: sky, drifting glass bubbles, electric green hills ---------- */
  .scene { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .scene .hills { position: absolute; left: 0; bottom: 0; width: 100%; height: 44%; }
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .95) 0 8%, rgba(255, 255, 255, .25) 18%, rgba(140, 225, 255, .18) 60%, rgba(40, 140, 255, .45) 100%);
    box-shadow: inset 0 -4px 10px rgba(0, 80, 220, .35), 0 0 0 1px rgba(255, 255, 255, .25);
    animation: drift 14s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(12px, -26px, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bubble, .card.is-playing .art::after, .card.is-playing .orb.play { animation: none !important; }
  }

  /* ---------- Card: blue acrylic with internal light ---------- */
  .card {
    position: relative;
    isolation: isolate;
    width: 380px;
    max-width: 100%;
    padding: 18px 18px 20px;
    border-radius: 30px;
    overflow: hidden;
    background:
      linear-gradient(170deg, rgba(214, 242, 255, .62) 0%, rgba(96, 190, 255, .34) 40%, rgba(30, 110, 240, .36) 100%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, .75);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .9),
      inset 0 -18px 30px -12px rgba(0, 70, 200, .45),
      inset 1px 1px 0 rgba(255, 255, 255, .45),
      inset 0 -10px 22px -8px rgba(120, 220, 255, .4),
      0 30px 60px -18px rgba(0, 25, 110, .65),
      0 0 0 1px rgba(10, 70, 200, .2);
  }
  .card::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    background: radial-gradient(120% 60% at 20% -10%, rgba(255, 255, 255, .85), rgba(255, 255, 255, 0) 55%);
    opacity: .55;
    pointer-events: none;
    z-index: -1;
  }
  .card::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, .22) 48%, transparent 56%);
    pointer-events: none;
    z-index: -1;
  }

  /* Header */
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: .02em; text-shadow: 0 1px 2px rgba(0, 50, 160, .5); }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 9px;
    display: grid; place-items: center;
    background: radial-gradient(circle at 35% 25%, #fff 0 10%, #bfefff 30%, #2aa8ff 70%, #0a52d6 100%);
    box-shadow: inset 0 -2px 4px rgba(0, 50, 160, .5), 0 2px 6px rgba(0, 40, 140, .35);
  }
  .brand-mark svg { width: 18px; height: 18px; }
  .kicker {
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .14em;
    padding: 4px 10px; border-radius: 999px; color: #f2fbff;
    background: linear-gradient(rgba(255, 255, 255, .45), rgba(255, 255, 255, .1));
    border: 1px solid rgba(255, 255, 255, .6);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8), 0 1px 3px rgba(0, 40, 140, .25);
  }

  /* Artwork: a glowing sky-and-grass window with a glossy rim */
  .art {
    position: relative; height: 176px; border-radius: 22px; overflow: hidden; isolation: isolate;
    background: #2a7bff;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .7), 0 14px 26px -10px rgba(0, 30, 120, .6);
  }
  #art { position: absolute; inset: 0; }
  #art svg { display: block; width: 100%; height: 100%; }
  .art .gloss {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(255, 255, 255, .5) 0%, rgba(255, 255, 255, .1) 40%, rgba(255, 255, 255, 0) 55%);
  }
  .art .rim {
    position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .6), inset 0 -18px 30px -10px rgba(0, 50, 190, .35);
  }
  .art::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .35) 50%, transparent 65%);
    transform: translateX(-100%);
  }
  .card.is-playing .art::after { animation: sheen 3.4s ease-in-out infinite; }
  @keyframes sheen { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  /* Meta */
  .meta { margin: 14px 2px 0; }
  .meta h1 {
    margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 2px rgba(0, 50, 160, .5);
  }
  .meta p { margin: 2px 0 0; font-size: 14px; color: #dff4ff; text-shadow: var(--ink-shadow); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Progress: a glass tube filled with lit green */
  .progress { margin-top: 14px; }
  .bar {
    position: relative; height: 14px; margin: 0 6px; border-radius: 999px; cursor: pointer; touch-action: none;
    background: linear-gradient(180deg, rgba(0, 40, 140, .55), rgba(40, 130, 255, .28));
    box-shadow: inset 0 2px 4px rgba(0, 30, 120, .6), 0 1px 0 rgba(255, 255, 255, .7);
  }
  .fill {
    position: absolute; top: 2px; bottom: 2px; left: 2px; width: 0%;
    border-radius: 999px; overflow: hidden;
    background: linear-gradient(180deg, #f3ffd9 0%, #8dff4d 35%, #2fe83a 70%, #0fbf3a 100%);
    box-shadow: 0 1px 2px rgba(0, 60, 40, .35), inset 0 -1px 2px rgba(0, 90, 20, .5);
  }
  .fill::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 50%;
    background: linear-gradient(rgba(255, 255, 255, .85), rgba(255, 255, 255, .1));
  }
  .thumb {
    position: absolute; top: 50%; left: 0%;
    width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%;
    background: radial-gradient(circle at 50% 25%, #fff 0 18%, #e6fbff 35%, #7fd0ff 70%, #2f8fff 100%);
    box-shadow: 0 2px 6px rgba(0, 40, 140, .5), inset 0 -2px 3px rgba(0, 60, 200, .4), 0 0 0 2px rgba(255, 255, 255, .7);
    transition: transform .15s ease;
    pointer-events: none;
  }
  .bar:hover .thumb, .bar.dragging .thumb { transform: scale(1.12); }
  .times {
    display: flex; justify-content: space-between; margin: 8px 6px 0;
    font-size: 12px; font-variant-numeric: tabular-nums; color: #eaf9ff; text-shadow: var(--ink-shadow);
  }

  /* Transport */
  .controls { display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: 12px; }
  .orb {
    position: relative;
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center; color: #0a4fd0;
    border: 1px solid rgba(255, 255, 255, .85);
    background: radial-gradient(circle at 50% 18%, #fff 0%, rgba(255, 255, 255, .7) 14%, rgba(150, 225, 255, .55) 45%, rgba(30, 120, 255, .75) 100%);
    box-shadow: inset 0 -8px 14px rgba(0, 50, 200, .4), inset 0 2px 3px rgba(255, 255, 255, .9), 0 8px 16px -4px rgba(0, 30, 130, .6);
    transition: transform .12s ease, filter .2s ease;
  }
  .orb::before {
    content: ""; position: absolute; top: 5px; left: 14%; right: 14%; height: 42%;
    border-radius: 999px 999px 40px 40px;
    background: linear-gradient(rgba(255, 255, 255, .8), rgba(255, 255, 255, .05));
    pointer-events: none;
  }
  .orb svg { position: relative; z-index: 1; width: 20px; height: 20px; fill: currentColor; filter: drop-shadow(0 1px 0 rgba(255, 255, 255, .8)); }
  .orb:hover { filter: brightness(1.06); }
  .orb:active { transform: scale(.94); }
  .orb.play {
    width: 72px; height: 72px; color: #fff;
    border-color: rgba(255, 255, 255, .95);
    background: radial-gradient(circle at 50% 72%, #eaffb4 0%, rgba(120, 255, 70, .92) 22%, rgba(30, 200, 70, .85) 45%, rgba(0, 110, 190, .85) 80%, rgba(0, 70, 190, .92) 100%);
    box-shadow:
      inset 0 -10px 18px rgba(0, 90, 40, .35),
      inset 0 3px 4px rgba(255, 255, 255, .9),
      0 0 0 4px rgba(255, 255, 255, .22),
      0 10px 22px -4px rgba(0, 80, 60, .55);
  }
  .orb.play svg { width: 26px; height: 26px; }
  .card.is-playing .orb.play { animation: glow 2.4s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.12); } }

  /* Volume */
  .volume { display: flex; align-items: center; gap: 10px; margin: 14px 4px 0; color: #f2fbff; }
  .icon-btn { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; filter: drop-shadow(0 1px 2px rgba(0, 40, 140, .5)); }
  .icon-btn svg { width: 18px; height: 18px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 12px; margin: 0; background: transparent; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 10px; border-radius: 999px;
    background: linear-gradient(90deg, #a8ff5c 0 var(--v, 70%), rgba(0, 40, 140, .38) var(--v, 70%) 100%);
    box-shadow: inset 0 1px 3px rgba(0, 30, 120, .5);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; margin-top: -4px; border-radius: 50%;
    border: 1px solid #fff;
    background: radial-gradient(circle at 50% 25%, #fff 0 18%, #e6fbff 35%, #7fd0ff 70%, #2f8fff 100%);
    box-shadow: 0 2px 5px rgba(0, 40, 140, .5);
  }
  input[type=range]::-moz-range-track {
    height: 10px; border-radius: 999px; background: rgba(0, 40, 140, .38);
    box-shadow: inset 0 1px 3px rgba(0, 30, 120, .5);
  }
  input[type=range]::-moz-range-progress { height: 10px; border-radius: 999px; background: #a8ff5c; }
  input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    border: 1px solid #fff;
    background: radial-gradient(circle at 50% 25%, #fff 0 18%, #e6fbff 35%, #7fd0ff 70%, #2f8fff 100%);
  }
  .vol-val { width: 26px; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; text-shadow: var(--ink-shadow); }

  /* Up next: a glass tray with glossy rows */
  .queue {
    margin-top: 16px; padding: 10px;
    border-radius: 20px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .34), rgba(255, 255, 255, .12));
    border: 1px solid rgba(255, 255, 255, .55);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8), inset 0 -8px 16px rgba(0, 60, 190, .18), 0 6px 14px -8px rgba(0, 30, 120, .5);
  }
  .queue h2 {
    margin: 2px 6px 8px; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: #f1fbff; text-shadow: var(--ink-shadow);
  }
  .queue ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .q-item {
    width: 100%; display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px;
    padding: 4px 10px 4px 4px; border-radius: 14px; text-align: left;
    background: linear-gradient(180deg, rgba(255, 255, 255, .28), rgba(255, 255, 255, .08));
    border: 1px solid rgba(255, 255, 255, .45);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7);
    transition: background .2s ease, transform .15s ease;
  }
  .q-item:hover { background: linear-gradient(180deg, rgba(255, 255, 255, .45), rgba(255, 255, 255, .16)); transform: translateX(2px); }
  .q-thumb { width: 40px; height: 40px; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255, 255, 255, .7), 0 3px 6px -2px rgba(0, 30, 120, .5); }
  .q-thumb svg { display: block; width: 100%; height: 100%; }
  .q-text { min-width: 0; display: grid; }
  .q-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: var(--ink-shadow); }
  .q-artist { font-size: 12px; color: #dff4ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q-dur { font-size: 12px; font-variant-numeric: tabular-nums; color: #eaf9ff; }

  .foot {
    position: fixed; left: 0; right: 0; bottom: 10px; margin: 0; text-align: center;
    font-size: 12px; color: rgba(255, 255, 255, .85); text-shadow: var(--ink-shadow); pointer-events: none;
  }
</style>
</head>
<body>

<div class="scene" aria-hidden="true">
  <span class="bubble" style="left:8%;top:12%;width:86px;height:86px;animation-duration:16s"></span>
  <span class="bubble" style="left:82%;top:10%;width:54px;height:54px;animation-duration:12s;animation-delay:-4s"></span>
  <span class="bubble" style="left:12%;top:58%;width:120px;height:120px;animation-duration:19s;animation-delay:-7s"></span>
  <span class="bubble" style="left:78%;top:52%;width:72px;height:72px;animation-duration:14s;animation-delay:-2s"></span>
  <span class="bubble" style="left:50%;top:22%;width:34px;height:34px;animation-duration:11s"></span>
  <svg class="hills" viewBox="0 0 1280 320" preserveAspectRatio="xMidYMax slice">
    <defs>
      <linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d4ff6a"/>
        <stop offset=".12" stop-color="#5cff2e"/>
        <stop offset=".5" stop-color="#17e03c"/>
        <stop offset="1" stop-color="#00822f"/>
      </linearGradient>
      <linearGradient id="gBack" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e8fbff" stop-opacity=".9"/>
        <stop offset="1" stop-color="#7fdcff" stop-opacity=".35"/>
      </linearGradient>
      <linearGradient id="gGloss" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="M-20,120 C140,60 260,84 420,116 S700,60 860,96 S1120,50 1300,96 L1300,320 L-20,320 Z" fill="url(#gBack)"/>
    <path d="M-20,196 C120,150 300,156 470,186 S760,140 930,172 S1180,150 1300,182 L1300,320 L-20,320 Z" fill="url(#gFront)"/>
    <path d="M-20,196 C120,150 300,156 470,186 S760,140 930,172 S1180,150 1300,182" fill="none" stroke="#f6ffe0" stroke-width="3" stroke-opacity=".9"/>
    <path d="M-20,196 C120,150 300,156 470,186 S760,140 930,172 S1180,150 1300,182 L1300,215 C1000,240 600,205 -20,236 Z" fill="url(#gGloss)" opacity=".7"/>
  </svg>
</div>

<main class="card" id="card">
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M3 14c3-4 6-4 9 0s6 4 9 0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M3 9.5c3-4 6-4 9 0s6 4 9 0" fill="none" stroke="#c9f7ff" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
        </svg>
      </span>
      Tide
    </div>
    <span class="kicker">Now playing</span>
  </header>

  <div class="art">
    <div id="art"></div>
    <div class="gloss"></div>
    <div class="rim"></div>
  </div>

  <div class="meta">
    <h1 id="title"></h1>
    <p id="artist"></p>
  </div>

  <div class="progress">
    <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="fill" id="fill"></div>
      <div class="thumb" id="thumb"></div>
    </div>
    <div class="times">
      <span id="elapsed">0:00</span>
      <span id="remaining">-0:00</span>
    </div>
  </div>

  <div class="controls">
    <button class="orb" id="prev" type="button" aria-label="Previous track"></button>
    <button class="orb play" id="play" type="button" aria-label="Play"></button>
    <button class="orb" id="next" type="button" aria-label="Next track"></button>
  </div>

  <div class="volume">
    <button class="icon-btn" id="mute" type="button" aria-label="Mute"></button>
    <input id="vol" type="range" min="0" max="100" step="1" value="70" aria-label="Volume">
    <span class="vol-val" id="volVal">70</span>
  </div>

  <section class="queue" aria-labelledby="qh">
    <h2 id="qh">Up next</h2>
    <ol id="queue"></ol>
  </section>
</main>

<p class="foot">Prototype: playback is simulated, no audio</p>

<script>
(function () {
  "use strict";

  var TRACKS = [
    { title: "Glass Tide",       artist: "Halcyon Wave",     dur: 214, sky: ["#8fe3ff", "#1769ff"], seed: 11 },
    { title: "Chlorophyll Sky",  artist: "Meadow Signal",    dur: 187, sky: ["#bff3ff", "#0b4fe0"], seed: 42 },
    { title: "Overexposed",      artist: "Ultramarine Club", dur: 243, sky: ["#d9f8ff", "#2a6bff"], seed: 7 },
    { title: "Vinyl Horizon",    artist: "Aero Parlor",      dur: 198, sky: ["#7ad9ff", "#0a3fc4"], seed: 99 },
    { title: "Pool Light",       artist: "Cyan Static",      dur: 226, sky: ["#a6ecff", "#1f7bff"], seed: 2024 },
    { title: "Green Hour",       artist: "Sunroom Fountain", dur: 205, sky: ["#c7f5ff", "#0d5cf2"], seed: 314 }
  ];

  var QUEUE_SIZE = 4;
  var n = TRACKS.length;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var uid = 0;

  var $ = function (s) { return document.querySelector(s); };
  var els = {
    card: $("#card"), art: $("#art"), title: $("#title"), artist: $("#artist"),
    bar: $("#bar"), fill: $("#fill"), thumb: $("#thumb"),
    elapsed: $("#elapsed"), remaining: $("#remaining"),
    prev: $("#prev"), play: $("#play"), next: $("#next"),
    queue: $("#queue"), vol: $("#vol"), volVal: $("#volVal"), mute: $("#mute")
  };

  var state = { i: 0, pos: 58, playing: false, dragging: false, vol: 70, prevVol: 70 };

  var ICON = {
    play:  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
    prev:  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zM18 6v12l-8.5-6z"/></svg>',
    next:  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM6 6v12l8.5-6z"/></svg>'
  };

  function rng(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function ridge(P) {
    var d = "M" + P[0][0].toFixed(1) + "," + P[0][1].toFixed(1);
    for (var i = 1; i < P.length - 1; i++) {
      var mx = (P[i][0] + P[i + 1][0]) / 2, my = (P[i][1] + P[i + 1][1]) / 2;
      d += "Q" + P[i][0].toFixed(1) + "," + P[i][1].toFixed(1) + " " + mx.toFixed(1) + "," + my.toFixed(1);
    }
    var L = P[P.length - 1];
    return d + "L" + L[0].toFixed(1) + "," + L[1].toFixed(1);
  }

  // Each call builds an inline SVG scene from the track's seed and palette.
  function artSVG(t) {
    var R = rng(t.seed);
    var f = function (a, b) { return a + (b - a) * R(); };
    var id = "g" + (++uid);
    var top = t.sky[0], bot = t.sky[1];
    var sx = f(60, 300), sy = f(26, 64), sr = f(30, 46);
    var ridgeAt = function (base, amp) {
      var pts = [];
      for (var i = 0; i < 6; i++) pts.push([-20 + i * 76, base + (R() * 2 - 1) * amp]);
      return pts;
    };
    var backD = ridge(ridgeAt(112, 16)), frontD = ridge(ridgeAt(150, 12));
    var bubbles = [];
    var nb = 5 + Math.floor(R() * 3);
    for (var i = 0; i < nb; i++) {
      var cx = f(24, 336), cy = f(20, 128), r = f(6, 20);
      var hx = (cx - r * 0.38).toFixed(1), hy = (cy - r * 0.42).toFixed(1);
      bubbles.push(
        '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + r.toFixed(1) +
        '" fill="url(#' + id + 'b)" stroke="#fff" stroke-opacity=".7" stroke-width="1"/>' +
        '<ellipse cx="' + hx + '" cy="' + hy + '" rx="' + (r * 0.36).toFixed(1) + '" ry="' + (r * 0.18).toFixed(1) +
        '" transform="rotate(-30 ' + hx + ' ' + hy + ')" fill="#fff" fill-opacity=".9"/>'
      );
    }
    var streakX = f(-60, 240);

    return '<svg viewBox="0 0 360 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">' +
      '<defs>' +
        '<linearGradient id="' + id + 's" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + top + '"/><stop offset="1" stop-color="' + bot + '"/></linearGradient>' +
        '<radialGradient id="' + id + 'r"><stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#eafcff" stop-opacity=".8"/><stop offset="1" stop-color="#eafcff" stop-opacity="0"/></radialGradient>' +
        '<linearGradient id="' + id + 'g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6ff6a"/><stop offset=".3" stop-color="#3dff2e"/><stop offset="1" stop-color="#00a53a"/></linearGradient>' +
        '<linearGradient id="' + id + 'h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9fdff" stop-opacity=".85"/><stop offset="1" stop-color="#7fdcff" stop-opacity=".3"/></linearGradient>' +
        '<radialGradient id="' + id + 'b" cx=".38" cy=".3" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".15"/><stop offset=".55" stop-color="#9ee6ff" stop-opacity=".22"/><stop offset="1" stop-color="#1f7dff" stop-opacity=".55"/></radialGradient>' +
        '<linearGradient id="' + id + 'k" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>' +
      '</defs>' +
      '<rect width="360" height="200" fill="url(#' + id + 's)"/>' +
      '<circle cx="' + sx.toFixed(1) + '" cy="' + sy.toFixed(1) + '" r="' + (sr * 2.6).toFixed(1) + '" fill="url(#' + id + 'r)"/>' +
      '<circle cx="' + sx.toFixed(1) + '" cy="' + sy.toFixed(1) + '" r="' + (sr * 0.5).toFixed(1) + '" fill="#fff" opacity=".95"/>' +
      '<path d="' + backD + 'L380,200L-20,200Z" fill="url(#' + id + 'h)" opacity=".8"/>' +
      '<path d="' + frontD + 'L380,200L-20,200Z" fill="url(#' + id + 'g)"/>' +
      '<path d="' + frontD + '" fill="none" stroke="#f7ffe6" stroke-width="2" stroke-opacity=".85"/>' +
      bubbles.join("") +
      '<rect x="' + streakX.toFixed(1) + '" y="-40" width="54" height="280" fill="url(#' + id + 'k)" transform="rotate(-18 180 100)"/>' +
      '</svg>';
  }

  function volIcon() {
    var v = state.vol;
    var body = '<path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/>';
    var waves;
    if (v === 0) {
      waves = '<path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9l5 6M21 9l-5 6"/>';
    } else if (v < 50) {
      waves = '<path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9a4 4 0 0 1 0 6"/>';
    } else {
      waves = '<path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/>';
    }
    return '<svg viewBox="0 0 24 24" aria-hidden="true">' + body + waves + '</svg>';
  }

  function renderTrack(animate) {
    var t = TRACKS[state.i];
    els.title.textContent = t.title;
    els.artist.textContent = t.artist;
    els.art.innerHTML = artSVG(t);
    var svg = els.art.firstElementChild;
    if (animate && svg && svg.animate && !reduceMotion) {
      svg.animate(
        [{ opacity: 0.2, transform: "scale(1.05)" }, { opacity: 1, transform: "scale(1)" }],
        { duration: 500, easing: "cubic-bezier(.2,.7,.2,1)" }
      );
    }
    document.title = t.title + " · Tide";
    renderQueue();
    renderProgress();
  }

  function renderQueue() {
    var html = "";
    for (var k = 1; k <= QUEUE_SIZE; k++) {
      var idx = (state.i + k) % n;
      var t = TRACKS[idx];
      html += '<li><button class="q-item" type="button" data-idx="' + idx + '" aria-label="Play ' +
        esc(t.title) + " by " + esc(t.artist) + '">' +
        '<span class="q-thumb">' + artSVG(t) + '</span>' +
        '<span class="q-text"><span class="q-name">' + esc(t.title) + '</span><span class="q-artist">' + esc(t.artist) + '</span></span>' +
        '<span class="q-dur">' + fmt(t.dur) + '</span>' +
        '</button></li>';
    }
    els.queue.innerHTML = html;
  }

  function renderProgress() {
    var t = TRACKS[state.i];
    var pct = Math.min(100, Math.max(0, (state.pos / t.dur) * 100));
    els.fill.style.width = pct + "%";
    els.thumb.style.left = pct + "%";
    els.elapsed.textContent = fmt(state.pos);
    els.remaining.textContent = "-" + fmt(t.dur - state.pos);
    els.bar.setAttribute("aria-valuenow", String(Math.round(pct)));
    els.bar.setAttribute("aria-valuetext", fmt(state.pos) + " of " + fmt(t.dur));
  }

  function renderPlay() {
    els.play.innerHTML = state.playing ? ICON.pause : ICON.play;
    els.play.setAttribute("aria-label", state.playing ? "Pause" : "Play");
    els.card.classList.toggle("is-playing", state.playing);
  }

  function renderVolume() {
    els.vol.value = String(state.vol);
    els.vol.style.setProperty("--v", state.vol + "%");
    els.volVal.textContent = String(state.vol);
    els.mute.innerHTML = volIcon();
    els.mute.setAttribute("aria-label", state.vol === 0 ? "Unmute" : "Mute");
  }

  function togglePlay() {
    state.playing = !state.playing;
    renderPlay();
  }

  function next() {
    state.i = (state.i + 1) % n;
    state.pos = 0;
    renderTrack(true);
  }

  function prev() {
    if (state.pos > 3) {
      state.pos = 0;
      renderProgress();
      return;
    }
    state.i = (state.i - 1 + n) % n;
    state.pos = 0;
    renderTrack(true);
  }

  function seekFromClientX(clientX) {
    var r = els.bar.getBoundingClientRect();
    var ratio = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    state.pos = ratio * TRACKS[state.i].dur;
    renderProgress();
  }

  // Progress loop: advances only while playing and not being dragged.
  var last = null;
  function loop(ts) {
    if (last === null) last = ts;
    var dt = Math.min((ts - last) / 1000, 0.5);
    last = ts;
    if (state.playing && !state.dragging) {
      state.pos += dt;
      if (state.pos >= TRACKS[state.i].dur) {
        next();
        state.playing = true;
        renderPlay();
      } else {
        renderProgress();
      }
    }
    requestAnimationFrame(loop);
  }

  // Transport
  els.play.addEventListener("click", togglePlay);
  els.prev.addEventListener("click", prev);
  els.next.addEventListener("click", next);
  els.queue.addEventListener("click", function (e) {
    var b = e.target.closest(".q-item");
    if (!b) return;
    state.i = Number(b.getAttribute("data-idx"));
    state.pos = 0;
    renderTrack(true);
  });

  // Seek by pointer (click or drag) and by keyboard
  els.bar.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    state.dragging = true;
    els.bar.classList.add("dragging");
    els.bar.setPointerCapture(e.pointerId);
    seekFromClientX(e.clientX);
  });
  els.bar.addEventListener("pointermove", function (e) {
    if (state.dragging) seekFromClientX(e.clientX);
  });
  function endDrag() {
    state.dragging = false;
    els.bar.classList.remove("dragging");
  }
  els.bar.addEventListener("pointerup", endDrag);
  els.bar.addEventListener("pointercancel", endDrag);
  els.bar.addEventListener("lostpointercapture", endDrag);
  els.bar.addEventListener("keydown", function (e) {
    var dur = TRACKS[state.i].dur, step = 5;
    var handled = true;
    if (e.key === "ArrowRight" || e.key === "ArrowUp") state.pos = Math.min(dur, state.pos + step);
    else if (e.key === "ArrowLeft" || e.key === "ArrowDown") state.pos = Math.max(0, state.pos - step);
    else if (e.key === "Home") state.pos = 0;
    else if (e.key === "End") state.pos = dur;
    else handled = false;
    if (handled) {
      e.preventDefault();
      renderProgress();
    }
  });

  // Volume (display-only: there is no audio output in this prototype)
  els.vol.addEventListener("input", function () {
    state.vol = Number(els.vol.value);
    if (state.vol > 0) state.prevVol = state.vol;
    renderVolume();
  });
  els.mute.addEventListener("click", function () {
    if (state.vol > 0) {
      state.prevVol = state.vol;
      state.vol = 0;
    } else {
      state.vol = state.prevVol || 70;
    }
    renderVolume();
  });

  // Space toggles playback when nothing specific has focus
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" && (e.target === document.body || e.target === document.documentElement)) {
      e.preventDefault();
      togglePlay();
    }
  });

  // Init
  els.prev.innerHTML = ICON.prev;
  els.next.innerHTML = ICON.next;
  renderTrack(false);
  renderPlay();
  renderVolume();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
