<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tide Player</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"SF Pro Text","SF Pro Display",-apple-system,"Segoe UI",system-ui,sans-serif;
  color:#f5fbff;
  background:#1573ff;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.stage{
  position:relative;min-height:100vh;display:grid;place-items:center;
  padding:40px 16px;overflow:hidden;isolation:isolate;
  background:
    radial-gradient(900px 480px at 22% 0%, rgba(255,255,255,.8), transparent 62%),
    radial-gradient(760px 620px at 92% 18%, rgba(150,235,255,.85), transparent 60%),
    linear-gradient(180deg,#0634c8 0%,#1173ff 42%,#4fbcff 74%,#bfefff 100%);
}
.field{position:absolute;left:0;bottom:0;width:100%;height:42%;z-index:-1;display:block}
.cloud{position:absolute;z-index:-1;border-radius:50%;background:rgba(255,255,255,.6);filter:blur(18px);pointer-events:none}
.c1{width:340px;height:110px;left:-60px;top:12%}
.c2{width:260px;height:90px;right:-40px;top:30%;opacity:.7}
.c3{width:200px;height:70px;left:55%;top:8%;opacity:.5}

.card{
  width:min(392px,100%);padding:22px 22px 22px;border-radius:36px;position:relative;overflow:hidden;
  background:
    linear-gradient(165deg,rgba(214,244,255,.66) 0%,rgba(96,190,255,.40) 38%,rgba(22,112,255,.46) 100%);
  -webkit-backdrop-filter:blur(26px) saturate(190%);
  backdrop-filter:blur(26px) saturate(190%);
  border:1.5px solid rgba(255,255,255,.78);
  box-shadow:
    inset 0 2px 1px rgba(255,255,255,.95),
    inset 0 -2px 2px rgba(255,255,255,.35),
    inset 0 -46px 64px -22px rgba(0,92,255,.6),
    inset 0 0 28px rgba(140,230,255,.35),
    0 36px 70px -18px rgba(0,30,130,.62),
    0 0 64px rgba(90,200,255,.38);
}
.card::before{
  content:"";position:absolute;left:0;right:0;top:0;height:52%;pointer-events:none;border-radius:36px 36px 60% 60%/36px 36px 30% 30%;
  background:linear-gradient(180deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.14) 60%,transparent 100%);
}
.card>*{position:relative}

.top{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:.01em;
  text-shadow:0 1px 0 rgba(0,70,210,.6),0 0 16px rgba(170,235,255,.9)}
.brand svg{width:26px;height:26px;color:#c9ffd6;filter:drop-shadow(0 0 6px rgba(120,255,150,.9))}
.pill{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:6px 11px;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.2));color:#0a46d8;
  box-shadow:inset 0 1px 0 #fff,0 4px 10px -4px rgba(0,40,160,.6)}

.art{position:relative;margin-top:16px;aspect-ratio:1/1;border-radius:28px;overflow:hidden;
  border:1.5px solid rgba(255,255,255,.85);
  box-shadow:0 20px 40px -14px rgba(0,40,160,.65),inset 0 0 0 1px rgba(255,255,255,.3),inset 0 -34px 52px rgba(0,90,255,.38)}
.art-svg{position:absolute;inset:0}
.art-svg svg{width:100%;height:100%;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.art .gloss{position:absolute;left:0;right:0;top:0;height:46%;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0))}
.art .sheen{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);
  transform:translateX(-120%)}
.card.playing .art .sheen{animation:sheen 4.8s ease-in-out infinite}
@keyframes sheen{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}

.meta{margin-top:18px;padding:0 4px}
.meta h1{margin:0;font-size:23px;font-weight:760;letter-spacing:-.01em;
  text-shadow:0 1px 0 rgba(0,70,210,.55),0 0 14px rgba(170,235,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta p{margin:3px 0 0;font-size:15px;opacity:.9;text-shadow:0 1px 0 rgba(0,70,210,.5)}

.progress{margin-top:18px;padding:0 4px}
.bar{position:relative;height:14px;border-radius:999px;cursor:pointer;touch-action:none;outline:none;
  background:linear-gradient(180deg,rgba(0,46,180,.6),rgba(110,200,255,.38));
  box-shadow:inset 0 2px 4px rgba(0,40,140,.6),0 1px 0 rgba(255,255,255,.75)}
.bar:focus-visible{box-shadow:inset 0 2px 4px rgba(0,40,140,.6),0 0 0 3px rgba(200,255,215,.85)}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:inherit;
  background:linear-gradient(90deg,#d2ff8a,#3dff62 55%,#00e6ff);
  box-shadow:0 0 16px rgba(90,255,120,.9),inset 0 1px 0 rgba(255,255,255,.85)}
.knob{position:absolute;top:50%;left:0;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#e0fbff 45%,#8fd9ff 100%);
  box-shadow:0 2px 8px rgba(0,60,180,.6),0 0 0 2px rgba(255,255,255,.75),0 0 14px rgba(140,255,170,.8);pointer-events:none}
.times{display:flex;justify-content:space-between;margin-top:9px;font-size:12.5px;font-weight:600;
  font-variant-numeric:tabular-nums;opacity:.92;text-shadow:0 1px 0 rgba(0,70,210,.5)}

.controls{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:16px}
.orb{
  width:56px;height:56px;border-radius:50%;border:0;cursor:pointer;color:#fff;display:grid;place-items:center;padding:0;
  background:
    radial-gradient(circle at 50% 120%,rgba(120,255,150,.9),transparent 55%),
    radial-gradient(circle at 35% 22%,rgba(255,255,255,.98) 0%,rgba(190,236,255,.55) 28%,rgba(40,140,255,.45) 65%,rgba(10,70,220,.7) 100%);
  box-shadow:
    inset 0 2px 2px rgba(255,255,255,.9),
    inset 0 -6px 12px rgba(0,60,200,.5),
    0 10px 22px -6px rgba(0,30,140,.6),
    0 0 0 1.5px rgba(255,255,255,.6);
  transition:transform .15s ease,filter .2s ease;
}
.orb:hover{filter:brightness(1.08) saturate(1.1)}
.orb:active{transform:scale(.93)}
.orb svg{width:20px;height:20px;filter:drop-shadow(0 1px 1px rgba(0,50,160,.6))}
.orb.primary{width:74px;height:74px;
  background:
    radial-gradient(circle at 50% 118%,rgba(110,255,120,.95),transparent 56%),
    radial-gradient(circle at 35% 20%,#fff 0%,#d6f6ff 22%,rgba(120,220,255,.62) 50%,rgba(20,110,255,.62) 85%,rgba(5,60,200,.85) 100%)}
.orb.primary svg{width:28px;height:28px}
.orb:focus-visible{outline:3px solid rgba(200,255,210,.95);outline-offset:3px}

.volume{display:flex;align-items:center;gap:10px;margin-top:18px;padding:0 4px}
.vol-icon{width:20px;height:20px;flex:none;display:grid;place-items:center}
.vol-icon svg{width:20px;height:20px;filter:drop-shadow(0 1px 1px rgba(0,50,160,.5))}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:8px;border-radius:999px;margin:0;cursor:pointer;outline:none;
  background:linear-gradient(90deg,#d2ff8a,#3dff62 var(--v,70%),rgba(0,46,180,.5) var(--v,70%));
  box-shadow:inset 0 1px 3px rgba(0,40,140,.6),0 1px 0 rgba(255,255,255,.7)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;border:0;
  background:radial-gradient(circle at 35% 30%,#fff,#e0fbff 50%,#8fd9ff 100%);
  box-shadow:0 2px 6px rgba(0,60,180,.6),0 0 0 2px rgba(255,255,255,.75)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;border:0;
  background:radial-gradient(circle at 35% 30%,#fff,#e0fbff 50%,#8fd9ff 100%);
  box-shadow:0 2px 6px rgba(0,60,180,.6),0 0 0 2px rgba(255,255,255,.75)}
input[type=range]:focus-visible{box-shadow:0 0 0 3px rgba(200,255,215,.85)}
.vol-val{width:30px;text-align:right;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;opacity:.92}

.queue{margin-top:20px;padding:0 4px}
.queue h2{margin:0;font-size:11.5px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;opacity:.9;
  text-shadow:0 1px 0 rgba(0,70,210,.5)}
.queue ol{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.queue button{
  width:100%;display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:20px;cursor:pointer;
  color:inherit;font:inherit;text-align:left;
  border:1px solid rgba(255,255,255,.55);
  background:linear-gradient(180deg,rgba(255,255,255,.44),rgba(120,210,255,.18));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 6px 14px -8px rgba(0,40,160,.6);
  transition:background .2s ease,transform .15s ease;
}
.queue button:hover{background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(140,225,255,.28));transform:translateX(2px)}
.queue button:focus-visible{outline:3px solid rgba(200,255,210,.95);outline-offset:2px}
.thumb{width:46px;height:46px;border-radius:14px;overflow:hidden;position:relative;flex:none;
  border:1px solid rgba(255,255,255,.8);box-shadow:0 4px 10px -4px rgba(0,40,160,.6)}
.thumb svg{width:100%;height:100%;display:block}
.q-text{flex:1;min-width:0;display:flex;flex-direction:column}
.q-title{font-size:14.5px;font-weight:680;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 rgba(0,70,210,.45)}
.q-artist{font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.q-dur{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;opacity:.9;flex:none}

@media (max-width:440px){
  .stage{padding:24px 12px}
  .card{padding:18px 16px 18px;border-radius:30px}
}
@media (prefers-reduced-motion:reduce){
  .card.playing .art .sheen{animation:none}
  .orb,.queue button,.art-svg svg{transition:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <svg class="field" viewBox="0 0 1280 340" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="gBack" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7dff4a"/><stop offset="1" stop-color="#14c83a"/>
      </linearGradient>
      <linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#43ff5e"/><stop offset="1" stop-color="#00a53a"/>
      </linearGradient>
    </defs>
    <path d="M0 120 C260 30 520 170 800 80 S1180 40 1280 96 L1280 340 L0 340 Z" fill="url(#gBack)"/>
    <path d="M0 190 C230 120 470 250 760 170 S1140 130 1280 190 L1280 340 L0 340 Z" fill="url(#gFront)"/>
    <path d="M0 250 C300 210 600 290 900 240 S1200 230 1280 250 L1280 340 L0 340 Z" fill="#00921f" opacity=".9"/>
  </svg>

  <main class="card" id="card" aria-label="Tide music player">
    <header class="top">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M2 14c2.5-3 5-3 7.5 0s5 3 7.5 0 3-2 5-1" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M2 8.5c2.5-3 5-3 7.5 0s5 3 7.5 0 3-2 5-1" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>
        </svg>
        <span>Tide</span>
      </div>
      <span class="pill">Now playing</span>
    </header>

    <div class="art">
      <div class="art-svg" id="artSvg"></div>
      <div class="sheen"></div>
      <div class="gloss"></div>
    </div>

    <div class="meta">
      <h1 id="title">Track</h1>
      <p id="artist">Artist</p>
    </div>

    <div class="progress">
      <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="fill" id="fill"></div>
        <div class="knob" id="knob"></div>
      </div>
      <div class="times">
        <span id="elapsed">0:00</span>
        <span id="remain">-0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="orb side" id="prev" type="button" aria-label="Previous track"></button>
      <button class="orb primary" id="play" type="button" aria-label="Play"></button>
      <button class="orb side" id="next" type="button" aria-label="Next track"></button>
    </div>

    <div class="volume">
      <span class="vol-icon" id="volIcon" aria-hidden="true"></span>
      <input type="range" id="vol" min="0" max="100" step="1" value="70" aria-label="Volume">
      <span class="vol-val" id="volVal">70</span>
    </div>

    <section class="queue">
      <h2>Up next</h2>
      <ol id="queue"></ol>
    </section>
  </main>
</div>

<script>
(function () {
  var TRACKS = [
    { title: 'Cumulus Drift',     artist: 'Halo Meadow',      dur: 214, sky: ['#0a4fe0', '#5fd4ff'], sun: '#fffbe0', g: ['#6dff3a', '#0bb53a'], seed: 1 },
    { title: 'Chlorophyll Hymn',  artist: 'Pale Lagoon',      dur: 187, sky: ['#0034b8', '#2a9bff'], sun: '#e6fff0', g: ['#3dff7a', '#00a86b'], seed: 2 },
    { title: 'Glasshouse Summer', artist: 'Ultramarine Kids', dur: 243, sky: ['#1656ff', '#8ee6ff'], sun: '#fff3c4', g: ['#9dff2e', '#18c42c'], seed: 3 },
    { title: 'Electric Pasture',  artist: 'Vinyl Sky',        dur: 201, sky: ['#0841c9', '#46b8ff'], sun: '#ffffff', g: ['#2bff9a', '#06b35a'], seed: 4 },
    { title: 'Aero Rain',         artist: 'Tidewater Club',   dur: 176, sky: ['#0b3fd0', '#7fd8ff'], sun: '#e0f7ff', g: ['#5cff5c', '#0c9e46'], seed: 5 }
  ];

  var ICON_PLAY  = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.8v14.4a1 1 0 0 0 1.5.86l12-7.2a1 1 0 0 0 0-1.72l-12-7.2A1 1 0 0 0 7 4.8z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg>';
  var ICON_PREV  = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="2.6" height="14" rx="1"/><path d="M19 5.5v13L9.5 12z"/></svg>';
  var ICON_NEXT  = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="16.4" y="5" width="2.6" height="14" rx="1"/><path d="M5 5.5v13L14.5 12z"/></svg>';

  function speakerIcon(level) {
    var waves = '';
    if (level === 0) {
      waves = '<path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>';
    } else {
      if (level >= 1) waves += '<path d="M15.5 9a4 4 0 0 1 0 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>';
      if (level >= 2) waves += '<path d="M18 6.5a7.5 7.5 0 0 1 0 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>';
      if (level >= 3) waves += '<path d="M20.5 4a11 11 0 0 1 0 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>';
    }
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4.5v15L7 15H3z" fill="currentColor"/>' + waves + '</svg>';
  }

  function fmt(s) {
    s = Math.max(0, Math.floor(s));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function hillPath(base, amp, freq, phase) {
    var d = 'M0 300 L0 ' + base;
    for (var x = 0; x <= 300; x += 6) {
      var y = base + Math.sin(x * freq + phase) * amp + Math.sin(x * freq * 2.3 + phase * 1.7) * amp * 0.35;
      d += ' L' + x + ' ' + y.toFixed(1);
    }
    return d + ' L300 300 Z';
  }

  var uid = 0;
  function artSVG(t) {
    var u = 'a' + (++uid), s = t.seed;
    var sunX = 70 + ((s * 37) % 160), sunY = 60 + ((s * 23) % 40);
    var dx = (s * 17) % 40;
    var bubbles = [[60, 232, 26], [236, 196, 14], [206, 96, 20], [118, 122, 9], [262, 262, 30]];
    var bub = '';
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      bub += '<circle cx="' + ((b[0] + dx * (i % 2 ? 1 : -1) * 0.4) % 300) + '" cy="' + b[1] + '" r="' + b[2] + '" fill="url(#' + u + 'b)" stroke="#fff" stroke-opacity=".6" stroke-width="1.2"/>';
    }
    return '<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
      '<defs>' +
        '<linearGradient id="' + u + 's" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + t.sky[0] + '"/><stop offset="1" stop-color="' + t.sky[1] + '"/></linearGradient>' +
        '<radialGradient id="' + u + 'g"><stop offset="0" stop-color="' + t.sun + '" stop-opacity="1"/><stop offset=".35" stop-color="' + t.sun + '" stop-opacity=".55"/><stop offset="1" stop-color="' + t.sun + '" stop-opacity="0"/></radialGradient>' +
        '<linearGradient id="' + u + 'h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + t.g[0] + '"/><stop offset="1" stop-color="' + t.g[1] + '"/></linearGradient>' +
        '<linearGradient id="' + u + 'b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".78"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".38"/></linearGradient>' +
        '<linearGradient id="' + u + 'l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>' +
        '<filter id="' + u + 'f" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>' +
      '</defs>' +
      '<rect width="300" height="300" fill="url(#' + u + 's)"/>' +
      '<circle cx="' + sunX + '" cy="' + sunY + '" r="130" fill="url(#' + u + 'g)"/>' +
      '<circle cx="' + sunX + '" cy="' + sunY + '" r="28" fill="' + t.sun + '" opacity=".96"/>' +
      '<g fill="#fff" opacity=".55" filter="url(#' + u + 'f)"><ellipse cx="' + (60 + dx) + '" cy="88" rx="58" ry="16"/><ellipse cx="' + (220 - dx) + '" cy="130" rx="44" ry="12"/></g>' +
      '<path d="' + hillPath(186, 14, 0.021, s) + '" fill="url(#' + u + 'h)" opacity=".92"/>' +
      '<path d="' + hillPath(222, 18, 0.016, s + 2) + '" fill="' + t.g[0] + '" opacity=".78"/>' +
      '<path d="' + hillPath(258, 10, 0.03, s + 4) + '" fill="' + t.g[1] + '"/>' +
      bub +
      '<rect width="300" height="140" fill="url(#' + u + 'l)"/>' +
      '</svg>';
  }

  var els = {
    card: document.getElementById('card'),
    artSvg: document.getElementById('artSvg'),
    title: document.getElementById('title'),
    artist: document.getElementById('artist'),
    bar: document.getElementById('bar'),
    fill: document.getElementById('fill'),
    knob: document.getElementById('knob'),
    elapsed: document.getElementById('elapsed'),
    remain: document.getElementById('remain'),
    play: document.getElementById('play'),
    prev: document.getElementById('prev'),
    next: document.getElementById('next'),
    vol: document.getElementById('vol'),
    volVal: document.getElementById('volVal'),
    volIcon: document.getElementById('volIcon'),
    queue: document.getElementById('queue')
  };

  var state = { idx: 0, pos: 62, playing: false, dragging: false, last: 0 };

  function curDur() { return TRACKS[state.idx].dur; }

  function renderTrack() {
    var t = TRACKS[state.idx];
    els.title.textContent = t.title;
    els.artist.textContent = t.artist;
    els.artSvg.innerHTML = artSVG(t);
    renderQueue();
    updateProgress();
  }

  function renderQueue() {
    var html = '';
    var n = TRACKS.length;
    for (var k = 1; k <= 4; k++) {
      var j = (state.idx + k) % n;
      var t = TRACKS[j];
      html += '<li><button type="button" data-i="' + j + '">' +
        '<span class="thumb">' + artSVG(t) + '</span>' +
        '<span class="q-text"><span class="q-title">' + t.title + '</span><span class="q-artist">' + t.artist + '</span></span>' +
        '<span class="q-dur">' + fmt(t.dur) + '</span>' +
        '</button></li>';
    }
    els.queue.innerHTML = html;
  }

  function updateProgress() {
    var dur = curDur();
    var pos = Math.min(Math.max(state.pos, 0), dur);
    var p = dur ? pos / dur : 0;
    els.fill.style.width = (p * 100) + '%';
    els.knob.style.left = (p * 100) + '%';
    els.bar.setAttribute('aria-valuenow', String(Math.round(p * 100)));
    els.bar.setAttribute('aria-valuetext', fmt(pos) + ' of ' + fmt(dur));
    els.elapsed.textContent = fmt(pos);
    els.remain.textContent = '-' + fmt(dur - pos);
  }

  function setPlaying(v) {
    state.playing = v;
    els.card.classList.toggle('playing', v);
    els.play.innerHTML = v ? ICON_PAUSE : ICON_PLAY;
    els.play.setAttribute('aria-label', v ? 'Pause' : 'Play');
  }

  function go(i) {
    state.idx = (i + TRACKS.length) % TRACKS.length;
    state.pos = 0;
    renderTrack();
  }

  function next() { go(state.idx + 1); }
  function prev() {
    if (state.pos > 3) { state.pos = 0; updateProgress(); }
    else { go(state.idx - 1); }
  }

  function tick(ts) {
    if (!state.last) state.last = ts;
    var dt = Math.min(0.25, (ts - state.last) / 1000);
    state.last = ts;
    if (state.playing && !state.dragging) {
      state.pos += dt;
      if (state.pos >= curDur()) {
        state.pos = 0;
        go(state.idx + 1);
      } else {
        updateProgress();
      }
    }
    requestAnimationFrame(tick);
  }

  function seekTo(clientX) {
    var r = els.bar.getBoundingClientRect();
    var ratio = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    state.pos = ratio * curDur();
    updateProgress();
  }

  els.bar.addEventListener('pointerdown', function (e) {
    state.dragging = true;
    els.bar.setPointerCapture(e.pointerId);
    seekTo(e.clientX);
  });
  els.bar.addEventListener('pointermove', function (e) {
    if (state.dragging) seekTo(e.clientX);
  });
  function endDrag() { state.dragging = false; }
  els.bar.addEventListener('pointerup', endDrag);
  els.bar.addEventListener('pointercancel', endDrag);
  els.bar.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { state.pos = Math.min(curDur(), state.pos + 5); }
    else if (e.key === 'ArrowLeft') { state.pos = Math.max(0, state.pos - 5); }
    else if (e.key === 'Home') { state.pos = 0; }
    else if (e.key === 'End') { state.pos = curDur(); }
    else { return; }
    e.preventDefault();
    updateProgress();
  });

  els.play.addEventListener('click', function () { setPlaying(!state.playing); });
  els.prev.addEventListener('click', prev);
  els.next.addEventListener('click', next);
  els.prev.innerHTML = ICON_PREV;
  els.next.innerHTML = ICON_NEXT;

  els.queue.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-i]');
    if (!b) return;
    go(parseInt(b.getAttribute('data-i'), 10));
  });

  function setVol(v) {
    els.vol.value = v;
    els.vol.style.setProperty('--v', v + '%');
    els.volVal.textContent = String(v);
    var level = v === 0 ? 0 : v < 34 ? 1 : v < 67 ? 2 : 3;
    els.volIcon.innerHTML = speakerIcon(level);
  }
  els.vol.addEventListener('input', function () { setVol(parseInt(els.vol.value, 10)); });

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && !e.target.closest('button, input')) {
      e.preventDefault();
      setPlaying(!state.playing);
    }
  });

  renderTrack();
  setVol(70);
  setPlaying(false);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
