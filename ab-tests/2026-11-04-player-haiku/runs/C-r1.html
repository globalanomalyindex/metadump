<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tide Player</title>
<style>
/* Tokens. Colors read as light passing through material, not paint. */
:root{
  --sky-deep:#0747e6;
  --sky-mid:#1f9cff;
  --sky-pale:#9fe6ff;
  --cyan:#5cf3ff;
  --cobalt:#0a3fd6;
  --ice:#eafaff;
  --white:#ffffff;
  --ink:#ffffff;
  --ink-soft:rgba(238,251,255,.88);
  --shadow-deep:rgba(0,38,140,.55);
  --grass-hi:#8dff4e;
  --grass:#2ad93a;
  --grass-deep:#0a8f2a;
  --font:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  min-height:100vh;
  font-family:var(--font);
  color:var(--ink);
  background:linear-gradient(180deg,var(--sky-deep) 0%,var(--sky-mid) 50%,var(--sky-pale) 100%);
  display:grid;
  place-items:center;
  padding:20px 16px;
  overflow-x:hidden;
}

/* Full-page scene: blue sky, overexposed bloom, hyperreal grass, translucent slab. */
.backdrop{position:fixed;inset:0;z-index:0;pointer-events:none}
.backdrop svg{width:100%;height:100%;display:block}

.stage{position:relative;z-index:1;width:100%;display:flex;justify-content:center}

/* The card: thick translucent blue acrylic. Edges catch light, the body is deeper. */
.player{
  position:relative;
  width:392px;
  max-width:100%;
  padding:14px 14px 16px;
  border-radius:30px;
  background:
    linear-gradient(165deg,rgba(120,220,255,.52) 0%,rgba(40,160,255,.44) 38%,rgba(0,78,230,.5) 75%,rgba(90,215,255,.46) 100%);
  -webkit-backdrop-filter:blur(24px) saturate(190%);
  backdrop-filter:blur(24px) saturate(190%);
  border:1.5px solid rgba(255,255,255,.75);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.95),
    inset 0 0 0 1px rgba(255,255,255,.16),
    inset 0 -18px 40px -12px rgba(0,60,220,.6),
    inset 12px 0 22px -18px rgba(190,250,255,.9),
    0 28px 60px -16px var(--shadow-deep),
    0 0 0 1px rgba(0,50,160,.12);
  overflow:hidden;
}
/* Glossy sheen across the top surface of the material. */
.player::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.08) 26%,rgba(255,255,255,0) 40%);
  pointer-events:none;
  z-index:0;
}
/* Blue light spilling through the lower body of the material. */
.player::after{
  content:"";
  position:absolute;
  left:-20%;
  right:-20%;
  bottom:-35%;
  height:70%;
  background:radial-gradient(ellipse at 50% 60%,rgba(92,243,255,.55) 0%,rgba(92,243,255,0) 65%);
  pointer-events:none;
  z-index:0;
}
.player > *{position:relative;z-index:1}

.brand{display:flex;align-items:center;gap:8px;padding:2px 4px 12px;font-size:12px;color:var(--ink-soft)}
.brand .logo{
  width:24px;height:24px;border-radius:8px;display:grid;place-items:center;
  color:#0a58ff;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.25));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 2px 6px -2px var(--shadow-deep);
}
.brand .logo svg{width:15px;height:15px;display:block}
.brand .brand-name{font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;text-shadow:0 1px 3px rgba(0,50,180,.4)}
.brand .brand-label{margin-left:auto;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}

/* Artwork: a sealed window onto a scene behind acrylic. */
.art{
  position:relative;
  aspect-ratio:16/9;
  border-radius:22px;
  overflow:hidden;
  background:#6cd8ff;
  box-shadow:
    inset 0 0 0 1.5px rgba(255,255,255,.8),
    inset 0 -22px 40px -22px rgba(0,50,200,.5),
    0 14px 30px -12px var(--shadow-deep);
}
.art > svg{width:100%;height:100%;display:block}
.art .sheen{
  position:absolute;
  inset:0;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.5) 48%,transparent 60%);
  transform:translateX(-100%);
  pointer-events:none;
}
.player.is-playing .art .sheen{animation:sheen 7s ease-in-out infinite}
@keyframes sheen{
  0%{transform:translateX(-100%)}
  60%,100%{transform:translateX(100%)}
}

.meta{margin-top:14px;padding:0 6px;min-width:0}
.title{
  margin:0;
  font-size:21px;
  font-weight:700;
  letter-spacing:-.01em;
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 1px 0 rgba(255,255,255,.35),0 2px 10px rgba(0,50,200,.45);
}
.artist{margin:3px 0 0;font-size:14px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Seek bar: a glowing rail with a glass knob. */
.seek{margin-top:16px;padding:0 6px}
.bar{
  position:relative;
  height:22px;
  display:flex;
  align-items:center;
  cursor:pointer;
  touch-action:none;
  outline:none;
}
.bar:focus-visible .knob{outline:2px solid #fff;outline-offset:3px}
.bar .rail{
  position:relative;
  width:100%;
  height:8px;
  border-radius:99px;
  overflow:hidden;
  background:rgba(0,40,160,.28);
  box-shadow:inset 0 1.5px 3px rgba(0,30,120,.45),0 1px 0 rgba(255,255,255,.7);
}
.bar .fill{
  position:absolute;
  inset:0;
  transform-origin:left center;
  transform:scaleX(0);
  background:linear-gradient(90deg,#8ff7ff,#ffffff 70%,#c8f6ff);
  box-shadow:0 0 12px rgba(120,250,255,.9),0 0 2px #fff;
}
.bar .knob{
  position:absolute;
  top:50%;
  left:0;
  width:18px;
  height:18px;
  margin:-9px 0 0 -9px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0 35%,#d9f7ff 60%,#8fdcff 100%);
  box-shadow:0 0 0 1.5px rgba(255,255,255,.9),0 2px 6px rgba(0,50,180,.5),0 0 14px rgba(120,240,255,.9);
  pointer-events:none;
}
.times{
  display:flex;
  justify-content:space-between;
  margin-top:4px;
  padding:0 1px;
  font-size:12px;
  font-variant-numeric:tabular-nums;
  color:var(--ink-soft);
}

/* Transport: translucent glass discs, with one brighter cyan orb for play. */
.controls{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:14px}
.btn{
  position:relative;
  width:54px;
  height:54px;
  padding:0;
  border:0;
  border-radius:50%;
  cursor:pointer;
  color:#fff;
  display:grid;
  place-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.78) 0%,rgba(255,255,255,.22) 48%,rgba(120,220,255,.36) 52%,rgba(40,150,255,.52) 100%);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.9),
    inset 0 -6px 12px rgba(0,60,200,.45),
    0 0 0 1px rgba(255,255,255,.6),
    0 10px 20px -8px var(--shadow-deep);
  transition:transform .15s ease,filter .2s ease;
}
.btn::after{
  content:"";
  position:absolute;
  left:16%;
  right:16%;
  top:7%;
  height:40%;
  border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0));
  pointer-events:none;
}
.btn svg{position:relative;z-index:1;width:22px;height:22px;display:block;filter:drop-shadow(0 1px 1px rgba(0,50,160,.5))}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.94)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.btn.primary{
  width:72px;
  height:72px;
  background:
    radial-gradient(circle at 50% 115%,#c4fcff 0%,rgba(90,240,255,0) 58%),
    linear-gradient(180deg,#48e6ff 0%,#1a8bff 55%,#0a4fe0 100%);
  box-shadow:
    inset 0 2px 2px rgba(255,255,255,.9),
    inset 0 -10px 18px rgba(0,30,160,.45),
    0 0 0 1.5px rgba(255,255,255,.85),
    0 0 30px rgba(90,240,255,.55),
    0 14px 24px -10px var(--shadow-deep);
}
.btn.primary::after{background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0))}
.btn.primary svg{width:26px;height:26px}
.player.is-playing .btn.primary{animation:orbglow 2.8s ease-in-out infinite}
@keyframes orbglow{
  0%,100%{box-shadow:inset 0 2px 2px rgba(255,255,255,.9),inset 0 -10px 18px rgba(0,30,160,.45),0 0 0 1.5px rgba(255,255,255,.85),0 0 22px rgba(90,240,255,.45),0 14px 24px -10px var(--shadow-deep)}
  50%{box-shadow:inset 0 2px 2px rgba(255,255,255,.9),inset 0 -10px 18px rgba(0,30,160,.45),0 0 0 1.5px rgba(255,255,255,.85),0 0 40px rgba(120,250,255,.85),0 14px 24px -10px var(--shadow-deep)}
}

/* Volume: a thin glass channel with a glowing fill. */
.volume{display:flex;align-items:center;gap:10px;margin-top:16px;padding:0 4px}
.icon-btn{
  width:30px;
  height:30px;
  padding:0;
  border:0;
  border-radius:50%;
  flex:none;
  display:grid;
  place-items:center;
  cursor:pointer;
  color:#fff;
  background:rgba(255,255,255,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 2px 6px -3px var(--shadow-deep);
}
.icon-btn svg{width:16px;height:16px;display:block}
.icon-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.volume input[type=range]{
  flex:1;
  min-width:0;
  height:8px;
  margin:0;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
  border-radius:99px;
  outline:none;
  background:linear-gradient(90deg,#f4feff 0,#f4feff var(--val,72%),rgba(0,40,160,.28) var(--val,72%),rgba(0,40,160,.28) 100%);
  box-shadow:inset 0 1.5px 3px rgba(0,30,120,.45),0 1px 0 rgba(255,255,255,.7);
}
.volume input[type=range]:focus-visible{box-shadow:inset 0 1.5px 3px rgba(0,30,120,.45),0 0 0 2px #fff}
.volume input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:16px;
  height:16px;
  margin-top:-4px;
  border:0;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0 35%,#d9f7ff 62%,#8fdcff 100%);
  box-shadow:0 0 0 1.5px #fff,0 2px 6px rgba(0,50,180,.5),0 0 10px rgba(120,240,255,.8);
}
.volume input[type=range]::-moz-range-track{height:8px;background:transparent;border:0}
.volume input[type=range]::-moz-range-progress{height:8px;background:#f4feff;border-radius:99px}
.volume input[type=range]::-moz-range-thumb{
  width:16px;
  height:16px;
  border:0;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0 35%,#d9f7ff 62%,#8fdcff 100%);
  box-shadow:0 0 0 1.5px #fff,0 2px 6px rgba(0,50,180,.5),0 0 10px rgba(120,240,255,.8);
}
.vol-val{width:24px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-soft)}

/* Up next: a second, fainter pane of the same material. */
.queue{
  margin-top:16px;
  padding:10px 8px 8px;
  border-radius:20px;
  background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.1));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.7),
    inset 0 -1px 0 rgba(0,40,160,.2),
    inset 0 0 0 1px rgba(255,255,255,.25);
}
.queue h2{
  margin:0 6px 6px;
  font-size:11px;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink-soft);
}
.queue ol{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.qitem{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:5px 8px;
  border:0;
  border-radius:14px;
  background:transparent;
  color:inherit;
  font:inherit;
  text-align:left;
  cursor:pointer;
  transition:background .2s ease;
}
.qitem:hover{background:rgba(255,255,255,.22)}
.qitem:focus-visible{outline:2px solid #fff;outline-offset:1px}
.qthumb{
  width:36px;
  height:36px;
  flex:none;
  border-radius:10px;
  overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),0 3px 8px -3px var(--shadow-deep);
}
.qthumb svg{width:100%;height:100%;display:block}
.qtext{min-width:0;flex:1}
.qtitle{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,50,160,.35)}
.qartist{display:block;font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qdur{flex:none;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-soft)}

@media (prefers-reduced-motion:reduce){
  .player.is-playing .art .sheen,
  .player.is-playing .btn.primary{animation:none}
}
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true">
  <svg viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0747e6"/>
        <stop offset=".5" stop-color="#1f9cff"/>
        <stop offset="1" stop-color="#9fe6ff"/>
      </linearGradient>
      <radialGradient id="bgSun" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
        <stop offset=".3" stop-color="#e9fbff" stop-opacity=".85"/>
        <stop offset="1" stop-color="#e9fbff" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="bgGrassBack" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5ef07a"/>
        <stop offset="1" stop-color="#14b33a"/>
      </linearGradient>
      <linearGradient id="bgGrass" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8dff4e"/>
        <stop offset=".45" stop-color="#2ad93a"/>
        <stop offset="1" stop-color="#0a8f2a"/>
      </linearGradient>
      <linearGradient id="bgSlab" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#5cf3ff" stop-opacity="0"/>
        <stop offset=".5" stop-color="#5cf3ff" stop-opacity=".55"/>
        <stop offset="1" stop-color="#0a3fd6" stop-opacity=".2"/>
      </linearGradient>
      <filter id="bgBlur" x="-20%" y="-50%" width="140%" height="200%">
        <feGaussianBlur stdDeviation="18"/>
      </filter>
    </defs>
    <rect width="1280" height="800" fill="url(#bgSky)"/>
    <circle cx="1010" cy="150" r="300" fill="url(#bgSun)"/>
    <g fill="#ffffff" opacity=".9" filter="url(#bgBlur)">
      <ellipse cx="180" cy="170" rx="170" ry="34"/>
      <ellipse cx="1120" cy="330" rx="200" ry="40"/>
      <ellipse cx="640" cy="90" rx="220" ry="26"/>
    </g>
    <path d="M0 500 C 220 420 400 455 620 485 S 1000 425 1280 470 V800 H0Z" fill="url(#bgGrassBack)" opacity=".9"/>
    <path d="M0 590 C 260 510 520 548 760 575 S 1100 530 1280 565 V800 H0Z" fill="url(#bgGrass)"/>
    <path d="M0 590 C 260 510 520 548 760 575 S 1100 530 1280 565" fill="none" stroke="#e6ffc4" stroke-opacity=".75" stroke-width="3"/>
    <path d="M-40 690 L 520 640 L 1320 700 V800 H-40Z" fill="url(#bgSlab)"/>
  </svg>
</div>

<main class="stage">
  <section class="player" id="player" aria-label="Tide music player">

    <header class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M2 14c2.5 0 2.5-4 5-4s2.5 4 5 4 2.5-4 5-4 2.5 4 5 4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-name">Tide</span>
      <span class="brand-label">Now playing</span>
    </header>

    <div class="art" id="art"></div>

    <div class="meta">
      <h1 class="title" id="title"></h1>
      <p class="artist" id="artist"></p>
    </div>

    <div class="seek">
      <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00">
        <div class="rail"><div class="fill" id="fill"></div></div>
        <div class="knob" id="knob"></div>
      </div>
      <div class="times">
        <span id="elapsed">0:00</span>
        <span id="remaining">-0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="prev" type="button" aria-label="Previous track"></button>
      <button class="btn primary" id="play" type="button" aria-label="Play"></button>
      <button class="btn" id="next" type="button" aria-label="Next track"></button>
    </div>

    <div class="volume">
      <button class="icon-btn" id="mute" type="button" aria-label="Mute"></button>
      <input id="vol" type="range" min="0" max="100" step="1" value="72" aria-label="Volume">
      <span class="vol-val" id="volVal">72</span>
    </div>

    <section class="queue" aria-labelledby="queueHeading">
      <h2 id="queueHeading">Up next</h2>
      <ol id="queue"></ol>
    </section>

  </section>
</main>

    player: $('player'), art: $('art'), title: $('title'), artist: $('artist'),
    bar: $('bar'), fill: $('fill'), knob: $('knob'),
    elapsed: $('elapsed'), remaining: $('remaining'),
    prev: $('prev'), play: $('play'), next: $('next'),
    mute: $('mute'), vol: $('vol'), volVal: $('volVal'), queue: $('queue')
  };

  var state = { i: 0, pos: 38, playing: false, vol: 72, lastVol: 72, dragging: false };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function cur() { return TRACKS[state.i]; }

  // Procedural artwork: blue sky, bloom, green hills, and a translucent acrylic slab.
  // p is a prefix so gradient and filter ids stay unique per rendered instance.
  function artSVG(t, p) {
    var s0 = t.sky[0], s1 = t.sky[1], s2 = t.sky[2];
    var g0 = t.grass[0], g1 = t.grass[1], g2 = t.grass[2];
    var c0 = t.slab[0], c1 = t.slab[1];
    var sx = t.sun[0] * 320, sy = t.sun[1] * 200, h = t.hill || 0;
    var clouds = t.clouds.map(function (c) {
      var cx = c[0] * 320, cy = c[1] * 200, k = c[2];
      return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + (46 * k) + '" ry="' + (12 * k) + '"/>' +
             '<ellipse cx="' + (cx + 30 * k) + '" cy="' + (cy + 5) + '" rx="' + (30 * k) + '" ry="' + (10 * k) + '"/>';
    }).join('');

    return '<svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">' +
      '<defs>' +
        '<linearGradient id="' + p + 'sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + s0 + '"/><stop offset=".6" stop-color="' + s1 + '"/><stop offset="1" stop-color="' + s2 + '"/></linearGradient>' +
        '<radialGradient id="' + p + 'sun"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>' +
        '<linearGradient id="' + p + 'gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + g0 + '"/><stop offset=".45" stop-color="' + g1 + '"/><stop offset="1" stop-color="' + g2 + '"/></linearGradient>' +
        '<linearGradient id="' + p + 'slab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + c0 + '" stop-opacity=".9"/><stop offset="1" stop-color="' + c1 + '" stop-opacity=".6"/></linearGradient>' +
        '<linearGradient id="' + p + 'acr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/><stop offset=".62" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".22"/></linearGradient>' +
        '<filter id="' + p + 'blur" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>' +
        '<filter id="' + p + 'soft" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>' +
      '</defs>' +
      '<rect width="320" height="200" fill="url(#' + p + 'sky)"/>' +
      '<circle cx="' + sx + '" cy="' + sy + '" r="84" fill="url(#' + p + 'sun)"/>' +
      '<circle cx="' + sx + '" cy="' + sy + '" r="14" fill="#fff"/>' +
      '<g fill="#fff" opacity=".92" filter="url(#' + p + 'blur)">' + clouds + '</g>' +
      '<path d="M-10 ' + (124 + h) + ' Q70 ' + (88 + h) + ' 150 ' + (118 + h) + ' T330 ' + (108 + h) + ' V210 H-10Z" fill="' + g1 + '"/>' +
      '<path d="M-10 ' + (154 + h) + ' Q110 ' + (116 + h) + ' 200 ' + (144 + h) + ' T330 ' + (134 + h) + ' V210 H-10Z" fill="url(#' + p + 'gr)"/>' +
      '<path d="M-10 ' + (154 + h) + ' Q110 ' + (116 + h) + ' 200 ' + (144 + h) + ' T330 ' + (134 + h) + '" fill="none" stroke="#f1ffd9" stroke-opacity=".7" stroke-width="1.6"/>' +
      '<path d="M-10 168 L170 150 L330 176 V210 H-10Z" fill="url(#' + p + 'slab)"/>' +
      '<ellipse cx="90" cy="184" rx="110" ry="9" fill="' + c0 + '" opacity=".75" filter="url(#' + p + 'soft)"/>' +
      '<rect width="320" height="200" fill="url(#' + p + 'acr)"/>' +
    '</svg>';
  }

  function renderTrack() {
    var t = cur();
    el.art.innerHTML = artSVG(t, 'm-') + '<span class="sheen" aria-hidden="true"></span>';
    el.title.textContent = t.title;
    el.artist.textContent = t.artist;
    el.bar.setAttribute('aria-valuemax', String(t.dur));
    document.title = t.title + ' · Tide';
    if (el.art.animate) {
      el.art.animate(
        [{ opacity: 0.3, transform: 'scale(1.03)' }, { opacity: 1, transform: 'scale(1)' }],
        { duration: 480, easing: 'cubic-bezier(.2,.7,.2,1)' }
      );
    }
  }

  function renderQueue() {
    var n = TRACKS.length, html = '';
    for (var k = 1; k <= 4; k++) {
      var idx = (state.i + k) % n, t = TRACKS[idx];
      html += '<li><button class="qitem" type="button" data-index="' + idx + '" aria-label="Play ' + esc(t.title) + ' by ' + esc(t.artist) + '">' +
        '<span class="qthumb">' + artSVG(t, 'q' + idx + '-') + '</span>' +
        '<span class="qtext"><span class="qtitle">' + esc(t.title) + '</span><span class="qartist">' + esc(t.artist) + '</span></span>' +
        '<span class="qdur">' + fmt(t.dur) + '</span>' +
      '</button></li>';
    }
    el.queue.innerHTML = html;
  }

  function setTrack(i) {
    state.i = (i + TRACKS.length) % TRACKS.length;
    state.pos = 0;
    renderTrack();
    renderQueue();
    updateProgress();
  }

  function setText(node, value) {
    if (node.textContent !== value) node.textContent = value;
  }

  function updateProgress() {
    var t = cur(), d = t.dur;
    var pos = Math.min(state.pos, d);
    var p = pos / d;
    el.fill.style.transform = 'scaleX(' + p.toFixed(5) + ')';
    el.knob.style.left = (p * 100).toFixed(3) + '%';
    setText(el.elapsed, fmt(pos));
    setText(el.remaining, '-' + fmt(d - pos));
    el.bar.setAttribute('aria-valuenow', String(Math.floor(pos)));
    el.bar.setAttribute('aria-valuetext', fmt(pos) + ' of ' + fmt(d));
  }

  function seekTo(sec) {
    state.pos = Math.max(0, Math.min(cur().dur, sec));
    updateProgress();
  }

  function seekFromPointer(e) {
    var r = el.bar.getBoundingClientRect();
    var p = (e.clientX - r.left) / r.width;
    seekTo(Math.max(0, Math.min(1, p)) * cur().dur);
  }

  function applyPlayState() {
    el.player.classList.toggle('is-playing', state.playing);
    el.play.innerHTML = state.playing ? ICON.pause : ICON.play;
    el.play.setAttribute('aria-label', state.playing ? 'Pause' : 'Play');
  }

  function togglePlay() {
    state.playing = !state.playing;
    applyPlayState();
  }

  function prev() {
    if (state.pos > 3) { seekTo(0); return; }
    setTrack(state.i - 1);
  }

  function setVolume(v) {
    v = Math.max(0, Math.min(100, Math.round(v)));
    state.vol = v;
    if (v > 0) state.lastVol = v;
    el.vol.value = String(v);
    el.vol.style.setProperty('--val', v + '%');
    el.volVal.textContent = String(v);
    el.mute.innerHTML = v === 0 ? ICON.muted : ICON.speaker;
    el.mute.setAttribute('aria-label', v === 0 ? 'Unmute' : 'Mute');
  }

  // Playback clock. Advances position while playing, auto-advances at track end.
  var last = 0;
  function frame(ts) {
    var dt = last ? Math.min((ts - last) / 1000, 0.5) : 0;
    last = ts;
    if (state.playing && !state.dragging) {
      state.pos += dt;
      if (state.pos >= cur().dur) setTrack(state.i + 1);
    }
    updateProgress();
    requestAnimationFrame(frame);
  }

  // Seek bar: pointer drag, plus keyboard.
  el.bar.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    state.dragging = true;
    el.bar.setPointerCapture(e.pointerId);
    seekFromPointer(e);
    el.bar.focus({ preventScroll: true });
  });
  el.bar.addEventListener('pointermove', function (e) {
    if (state.dragging) seekFromPointer(e);
  });
  function endDrag() { state.dragging = false; }
  el.bar.addEventListener('pointerup', endDrag);
  el.bar.addEventListener('pointercancel', endDrag);
  el.bar.addEventListener('keydown', function (e) {
    var handled = true;
    if (e.key === 'ArrowRight') seekTo(state.pos + 5);
    else if (e.key === 'ArrowLeft') seekTo(state.pos - 5);
    else if (e.key === 'Home') seekTo(0);
    else if (e.key === 'End') seekTo(cur().dur - 1);
    else handled = false;
    if (handled) e.preventDefault();
  });

  // Transport.
  el.play.addEventListener('click', togglePlay);
  el.prev.addEventListener('click', prev);
  el.next.addEventListener('click', function () { setTrack(state.i + 1); });

  // Queue: clicking an item makes it the current track and starts playback.
  el.queue.addEventListener('click', function (e) {
    var b = e.target.closest('.qitem');
    if (!b) return;
    setTrack(parseInt(b.getAttribute('data-index'), 10));
    state.playing = true;
    applyPlayState();
  });

  // Volume.
  el.vol.addEventListener('input', function () { setVolume(parseFloat(el.vol.value)); });
  el.mute.addEventListener('click', function () {
    setVolume(state.vol > 0 ? 0 : (state.lastVol || 50));
  });

  // Space toggles playback when nothing interactive has focus.
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && (e.target === document.body || e.target === document.documentElement)) {
      e.preventDefault();
      togglePlay();
    }
  });

  // Init.
  el.prev.innerHTML = ICON.prev;
  el.next.innerHTML = ICON.next;
  setVolume(state.vol);
  renderTrack();
  renderQueue();
  applyPlayState();
  updateProgress();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
