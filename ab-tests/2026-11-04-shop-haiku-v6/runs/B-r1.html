<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop component</title>
<style>
  :root {
    --ink: #1A1A1A;
    --muted: #595959;
    --accent: #1F5FBF;
    --accent-hover: #1A52A6;
    --border: #8A8A8A;
    --hair: #E4E4E4;
    --error: #B42318;
    --ground: #FFFFFF;
    --tint: #F4F4F2;
    --radius: 8px;
    --shadow-drawer: 0 8px 24px rgba(0, 0, 0, 0.12);
    --ease-out: cubic-bezier(0.2, 0.6, 0.3, 1);
    --ease-in: cubic-bezier(0.4, 0, 1, 1);
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.4;
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h2:focus { outline: none; }

  .sr {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; margin: -1px; padding: 0; border: 0;
  }

  /* Page */
  .page { max-width: 960px; margin: 0 auto; padding: 16px; }
  .top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0 16px; margin-bottom: 16px; border-bottom: 1px solid var(--hair);
  }
  .brand { font-weight: 600; }
  .pagetitle { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .hint { font-size: 13px; color: var(--muted); margin: 0 0 16px; }

  .bag-btn {
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 44px; min-width: 44px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: #FFFFFF; color: var(--ink); font: inherit; cursor: pointer;
  }
  .count {
    display: inline-grid; place-items: center; min-width: 24px; height: 24px;
    padding: 0 6px; border-radius: 12px; background: var(--ink); color: #FFFFFF;
    font-size: 13px; font-variant-numeric: tabular-nums;
  }
  .count.bump { animation: bump 200ms var(--ease-out); }

  /* Grid and card */
  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); } }

  .card { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .media {
    aspect-ratio: 1 / 1; border-radius: var(--radius); background: var(--tint);
    display: grid; place-items: center; overflow: hidden;
  }
  .media svg { width: 50%; height: 50%; }

  .name { font-size: 16px; font-weight: 500; line-height: 1.3; margin: 4px 0 0; }
  .name a { color: inherit; text-decoration: none; }
  .name a:hover { text-decoration: underline; }
  .price { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.3; }
  .price s { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .meta { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.4; }

  .variants { border: 0; margin: 0; padding: 0; min-width: 0; }
  .variants legend { padding: 0; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
  .options { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt { position: relative; display: inline-flex; }
  .opt input {
    position: absolute; top: 0; left: 0; width: 44px; height: 44px; margin: 0;
    opacity: 0; pointer-events: none;
  }
  .opt span {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 44px; height: 44px; padding: 0 10px; box-sizing: border-box;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: #FFFFFF; color: var(--ink); cursor: pointer;
  }
  .opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opt input:checked + span { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }
  .opt input[aria-disabled="true"] + span {
    color: var(--muted); text-decoration: line-through; border-style: dashed; background: #F3F3F3;
  }
  .dot {
    display: inline-block; width: 12px; height: 12px; margin-right: 6px; border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2);
  }

  .stepper {
    display: inline-flex; align-items: center; width: max-content; height: 44px;
    border: 1px solid var(--border); border-radius: var(--radius);
  }
  .stepper button {
    width: 44px; height: 100%; border: 0; background: none; color: var(--ink);
    font: inherit; font-size: 18px; cursor: pointer; border-radius: var(--radius);
  }
  .stepper button[aria-disabled="true"] { color: var(--muted); cursor: not-allowed; }
  .stepper output { min-width: 36px; text-align: center; font-variant-numeric: tabular-nums; }

  .add, .primary {
    position: relative; display: grid; place-items: center; width: 100%; min-height: 44px;
    border: 0; border-radius: var(--radius); background: var(--accent); color: #FFFFFF;
    font: inherit; font-weight: 600; cursor: pointer;
    transition: background-color 150ms var(--ease-out), transform 100ms var(--ease-out);
  }
  .add:hover, .primary:hover { background: var(--accent-hover); }
  .add:active, .primary:active { transform: scale(0.98); }
  .add[aria-disabled="true"] { background: #EDEDED; color: var(--muted); cursor: not-allowed; }
  .add[aria-disabled="true"]:hover { background: #EDEDED; }
  .add .lbl { grid-area: 1 / 1; }
  .add[aria-busy="true"] .lbl { visibility: hidden; }
  .spinner {
    grid-area: 1 / 1; width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.45); border-top-color: #FFFFFF;
    opacity: 0; animation: spin 800ms linear infinite;
  }
  .add[aria-busy="true"] .spinner { opacity: 1; }
  .swap { animation: fade 150ms var(--ease-out); }

  .reason { margin: 0; font-size: 13px; color: var(--muted); }
  .reason:empty, .msg:empty, .bag-msg:empty { display: none; }
  .msg { margin: 0; font-size: 13px; color: var(--error); }
  .soldrow { display: flex; align-items: center; gap: 8px; }
  .tag { font-size: 13px; font-weight: 600; color: var(--error); }

  .link {
    min-height: 44px; padding: 0 8px; border: 0; background: none;
    color: var(--ink); font: inherit; text-decoration: underline; cursor: pointer;
  }

  /* Bag drawer */
  .scrim {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.32);
    opacity: 0; visibility: hidden;
    transition: opacity 180ms var(--ease-in), visibility 0s linear 180ms;
  }
  .scrim.open {
    opacity: 1; visibility: visible;
    transition: opacity 240ms var(--ease-out), visibility 0s;
  }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100%);
    display: flex; flex-direction: column; background: #FFFFFF; box-shadow: var(--shadow-drawer);
    visibility: hidden; transform: translateX(100%);
    transition: transform 180ms var(--ease-in), visibility 0s linear 180ms;
  }
  .drawer.open {
    visibility: visible; transform: none;
    transition: transform 240ms var(--ease-out), visibility 0s;
  }
  .drawer header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px; border-bottom: 1px solid var(--hair);
  }
  .drawer h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .close {
    width: 44px; height: 44px; border: 0; background: none; color: var(--ink);
    font-size: 24px; line-height: 1; cursor: pointer; border-radius: var(--radius);
  }
  .body { flex: 1; overflow: auto; padding: 0 16px; }
  .lines { list-style: none; margin: 0; padding: 0; }
  .line {
    display: grid; grid-template-columns: 56px 1fr auto; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--hair);
  }
  .thumb {
    width: 56px; height: 56px; border-radius: var(--radius); background: var(--tint);
    display: grid; place-items: center;
  }
  .thumb svg { width: 60%; height: 60%; }
  .line-name { margin: 0; font-weight: 500; line-height: 1.3; }
  .line-meta { margin: 0; font-size: 13px; color: var(--muted); }
  .line-ctrl { display: flex; align-items: center; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  .line-price { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .empty { padding: 24px 0; color: var(--muted); }
  .empty p { margin: 0 0 12px; }

  .drawer footer { display: grid; gap: 8px; padding: 16px; border-top: 1px solid var(--hair); }
  .sumrow { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; }
  .sumnote { margin: 0; font-size: 13px; color: var(--muted); }
  .bag-msg { margin: 0; font-size: 13px; color: var(--muted); }
  .ghost {
    width: 100%; min-height: 44px; border: 1px solid var(--border); border-radius: var(--radius);
    background: #FFFFFF; color: var(--ink); font: inherit; cursor: pointer;
  }

  /* Bottom sheet below 480 px */
  @media (max-width: 480px) {
    .drawer {
      top: auto; left: 0; right: 0; width: auto; max-height: 85vh;
      border-radius: 12px 12px 0 0; transform: translateY(100%);
    }
    .drawer.open { transform: none; }
    .drawer .body { max-height: 52vh; }
  }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 100% { transform: scale(1); } }

  /* WCAG 2.3.3: interaction-triggered motion off for reduced-motion users */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition: none !important;
      animation: none !important;
    }
    .drawer, .drawer.open, .add:active, .primary:active { transform: none !important; }
    .spinner { border-top-color: transparent; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <span class="brand">Field Goods</span>
    <button type="button" class="bag-btn" id="bag-btn" aria-haspopup="dialog" aria-controls="bag" aria-expanded="false" aria-label="Bag, 0 items">
      <span>Bag</span><span class="count" id="count">0</span>
    </button>
  </header>

  <main>
    <h1 class="pagetitle">New in</h1>
    <p class="hint">Demo store. Nothing is charged.</p>
    <section class="grid" id="grid" aria-label="Products"></section>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="bag" role="dialog" aria-modal="true" aria-labelledby="bag-title">
  <header>
    <h2 id="bag-title" tabindex="-1">Bag</h2>
    <button type="button" class="close" id="close" aria-label="Close bag">&times;</button>
  </header>
  <div class="body">
    <div class="empty" id="empty">
      <p>Your bag is empty.</p>
      <button type="button" class="ghost" data-keep>Keep shopping</button>
    </div>
    <ul class="lines" id="lines"></ul>
  </div>
  <footer id="foot">
    <div class="sumrow"><span>Subtotal</span><span id="sub">$0.00</span></div>
    <p class="sumnote">Tax and shipping are calculated at checkout.</p>
    <button type="button" class="primary" id="checkout">Checkout</button>
    <button type="button" class="ghost" data-keep>Keep shopping</button>
    <p class="bag-msg" id="bag-msg" role="status"></p>
  </footer>
</aside>

<div class="sr" id="live" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  // Sample catalogue. Prices in cents. Stock is per variant.
  const PRODUCTS = [
    {
      id: 'overshirt', name: 'Linen overshirt', price: 6800, was: 8400,
      tint: '#E3E8DC', kind: 'shirt', variantLabel: 'Size',
      variants: [
        { id: 'S', label: 'S', stock: 4 },
        { id: 'M', label: 'M', stock: 6 },
        { id: 'L', label: 'L', stock: 0 },
        { id: 'XL', label: 'XL', stock: 3 }
      ]
    },
    {
      id: 'sweater', name: 'Merino crew sweater', price: 9200,
      tint: '#ECE6DA', kind: 'shirt', variantLabel: 'Size',
      variants: [
        { id: 'S', label: 'S', stock: 2 },
        { id: 'M', label: 'M', stock: 5 },
        { id: 'L', label: 'L', stock: 5 },
        { id: 'XL', label: 'XL', stock: 0 }
      ]
    },
    {
      id: 'tote', name: 'Canvas tote', price: 3400,
      tint: '#EFE9DF', kind: 'tote', variantLabel: 'Color',
      variants: [{ id: 'Natural', label: 'Natural', stock: 12 }]
    },
    {
      id: 'pourover', name: 'Ceramic pour-over set', price: 4800,
      tint: '#E9E9E6', kind: 'cup', variantLabel: 'Glaze',
      variants: [
        { id: 'Stone', label: 'Stone', stock: 0, dot: '#B9B2A6' },
        { id: 'Clay', label: 'Clay', stock: 0, dot: '#B5674A' }
      ]
    }
  ];

  const MAX_QTY = 9;
  const REQUEST_MS = 500;   // simulated add request
  const HOLD_MS = 1500;     // 'Added' label holds, then returns

  const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
  const fmt = cents => money.format(cents / 100);
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const byId = id => PRODUCTS.find(p => p.id === id);
  const variantOf = (p, vid) => p.variants.find(v => v.id === vid);
  const soldOutProduct = p => p.variants.every(v => v.stock === 0);

  // State
  const cards = {};   // pid -> { variant, qty, label, msg, note, pending, hold }
  const bag = [];     // { pid, vid, qty }

  PRODUCTS.forEach(p => {
    const first = p.variants.find(v => v.stock > 0) || p.variants[0];
    cards[p.id] = { variant: first.id, qty: 1, label: 'Add to bag', msg: '', note: '', pending: false, hold: null };
  });

  const bagQty = (pid, vid) => (bag.find(l => l.pid === pid && l.vid === vid) || { qty: 0 }).qty;
  const bagCount = () => bag.reduce((n, l) => n + l.qty, 0);
  const subtotal = () => bag.reduce((sum, l) => sum + byId(l.pid).price * l.qty, 0);

  // Elements
  const grid = $('#grid');
  const bagBtn = $('#bag-btn');
  const countEl = $('#count');
  const drawer = $('#bag');
  const scrim = $('#scrim');
  const heading = $('#bag-title');
  const linesEl = $('#lines');
  const emptyEl = $('#empty');
  const footEl = $('#foot');
  const subEl = $('#sub');
  const bagMsg = $('#bag-msg');
  const liveEl = $('#live');

  function announce(text) {
    liveEl.textContent = '';
    setTimeout(() => { liveEl.textContent = text; }, 50);
  }

  function art(p) {
    const ink = 'rgba(26, 26, 26, 0.28)';
    const shapes = {
      shirt: `<path d="M27 18 40 26 53 18 67 27 61 39 56 36 56 64 24 64 24 36 19 39 13 27Z" fill="${ink}"/>`,
      tote: `<path d="M30 33v-6a10 10 0 0 1 20 0v6" fill="none" stroke="${ink}" stroke-width="4" stroke-linecap="round"/><rect x="19" y="33" width="42" height="36" rx="4" fill="${ink}"/>`,
      cup: `<rect x="16" y="22" width="48" height="8" rx="3" fill="${ink}"/><path d="M22 34h36l-5 32H27Z" fill="${ink}"/>`
    };
    return `<svg viewBox="0 0 80 80" focusable="false" aria-hidden="true">${shapes[p.kind]}</svg>`;
  }

  function cardHTML(p) {
    const single = p.variants.length === 1;
    const out = soldOutProduct(p);
    const picker = single
      ? `<p class="meta">${p.variants[0].label}</p>`
      : `<fieldset class="variants">
           <legend>${p.variantLabel}: <span data-sel></span></legend>
           <div class="options">
             ${p.variants.map(v => `
               <label class="opt">
                 <input type="radio" name="v-${p.id}" value="${v.id}" ${v.stock === 0 ? 'aria-disabled="true"' : ''}>
                 <span>${v.dot ? `<i class="dot" style="background:${v.dot}"></i>` : ''}${v.label}${v.stock === 0 ? '<span class="sr"> (sold out)</span>' : ''}</span>
               </label>`).join('')}
           </div>
         </fieldset>`;
    return `
      <article class="card" data-pid="${p.id}">
        <div class="media">${art(p)}</div>
        <h2 class="name"><a href="#${p.id}">${p.name}</a></h2>
        <p class="price"><span data-now></span>${p.was ? ` <s>${fmt(p.was)}</s>` : ''}</p>
        ${picker}
        <div class="stepper" role="group" aria-label="Quantity">
          <button type="button" data-act="dec" aria-label="Decrease quantity">&minus;</button>
          <output data-qty>1</output>
          <button type="button" data-act="inc" aria-label="Increase quantity">+</button>
        </div>
        <button type="button" class="add" data-act="add"><span class="lbl">Add to bag</span><span class="spinner"></span></button>
        <p class="reason" data-reason></p>
        <p class="msg" role="alert" data-msg></p>
        <div class="soldrow" ${out ? '' : 'hidden'}>
          <span class="tag">Sold out</span>
          <button type="button" class="link" data-act="notify">Notify me</button>
        </div>
      </article>`;
  }

  function renderCard(pid) {
    const p = byId(pid);
    const s = cards[pid];
    const v = variantOf(p, s.variant);
    const card = $(`[data-pid="${pid}"]`, grid);
    const out = soldOutProduct(p);
    const vOut = v.stock === 0;
    const max = Math.max(1, Math.min(MAX_QTY, v.stock));
    if (s.qty > max) s.qty = max;

    $('[data-now]', card).textContent = fmt(p.price);
    $$('input[type="radio"]', card).forEach(r => { r.checked = r.value === s.variant; });
    const sel = $('[data-sel]', card);
    if (sel) sel.textContent = v.label;

    $('[data-qty]', card).textContent = s.qty;
    $('[data-act="dec"]', card).setAttribute('aria-disabled', String(s.qty <= 1));
    $('[data-act="inc"]', card).setAttribute('aria-disabled', String(s.qty >= max));
    $('.stepper', card).hidden = out;

    const add = $('[data-act="add"]', card);
    add.setAttribute('aria-disabled', String(out || vOut));
    add.setAttribute('aria-busy', String(s.pending));
    const lbl = $('.lbl', add);
    if (lbl.textContent !== s.label) {
      lbl.textContent = s.label;
      lbl.classList.remove('swap');
      void lbl.offsetWidth;
      lbl.classList.add('swap');
    }

    $('[data-reason]', card).textContent = s.note || (vOut && !out ? `${v.label} is sold out.` : '');
    $('[data-msg]', card).textContent = s.msg;
    $('.soldrow', card).hidden = !out;
  }

  function resetCardMessages(s) {
    s.note = '';
    s.msg = '';
    if (s.label === "Couldn't add") s.label = 'Add to bag';
  }

  function addLine(pid, vid, qty) {
    const line = bag.find(l => l.pid === pid && l.vid === vid);
    if (line) line.qty += qty;
    else bag.push({ pid, vid, qty });
  }

  function addToBag(pid) {
    const p = byId(pid);
    const s = cards[pid];
    const v = variantOf(p, s.variant);
    if (s.pending || soldOutProduct(p) || v.stock === 0) return;

    const qty = s.qty;
    const vid = v.id;
    s.pending = true;
    resetCardMessages(s);
    renderCard(pid);

    setTimeout(() => {
      s.pending = false;
      const room = v.stock - bagQty(pid, vid);
      if (qty > room) {
        s.label = "Couldn't add";
        s.msg = room > 0 ? `Only ${room} left in ${v.label}.` : `No more ${v.label} in stock.`;
        renderCard(pid);
        announce(`${p.name}, ${v.label}: ${s.msg}`);
        return;
      }
      addLine(pid, vid, qty);
      s.label = 'Added';
      s.msg = '';
      renderCard(pid);
      bumpCount();
      renderBag();
      announce(`Added ${p.name}, ${v.label} to your bag. Bag has ${bagCount()} ${bagCount() === 1 ? 'item' : 'items'}.`);
      clearTimeout(s.hold);
      s.hold = setTimeout(() => {
        if (s.label === 'Added') { s.label = 'Add to bag'; renderCard(pid); }
      }, HOLD_MS);
    }, REQUEST_MS);
  }

  function bumpCount() {
    countEl.classList.remove('bump');
    void countEl.offsetWidth;
    countEl.classList.add('bump');
  }

  function lineHTML(l) {
    const p = byId(l.pid);
    const v = variantOf(p, l.vid);
    const key = `${l.pid}|${l.vid}`;
    const atMax = l.qty >= v.stock;
    return `
      <li class="line">
        <div class="thumb">${art(p)}</div>
        <div>
          <p class="line-name">${p.name}</p>
          <p class="line-meta">${p.variants.length > 1 ? `${p.variantLabel}: ` : ''}${v.label}</p>
          <div class="line-ctrl">
            <div class="stepper" role="group" aria-label="Quantity, ${p.name}, ${v.label}">
              <button type="button" data-bag="dec" data-key="${key}" data-fk="dec:${key}" aria-label="Decrease quantity" aria-disabled="${l.qty <= 1}">&minus;</button>
              <output>${l.qty}</output>
              <button type="button" data-bag="inc" data-key="${key}" data-fk="inc:${key}" aria-label="Increase quantity" aria-disabled="${atMax}">+</button>
            </div>
            <button type="button" class="link" data-bag="rm" data-key="${key}" data-fk="rm:${key}">Remove<span class="sr"> ${p.name}, ${v.label}</span></button>
          </div>
        </div>
        <p class="line-price">${fmt(p.price * l.qty)}</p>
      </li>`;
  }

  function renderBag() {
    const active = document.activeElement;
    const fk = active && active.dataset ? active.dataset.fk : null;
    const n = bagCount();

    countEl.textContent = n;
    bagBtn.setAttribute('aria-label', `Bag, ${n} ${n === 1 ? 'item' : 'items'}`);
    linesEl.innerHTML = bag.map(lineHTML).join('');
    emptyEl.hidden = n > 0;
    linesEl.hidden = n === 0;
    footEl.hidden = n === 0;
    subEl.textContent = fmt(subtotal());

    if (fk && drawer.classList.contains('open')) {
      const el = drawer.querySelector(`[data-fk="${CSS.escape(fk)}"]`);
      (el || heading).focus();
    }
  }

  function openBag() {
    drawer.classList.add('open');
    scrim.classList.add('open');
    bagBtn.setAttribute('aria-expanded', 'true');
    heading.focus();
  }

  function closeBag() {
    drawer.classList.remove('open');
    scrim.classList.remove('open');
    bagBtn.setAttribute('aria-expanded', 'false');
    bagBtn.focus();
  }

  // Events: product grid
  grid.innerHTML = PRODUCTS.map(cardHTML).join('');
  PRODUCTS.forEach(p => renderCard(p.id));

  grid.addEventListener('click', e => {
    const link = e.target.closest('a[href^="#"]');
    if (link) { e.preventDefault(); return; }
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const pid = btn.closest('[data-pid]').dataset.pid;
    const s = cards[pid];
    const act = btn.dataset.act;

    if (act === 'inc' || act === 'dec') {
      if (btn.getAttribute('aria-disabled') === 'true') return;
      resetCardMessages(s);
      s.qty += act === 'inc' ? 1 : -1;
      renderCard(pid);
    } else if (act === 'add') {
      addToBag(pid);
    } else if (act === 'notify') {
      s.note = 'Restock alerts are not connected in this demo.';
      renderCard(pid);
    }
  });

  grid.addEventListener('change', e => {
    const r = e.target;
    if (r.type !== 'radio') return;
    const pid = r.closest('[data-pid]').dataset.pid;
    const s = cards[pid];
    const v = variantOf(byId(pid), r.value);
    if (v.stock === 0) {
      s.note = `${v.label} is sold out.`;
      renderCard(pid);
      return;
    }
    resetCardMessages(s);
    s.variant = r.value;
    renderCard(pid);
  });

  // Events: bag drawer
  linesEl.addEventListener('click', e => {
    const btn = e.target.closest('button[data-bag]');
    if (!btn) return;
    const [pid, vid] = btn.dataset.key.split('|');
    const idx = bag.findIndex(l => l.pid === pid && l.vid === vid);
    if (idx < 0) return;
    const line = bag[idx];
    const v = variantOf(byId(pid), vid);
    const act = btn.dataset.bag;

    if (act === 'rm') {
      bag.splice(idx, 1);
      bagMsg.textContent = '';
    } else if (act === 'inc') {
      if (line.qty >= v.stock) {
        bagMsg.textContent = `Only ${v.stock} left in ${v.label}.`;
        return;
      }
      line.qty += 1;
      bagMsg.textContent = '';
    } else if (act === 'dec') {
      if (line.qty <= 1) return;
      line.qty -= 1;
      bagMsg.textContent = '';
    }
    renderBag();
    announce(bagCount() === 0 ? 'Bag is empty.' : `Bag has ${bagCount()} ${bagCount() === 1 ? 'item' : 'items'}, subtotal ${fmt(subtotal())}.`);
  });

  $('#checkout').addEventListener('click', () => {
    const n = bagCount();
    if (n === 0) return;
    bagMsg.textContent = `Demo only: checkout would open with ${n} ${n === 1 ? 'item' : 'items'} at ${fmt(subtotal())}.`;
  });

  $$('[data-keep]').forEach(b => b.addEventListener('click', closeBag));
  $('#close').addEventListener('click', closeBag);
  scrim.addEventListener('click', closeBag);
  bagBtn.addEventListener('click', openBag);

  document.addEventListener('keydown', e => {
    if (!drawer.classList.contains('open')) return;
    if (e.key === 'Escape') { e.preventDefault(); closeBag(); return; }
    if (e.key !== 'Tab') return;
    const focusable = $$('button, input, a[href], [tabindex]:not([tabindex="-1"])', drawer)
      .filter(el => el.offsetParent !== null);
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    const inside = drawer.contains(document.activeElement);
    if (e.shiftKey && (!inside || document.activeElement === first)) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && (!inside || document.activeElement === last)) {
      e.preventDefault(); first.focus();
    }
  });

  renderBag();
})();
</script>
</body>
</html>
