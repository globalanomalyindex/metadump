<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Field &amp; Form Shop</title>
<style>
:root{
  --bg:#fafaf9;--fg:#1c1917;--muted:#78716c;--line:#e7e5e4;--card:#ffffff;
  --accent:#1c1917;--accent-fg:#ffffff;--chip:#f5f5f4;--warn:#b45309;--scrim:rgba(0,0,0,.35);
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0a09;--fg:#fafaf9;--muted:#a8a29e;--line:#292524;--card:#1c1917;
    --accent:#fafaf9;--accent-fg:#0c0a09;--chip:#292524;--warn:#fbbf24;--scrim:rgba(0,0,0,.6);
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0a09;--fg:#fafaf9;--muted:#a8a29e;--line:#292524;--card:#1c1917;
  --accent:#fafaf9;--accent-fg:#0c0a09;--chip:#292524;--warn:#fbbf24;--scrim:rgba(0,0,0,.6);
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font-weight:650;letter-spacing:-.01em;font-size:16px;margin-right:auto}
.search{position:relative;flex:1 1 220px;max-width:360px}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);outline:none}
.search input:focus{border-color:var(--fg)}
.cart-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-size:12px;font-weight:650;display:inline-grid;place-items:center}

/* toolbar */
main{padding:16px;max-width:1100px;margin:0 auto}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-right:auto}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--chip);font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
select{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.meta{color:var(--muted);font-size:13px;width:100%;margin:-4px 0 0}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.media{height:136px;display:grid;place-items:center;font-size:52px;background:var(--tint,#eee);position:relative}
.tag{position:absolute;left:10px;top:10px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--card);color:var(--fg)}
.tag.warn{color:var(--warn)}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.cat{font-size:12px;color:var(--muted)}
.name{font-weight:600;line-height:1.3}
.rating{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;gap:8px}
.price{font-weight:650;font-variant-numeric:tabular-nums}
.add{padding:8px 12px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-fg);font-size:13px;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:40px 0;grid-column:1/-1}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;z-index:10}
.scrim.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(400px,100%);display:flex;flex-direction:column;background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);visibility:hidden;transition:transform .25s ease,visibility .25s;z-index:11}
.drawer.open{transform:none;visibility:visible}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer-head h2{margin:0;font-size:17px}
.icon{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1}
.lines{flex:1;overflow:auto;padding:4px 18px}
.line{display:grid;grid-template-columns:56px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.thumb{width:56px;height:56px;border-radius:10px;background:var(--tint,#eee);display:grid;place-items:center;font-size:28px}
.line-name{font-weight:600;font-size:14px;line-height:1.3}
.line-price{font-size:13px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.stepper button:not(.link){width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.stepper output{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12px;padding:0 0 0 6px}
.line-total{font-weight:600;font-variant-numeric:tabular-nums}
.drawer-foot{padding:16px 18px 20px;border-top:1px solid var(--line)}
.sum{margin:0 0 10px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.sum dt{color:var(--muted)}
.sum dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.sum .total{font-weight:650;font-size:16px;padding-top:8px;border-top:1px solid var(--line)}
.note{margin:6px 0 12px;font-size:13px;color:var(--muted);min-height:1.2em}
.primary{width:100%;padding:12px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:650}
.primary:disabled{opacity:.4}

@media (max-width:480px){
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .media{height:112px;font-size:44px}
  .brand{width:100%}
  .search{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">Field &amp; Form</div>
  <label class="search">
    <span class="sr">Search products</span>
    <input id="q" type="search" placeholder="Search products" autocomplete="off">
  </label>
  <button id="cartBtn" class="cart-btn" aria-controls="drawer" aria-expanded="false">
    Cart <span id="badge" class="badge">0</span>
  </button>
</header>

<main>
  <div class="bar">
    <div id="chips" class="chips" role="group" aria-label="Category"></div>
    <label>
      <span class="sr">Sort</span>
      <select id="sort">
        <option value="featured">Featured</option>
        <option value="price-asc">Price: low to high</option>
        <option value="price-desc">Price: high to low</option>
        <option value="rating">Top rated</option>
      </select>
    </label>
    <p id="count" class="meta" aria-live="polite"></p>
  </div>
  <section id="grid" class="grid" aria-label="Products"></section>
</main>

<div id="scrim" class="scrim"></div>
<aside id="drawer" class="drawer" aria-label="Shopping cart" aria-hidden="true">
  <div class="drawer-head">
    <h2>Your cart</h2>
    <button id="closeBtn" class="icon" aria-label="Close cart">&times;</button>
  </div>
  <div id="lines" class="lines"></div>
  <div class="drawer-foot">
    <dl class="sum">
      <dt>Subtotal</dt><dd id="sSub">$0.00</dd>
      <dt>Shipping</dt><dd id="sShip">$0.00</dd>
      <dt>Estimated tax (8%)</dt><dd id="sTax">$0.00</dd>
      <dt class="total">Total</dt><dd id="sTotal" class="total">$0.00</dd>
    </dl>
    <p id="note" class="note" aria-live="polite"></p>
    <button id="checkout" class="primary">Checkout</button>
  </div>
</aside>

<script>
const PRODUCTS = [
  {id:'p1',  name:'Ceramic Pour-Over Dripper', cat:'Kitchen',  price:28,    rating:4.7, reviews:412, stock:12, icon:'☕', tint:'#f3e3d3'},
  {id:'p2',  name:'Merino Crew Sweater',       cat:'Apparel',  price:89,    rating:4.6, reviews:238, stock:5,  icon:'🧶', tint:'#dfe7e1'},
  {id:'p3',  name:'Canvas Field Tote',         cat:'Bags',     price:54,    rating:4.8, reviews:519, stock:9,  icon:'👜', tint:'#e9e4d8'},
  {id:'p4',  name:'Walnut Desk Organizer',     cat:'Home',     price:64,    rating:4.5, reviews:97,  stock:3,  icon:'🗂️', tint:'#ebe2d6'},
  {id:'p5',  name:'Trail Runner Low',          cat:'Footwear', price:120,   rating:4.4, reviews:186, stock:0,  icon:'👟', tint:'#dde3ec'},
  {id:'p6',  name:'Insulated Steel Bottle',    cat:'Outdoors', price:34.5,  rating:4.9, reviews:804, stock:20, icon:'🥤', tint:'#dfe9ec'},
  {id:'p7',  name:'Linen Throw Blanket',       cat:'Home',     price:79,    rating:4.6, reviews:143, stock:0,  icon:'🛏️', tint:'#ece7de'},
  {id:'p8',  name:'Brass Desk Lamp',           cat:'Home',     price:112,   rating:4.3, reviews:61,  stock:2,  icon:'💡', tint:'#efe6d2'},
  {id:'p9',  name:'Ribbed Wool Beanie',        cat:'Apparel',  price:24,    rating:4.5, reviews:275, stock:30, icon:'🧢', tint:'#e4e0ea'},
  {id:'p10', name:'Cast Iron Skillet, 10 in',  cat:'Kitchen',  price:46,    rating:4.9, reviews:1024,stock:7,  icon:'🍳', tint:'#e3e3e0'},
  {id:'p11', name:'Leather Card Wallet',       cat:'Bags',     price:42,    rating:4.2, reviews:88,  stock:14, icon:'👛', tint:'#f0e1d8'},
  {id:'p12', name:'Stoneware Teapot',          cat:'Kitchen',  price:38,    rating:4.7, reviews:156, stock:6,  icon:'🫖', tint:'#e6e9e2'}
];
const CATS = ['All', ...new Set(PRODUCTS.map(p => p.cat))];
const FREE_SHIP_AT = 75, SHIP_FEE = 6.95, TAX_RATE = 0.08;
const KEY = 'field-form-cart';

const state = { q:'', cat:'All', sort:'featured', cart: loadCart() };

const els = {
  q: document.getElementById('q'),
  chips: document.getElementById('chips'),
  sort: document.getElementById('sort'),
  count: document.getElementById('count'),
  grid: document.getElementById('grid'),
  badge: document.getElementById('badge'),
  cartBtn: document.getElementById('cartBtn'),
  drawer: document.getElementById('drawer'),
  scrim: document.getElementById('scrim'),
  closeBtn: document.getElementById('closeBtn'),
  lines: document.getElementById('lines'),
  note: document.getElementById('note'),
  checkout: document.getElementById('checkout'),
  sSub: document.getElementById('sSub'),
  sShip: document.getElementById('sShip'),
  sTax: document.getElementById('sTax'),
  sTotal: document.getElementById('sTotal')
};

const money = n => new Intl.NumberFormat('en-US', {style:'currency', currency:'USD'}).format(n);
const round2 = n => Math.round(n * 100) / 100;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function loadCart(){
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || '{}');
    const cart = {};
    for (const p of PRODUCTS) {
      const q = Math.min(Math.floor(Number(raw[p.id]) || 0), p.stock);
      if (q > 0) cart[p.id] = q;
    }
    return cart;
  } catch { return {}; }
}
function saveCart(){
  try { localStorage.setItem(KEY, JSON.stringify(state.cart)); } catch {}
}

function visibleProducts(){
  const q = state.q.trim().toLowerCase();
  const sorters = {
    'featured':   null,
    'price-asc':  (a, b) => a.price - b.price,
    'price-desc': (a, b) => b.price - a.price,
    'rating':     (a, b) => b.rating - a.rating
  };
  const list = PRODUCTS.filter(p =>
    (state.cat === 'All' || p.cat === state.cat) &&
    (!q || (p.name + ' ' + p.cat).toLowerCase().includes(q))
  );
  const cmp = sorters[state.sort];
  return cmp ? list.sort(cmp) : list;
}

function renderChips(){
  els.chips.innerHTML = CATS.map(c =>
    `<button class="chip" data-cat="${esc(c)}" aria-pressed="${c === state.cat}">${esc(c)}</button>`
  ).join('');
}

function cardHTML(p){
  const inCart = state.cart[p.id] || 0;
  let tag = '';
  if (p.stock > 0 && p.stock <= 3) tag = `<span class="tag warn">Only ${p.stock} left</span>`;
  let button;
  if (p.stock === 0) button = `<button class="add" disabled>Sold out</button>`;
  else if (inCart >= p.stock) button = `<button class="add" disabled>Max in cart</button>`;
  else button = `<button class="add" data-add="${p.id}">Add</button>`;
  return `
    <article class="card">
      <div class="media" style="--tint:${p.tint}">${p.icon}${tag}</div>
      <div class="body">
        <div class="cat">${esc(p.cat)}</div>
        <div class="name">${esc(p.name)}</div>
        <div class="rating">★ ${p.rating.toFixed(1)} (${p.reviews.toLocaleString('en-US')})</div>
        <div class="row">
          <span class="price">${money(p.price)}</span>
          ${button}
        </div>
      </div>
    </article>`;
}

function renderGrid(){
  const list = visibleProducts();
  els.count.textContent = `${list.length} ${list.length === 1 ? 'item' : 'items'}`;
  if (!list.length) {
    const where = state.cat === 'All' ? '' : ` in ${state.cat}`;
    const what = state.q.trim() ? ` for “${esc(state.q.trim())}”` : '';
    els.grid.innerHTML = `<p class="empty">No products${what}${where}.</p>`;
    return;
  }
  els.grid.innerHTML = list.map(cardHTML).join('');
}

function totals(){
  const items = Object.entries(state.cart)
    .map(([id, qty]) => ({ p: PRODUCTS.find(x => x.id === id), qty }))
    .filter(l => l.p && l.qty > 0);
  const count = items.reduce((n, l) => n + l.qty, 0);
  const subtotal = round2(items.reduce((s, l) => s + l.p.price * l.qty, 0));
  const shipping = subtotal === 0 || subtotal >= FREE_SHIP_AT ? 0 : SHIP_FEE;
  const tax = round2(subtotal * TAX_RATE);
  return { items, count, subtotal, shipping, tax, total: round2(subtotal + shipping + tax) };
}

function renderCart(){
  const t = totals();
  els.badge.textContent = t.count;
  els.lines.innerHTML = t.items.length ? t.items.map(l => `
    <div class="line">
      <div class="thumb" style="--tint:${l.p.tint}">${l.p.icon}</div>
      <div>
        <div class="line-name">${esc(l.p.name)}</div>
        <div class="line-price">${money(l.p.price)} each</div>
        <div class="stepper">
          <button data-dec="${l.p.id}" aria-label="Decrease quantity">&minus;</button>
          <output aria-label="Quantity">${l.qty}</output>
          <button data-inc="${l.p.id}" aria-label="Increase quantity" ${l.qty >= l.p.stock ? 'disabled' : ''}>+</button>
          <button class="link" data-rm="${l.p.id}">Remove</button>
        </div>
      </div>
      <div class="line-total">${money(round2(l.p.price * l.qty))}</div>
    </div>`).join('') : `<p class="empty">Your cart is empty.</p>`;

  els.sSub.textContent = money(t.subtotal);
  els.sShip.textContent = t.shipping === 0 && t.subtotal > 0 ? 'Free' : money(t.shipping);
  els.sTax.textContent = money(t.tax);
  els.sTotal.textContent = money(t.total);
  els.checkout.disabled = t.count === 0;

  if (t.subtotal === 0) els.note.textContent = '';
  else if (t.subtotal >= FREE_SHIP_AT) els.note.textContent = 'You qualify for free shipping.';
  else els.note.textContent = `Add ${money(round2(FREE_SHIP_AT - t.subtotal))} more for free shipping.`;
}

function commit(){
  saveCart();
  renderGrid();
  renderCart();
}

function addToCart(id){
  const p = PRODUCTS.find(x => x.id === id);
  const have = state.cart[id] || 0;
  if (!p || have >= p.stock) return;
  state.cart[id] = have + 1;
  commit();
}
function setQty(id, qty){
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  if (qty <= 0) delete state.cart[id];
  else state.cart[id] = Math.min(qty, p.stock);
  commit();
}

function openCart(open){
  els.drawer.classList.toggle('open', open);
  els.scrim.classList.toggle('open', open);
  els.drawer.setAttribute('aria-hidden', String(!open));
  els.cartBtn.setAttribute('aria-expanded', String(open));
  if (open) els.closeBtn.focus();
  else els.cartBtn.focus();
}

// events
els.q.addEventListener('input', e => { state.q = e.target.value; renderGrid(); });
els.sort.addEventListener('change', e => { state.sort = e.target.value; renderGrid(); });
els.chips.addEventListener('click', e => {
  const btn = e.target.closest('[data-cat]');
  if (!btn) return;
  state.cat = btn.dataset.cat;
  renderChips();
  renderGrid();
});
els.grid.addEventListener('click', e => {
  const btn = e.target.closest('[data-add]');
  if (btn) addToCart(btn.dataset.add);
});
els.lines.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  const id = t.dataset.inc || t.dataset.dec || t.dataset.rm;
  if (!id) return;
  const qty = state.cart[id] || 0;
  if (t.dataset.inc) setQty(id, qty + 1);
  else if (t.dataset.dec) setQty(id, qty - 1);
  else setQty(id, 0);
});
els.checkout.addEventListener('click', () => {
  const t = totals();
  if (t.count === 0) return;
  state.cart = {};
  commit();
  els.note.textContent = `Order placed (demo): ${money(t.total)} for ${t.count} ${t.count === 1 ? 'item' : 'items'}.`;
});
els.cartBtn.addEventListener('click', () => openCart(true));
els.closeBtn.addEventListener('click', () => openCart(false));
els.scrim.addEventListener('click', () => openCart(false));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && els.drawer.classList.contains('open')) openCart(false);
});

// init
renderChips();
renderGrid();
renderCart();
</script>
</body>
</html>
