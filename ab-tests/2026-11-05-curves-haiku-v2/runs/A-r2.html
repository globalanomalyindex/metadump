<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticky and Punchy Curves</title>
<style>
:root {
  --bg: #f5f4f0;
  --fg: #1a1a1a;
  --muted: #6b6b6b;
  --accent: #e4572e;
  --track: #e2dfd8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141414;
    --fg: #f2f2f2;
    --muted: #9a9a9a;
    --accent: #ff7a4d;
    --track: #2a2a2a;
  }
}
:root[data-theme="dark"] {
  --bg: #141414;
  --fg: #f2f2f2;
  --muted: #9a9a9a;
  --accent: #ff7a4d;
  --track: #2a2a2a;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.5 system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  padding: 16px;
  min-height: 100vh;
}
main { max-width: 640px; margin: 0 auto; }
h1 { font-size: 1.5rem; margin: 0.5rem 0 0.25rem; }
.intro { color: var(--muted); margin: 0 0 8px; font-size: 0.9rem; }
.curve { border-top: 1px solid var(--track); padding: 20px 0; }
.meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.name { font-weight: 600; }
.spec { color: var(--muted); font-size: 0.8rem; font-family: ui-monospace, Menlo, Consolas, monospace; }
.track {
  position: relative;
  height: 56px;
  background: var(--track);
  border-radius: 28px;
  overflow: hidden;
}
.ball {
  position: absolute;
  left: 40px;
  top: 4px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--accent);
  animation-name: slide;
  animation-iteration-count: infinite;
  animation-direction: alternate;
  animation-fill-mode: both;
  will-change: transform;
}
@keyframes slide {
  from { transform: translateX(0); }
  to { transform: translateX(var(--travel, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  .ball { animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
}
</style>
</head>
<body>
<main>
  <h1>Sticky and Punchy Curves</h1>
  <p class="intro">Three bezier curves, each shown as a looping animation. Each ball travels out and back on its own curve.</p>
  <div id="list"></div>
</main>

<script>
// The three curves. These are the exact values the animations use.
var CURVES = [
  { name: "Sticky Snap", bezier: [0.7, 0, 0.2, 1], duration_ms: 600 },
  { name: "Punchy Overshoot", bezier: [0.34, 1.56, 0.64, 1], duration_ms: 500 },
  { name: "Sticky Anticipate Punch", bezier: [0.6, -0.3, 0.1, 1.35], duration_ms: 700 }
];
window.CURVES = CURVES;

(function () {
  var list = document.getElementById("list");
  var tracks = [];

  CURVES.forEach(function (c) {
    var easing = "cubic-bezier(" + c.bezier.join(", ") + ")";

    var wrap = document.createElement("section");
    wrap.className = "curve";

    var meta = document.createElement("div");
    meta.className = "meta";
    var name = document.createElement("span");
    name.className = "name";
    name.textContent = c.name;
    var spec = document.createElement("span");
    spec.className = "spec";
    spec.textContent = easing + " · " + c.duration_ms + " ms";
    meta.appendChild(name);
    meta.appendChild(spec);

    var track = document.createElement("div");
    track.className = "track";
    var ball = document.createElement("div");
    ball.className = "ball";
    ball.style.animationTimingFunction = easing;
    ball.style.animationDuration = c.duration_ms + "ms";
    track.appendChild(ball);

    wrap.appendChild(meta);
    wrap.appendChild(track);
    list.appendChild(wrap);
    tracks.push(track);
  });

  // Travel distance: track width minus the ball and a 40px margin on each side,
  // so overshoot stays inside the rounded track.
  function layout() {
    tracks.forEach(function (track) {
      var travel = Math.max(0, track.clientWidth - 48 - 80 - 4);
      track.style.setProperty("--travel", travel + "px");
    });
  }
  layout();
  window.addEventListener("resize", layout);
})();
</script>
</body>
</html>
