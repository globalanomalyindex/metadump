<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticky and Punchy Curves</title>
<style>
:root {
  --bg: #f5f4f0;
  --fg: #1d1c1a;
  --muted: #6b6862;
  --card: #ffffff;
  --line: #e2dfd8;
  --accent: #e4572e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141311;
    --fg: #f2efe9;
    --muted: #9a958c;
    --card: #1e1d1a;
    --line: #2e2c28;
    --accent: #ff7a52;
  }
}
:root[data-theme="dark"] {
  --bg: #141311;
  --fg: #f2efe9;
  --muted: #9a958c;
  --card: #1e1d1a;
  --line: #2e2c28;
  --accent: #ff7a52;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.5 system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  padding: 24px 16px 40px;
}
main { max-width: 560px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; }
.lead { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
}
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.name { font-weight: 600; }
.meta { font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); overflow-wrap: anywhere; }
.track {
  position: relative;
  height: 44px;
  margin-top: 14px;
  border-radius: 999px;
  background: var(--line);
  overflow: hidden;
}
.dot {
  position: absolute;
  left: 4px;
  top: 4px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--accent);
  will-change: transform;
}
</style>
</head>
<body>
<main>
  <h1>Sticky and punchy</h1>
  <p class="lead">Three custom curves. Each dot loops across its track: out on one leg, back on the other.</p>
  <div id="list"></div>
</main>
<script>
const CURVES = [
  { name: "Sticky Snap", bezier: [0.2, 0.9, 0.1, 1], duration_ms: 420 },
  { name: "Punchy Overshoot", bezier: [0.25, 1.4, 0.3, 1], duration_ms: 520 },
  { name: "Grip Hold", bezier: [0.75, 0, 0.15, 1], duration_ms: 640 }
];
window.CURVES = CURVES;

const DOT = 36;
const INSET = 4;
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const list = document.getElementById("list");
const entries = [];

function travelFor(track) {
  return Math.max(0, track.clientWidth - DOT - 2 * INSET);
}

function framesFor(curve, distance) {
  const easing = "cubic-bezier(" + curve.bezier.join(", ") + ")";
  return [
    { transform: "translateX(0px)", easing: easing, offset: 0 },
    { transform: "translateX(" + distance + "px)", easing: easing, offset: 0.5 },
    { transform: "translateX(0px)", offset: 1 }
  ];
}

CURVES.forEach(function (curve) {
  const card = document.createElement("section");
  card.className = "card";

  const head = document.createElement("div");
  head.className = "head";
  const name = document.createElement("div");
  name.className = "name";
  name.textContent = curve.name;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = "cubic-bezier(" + curve.bezier.join(", ") + ") · " + curve.duration_ms + " ms per leg";
  head.appendChild(name);
  head.appendChild(meta);

  const track = document.createElement("div");
  track.className = "track";
  const dot = document.createElement("div");
  dot.className = "dot";
  track.appendChild(dot);

  card.appendChild(head);
  card.appendChild(track);
  list.appendChild(card);

  const anim = dot.animate(framesFor(curve, travelFor(track)), {
    duration: curve.duration_ms * 2,
    iterations: Infinity
  });
  if (reduceMotion) anim.pause();
  entries.push({ curve: curve, track: track, anim: anim });
});

window.addEventListener("resize", function () {
  entries.forEach(function (e) {
    e.anim.effect.setKeyframes(framesFor(e.curve, travelFor(e.track)));
  });
});
</script>
</body>
</html>
