<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticky and Punchy Curves</title>
<style>
:root {
  --bg: #f4f4f1;
  --card: #ffffff;
  --ink: #1d1d1f;
  --muted: #6b6b70;
  --accent: #e4572e;
  --line: #d9d9de;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121214;
    --card: #1c1c20;
    --ink: #f2f2f4;
    --muted: #9a9aa3;
    --accent: #ff7a4d;
    --line: #33333a;
  }
}
:root[data-theme="dark"] {
  --bg: #121214;
  --card: #1c1c20;
  --ink: #f2f2f4;
  --muted: #9a9aa3;
  --accent: #ff7a4d;
  --line: #33333a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: 16px;
  min-height: 100vh;
}
main { max-width: 640px; margin: 0 auto; }
h1 { font-size: 20px; margin: 8px 0 4px; }
p.sub { color: var(--muted); margin: 0 0 16px; font-size: 14px; line-height: 1.4; }
.stack { display: grid; gap: 14px; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
}
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.name { font-weight: 650; font-size: 16px; }
.vals { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); }
.row {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 14px;
  align-items: center;
  margin-top: 12px;
}
svg.graph { width: 110px; height: 110px; overflow: visible; }
.track {
  position: relative;
  height: 56px;
  border-radius: 999px;
  background: var(--line);
  overflow: hidden;
}
.ball {
  position: absolute;
  top: 8px;
  left: 4px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--accent);
  will-change: transform;
}
.meta { margin-top: 10px; font-size: 12px; color: var(--muted); }
footer { margin-top: 18px; font-size: 12px; color: var(--muted); text-align: center; }
@media (max-width: 460px) {
  .row { grid-template-columns: 1fr; }
  svg.graph { width: 100%; height: auto; max-width: 180px; }
}
</style>
</head>
<body>
<main>
  <h1>Sticky and punchy</h1>
  <p class="sub">Three custom cubic-bezier curves, each looping a ball out and back. Each leg runs on its curve, then holds 0.6 s at the end.</p>
  <div class="stack" id="cards"></div>
  <footer>Overshoot (y above 1) is the punch. Fast start with a firm settle is the stick.</footer>
</main>
<script>
// The three curves the animations use. Exposed on window for the test harness.
const CURVES = [
  { name: "Sticky", bezier: [0.7, 0, 0.2, 1], duration_ms: 520 },
  { name: "Punch", bezier: [0.34, 1.56, 0.64, 1], duration_ms: 460 },
  { name: "Snap-settle", bezier: [0.15, 1, 0.3, 1], duration_ms: 640 }
];
window.CURVES = CURVES;

const HOLD_MS = 600;

// Cubic bezier easing for control points (x1, y1, x2, y2), with x mapped to progress.
function bezierEase(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sampleX = t => ((ax * t + bx) * t + cx) * t;
  const sampleY = t => ((ay * t + by) * t + cy) * t;
  const slopeX = t => (3 * ax * t + 2 * bx) * t + cx;
  return function (x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) {
      const e = sampleX(t) - x;
      if (Math.abs(e) < 1e-7) break;
      const d = slopeX(t);
      if (Math.abs(d) < 1e-7) break;
      t -= e / d;
    }
    if (Math.abs(sampleX(t) - x) > 1e-5) {
      let lo = 0, hi = 1;
      t = x;
      for (let i = 0; i < 60; i++) {
        const v = sampleX(t);
        if (Math.abs(v - x) < 1e-7) break;
        if (x > v) lo = t; else hi = t;
        t = (lo + hi) / 2;
      }
    }
    return sampleY(t);
  };
}

function curvePath(b) {
  const [x1, y1, x2, y2] = b;
  return `M0 200 C${x1 * 200} ${200 - y1 * 200} ${x2 * 200} ${200 - y2 * 200} 200 0`;
}

const SVG_NS = "http://www.w3.org/2000/svg";
const cardsEl = document.getElementById("cards");
const tracks = [];

CURVES.forEach(c => {
  const card = document.createElement("section");
  card.className = "card";

  const head = document.createElement("div");
  head.className = "head";
  const name = document.createElement("div");
  name.className = "name";
  name.textContent = c.name;
  const vals = document.createElement("div");
  vals.className = "vals";
  vals.textContent = `[${c.bezier.join(", ")}]  ${c.duration_ms} ms`;
  head.append(name, vals);

  const row = document.createElement("div");
  row.className = "row";

  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("class", "graph");
  svg.setAttribute("viewBox", "-10 -50 220 270");
  const frame = document.createElementNS(SVG_NS, "rect");
  frame.setAttribute("x", "0"); frame.setAttribute("y", "0");
  frame.setAttribute("width", "200"); frame.setAttribute("height", "200");
  frame.setAttribute("fill", "none");
  frame.setAttribute("stroke", "var(--line)");
  const path = document.createElementNS(SVG_NS, "path");
  path.setAttribute("d", curvePath(c.bezier));
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", "var(--accent)");
  path.setAttribute("stroke-width", "5");
  path.setAttribute("stroke-linecap", "round");
  svg.append(frame, path);

  const track = document.createElement("div");
  track.className = "track";
  const ball = document.createElement("div");
  ball.className = "ball";
  track.appendChild(ball);

  row.append(svg, track);

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = "Loop: out " + c.duration_ms + " ms, hold " + HOLD_MS + " ms, back " + c.duration_ms + " ms, hold " + HOLD_MS + " ms";

  card.append(head, row, meta);
  cardsEl.appendChild(card);

  tracks.push({ curve: c, ease: bezierEase(...c.bezier), track, ball });
});

// Progress of the ball (0 at start, 1 at end) for a given time within the loop.
function progressAt(t, dur) {
  if (t < dur) return tracks.ease ? 0 : 0; // placeholder replaced below
  return 0;
}

function positionFor(entry, now) {
  const dur = entry.curve.duration_ms;
  const cycle = 2 * dur + 2 * HOLD_MS;
  const t = (now - START) % cycle;
  let p;
  if (t < dur) {
    p = entry.ease(t / dur);
  } else if (t < dur + HOLD_MS) {
    p = 1;
  } else if (t < 2 * dur + HOLD_MS) {
    p = 1 - entry.ease((t - dur - HOLD_MS) / dur);
  } else {
    p = 0;
  }
  return p;
}

function render(now) {
  tracks.forEach(entry => {
    const max = Math.max(0, entry.track.clientWidth - 48);
    const p = positionFor(entry, now);
    entry.ball.style.transform = `translate3d(${p * max}px, 0, 0)`;
  });
}

const START = performance.now();
const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function loop(now) {
  render(now);
  requestAnimationFrame(loop);
}

if (reduced) {
  // Reduced motion: hold each ball at the far end instead of looping.
  tracks.forEach(entry => {
    const max = Math.max(0, entry.track.clientWidth - 48);
    entry.ball.style.transform = `translate3d(${max}px, 0, 0)`;
  });
} else {
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
