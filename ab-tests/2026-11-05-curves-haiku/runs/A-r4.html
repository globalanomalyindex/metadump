<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticky Punchy Curves</title>
<style>
:root{
  --bg:#f5f3ef;--fg:#1d1b19;--muted:#6b665f;--accent:#e4572e;--track:#e2ded7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161514;--fg:#f2efe9;--muted:#9a948b;--accent:#ff7a52;--track:#2a2825;
  }
}
:root[data-theme="dark"]{
  --bg:#161514;--fg:#f2efe9;--muted:#9a948b;--accent:#ff7a52;--track:#2a2825;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--fg);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:16px;min-height:100vh;
}
main{max-width:640px;margin:0 auto;padding-top:24px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:8px}
h1{font-size:1.4rem;margin:0;line-height:1.2}
p.sub{color:var(--muted);margin:4px 0 0;font-size:.95rem}
button{
  font:inherit;font-size:.9rem;color:var(--fg);background:transparent;
  border:1px solid var(--track);border-radius:999px;padding:6px 14px;cursor:pointer;
}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.curve{border-top:1px solid var(--track);padding:18px 0}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.name{font-weight:600}
.vals{font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted)}
.plot{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.plot svg{width:56px;height:56px;flex:none;overflow:visible}
.plot .frame{fill:none;stroke:var(--track);stroke-width:1}
.plot .path{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round}
.plot .handle{stroke:var(--muted);stroke-width:1}
.plot .pt{fill:var(--muted)}
.track{
  position:relative;height:48px;background:var(--track);border-radius:24px;overflow:hidden;
}
.dot{
  position:absolute;left:0;top:0;width:48px;height:48px;border-radius:50%;
  background:var(--accent);will-change:transform,opacity;
}
body.paused .dot{animation-play-state:paused}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Sticky and punchy</h1>
      <p class="sub">Three custom bezier curves, each looping.</p>
    </div>
    <button type="button" id="toggle" aria-pressed="false">Pause</button>
  </header>
  <div id="list"></div>
</main>

<script>
// Curves used by the animations below. Values are the exact ones the CSS keyframes use.
window.CURVES = [
  { "name": "sticky-punch", "bezier": [0.34, 1.56, 0.64, 1], "duration_ms": 600 },
  { "name": "snap-settle",  "bezier": [0.16, 1, 0.3, 1.2],   "duration_ms": 450 },
  { "name": "wind-up-pop",  "bezier": [0.6, -0.5, 0.1, 1.4], "duration_ms": 800 }
];

(function () {
  var HOLD_MS = 900;   // pause at the end of each loop before it restarts
  var DOT = 48;        // dot diameter in px
  var list = document.getElementById('list');
  var styleEl = document.createElement('style');
  document.head.appendChild(styleEl);
  var rules = [];
  var tracks = [];

  window.CURVES.forEach(function (c, i) {
    var b = c.bezier;
    var total = c.duration_ms + HOLD_MS;
    var stop = (c.duration_ms / total * 100).toFixed(3) + '%';
    var easing = 'cubic-bezier(' + b.join(',') + ')';
    var name = 'curve-loop-' + i;

    // Keyframes: move with the bezier, fade in while moving, hold, fade out, restart.
    rules.push(
      '@keyframes ' + name + '{' +
        '0%{transform:translateX(0);opacity:0;animation-timing-function:' + easing + '}' +
        stop + '{transform:translateX(var(--travel));opacity:1;animation-timing-function:linear}' +
        '100%{transform:translateX(var(--travel));opacity:0}' +
      '}'
    );
    rules.push(
      '.curve-' + i + ' .dot{animation:' + name + ' ' + total + 'ms infinite}'
    );

    // Curve plot: start at (0,1), end at (1,0) in a 0..1 box; y is flipped for SVG.
    var px = function (v) { return (v * 50 + 3).toFixed(2); };
    var py = function (v) { return (53 - v * 50).toFixed(2); };
    var d = 'M3,53 C' + px(b[0]) + ',' + py(b[1]) + ' ' + px(b[2]) + ',' + py(b[3]) + ' 53,3';

    var row = document.createElement('section');
    row.className = 'curve curve-' + i;
    row.innerHTML =
      '<div class="meta">' +
        '<span class="name"></span>' +
        '<span class="vals"></span>' +
      '</div>' +
      '<div class="plot">' +
        '<svg viewBox="0 0 56 56" aria-hidden="true">' +
          '<rect class="frame" x="3" y="3" width="50" height="50"></rect>' +
          '<line class="handle" x1="3" y1="53" x2="' + px(b[0]) + '" y2="' + py(b[1]) + '"></line>' +
          '<line class="handle" x1="53" y1="3" x2="' + px(b[2]) + '" y2="' + py(b[3]) + '"></line>' +
          '<path class="path" d="' + d + '"></path>' +
        '</svg>' +
        '<span class="vals"></span>' +
      '</div>' +
      '<div class="track"><div class="dot"></div></div>';

    row.querySelector('.name').textContent = c.name;
    var vals = row.querySelectorAll('.vals');
    vals[0].textContent = c.duration_ms + ' ms';
    vals[1].textContent = 'cubic-bezier(' + b.join(', ') + ')';
    list.appendChild(row);
    tracks.push(row.querySelector('.track'));
  });

  styleEl.textContent = rules.join('\n');

  function layout() {
    tracks.forEach(function (t) {
      t.style.setProperty('--travel', Math.max(0, t.clientWidth - DOT) + 'px');
    });
  }
  layout();
  window.addEventListener('resize', layout);

  var btn = document.getElementById('toggle');
  btn.addEventListener('click', function () {
    var paused = document.body.classList.toggle('paused');
    btn.textContent = paused ? 'Play' : 'Pause';
    btn.setAttribute('aria-pressed', String(paused));
  });
})();
</script>
</body>
</html>
