<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Box Sandbox</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d1d1f;--panel:rgba(255,255,255,.92);--line:rgba(0,0,0,.14);--accent:#2f6fed}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#15171c;--fg:#e8e8ea;--panel:rgba(34,37,44,.94);--line:rgba(255,255,255,.14);--accent:#6ea8ff}
}
:root[data-theme="dark"]{--bg:#15171c;--fg:#e8e8ea;--panel:rgba(34,37,44,.94);--line:rgba(255,255,255,.14);--accent:#6ea8ff}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#stage.grabbing{cursor:grabbing}
#bar{position:fixed;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 2px 12px rgba(0,0,0,.12);width:max-content;max-width:calc(100vw - 24px)}
#bar button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
#bar button:hover{border-color:var(--accent);color:var(--accent)}
#bar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#hud{position:fixed;left:12px;bottom:10px;font-size:12px;opacity:.75;background:var(--panel);border-radius:8px;padding:4px 8px;border:1px solid var(--line)}
</style>
</head>
<body>
<canvas id="stage" aria-label="Physics sandbox: drag boxes around"></canvas>
<div id="bar">
  <button id="add" type="button">Add box</button>
  <button id="grav" type="button">Gravity: on</button>
  <button id="reset" type="button">Reset</button>
  <button id="clear" type="button">Clear</button>
</div>
<div id="hud">Drag a box to move it. Click empty space to drop one.</div>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const gravBtn = document.getElementById('grav');

  const GRAVITY = 1400;      // px/s^2
  const SUBSTEPS = 8;
  const ITERS = 8;
  const BOX_REST = 0.15;
  const WALL_REST = 0.3;
  const FRICTION = 0.6;
  const SPRING = 300;        // drag spring stiffness
  const DAMP = 14;           // drag damping
  const MAX_V = 3000;        // px/s safety clamp
  const MAX_BOXES = 80;
  const COLORS = ['#ef6f6c', '#f5b841', '#4cc9a0', '#4f8ff7', '#b07cf0', '#ff8fab', '#7bd389'];

  // Seeded PRNG so the initial layout is reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  let rng = mulberry32(7);

  let W = 0, H = 0, DPR = 1;
  let boxes = [];
  let nextId = 1;
  let gravityOn = true;
  let drag = null;               // { box, ox, oy, id }
  const pointer = { x: 0, y: 0 };

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    for (const b of boxes) clampBox(b);
  }

  function clampBox(b) {
    const hw = b.w / 2, hh = b.h / 2;
    b.x = Math.min(Math.max(b.x, hw), Math.max(hw, W - hw));
    b.y = Math.min(Math.max(b.y, hh), Math.max(hh, H - hh));
  }

  function makeBox(x, y) {
    const w = 36 + rng() * 64;
    const h = 30 + rng() * 56;
    const color = COLORS[Math.floor(rng() * COLORS.length)];
    const b = { id: nextId++, x, y, w, h, vx: 0, vy: 0, color };
    clampBox(b);
    return b;
  }

  function addBox(x, y) {
    if (boxes.length >= MAX_BOXES) return null;
    const b = makeBox(x, y);
    boxes.push(b);
    return b;
  }

  function resetScene() {
    rng = mulberry32(7);
    nextId = 1;
    drag = null;
    boxes = [];
    for (let i = 0; i < 6; i++) {
      addBox(W * (0.25 + 0.5 * rng()), 60 + i * 40);
    }
  }

  function invMass(b) {
    return drag && drag.box === b ? 0 : 1;
  }

  function solveWalls() {
    for (const b of boxes) {
      const hw = b.w / 2, hh = b.h / 2;
      if (b.x - hw < 0) { b.x = hw; if (b.vx < 0) b.vx = -b.vx * WALL_REST; }
      if (b.x + hw > W) { b.x = W - hw; if (b.vx > 0) b.vx = -b.vx * WALL_REST; }
      if (b.y - hh < 0) { b.y = hh; if (b.vy < 0) b.vy = -b.vy * WALL_REST; }
      if (b.y + hh > H) {
        b.y = H - hh;
        if (b.vy > 0) {
          b.vy = -b.vy * WALL_REST;
          if (Math.abs(b.vy) < 25) b.vy = 0;
        }
        b.vx *= 0.9; // floor friction
      }
    }
  }

  function solvePairs() {
    const n = boxes.length;
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const a = boxes[i], b = boxes[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const ox = (a.w + b.w) / 2 - Math.abs(dx);
        const oy = (a.h + b.h) / 2 - Math.abs(dy);
        if (ox <= 0 || oy <= 0) continue;

        let nx, ny, pen;
        if (ox < oy) { nx = dx < 0 ? -1 : 1; ny = 0; pen = ox; }
        else { nx = 0; ny = dy < 0 ? -1 : 1; pen = oy; }

        const wa = invMass(a), wb = invMass(b);
        const inv = wa + wb;
        if (inv === 0) continue;

        // Positional correction (split by inverse mass).
        const corr = (pen / inv) * 0.9;
        a.x -= nx * corr * wa; a.y -= ny * corr * wa;
        b.x += nx * corr * wb; b.y += ny * corr * wb;

        // Normal impulse with restitution.
        const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (vn < 0) {
          const jn = -(1 + BOX_REST) * vn / inv;
          a.vx -= jn * nx * wa; a.vy -= jn * ny * wa;
          b.vx += jn * nx * wb; b.vy += jn * ny * wb;

          // Friction impulse along the tangent, clamped by Coulomb limit.
          const tx = -ny, ty = nx;
          const vt = (b.vx - a.vx) * tx + (b.vy - a.vy) * ty;
          const jt = Math.max(-FRICTION * jn, Math.min(FRICTION * jn, -vt / inv));
          a.vx -= jt * tx * wa; a.vy -= jt * ty * wa;
          b.vx += jt * tx * wb; b.vy += jt * ty * wb;
        }
      }
    }
  }

  function step(dt) {
    const h = dt / SUBSTEPS;
    if (h <= 0) return;
    for (let s = 0; s < SUBSTEPS; s++) {
      for (const b of boxes) {
        if (drag && drag.box === b) {
          const tx = pointer.x - drag.ox, ty = pointer.y - drag.oy;
          const k = Math.exp(-DAMP * h);
          b.vx = (b.vx + (tx - b.x) * SPRING * h) * k;
          b.vy = (b.vy + (ty - b.y) * SPRING * h) * k;
        } else if (gravityOn) {
          b.vy += GRAVITY * h;
        }
        b.vx = Math.max(-MAX_V, Math.min(MAX_V, b.vx));
        b.vy = Math.max(-MAX_V, Math.min(MAX_V, b.vy));
        b.x += b.vx * h;
        b.y += b.vy * h;
      }
      for (let i = 0; i < ITERS; i++) {
        solveWalls();
        solvePairs();
      }
    }
    solveWalls();
  }

  function roundRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const b of boxes) {
      const x = b.x - b.w / 2, y = b.y - b.h / 2;
      const held = drag && drag.box === b;
      roundRectPath(x, y, b.w, b.h, 8);
      ctx.fillStyle = b.color;
      ctx.fill();
      ctx.lineWidth = held ? 3 : 1.5;
      ctx.strokeStyle = held ? 'rgba(47,111,237,.9)' : 'rgba(0,0,0,.25)';
      ctx.stroke();
    }
  }

  function hitTest(px, py) {
    for (let i = boxes.length - 1; i >= 0; i--) {
      const b = boxes[i];
      if (Math.abs(px - b.x) <= b.w / 2 && Math.abs(py - b.y) <= b.h / 2) return b;
    }
    return null;
  }

  function toBack(b) {
    const i = boxes.indexOf(b);
    if (i >= 0 && i !== boxes.length - 1) {
      boxes.splice(i, 1);
      boxes.push(b);
    }
  }

  function localPoint(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  canvas.addEventListener('pointerdown', (e) => {
    const p = localPoint(e);
    pointer.x = p.x; pointer.y = p.y;
    const b = hitTest(p.x, p.y);
    if (b) {
      canvas.setPointerCapture(e.pointerId);
      drag = { box: b, ox: p.x - b.x, oy: p.y - b.y, id: e.pointerId };
      b.vx = 0; b.vy = 0;
      toBack(b);
      canvas.classList.add('grabbing');
    } else {
      addBox(p.x, p.y);
    }
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', (e) => {
    const p = localPoint(e);
    pointer.x = p.x; pointer.y = p.y;
  });

  function endDrag(e) {
    if (drag && (!e || e.pointerId === drag.id)) {
      drag = null;
      canvas.classList.remove('grabbing');
    }
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('lostpointercapture', endDrag);

  document.getElementById('add').addEventListener('click', () => {
    addBox(W * (0.3 + 0.4 * rng()), 60);
  });
  gravBtn.addEventListener('click', () => {
    gravityOn = !gravityOn;
    gravBtn.textContent = 'Gravity: ' + (gravityOn ? 'on' : 'off');
  });
  document.getElementById('reset').addEventListener('click', () => {
    resetScene();
  });
  document.getElementById('clear').addEventListener('click', () => {
    drag = null;
    boxes = [];
  });

  window.addEventListener('resize', resize);

  // Test-harness hook: current boxes as centers in CSS px.
  window.boxes = function () {
    return boxes.map((b) => ({ x: b.x, y: b.y, w: b.w, h: b.h }));
  };

  let lastHud = '';
  function updateHud() {
    const text = boxes.length + ' box' + (boxes.length === 1 ? '' : 'es') +
      ' · gravity ' + (gravityOn ? 'on' : 'off') +
      (drag ? ' · dragging' : '') +
      ' · drag a box to move it, click empty space to drop one';
    if (text !== lastHud) { hud.textContent = text; lastHud = text; }
  }

  let last = performance.now();
  function frame(t) {
    const dt = Math.min((t - last) / 1000, 1 / 30);
    last = t;
    step(dt);
    draw();
    updateHud();
    requestAnimationFrame(frame);
  }

  resize();
  resetScene();
  requestAnimationFrame((t) => { last = t; frame(t); });
})();
</script>
</body>
</html>
