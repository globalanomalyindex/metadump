<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Figma Loop</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Looping animation: five colorful Figma-style shapes assemble, burst outward and reassemble"></canvas>
<script>
(function () {
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var DUR = 5000; // loop length in ms
  var COLORS = ['#F24E1E', '#FF7262', '#A259FF', '#1ABCFE', '#0ACF83'];
  var BLOBS = [
    { c: '#F24E1E', p: 0.0, rx: 0.30, ry: 0.22 },
    { c: '#A259FF', p: 2.1, rx: 0.26, ry: 0.30 },
    { c: '#1ABCFE', p: 4.2, rx: 0.32, ry: 0.20 },
    { c: '#0ACF83', p: 3.1, rx: 0.22, ry: 0.28 }
  ];
  var TARGETS = [[-0.55, -0.55], [0.55, -0.55], [-0.55, 0.55], [0.55, 0.55], [0, 0]];
  var SCATTER = [[-2.2, -1.6], [2.4, -1.2], [-2.0, 1.8], [2.1, 1.9], [0.3, -2.4]];
  var SPIN = [-120, 140, -90, 160, -200];
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, dpr = 1;
  var start = performance.now();

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', function () { resize(); if (reduce) draw(0.45); });

  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function frac(x) { return x - Math.floor(x); }

  // Keyframes per piece, in unit space. Last key equals first so the loop is seamless.
  function pieceState(i, t) {
    var tx = TARGETS[i][0], ty = TARGETS[i][1];
    var sx = SCATTER[i][0], sy = SCATTER[i][1];
    var sp = SPIN[i];
    var K = [
      [0.00, sx, sy, sp, 0],
      [0.22, tx, ty, 0, 1],
      [0.52, tx, ty, 0, 1],
      [0.74, tx * 1.7, ty * 1.7, (i % 2 ? 90 : -90), 1.15],
      [1.00, sx, sy, sp, 0]
    ];
    for (var k = 0; k < K.length - 1; k++) {
      var a = K[k], b = K[k + 1];
      if (t >= a[0] && t <= b[0]) {
        var e = ease((t - a[0]) / (b[0] - a[0]));
        return { x: lerp(a[1], b[1], e), y: lerp(a[2], b[2], e), r: lerp(a[3], b[3], e), s: lerp(a[4], b[4], e) };
      }
    }
    return { x: sx, y: sy, r: sp, s: 0 };
  }

  function shape(i) {
    ctx.beginPath();
    if (i === 0) {
      if (ctx.roundRect) ctx.roundRect(-0.5, -0.5, 1, 1, [0.5, 0, 0, 0]); else ctx.rect(-0.5, -0.5, 1, 1);
    } else if (i === 1) {
      ctx.arc(0, 0, 0.5, 0, Math.PI * 2);
    } else if (i === 2) {
      if (ctx.roundRect) ctx.roundRect(-0.5, -0.5, 1, 1, 0.28); else ctx.rect(-0.5, -0.5, 1, 1);
    } else if (i === 3) {
      ctx.arc(0, 0, 0.5, Math.PI, 0);
      ctx.closePath();
    } else {
      ctx.moveTo(-0.5, -0.5);
      ctx.arc(-0.5, -0.5, 1, 0, Math.PI / 2);
      ctx.closePath();
    }
  }

  function draw(t) {
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#0b0b0d';
    ctx.fillRect(0, 0, W, H);

    // Drifting colour blooms, periodic in t
    var cx = W / 2, cy = H / 2;
    var big = Math.min(W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (var j = 0; j < BLOBS.length; j++) {
      var B = BLOBS[j];
      var ang = t * Math.PI * 2 + B.p;
      var bx = cx + Math.cos(ang) * W * B.rx;
      var by = cy + Math.sin(ang * 2) * H * B.ry;
      var rad = big * 0.75;
      var g = ctx.createRadialGradient(bx, by, 0, bx, by, rad);
      g.addColorStop(0, hexA(B.c, 0.22));
      g.addColorStop(1, hexA(B.c, 0));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.globalCompositeOperation = 'source-over';

    // Shapes
    var U = big * 0.16;
    for (var i = 0; i < 5; i++) {
      var lt = frac(t - i * 0.035);
      var st = pieceState(i, lt);
      if (st.s < 0.01) continue;
      ctx.save();
      ctx.translate(cx + st.x * U, cy + st.y * U);
      ctx.rotate(st.r * Math.PI / 180);
      ctx.scale(st.s * U, st.s * U);
      ctx.fillStyle = COLORS[i];
      shape(i);
      ctx.fill();
      ctx.restore();
    }
  }

  function hexA(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  function frame(now) {
    draw(frac((now - start) / DUR));
    requestAnimationFrame(frame);
  }

  resize();
  if (reduce) {
    draw(0.45);
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
