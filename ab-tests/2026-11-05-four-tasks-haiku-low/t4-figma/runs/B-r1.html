<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand Shape Loop</title>
<style>
  :root {
    --ground-a: #fde6da;
    --ground-b: #dce8ff;
    --orange: #ff7a59;
    --purple: #8b5cf6;
    --yellow: #ffc83d;
    --green: #2bd4a0;
    --blue: #3d8bff;
    --pink: #ff5c9d;
    --ink: #1c1b29;
    --page: #f4f4f7;
    --handle: #ffffff;
    --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
    --ease-io: cubic-bezier(0.45, 0, 0.55, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground-a: #2a2148;
      --ground-b: #142a3f;
      --page: #0e0e14;
      --ink: #f2f2f7;
      --handle: #1c1b29;
    }
  }
  :root[data-theme="dark"] {
    --ground-a: #2a2148;
    --ground-b: #142a3f;
    --page: #0e0e14;
    --ink: #f2f2f7;
    --handle: #1c1b29;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-x: hidden;
  }

  .wrap { width: 100%; max-width: 960px; }

  /* The stage is a container so every position and travel is in cqw:
     the whole composition scales with the stage and stays on-brand at any width. */
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    border-radius: 16px;
    container-type: inline-size;
    background: linear-gradient(160deg, var(--ground-a) 0%, var(--ground-b) 100%);
    cursor: pointer;
  }

  .shape {
    position: absolute;
    display: block;
    animation: loop 5s linear infinite;
    will-change: transform;
  }
  .stage.paused .shape,
  .stage.paused .handle { animation-play-state: paused; }

  /* Soft gradient field: drifts on a closed path behind the solids. */
  .field {
    left: 30%; top: 4%;
    width: 60cqw; height: 60cqw;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.45) 0%, rgba(139, 92, 246, 0) 70%);
    animation-name: drift;
  }

  .orb {
    left: 12%; top: 26%;
    width: 18cqw; height: 18cqw;
    border-radius: 50%;
    background: var(--orange);
    animation-name: orb;
  }

  .sq {
    left: 58%; top: 16%;
    width: 14cqw; height: 14cqw;
    background: var(--green);
    animation-name: sq;
  }
  .handle {
    position: absolute;
    width: 2.2cqw; height: 2.2cqw;
    background: var(--handle);
    animation: handle 5s linear infinite;
  }
  .h-tl { left: -1.1cqw;  top: -1.1cqw; }
  .h-tr { right: -1.1cqw; top: -1.1cqw; }
  .h-bl { left: -1.1cqw;  bottom: -1.1cqw; }
  .h-br { right: -1.1cqw; bottom: -1.1cqw; }

  .blob {
    left: 40%; top: 50%;
    width: 22cqw; height: 22cqw;
    background: var(--purple);
    animation-name: blob;
  }

  .star {
    left: 72%; top: 54%;
    width: 15cqw; height: 15cqw;
    animation-name: star;
  }
  .star svg { display: block; width: 100%; height: 100%; }

  .dot {
    left: 8%; top: 64%;
    width: 9cqw; height: 9cqw;
    border-radius: 50%;
    background: var(--blue);
    animation-name: dot;
  }

  .bar {
    left: 26%; top: 84%;
    width: 16cqw; height: 3.2cqw;
    border-radius: 999px;
    background: var(--pink);
    animation-name: bar;
  }

  /* One 5 s cycle. Every keyframe carries its own easing, so velocity is zero at
     every key including 0% and 100%, and the restart is continuous.
     0% and 100% are identical for every property: the seam is invisible. */
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1);       animation-timing-function: var(--ease-io); }
    35%  { transform: translate(-8cqw, 6cqw) scale(1.12); animation-timing-function: var(--ease-io); }
    70%  { transform: translate(6cqw, 10cqw) scale(0.94); animation-timing-function: var(--ease-io); }
    100% { transform: translate(0, 0) scale(1); }
  }

  @keyframes orb {
    0%   { transform: translate(0, 0) scale(1);      animation-timing-function: var(--ease-out); }
    30%  { transform: translate(15cqw, -7cqw) scale(1.12); animation-timing-function: var(--ease-io); }
    60%  { transform: translate(4cqw, 9cqw) scale(0.96); animation-timing-function: var(--ease-io); }
    100% { transform: translate(0, 0) scale(1); }
  }

  @keyframes sq {
    0%   { transform: translate(0, 0) rotate(0deg);     animation-timing-function: var(--ease-out); }
    40%  { transform: translate(-11cqw, 12cqw) rotate(90deg); animation-timing-function: var(--ease-io); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  @keyframes handle {
    0%, 100% { border-radius: 0; transform: scale(1); }
    40%      { border-radius: 50%; transform: scale(1.25); }
  }

  @keyframes blob {
    0% {
      transform: translate(0, 0);
      border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      animation-timing-function: var(--ease-io);
    }
    50% {
      transform: translate(-4cqw, -9cqw);
      border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%;
      animation-timing-function: var(--ease-io);
    }
    100% {
      transform: translate(0, 0);
      border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
    }
  }

  @keyframes star {
    0%   { transform: translate(0, 0) rotate(0deg);   animation-timing-function: var(--ease-out); }
    50%  { transform: translate(-6cqw, 4cqw) rotate(45deg); animation-timing-function: var(--ease-io); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  @keyframes dot {
    0%   { transform: translate(0, 0);          animation-timing-function: var(--ease-out); }
    25%  { transform: translate(18cqw, -6cqw);  animation-timing-function: var(--ease-io); }
    55%  { transform: translate(34cqw, 5cqw);   animation-timing-function: var(--ease-io); }
    80%  { transform: translate(14cqw, -2cqw);  animation-timing-function: var(--ease-io); }
    100% { transform: translate(0, 0); }
  }

  @keyframes bar {
    0%   { transform: translate(0, 0) scaleX(1);     animation-timing-function: var(--ease-out); }
    50%  { transform: translate(22cqw, -3cqw) scaleX(1.5); animation-timing-function: var(--ease-io); }
    100% { transform: translate(0, 0) scaleX(1); }
  }

  /* Reduced motion: no travel or scale. The composition rests on its frame-0 layout. */
  @media (prefers-reduced-motion: reduce) {
    .shape, .handle { animation: none !important; }
  }

  .caption {
    margin: 14px 4px 0;
    font-size: 13px;
    line-height: 1.4;
    opacity: 0.7;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage" role="img" aria-label="Looping 5 second composition of flat brand shapes in spectrum colors on a soft gradient">
    <div class="shape field"></div>
    <div class="shape orb"></div>
    <div class="shape sq">
      <span class="handle h-tl"></span>
      <span class="handle h-tr"></span>
      <span class="handle h-bl"></span>
      <span class="handle h-br"></span>
    </div>
    <div class="shape blob"></div>
    <div class="shape star">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <polygon fill="var(--yellow)" points="100,50 75.9,60.7 85.4,85.4 60.7,75.9 50,100 39.3,75.9 14.6,85.4 24.1,60.7 0,50 24.1,39.3 14.6,14.6 39.3,24.1 50,0 60.7,24.1 85.4,14.6 75.9,39.3"/>
      </svg>
    </div>
    <div class="shape dot"></div>
    <div class="shape bar"></div>
  </div>
  <p class="caption">Click the shapes to pause or resume. Reduced-motion settings show the still frame.</p>
</div>
<script>
  (function () {
    var stage = document.getElementById('stage');
    stage.addEventListener('click', function () {
      stage.classList.toggle('paused');
    });
  })();
</script>
</body>
</html>
