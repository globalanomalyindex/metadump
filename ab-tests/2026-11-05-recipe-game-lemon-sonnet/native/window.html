<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MetaDump side by side</title>
<!-- A Chrome for macOS window (light theme, 2023+ refresh) drawn around one showcase scene, filmed at 1080x1350.
     The chrome is laid out in points and zoomed by S (px per pt). The scene iframe keeps its 1080 px width and
     gets a shorter viewport so its absolutely placed footer and cards stay inside the window. -->
<style>
:root{--frame:#dfe3e8;--omni:#edf0f4;--ink:#1f1f1f;--dim:#5e5e5e;--icon:#474747}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
body{background:
  radial-gradient(60% 50% at 12% 8%,#9cc0ff 0,rgba(156,192,255,0) 70%),
  radial-gradient(55% 45% at 92% 18%,#b9a6ff 0,rgba(185,166,255,0) 70%),
  radial-gradient(70% 55% at 80% 95%,#7fb4f5 0,rgba(127,180,245,0) 70%),
  radial-gradient(60% 50% at 8% 92%,#c7b5f7 0,rgba(199,181,247,0) 70%),#aebfee;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
.win{position:absolute;left:16px;top:16px;width:1048px;height:1318px;border-radius:22px;overflow:hidden;background:#fff;
  box-shadow:0 0 0 .6px rgba(0,0,0,.28),0 24px 64px rgba(20,30,70,.38),0 6px 16px rgba(20,30,70,.18)}
.chrome{position:absolute;left:0;top:0;width:598.857px;zoom:1.75;user-select:none;cursor:default;color:var(--ink)}
.tabstrip{position:relative;height:40px;background:var(--frame)}
.lights{position:absolute;left:14px;top:15px;display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.tab{position:absolute;left:72px;top:6px;width:236px;height:34px}
.tab svg.shape{position:absolute;left:-8px;top:0;overflow:visible}
.tab .fav{position:absolute;left:12px;top:9px;width:16px;height:16px;border-radius:4px;background:#2d5bd7;color:#fff;
  font:700 11px/16px -apple-system,sans-serif;text-align:center;letter-spacing:-.02em}
.tab .title{position:absolute;left:36px;right:32px;top:0;line-height:34px;font-size:12px;white-space:nowrap;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)}
.tab .x{position:absolute;right:8px;top:9px;width:16px;height:16px;display:grid;place-items:center}
.ib{position:absolute;display:grid;place-items:center;border-radius:50%}
.ib svg{fill:var(--icon)}
.newtab{left:314px;top:9px;width:28px;height:28px}
.tsearch{right:8px;top:9px;width:28px;height:28px}
.toolbar{position:relative;height:44px;background:#fff;border-bottom:.6px solid rgba(0,0,0,.09)}
.back{left:6px;top:5px;width:34px;height:34px}.fwd{left:40px;top:5px;width:34px;height:34px}.reload{left:74px;top:5px;width:34px;height:34px}
.fwd svg{opacity:.38}
.omni{position:absolute;left:114px;right:78px;top:5px;height:34px;border-radius:17px;background:var(--omni)}
.omni .info{left:4px;top:3px;width:28px;height:28px}
.omni .url{position:absolute;left:38px;right:36px;top:0;line-height:34px;font-size:14px;white-space:nowrap;overflow:hidden;letter-spacing:-.005em}
.omni .url span{color:var(--dim)}
.omni .star{right:4px;top:3px;width:28px;height:28px}
.avatar{right:42px;top:5px;width:34px;height:34px}
.menu{right:6px;top:5px;width:34px;height:34px}
.content{position:absolute;left:0;top:147px;right:0;bottom:0;overflow:hidden;background:#f6f5f1}
#scene{position:absolute;left:0;top:0;border:0;width:1080px;transform-origin:0 0}
</style>
</head>
<body>
<div class="win">
  <div class="chrome">
    <div class="tabstrip">
      <div class="lights"><i></i><i></i><i></i></div>
      <div class="tab">
        <svg class="shape" width="252" height="34" viewBox="0 0 252 34"><path fill="#fff" d="M0 34A8 8 0 0 0 8 26V10A10 10 0 0 1 18 0H234A10 10 0 0 1 244 10V26A8 8 0 0 0 252 34Z"/></svg>
        <div class="fav">M</div>
        <div class="title">MetaDump side by side</div>
        <div class="x"><svg width="12" height="12" viewBox="0 0 24 24" style="fill:var(--icon)"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></div>
      </div>
      <div class="ib newtab"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div>
      <div class="ib tsearch"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg></div>
    </div>
    <div class="toolbar">
      <div class="ib back"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></div>
      <div class="ib fwd"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg></div>
      <div class="ib reload"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></div>
      <div class="omni">
        <div class="ib info"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#474747" stroke-width="2" stroke-linecap="round"><path d="M3 7.5h7.2M15.8 7.5H21M3 16.5h2.2M10.8 16.5H21"/><circle cx="13" cy="7.5" r="2.8"/><circle cx="8" cy="16.5" r="2.8"/></svg></div>
        <div class="url">globalanomalyindex.github.io<span>/metadump/showcase/round-2</span></div>
        <div class="ib star"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M22 9.24l-7.19-.62L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.63-7.03L22 9.24zM12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.71 4.04 4.38.38-3.32 2.88 1 4.28L12 15.4z"/></svg></div>
      </div>
      <div class="ib avatar"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm0 14c-2.03 0-4.43-.82-6.14-2.88a9.947 9.947 0 0 1 12.28 0C16.43 19.18 14.03 20 12 20z"/></svg></div>
      <div class="ib menu"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></div>
    </div>
  </div>
  <div class="content"><iframe id="scene"></iframe></div>
</div>
<script>
const WIN = { left: 16, top: 16, width: 1048, height: 1318 }, CHROME_H = 147
const s = WIN.width / 1080, VH = Math.floor((WIN.height - CHROME_H) / s)
const frame = document.getElementById('scene')
frame.style.height = VH + 'px'; frame.style.transform = `scale(${s})`
window.L = { ox: WIN.left, oy: WIN.top + CHROME_H, s, vh: VH, win: WIN }
frame.src = new URLSearchParams(location.search).get('scene') || '../scene.html?task=intro'
const sdoc = () => frame.contentDocument, swin = () => frame.contentWindow

// Wait for the scene, its build iframes and fonts.
window.ready = async () => {
  const loaded = f => new Promise(r => { try { if (f.contentDocument && f.contentDocument.readyState === 'complete' && f.contentDocument.URL !== 'about:blank') return r() } catch (e) {} f.addEventListener('load', () => r(), { once: true }) })
  await loaded(frame)
  for (let i = 0; i < 50 && !sdoc().querySelector('#root > *'); i++) await new Promise(r => setTimeout(r, 50))
  await Promise.all([...sdoc().querySelectorAll('iframe')].map(loaded))
  await document.fonts.ready; await sdoc().fonts.ready
  return true
}

// Rect inside any nested same-origin frame -> top page coordinates.
function toTop(r, win) {
  let { left, top, width, height } = r
  while (win.frameElement) {
    const fe = win.frameElement, fr = fe.getBoundingClientRect(), k = fr.width / fe.offsetWidth
    left = fr.left + left * k; top = fr.top + top * k; width *= k; height *= k; win = win.parent
  }
  return { x: left + width / 2, y: top + height / 2, left, top, width, height }
}
// Deepest element under a top-page point, with that frame's local coordinates.
function deepAt(x, y) {
  let win = window, px = x, py = y, el
  for (let i = 0; i < 6; i++) {
    el = win.document.elementFromPoint(px, py)
    if (!el) return null
    if (el.tagName === 'IFRAME' && el.contentDocument) {
      const r = el.getBoundingClientRect(), k = r.width / el.offsetWidth
      px = (px - r.left) / k; py = (py - r.top) / k; win = el.contentWindow; continue
    }
    break
  }
  return { el, win, px, py }
}
const INTERACTIVE = 'a[href],button,summary,select,label[for],[role=button],[role=tab],[role=switch],[role=checkbox],[aria-expanded],input[type=button],input[type=submit],input[type=checkbox],input[type=radio]'
const EDITABLE = 'input:not([type=button]):not([type=submit]):not([type=checkbox]):not([type=radio]):not([type=range]),textarea,[contenteditable=""],[contenteditable=true]'
// Which macOS cursor Chrome would show here: the page's own CSS cursor first, then controls, then text.
window.shapeAt = (x, y) => {
  const d = deepAt(x, y); if (!d || d.win === window) return 'arrow'
  const { el, win, px, py } = d, cs = win.getComputedStyle(el), c = cs.cursor
  if (c === 'pointer') return 'hand'
  if (c === 'text' || c === 'vertical-text') return 'ibeam'
  if (c !== 'auto' && c !== 'default') return 'arrow'
  if (el.closest(INTERACTIVE)) return 'hand'
  if (c === 'default') return 'arrow'
  if (el.closest(EDITABLE)) return 'ibeam'
  if (cs.userSelect === 'none') return 'arrow'
  const r = win.document.caretRangeFromPoint(px, py)
  if (r && r.startContainer.nodeType === 3 && r.startContainer.textContent.trim()) {
    const rg = win.document.createRange(); rg.selectNodeContents(r.startContainer)
    for (const b of rg.getClientRects()) if (px >= b.left - 1 && px <= b.right + 1 && py >= b.top && py <= b.bottom) return 'ibeam'
  }
  return 'arrow'
}
// The scene's own target (targetIn), plus the size of the element under it for Fitts's law.
window.target = (id, kind) => {
  // targetIn scrolls the control into view; that may also scroll the scene page and this window, which a
  // real visitor would not see happen. Keep the build frame's scroll, undo the rest, and shift the point back.
  const se = sdoc().scrollingElement, keep = [document.scrollingElement, document.querySelector('.content'), document.querySelector('.win')]
  const before = keep.map(e => [e.scrollLeft, e.scrollTop]), s0 = [se.scrollLeft, se.scrollTop]
  const bf = sdoc().getElementById(id), be = bf && bf.contentDocument && bf.contentDocument.scrollingElement, b0 = be ? be.scrollTop : 0
  const p = swin().targetIn(id, kind); if (!p) return null
  const b1 = be ? be.scrollTop : 0, k = bf ? +bf.dataset.k || 1 : 1
  se.scrollLeft = s0[0]; se.scrollTop = s0[1]; keep.forEach((e, i) => { e.scrollLeft = before[i][0]; e.scrollTop = before[i][1] })
  if (be) be.scrollTop = b0   // the build scrolls only when the hand scrolls it
  // targetIn measures the frame box before scrolling and the control after, so only the build's own scroll needs undoing
  const x = L.ox + p.x * s, y = L.oy + (p.y + (b1 - b0) * k) * s
  const fb = bf ? toTop(bf.getBoundingClientRect(), swin()) : null
  const offscreen = !!fb && (y < fb.top + 12 || y > fb.top + fb.height - 12)
  if (offscreen) return { x, y, w: 40, h: 40, offscreen, scrollBy: (y - (fb.top + fb.height / 2)) / s / k, frame: fb }
  const d = deepAt(x, y)
  let w = 40, h = 40, expanded = null
  if (d && d.win !== window) {
    const el = d.el.closest(INTERACTIVE) || d.el, r = toTop(el.getBoundingClientRect(), d.win)
    w = r.width; h = r.height
    const t = d.el.closest('[aria-expanded]'); if (t) expanded = t.getAttribute('aria-expanded')
    else { const det = d.el.closest('details'); if (det) expanded = String(det.open) }
  }
  return { x, y, w, h, expanded, frame: fb }
}
window.rectOf = sel => { const e = sdoc().querySelector(sel); return e ? toTop(e.getBoundingClientRect(), swin()) : null }
// Visible text lines of one build frame, in top coordinates, plus how far it can still scroll.
window.lines = id => {
  const fr = sdoc().getElementById(id); if (!fr) return null
  const w = fr.contentWindow, doc = fr.contentDocument, vh = w.innerHeight, out = []
  const tw = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, { acceptNode: n => n.textContent.trim() ? 1 : 2 })
  for (let n; (n = tw.nextNode());) {
    const pe = n.parentElement; if (!pe || /^(SCRIPT|STYLE|NOSCRIPT)$/.test(pe.tagName)) continue
    const cs = w.getComputedStyle(pe); if (cs.visibility === 'hidden' || +cs.opacity === 0) continue
    const rg = doc.createRange(); rg.selectNodeContents(n)
    for (const b of rg.getClientRects()) {
      if (b.width < 3 || b.height < 4 || b.bottom < 0 || b.top > vh) continue
      const cy = (b.top + b.bottom) / 2, l = out.find(o => Math.abs(o.cy - cy) < Math.min(o.h, b.height) * .5)
      if (l) { l.left = Math.min(l.left, b.left); l.right = Math.max(l.right, b.right) }
      else out.push({ cy, h: b.height, left: b.left, right: b.right, top: b.top })
    }
  }
  out.sort((a, b) => a.top - b.top)
  const box = toTop(fr.getBoundingClientRect(), swin())
  const se = doc.scrollingElement
  return { box, scrollable: Math.max(0, se.scrollHeight - se.clientHeight - se.scrollTop),
    lines: out.map(o => { const r = toTop({ left: o.left, top: o.top, width: o.right - o.left, height: o.h }, w); return { x0: r.left, x1: r.left + r.width, y: r.y, h: r.height } }) }
}
</script>
</body>
</html>
