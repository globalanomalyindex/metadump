<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lemon 3D</title>
<style>
  :root{--bg1:#2b3a2f;--bg2:#10161a;--fg:#f5f1d8;--accent:#f4d03f;--panel:rgba(14,18,16,.72)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,var(--bg1),var(--bg2));color:var(--fg);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas.drag{cursor:grabbing}
  h1{position:fixed;left:20px;top:14px;margin:0;font-size:20px;letter-spacing:.04em;font-weight:600;pointer-events:none}
  h1 small{display:block;font-size:12px;font-weight:400;opacity:.65;letter-spacing:0}
  #panel{position:fixed;right:16px;top:16px;width:250px;padding:14px 16px;background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:12px;backdrop-filter:blur(8px)}
  label{display:block;margin:10px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
  label span{float:right;text-transform:none;letter-spacing:0;color:var(--accent)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .row{display:flex;gap:8px;margin-top:12px;align-items:center}
  button{flex:1;background:#223;border:1px solid rgba(255,255,255,.2);color:var(--fg);padding:7px 8px;border-radius:8px;cursor:pointer;font:inherit}
  button:hover{border-color:var(--accent)}
  button.on{background:var(--accent);color:#222;border-color:var(--accent)}
  #stage{margin-top:12px;font-size:13px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12)}
  #stage b{color:var(--accent)}
  #hint{position:fixed;left:20px;bottom:14px;font-size:12px;opacity:.6;pointer-events:none}
  #err{position:fixed;left:20px;top:70px;color:#ff9a8a;max-width:60ch}
  @media (max-width:600px){#panel{top:auto;bottom:0;right:0;left:0;width:auto;border-radius:12px 12px 0 0}#hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<h1>Citrus limon<small>Drag to rotate, scroll to zoom</small></h1>
<div id="err"></div>
<div id="panel">
  <label>Ripeness <span id="vRipe"></span></label>
  <input id="ripe" type="range" min="0" max="1" step="0.01" value="1">
  <label>Peel texture <span id="vBump"></span></label>
  <input id="bump" type="range" min="0" max="1" step="0.01" value="0.5">
  <label>Slice <span id="vCut"></span></label>
  <input id="cut" type="range" min="0" max="1" step="0.01" value="0">
  <label>Light angle <span id="vLight"></span></label>
  <input id="light" type="range" min="0" max="360" step="1" value="40">
  <div class="row">
    <button id="spin" class="on">Auto-spin: on</button>
    <button id="reset">Reset</button>
  </div>
  <div id="stage"></div>
</div>
<div id="hint">Lemon fruit, procedural peel, WebGL</div>
<script>
(function(){
  var canvas = document.getElementById('c');
  var errEl = document.getElementById('err');
  var gl = canvas.getContext('webgl', {antialias:true}) || canvas.getContext('experimental-webgl');
  if(!gl){ errEl.textContent = 'WebGL is not available in this browser.'; return; }

  // ---------- state ----------
  var DEFAULTS = {yaw:0.6, pitch:0.35, zoom:4.2, ripe:1, bump:0.5, cut:0, light:40, spin:true};
  var S = {};
  function resetState(){ for(var k in DEFAULTS) S[k]=DEFAULTS[k]; }
  resetState();

  // ---------- shaders ----------
  var VS = [
  'attribute vec3 aPos; attribute vec3 aNrm;',
  'uniform mat3 uRot; uniform float uDist; uniform float uAspect;',
  'varying vec3 vObj; varying vec3 vNrm; varying vec3 vView;',
  'void main(){',
  '  vec3 p = uRot*aPos; p.z -= uDist;',
  '  vObj = aPos; vNrm = aNrm; vView = p;',
  '  float f = 1.0/tan(0.4);',
  '  gl_Position = vec4(p.x*f/uAspect, p.y*f, -p.z*1.002 - 0.2, -p.z);',
  '}'].join('\n');

  var FS = [
  'precision highp float;',
  'varying vec3 vObj; varying vec3 vNrm; varying vec3 vView;',
  'uniform mat3 uRot; uniform float uRipe, uBump, uCut, uLight;',
  'float hash(vec3 p){ p = fract(p*0.3183099+vec3(.1,.2,.3)); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }',
  'float vnoise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);',
  '  return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),',
  '             mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }',
  'float pores(vec3 p){ // oil-gland dimples',
  '  float n = vnoise(p*34.0); float d = smoothstep(0.55,0.2,n);',
  '  return -d*0.6 + vnoise(p*9.0)*0.25 + vnoise(p*90.0)*0.08; }',
  'void main(){',
  '  if(vObj.x > uCut) discard;',
  '  vec3 L = normalize(vec3(cos(uLight), 0.55, sin(uLight)));',
  '  vec3 V = normalize(-vView);',
  '  vec3 col; vec3 N; float spec = 0.0; float sh = 24.0;',
  '  if(gl_FrontFacing){',
  '    vec3 n = normalize(vNrm); float e = 0.012;',
  '    float h0 = pores(vObj);',
  '    vec3 g = vec3(pores(vObj+vec3(e,0,0))-h0, pores(vObj+vec3(0,e,0))-h0, pores(vObj+vec3(0,0,e))-h0)/e;',
  '    g -= n*dot(g,n);',
  '    n = normalize(n - g*uBump*0.035);',
  '    N = normalize(uRot*n);',
  '    vec3 green = vec3(0.45,0.62,0.12), yellow = vec3(0.98,0.82,0.08), deep = vec3(0.93,0.7,0.04);',
  '    float mott = vnoise(vObj*3.0+4.0);',
  '    vec3 ripe = mix(yellow, deep, mott*0.6);',
  '    ripe = mix(ripe, vec3(1.0,0.9,0.3), smoothstep(0.6,0.0,abs(pores(vObj)))*0.0);',
  '    col = mix(green, ripe, clamp(uRipe*1.1 + (mott-0.5)*0.25*(1.0-uRipe), 0.0, 1.0));',
  '    float pore = smoothstep(0.0,0.6,-pores(vObj));',
  '    col *= 1.0 - pore*0.10*uBump;',
  '    float tip = smoothstep(0.86,0.99,abs(vObj.x));',
  '    col = mix(col, vec3(0.5,0.4,0.1), tip*0.5);',
  '    spec = 1.0; sh = 28.0 + 40.0*(1.0-uBump);',
  '  } else {',
  '    N = normalize(-(uRot*normalize(vNrm)));',
  '    float ang = atan(vObj.z, vObj.y);',
  '    float r = length(vObj.yz);',
  '    float seg = abs(sin(ang*5.0));',
  '    float wall = smoothstep(0.62,0.72,r);',
  '    col = mix(vec3(1.0,0.93,0.45), vec3(1.0,0.97,0.7), smoothstep(0.0,0.5,r));',
  '    col = mix(col, vec3(0.95,0.82,0.3), (1.0-smoothstep(0.0,0.12,seg))*0.9);',
  '    col += vnoise(vObj*60.0)*0.06;',
  '    col = mix(col, vec3(1.0,0.99,0.88), wall);',
  '    spec = 0.7; sh = 60.0;',
  '  }',
  '  float ndl = dot(N,L);',
  '  float diff = clamp(ndl*0.5+0.5, 0.0, 1.0); diff*=diff;',
  '  vec3 H = normalize(L+V);',
  '  float s = pow(max(dot(N,H),0.0), sh)*spec*0.55;',
  '  float fres = pow(1.0-max(dot(N,V),0.0), 3.0);',
  '  vec3 amb = mix(vec3(0.10,0.12,0.09), vec3(0.28,0.30,0.35), N.y*0.5+0.5);',
  '  vec3 c = col*(amb + diff*vec3(1.05,1.0,0.92)) + s*vec3(1.0,0.98,0.9) + fres*0.12*vec3(0.8,0.9,1.0);',
  '  c = pow(c, vec3(0.9));',
  '  gl_FragColor = vec4(c,1.0);',
  '}'].join('\n');

  function compile(type, src){
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){ errEl.textContent = 'Shader error: ' + gl.getShaderInfoLog(s); throw new Error(gl.getShaderInfoLog(s)); }
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){ errEl.textContent = 'Link error: ' + gl.getProgramInfoLog(prog); return; }
  gl.useProgram(prog);

  // ---------- lemon geometry ----------
  function smooth(x){ return x*x*(3-2*x); }
  function radius(t){
    var a = 1 - t*t; if(a < 0) a = 0;
    var body = 0.74 * Math.pow(a, 0.58) * (1 + 0.07*t);
    var nip = (t > 0 ? 0.075 : 0.05) * Math.exp(-(1-Math.abs(t))/0.045);
    return (body + nip) * Math.pow(a, 0.22);
  }
  function P(t, phi){
    var r = radius(t);
    // slight irregularity so it is not a perfect solid of revolution
    r *= 1 + 0.025*Math.sin(phi*2 + t*3) + 0.015*Math.cos(phi*3 - t*2);
    return [t*1.05, r*Math.cos(phi), r*Math.sin(phi)];
  }
  var NT = 160, NP = 96;
  var pos = [], nrm = [], idx = [];
  var eps = 1e-3;
  for(var i=0;i<=NT;i++){
    var t = -1 + 2*i/NT; t = Math.max(-0.9993, Math.min(0.9993, t));
    for(var j=0;j<=NP;j++){
      var phi = 2*Math.PI*j/NP;
      var p = P(t, phi);
      var tA = P(Math.min(0.9996,t+eps), phi), tB = P(Math.max(-0.9996,t-eps), phi);
      var pA = P(t, phi+eps), pB = P(t, phi-eps);
      var dt=[tA[0]-tB[0],tA[1]-tB[1],tA[2]-tB[2]], dp=[pA[0]-pB[0],pA[1]-pB[1],pA[2]-pB[2]];
      var n=[dt[1]*dp[2]-dt[2]*dp[1], dt[2]*dp[0]-dt[0]*dp[2], dt[0]*dp[1]-dt[1]*dp[0]];
      var l = Math.hypot(n[0],n[1],n[2]) || 1; n=[n[0]/l,n[1]/l,n[2]/l];
      // orient outward: compare with radial direction
      if(n[1]*p[1] + n[2]*p[2] + n[0]*(p[0]*0.0) < 0 && Math.abs(t) < 0.97) n=[-n[0],-n[1],-n[2]];
      pos.push(p[0],p[1],p[2]); nrm.push(n[0],n[1],n[2]);
    }
  }
  // enforce consistent orientation across the whole mesh using sign from the middle
  (function(){
    var mid = Math.floor(NT/2)*(NP+1);
    var sgn = (nrm[mid*3+1]*pos[mid*3+1] + nrm[mid*3+2]*pos[mid*3+2]) >= 0 ? 1 : -1;
    for(var k=0;k<nrm.length;k++) nrm[k]*=sgn;
    // flip any vertex whose normal points inward relative to the axis-centre vector
    for(var v=0; v<pos.length/3; v++){
      var d = nrm[v*3]*pos[v*3] * 0.0 + nrm[v*3+1]*pos[v*3+1] + nrm[v*3+2]*pos[v*3+2];
      if(d < 0 && Math.hypot(pos[v*3+1],pos[v*3+2]) > 0.05){ nrm[v*3]*=-1; nrm[v*3+1]*=-1; nrm[v*3+2]*=-1; }
    }
  })();
  for(var a=0;a<NT;a++) for(var b=0;b<NP;b++){
    var i0=a*(NP+1)+b, i1=i0+1, i2=i0+NP+1, i3=i2+1;
    idx.push(i0,i2,i1, i1,i2,i3);
  }
  function buf(target, data){ var bf=gl.createBuffer(); gl.bindBuffer(target,bf); gl.bufferData(target,data,gl.STATIC_DRAW); return bf; }
  var bPos = buf(gl.ARRAY_BUFFER, new Float32Array(pos));
  var bNrm = buf(gl.ARRAY_BUFFER, new Float32Array(nrm));
  var bIdx = buf(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx));
  var aPos = gl.getAttribLocation(prog,'aPos'), aNrm = gl.getAttribLocation(prog,'aNrm');
  gl.bindBuffer(gl.ARRAY_BUFFER,bPos); gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,bNrm); gl.enableVertexAttribArray(aNrm); gl.vertexAttribPointer(aNrm,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,bIdx);

  var U = {};
  ['uRot','uDist','uAspect','uRipe','uBump','uCut','uLight'].forEach(function(n){ U[n]=gl.getUniformLocation(prog,n); });
  gl.enable(gl.DEPTH_TEST);
  gl.disable(gl.CULL_FACE);
  gl.clearColor(0,0,0,0);

  // ---------- UI ----------
  var $ = function(id){ return document.getElementById(id); };
  var ripeEl=$('ripe'), bumpEl=$('bump'), cutEl=$('cut'), lightEl=$('light'), spinBtn=$('spin'), resetBtn=$('reset');
  function stageName(r){
    if(r<0.2) return 'Unripe, hard and green';
    if(r<0.5) return 'Turning, green-yellow';
    if(r<0.85) return 'Nearly ripe';
    return 'Ripe, bright yellow';
  }
  function cutMapped(){ return 1.2 - S.cut*2.4; } // slider 0 = whole, 1 = cut through to the far end
  function refreshUI(){
    ripeEl.value=S.ripe; bumpEl.value=S.bump; cutEl.value=S.cut; lightEl.value=S.light;
    $('vRipe').textContent=Math.round(S.ripe*100)+'%';
    $('vBump').textContent=Math.round(S.bump*100)+'%';
    $('vCut').textContent = S.cut<0.01 ? 'whole' : Math.round(S.cut*100)+'% cut';
    $('vLight').textContent=Math.round(S.light)+'°';
    spinBtn.textContent='Auto-spin: '+(S.spin?'on':'off');
    spinBtn.classList.toggle('on',S.spin);
    $('stage').innerHTML='<b>'+stageName(S.ripe)+'</b><br>'+(S.cut>0.01?'Cross-section showing the segmented flesh and pith.':'Whole fruit, peel intact.')+'<br>Zoom '+(DEFAULTS.zoom/S.zoom).toFixed(2)+'x';
  }
  ripeEl.oninput=function(){ S.ripe=+ripeEl.value; refreshUI(); };
  bumpEl.oninput=function(){ S.bump=+bumpEl.value; refreshUI(); };
  cutEl.oninput=function(){ S.cut=+cutEl.value; refreshUI(); };
  lightEl.oninput=function(){ S.light=+lightEl.value; refreshUI(); };
  spinBtn.onclick=function(){ S.spin=!S.spin; refreshUI(); };
  resetBtn.onclick=function(){ resetState(); refreshUI(); };

  // drag / zoom
  var dragging=false, lx=0, ly=0;
  canvas.addEventListener('pointerdown',function(e){ dragging=true; lx=e.clientX; ly=e.clientY; canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove',function(e){
    if(!dragging) return;
    S.yaw += (e.clientX-lx)*0.01; S.pitch += (e.clientY-ly)*0.01;
    S.pitch = Math.max(-1.5, Math.min(1.5, S.pitch));
    lx=e.clientX; ly=e.clientY;
  });
  function up(){ dragging=false; canvas.classList.remove('drag'); }
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',function(e){
    e.preventDefault();
    S.zoom *= Math.exp(e.deltaY*0.001);
    S.zoom = Math.max(2.2, Math.min(9, S.zoom));
    refreshUI();
  },{passive:false});
  window.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft') S.yaw-=0.1; else if(e.key==='ArrowRight') S.yaw+=0.1;
    else if(e.key==='ArrowUp') S.pitch=Math.max(-1.5,S.pitch-0.1); else if(e.key==='ArrowDown') S.pitch=Math.min(1.5,S.pitch+0.1);
  });

  // ---------- render ----------
  function resize(){
    var dpr = Math.min(window.devicePixelRatio||1, 2);
    var w = Math.floor(canvas.clientWidth*dpr), h = Math.floor(canvas.clientHeight*dpr);
    if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; }
    gl.viewport(0,0,canvas.width,canvas.height);
  }
  function rotMat(yaw,pitch){
    var cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
    // R = Rx(pitch) * Ry(yaw), column-major for WebGL
    var Ry=[cy,0,-sy, 0,1,0, sy,0,cy];
    var Rx=[1,0,0, 0,cp,sp, 0,-sp,cp];
    function mul(A,B){ var C=new Array(9); for(var c=0;c<3;c++)for(var r=0;r<3;r++){ var s=0; for(var k=0;k<3;k++) s+=A[k*3+r]*B[c*3+k]; C[c*3+r]=s; } return C; }
    return mul(Rx,Ry);
  }
  var last = performance.now();
  function frame(now){
    var dt = Math.min(0.05,(now-last)/1000); last=now;
    if(S.spin && !dragging) S.yaw += dt*0.5;
    resize();
    gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    gl.uniformMatrix3fv(U.uRot,false,new Float32Array(rotMat(S.yaw,S.pitch)));
    gl.uniform1f(U.uDist,S.zoom);
    gl.uniform1f(U.uAspect,canvas.width/canvas.height);
    gl.uniform1f(U.uRipe,S.ripe);
    gl.uniform1f(U.uBump,S.bump);
    gl.uniform1f(U.uCut,cutMapped());
    gl.uniform1f(U.uLight,S.light*Math.PI/180);
    gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_SHORT, 0);
    requestAnimationFrame(frame);
  }
  refreshUI();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
