<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northfield Shop</title>
<style>
  :root {
    --bg: #fafaf9;
    --surface: #ffffff;
    --text: #1c1917;
    --muted: #78716c;
    --border: #e7e5e4;
    --tile: #f5f5f4;
    --accent: #1c1917;
    --accent-text: #ffffff;
    --danger: #b91c1c;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 30px rgba(0,0,0,.06);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0a09; --surface: #1c1917; --text: #fafaf9; --muted: #a8a29e;
      --border: #292524; --tile: #262320; --accent: #fafaf9; --accent-text: #0c0a09;
      --danger: #f87171; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0a09; --surface: #1c1917; --text: #fafaf9; --muted: #a8a29e;
    --border: #292524; --tile: #262320; --accent: #fafaf9; --accent-text: #0c0a09;
    --danger: #f87171; --shadow: none;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .45; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .bar { display: flex; align-items: center; gap: 16px; height: 64px; }
  .brand { font-weight: 700; letter-spacing: -.01em; font-size: 17px; margin-right: auto; }
  .search {
    width: min(320px, 40vw); height: 38px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
  }
  .cart-btn {
    position: relative; height: 38px; padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); font-weight: 600;
  }
  .badge {
    position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 6px;
    border-radius: 999px; background: var(--accent); color: var(--accent-text);
    font-size: 12px; line-height: 20px; text-align: center; font-variant-numeric: tabular-nums;
  }
  .badge[hidden] { display: none; }

  /* Toolbar */
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 12px; padding: 20px 0 8px;
  }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    height: 34px; padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--muted);
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .sort { height: 34px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); }
  .count { color: var(--muted); font-size: 13px; padding: 8px 0 16px; }

  /* Product grid */
  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    padding-bottom: 64px;
  }
  .card {
    display: flex; flex-direction: column; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
    box-shadow: var(--shadow); transition: transform .2s ease, box-shadow .2s ease;
  }
  .card:hover { transform: translateY(-2px); }
  .art {
    height: 150px; display: grid; place-items: center; font-size: 64px;
    background: var(--tile); position: relative;
  }
  .soldout {
    position: absolute; top: 10px; left: 10px; font-size: 11px; font-weight: 600;
    padding: 3px 8px; border-radius: 999px; background: var(--surface); color: var(--muted);
    border: 1px solid var(--border);
  }
  .low { position: absolute; top: 10px; left: 10px; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--surface); color: var(--danger); border: 1px solid var(--border); }
  .info { padding: 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .cat { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .name { font-weight: 600; margin: 0; }
  .meta { display: flex; justify-content: space-between; align-items: baseline; margin-top: auto; padding-top: 10px; }
  .price { font-weight: 700; font-variant-numeric: tabular-nums; }
  .rating { font-size: 13px; color: var(--muted); }
  .action { margin-top: 12px; }

  .btn-add {
    width: 100%; height: 38px; border-radius: 10px; border: 0;
    background: var(--accent); color: var(--accent-text); font-weight: 600;
  }
  .btn-add:active { transform: scale(.98); }
  .stepper {
    display: flex; align-items: center; justify-content: space-between;
    height: 38px; border: 1px solid var(--border); border-radius: 10px;
  }
  .stepper button {
    width: 40px; height: 100%; border: 0; background: none; font-size: 18px;
  }
  .stepper output { font-weight: 600; font-variant-numeric: tabular-nums; }
  .empty-grid { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 48px 0; }

  /* Cart drawer */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.35);
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%);
    background: var(--surface); border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px; border-bottom: 1px solid var(--border);
  }
  .drawer-head h2 { margin: 0; font-size: 17px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-size: 16px; }
  .lines { flex: 1; overflow-y: auto; padding: 8px 20px; }
  .line { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); align-items: center; }
  .line .thumb { width: 56px; height: 56px; border-radius: 10px; background: var(--tile); display: grid; place-items: center; font-size: 28px; }
  .line .title { font-weight: 600; font-size: 14px; }
  .line .unit { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .line .qty { margin-top: 8px; width: 116px; }
  .line .qty button { width: 34px; }
  .line-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .line-total { font-weight: 600; font-variant-numeric: tabular-nums; }
  .remove { border: 0; background: none; color: var(--muted); font-size: 12px; text-decoration: underline; padding: 0; }
  .remove:hover { color: var(--danger); }
  .blank { text-align: center; color: var(--muted); padding: 56px 12px; }
  .notice { margin: 8px 20px 0; padding: 12px 14px; border-radius: 10px; background: var(--tile); font-size: 14px; }

  .summary { padding: 16px 20px 20px; border-top: 1px solid var(--border); }
  .row { display: flex; justify-content: space-between; color: var(--muted); font-variant-numeric: tabular-nums; padding: 3px 0; }
  .row.total { color: var(--text); font-weight: 700; font-size: 16px; padding-top: 10px; margin-top: 6px; border-top: 1px dashed var(--border); }
  .hint { font-size: 12px; color: var(--muted); margin: 6px 0 12px; }
  .checkout {
    width: 100%; height: 46px; border: 0; border-radius: 12px;
    background: var(--accent); color: var(--accent-text); font-weight: 700; font-size: 15px;
  }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
  @media (max-width: 520px) {
    .search { width: 100%; }
    .bar { flex-wrap: wrap; height: auto; padding: 12px 0; }
    .brand { width: 100%; }
    .search { order: 3; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <div class="brand">Northfield</div>
    <input class="search" id="search" type="search" placeholder="Search products" aria-label="Search products">
    <button class="cart-btn" id="open-cart" aria-label="Open cart">
      Cart <span class="badge" id="badge" hidden>0</span>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
    <select class="sort" id="sort" aria-label="Sort products">
      <option value="featured">Featured</option>
      <option value="price-asc">Price: low to high</option>
      <option value="price-desc">Price: high to low</option>
      <option value="rating">Top rated</option>
    </select>
  </div>
  <div class="count" id="count" aria-live="polite"></div>
  <section class="grid" id="grid" aria-label="Products"></section>
</main>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="cart-title" aria-hidden="true">
  <div class="drawer-head">
    <h2 id="cart-title">Your cart</h2>
    <button class="icon-btn" id="close-cart" aria-label="Close cart">&times;</button>
  </div>
  <div class="lines" id="lines"></div>
  <div id="notice-slot"></div>
  <div class="summary" id="summary"></div>
</aside>

<div class="sr-only" id="status" role="status" aria-live="polite"></div>

<script>
(() => {
  const PRODUCTS = [
    { id: "p1",  name: "Linen Overshirt",          cat: "Apparel",     price: 84,  rating: 4.6, stock: 12, art: "👔" },
    { id: "p2",  name: "Merino Crew Sweater",      cat: "Apparel",     price: 98,  rating: 4.8, stock: 8,  art: "🧶" },
    { id: "p3",  name: "Selvedge Denim Jeans",     cat: "Apparel",     price: 136, rating: 4.7, stock: 2,  art: "👖" },
    { id: "p4",  name: "Trail Socks, 3-pack",      cat: "Apparel",     price: 24,  rating: 4.2, stock: 50, art: "🧦" },
    { id: "p5",  name: "Canvas Tote",              cat: "Accessories", price: 42,  rating: 4.4, stock: 30, art: "👜" },
    { id: "p6",  name: "Leather Card Wallet",      cat: "Accessories", price: 58,  rating: 4.5, stock: 0,  art: "👛" },
    { id: "p7",  name: "Wool Beanie",              cat: "Accessories", price: 28,  rating: 4.3, stock: 20, art: "🧢" },
    { id: "p8",  name: "Aviator Sunglasses",       cat: "Accessories", price: 120, rating: 4.1, stock: 3,  art: "🕶️" },
    { id: "p9",  name: "Ceramic Pour-Over Set",    cat: "Home",        price: 64,  rating: 4.9, stock: 9,  art: "☕" },
    { id: "p10", name: "Stoneware Dinner Plate",   cat: "Home",        price: 22,  rating: 4.6, stock: 40, art: "🍽️" },
    { id: "p11", name: "Beeswax Candle Trio",      cat: "Home",        price: 36,  rating: 4.7, stock: 16, art: "🕯️" },
    { id: "p12", name: "Walnut Desk Organizer",    cat: "Home",        price: 73,  rating: 4.4, stock: 6,  art: "🪵" }
  ];
  const CATEGORIES = ["All", ...new Set(PRODUCTS.map(p => p.cat))];
  const FREE_SHIPPING_AT = 75;
  const SHIPPING_FEE = 6.95;
  const TAX_RATE = 0.08;
  const LOW_STOCK = 5;

  const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
  const byId = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));

  const state = {
    query: "",
    category: "All",
    sort: "featured",
    cart: {},          // { productId: quantity }
    notice: ""         // message shown in the drawer after checkout
  };

  const $ = (sel) => document.querySelector(sel);
  const els = {
    search: $("#search"), sort: $("#sort"), chips: $("#chips"), count: $("#count"),
    grid: $("#grid"), badge: $("#badge"), lines: $("#lines"), summary: $("#summary"),
    notice: $("#notice-slot"), drawer: $("#drawer"), overlay: $("#overlay"),
    status: $("#status"), openCart: $("#open-cart"), closeCart: $("#close-cart")
  };

  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const announce = (msg) => { els.status.textContent = ""; requestAnimationFrame(() => { els.status.textContent = msg; }); };

  // ---- derived data ----
  function visibleProducts() {
    const q = state.query.trim().toLowerCase();
    const sorters = {
      "featured":   (a, b) => PRODUCTS.indexOf(a) - PRODUCTS.indexOf(b),
      "price-asc":  (a, b) => a.price - b.price,
      "price-desc": (a, b) => b.price - a.price,
      "rating":     (a, b) => b.rating - a.rating
    };
    return PRODUCTS
      .filter(p => state.category === "All" || p.cat === state.category)
      .filter(p => !q || `${p.name} ${p.cat}`.toLowerCase().includes(q))
      .sort(sorters[state.sort]);
  }

  function cartLines() {
    return Object.entries(state.cart)
      .filter(([, qty]) => qty > 0)
      .map(([id, qty]) => ({ product: byId[id], qty }));
  }

  function cartCount() {
    return cartLines().reduce((n, l) => n + l.qty, 0);
  }

  function totals() {
    const subtotal = cartLines().reduce((sum, l) => sum + l.product.price * l.qty, 0);
    const shipping = subtotal === 0 || subtotal >= FREE_SHIPPING_AT ? 0 : SHIPPING_FEE;
    const tax = Math.round(subtotal * TAX_RATE * 100) / 100;
    return { subtotal, shipping, tax, total: subtotal + shipping + tax };
  }

  // ---- actions ----
  function setQty(id, qty) {
    const p = byId[id];
    const clamped = Math.max(0, Math.min(qty, p.stock));
    if (clamped === 0) delete state.cart[id];
    else state.cart[id] = clamped;
    return clamped;
  }

  function changeQty(id, delta) {
    const p = byId[id];
    const current = state.cart[id] || 0;
    const next = setQty(id, current + delta);
    if (next === current && delta > 0) {
      announce(`Only ${p.stock} ${p.name} available.`);
    } else if (delta > 0) {
      announce(`${p.name} added. ${cartCount()} in cart.`);
    } else {
      announce(`${p.name} now ${next || "removed"}.`);
    }
    render();
  }

  function removeLine(id) {
    delete state.cart[id];
    announce(`${byId[id].name} removed.`);
    render();
  }

  function checkout() {
    const { total } = totals();
    const count = cartCount();
    state.cart = {};
    state.notice = `Thanks! Order placed for ${count} item${count === 1 ? "" : "s"}, ${money.format(total)} total.`;
    announce(state.notice);
    render();
  }

  function openCart() {
    els.drawer.classList.add("open");
    els.overlay.classList.add("open");
    els.drawer.setAttribute("aria-hidden", "false");
    setTimeout(() => els.closeCart.focus(), 50);
  }

  function closeCart() {
    els.drawer.classList.remove("open");
    els.overlay.classList.remove("open");
    els.drawer.setAttribute("aria-hidden", "true");
    els.openCart.focus();
  }

  // ---- rendering ----
  function renderChips() {
    els.chips.innerHTML = CATEGORIES.map(c =>
      `<button class="chip" data-act="cat" data-cat="${esc(c)}" aria-pressed="${c === state.category}">${esc(c)}</button>`
    ).join("");
  }

  function renderGrid() {
    const list = visibleProducts();
    els.count.textContent = `${list.length} product${list.length === 1 ? "" : "s"}`;
    if (!list.length) {
      els.grid.innerHTML = `<p class="empty-grid">No products match “${esc(state.query)}”.</p>`;
      return;
    }
    els.grid.innerHTML = list.map(p => {
      const inCart = state.cart[p.id] || 0;
      const badge = p.stock === 0
        ? `<span class="soldout">Sold out</span>`
        : p.stock <= LOW_STOCK ? `<span class="low">Only ${p.stock} left</span>` : "";
      let action;
      if (p.stock === 0) {
        action = `<button class="btn-add" disabled>Sold out</button>`;
      } else if (inCart) {
        action = `<div class="stepper" role="group" aria-label="Quantity for ${esc(p.name)}">
          <button data-act="dec" data-id="${p.id}" aria-label="Decrease">&minus;</button>
          <output aria-live="polite">${inCart}</output>
          <button data-act="inc" data-id="${p.id}" aria-label="Increase" ${inCart >= p.stock ? "disabled" : ""}>+</button>
        </div>`;
      } else {
        action = `<button class="btn-add" data-act="inc" data-id="${p.id}">Add to cart</button>`;
      }
      return `
        <article class="card">
          <div class="art" aria-hidden="true">${p.art}${badge}</div>
          <div class="info">
            <span class="cat">${esc(p.cat)}</span>
            <h3 class="name">${esc(p.name)}</h3>
            <div class="meta">
              <span class="price">${money.format(p.price)}</span>
              <span class="rating" aria-label="Rated ${p.rating} out of 5">★ ${p.rating.toFixed(1)}</span>
            </div>
            <div class="action">${action}</div>
          </div>
        </article>`;
    }).join("");
  }

  function renderBadge() {
    const n = cartCount();
    els.badge.hidden = n === 0;
    els.badge.textContent = n;
    els.openCart.setAttribute("aria-label", `Open cart, ${n} item${n === 1 ? "" : "s"}`);
  }

  function renderCart() {
    const lines = cartLines();
    els.lines.innerHTML = lines.length
      ? lines.map(({ product: p, qty }) => `
        <div class="line">
          <div class="thumb" aria-hidden="true">${p.art}</div>
          <div>
            <div class="title">${esc(p.name)}</div>
            <div class="unit">${money.format(p.price)} each</div>
            <div class="stepper qty" role="group" aria-label="Quantity for ${esc(p.name)}">
              <button data-act="dec" data-id="${p.id}" aria-label="Decrease">&minus;</button>
              <output>${qty}</output>
              <button data-act="inc" data-id="${p.id}" aria-label="Increase" ${qty >= p.stock ? "disabled" : ""}>+</button>
            </div>
          </div>
          <div class="line-right">
            <span class="line-total">${money.format(p.price * qty)}</span>
            <button class="remove" data-act="remove" data-id="${p.id}">Remove</button>
          </div>
        </div>`).join("")
      : `<div class="blank">Your cart is empty.</div>`;

    els.notice.innerHTML = state.notice ? `<div class="notice">${esc(state.notice)}</div>` : "";

    const t = totals();
    const freeAway = FREE_SHIPPING_AT - t.subtotal;
    const hint = t.subtotal === 0 ? ""
      : freeAway > 0 ? `Add ${money.format(freeAway)} more for free shipping.`
      : "You qualify for free shipping.";
    els.summary.innerHTML = `
      <div class="row"><span>Subtotal</span><span>${money.format(t.subtotal)}</span></div>
      <div class="row"><span>Shipping</span><span>${t.subtotal === 0 ? "—" : t.shipping === 0 ? "Free" : money.format(t.shipping)}</span></div>
      <div class="row"><span>Estimated tax</span><span>${money.format(t.tax)}</span></div>
      <div class="row total"><span>Total</span><span>${money.format(t.total)}</span></div>
      <p class="hint">${hint}</p>
      <button class="checkout" data-act="checkout" ${lines.length ? "" : "disabled"}>Checkout</button>`;
  }

  function render() {
    renderChips();
    renderGrid();
    renderBadge();
    renderCart();
  }

  // ---- events ----
  document.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-act]");
    if (!btn || btn.disabled) return;
    const { act, id, cat } = btn.dataset;
    if (act === "cat") { state.category = cat; state.notice = ""; render(); }
    else if (act === "inc") changeQty(id, +1);
    else if (act === "dec") changeQty(id, -1);
    else if (act === "remove") removeLine(id);
    else if (act === "checkout") checkout();
  });

  els.search.addEventListener("input", (e) => { state.query = e.target.value; renderGrid(); });
  els.sort.addEventListener("change", (e) => { state.sort = e.target.value; renderGrid(); });
  els.openCart.addEventListener("click", openCart);
  els.closeCart.addEventListener("click", closeCart);
  els.overlay.addEventListener("click", closeCart);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && els.drawer.classList.contains("open")) closeCart();
  });

  render();
})();
</script>
</body>
</html>
