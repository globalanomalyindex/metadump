<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moodboard: dreamlight button</title>
<style>
:root {
  --ink: #1c1830;
  --muted: #6b6786;
  --paper: #f6f4ff;
  --card: rgba(255, 255, 255, 0.72);
  --violet: #7b6cf0;
  --line: rgba(28, 24, 48, 0.08);

  /* Custom bezier curves */
  --ease-drift: cubic-bezier(0.22, 1, 0.36, 1);   /* lift and colour: long soft settle */
  --ease-bloom: cubic-bezier(0.16, 1, 0.3, 1);    /* aura opening: slow start, long tail */
  --ease-press: cubic-bezier(0.3, 0.7, 0.4, 1);   /* press down: quick, no overshoot */
  --ease-sheen: cubic-bezier(0.65, 0, 0.35, 1);   /* light sweep: symmetric */
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(1200px 600px at 10% -10%, #e9e3ff 0%, transparent 60%),
    radial-gradient(900px 500px at 110% 10%, #ffe3f1 0%, transparent 55%),
    var(--paper);
}

.wrap { max-width: 980px; margin: 0 auto; padding: 48px 20px 72px; }

h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); letter-spacing: -0.02em; margin: 0 0 8px; font-weight: 700; }
h2 { font-size: 1.05rem; margin: 0 0 12px; }
.lede { color: var(--muted); max-width: 56ch; margin: 0 0 28px; line-height: 1.55; }

.bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
}
.status { color: var(--muted); font-size: 0.95rem; margin: 0; min-height: 1.4em; }
.status strong { color: var(--ink); }

.layout { display: grid; grid-template-columns: 1.6fr 1fr; gap: 28px; align-items: start; }
@media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }

.tile {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 12px;
  backdrop-filter: blur(6px);
  transition: transform 0.7s var(--ease-drift), box-shadow 0.7s var(--ease-drift);
}
.tile:hover { transform: translate3d(0, -4px, 0); box-shadow: 0 24px 40px -28px rgba(60, 40, 120, 0.45); }
.swatch { height: 128px; border-radius: 14px; background: var(--g); margin-bottom: 12px; }
.tile h3 { font-size: 1rem; margin: 0 0 4px; }
.tile p { margin: 0 0 12px; color: var(--muted); font-size: 0.875rem; line-height: 1.45; min-height: 2.6em; }

/* ---------- The button ---------- */
.dream {
  position: relative;
  isolation: isolate;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  min-height: 44px;
  padding: 0.7rem 1.25rem;
  border: 0;
  border-radius: 999px;
  font: inherit;
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--ink);
  background: linear-gradient(160deg, #ffffff 0%, #efeaff 100%);
  box-shadow:
    inset 0 1px 0 #fff,
    0 1px 2px rgba(40, 30, 80, 0.12),
    0 8px 20px -12px rgba(60, 40, 120, 0.5);
  cursor: pointer;
  transform: translate3d(0, 0, 0);
  transition:
    transform 0.6s var(--ease-drift),
    box-shadow 0.8s var(--ease-drift),
    background-color 0.6s var(--ease-drift),
    color 0.5s var(--ease-drift);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* Aura: a blurred violet-rose bloom that breathes while hovered */
.dream::before {
  content: "";
  position: absolute;
  inset: -35% -20%;
  z-index: -1;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(123, 108, 240, 0.5), rgba(242, 140, 193, 0.26) 55%, transparent 75%);
  filter: blur(12px);
  opacity: 0;
  transition: opacity 0.9s var(--ease-bloom);
  pointer-events: none;
}

/* Sheen: a light band that sweeps across on hover (background-position only, no overflow needed) */
.dream::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(100deg, transparent 40%, rgba(255, 255, 255, 0.85) 50%, transparent 60%) 100% 0 / 250% 100% no-repeat;
  transition: background-position 1.2s var(--ease-sheen);
  pointer-events: none;
}

.dream:not(:disabled):hover {
  transform: translate3d(0, -3px, 0);
  box-shadow:
    inset 0 1px 0 #fff,
    0 2px 4px rgba(40, 30, 80, 0.1),
    0 22px 36px -14px rgba(123, 108, 240, 0.6);
}
.dream:not(:disabled):hover::before {
  opacity: 1;
  animation: aura-drift 5.2s ease-in-out infinite alternate;
}
.dream:not(:disabled):hover::after { background-position: 0% 0; }

/* Press: quick, no overshoot, so it feels physical */
.dream:not(:disabled):active {
  transform: translate3d(0, 0, 0) scale(0.975);
  transition-duration: 0.18s;
  transition-timing-function: var(--ease-press);
}

.dream:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }

/* Variants */
.dream--ink {
  color: #fff;
  background: linear-gradient(160deg, #3d3572 0%, #1c1830 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 10px 22px -12px rgba(28, 24, 48, 0.7);
}
.dream--ghost {
  background: transparent;
  box-shadow: inset 0 0 0 1px rgba(28, 24, 48, 0.18);
}
.dream--ghost:not(:disabled):hover {
  background-color: rgba(255, 255, 255, 0.6);
  box-shadow: inset 0 0 0 1px rgba(123, 108, 240, 0.55), 0 16px 30px -18px rgba(123, 108, 240, 0.6);
}

/* Saved state */
.dream[aria-pressed="true"] {
  background: linear-gradient(160deg, #d5ccff 0%, #fcd0e6 100%);
}

/* Disabled */
.dream:disabled { cursor: default; opacity: 0.6; transform: none; }

/* Loading dots */
.dots { display: none; gap: 4px; align-items: center; }
.dots i {
  width: 6px; height: 6px; border-radius: 50%; background: currentColor;
  animation: dot 1.1s var(--ease-sheen) infinite;
}
.dots i:nth-child(2) { animation-delay: 0.15s; }
.dots i:nth-child(3) { animation-delay: 0.3s; }
.dream[aria-busy="true"] .dots { display: inline-flex; }
.dream[aria-busy="true"] .label { opacity: 0.75; }

/* Save pulse: a ring that blooms once after a toggle */
.is-pulsing { animation: ring 0.9s var(--ease-bloom); }

@keyframes aura-drift {
  0%   { transform: translate3d(-3%, 2%, 0) scale(0.98); }
  100% { transform: translate3d(3%, -3%, 0) scale(1.06); }
}
@keyframes dot {
  0%, 100% { opacity: 0.25; transform: translateY(0); }
  40%      { opacity: 1;    transform: translateY(-3px); }
}
@keyframes ring {
  0%   { box-shadow: 0 0 0 0 rgba(123, 108, 240, 0.5); }
  100% { box-shadow: 0 0 0 18px rgba(123, 108, 240, 0); }
}

/* ---------- Side panel ---------- */
.side {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 20px;
  backdrop-filter: blur(6px);
}
.saved-list { list-style: none; padding: 0; margin: 0 0 24px; display: grid; gap: 8px; }
.saved-list li {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  background: rgba(255, 255, 255, 0.8);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 14px;
  font-size: 0.92rem;
}
.saved-list .hex { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.empty {
  color: var(--muted); font-size: 0.9rem; margin: 0 0 24px;
  padding: 14px; border: 1px dashed rgba(28, 24, 48, 0.18); border-radius: 14px;
}

form label { display: block; font-size: 0.9rem; color: var(--muted); margin-bottom: 6px; }
.field { display: flex; gap: 8px; flex-wrap: wrap; }
input[type="email"] {
  flex: 1 1 180px;
  min-height: 44px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid rgba(28, 24, 48, 0.15);
  background: #fff;
  font: inherit;
  color: var(--ink);
}
input[type="email"]:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
input[aria-invalid="true"] { border-color: #d0476f; }
.error { color: #b3284f; font-size: 0.85rem; margin: 8px 0 0; min-height: 1.2em; }
.note { color: var(--ink); font-size: 0.9rem; margin: 12px 0 0; min-height: 1.2em; line-height: 1.5; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .dream:not(:disabled):hover { transform: none; }
  .tile:hover { transform: none; }
}
</style>
</head>
<body>
<main class="wrap">
  <h1>Moodboard</h1>
  <p class="lede">Collect the textures for the autumn launch. Save the swatches you like, review them on the right, and request the palette notes when the set is final.</p>

  <div class="bar">
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <button class="dream dream--ghost" id="clear" type="button">Clear saved</button>
  </div>

  <div class="layout">
    <section aria-label="Swatches">
      <div class="grid" id="grid"></div>
    </section>

    <aside class="side" aria-labelledby="saved-heading">
      <h2 id="saved-heading">Saved (<span id="count">0</span>)</h2>
      <ul class="saved-list" id="saved"></ul>

      <h2>Get the palette notes</h2>
      <form id="subscribe" novalidate>
        <label for="email">Email address</label>
        <div class="field">
          <input id="email" type="email" placeholder="you@studio.com" autocomplete="email" aria-describedby="error">
          <button class="dream dream--ink" id="submit" type="submit">
            <span class="label">Send me the notes</span>
            <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>
        </div>
        <p class="error" id="error" role="alert"></p>
      </form>
      <p class="note" id="note" role="status" aria-live="polite"></p>
    </aside>
  </div>
</main>

<script>
(function () {
  var SWATCHES = [
    { id: "dusk",  name: "Dusk Linen",   hex: "#B9A7E6", note: "Warm grey with a violet undertone for soft backgrounds.", g: "linear-gradient(140deg,#e8e1f5,#b9a7e6 60%,#7d6bc4)" },
    { id: "tide",  name: "Tidewater",    hex: "#7FD3BD", note: "Muted teal for cards and data highlights.", g: "linear-gradient(140deg,#d7f3ec,#7fd3bd 55%,#3d8f88)" },
    { id: "peony", name: "Late Peony",   hex: "#F29CC6", note: "Soft rose for hover accents and badges.", g: "linear-gradient(140deg,#ffe3ef,#f29cc6 60%,#c35c93)" },
    { id: "ember", name: "Ember Glow",   hex: "#F5B872", note: "Low-saturation orange for warnings and calls to action.", g: "linear-gradient(140deg,#fff0dc,#f5b872 60%,#c8743a)" },
    { id: "fog",   name: "Morning Fog",  hex: "#CFE3F5", note: "Near-white blue for large surfaces and dialogs.", g: "linear-gradient(140deg,#f6fbff,#cfe3f5 60%,#9fbfdc)" },
    { id: "ink",   name: "Night Ink",    hex: "#1C1830", note: "Deep indigo for text and the primary button.", g: "linear-gradient(140deg,#4a4180,#1c1830)" }
  ];

  var state = {
    saved: { dusk: true, tide: true },   // ids of saved swatches
    lastAction: "",
    subscribed: false,
    sending: false
  };

  var el = {
    grid: document.getElementById("grid"),
    saved: document.getElementById("saved"),
    count: document.getElementById("count"),
    status: document.getElementById("status"),
    clear: document.getElementById("clear"),
    form: document.getElementById("subscribe"),
    email: document.getElementById("email"),
    submit: document.getElementById("submit"),
    error: document.getElementById("error"),
    note: document.getElementById("note")
  };

  function savedIds() {
    return SWATCHES.filter(function (s) { return state.saved[s.id]; }).map(function (s) { return s.id; });
  }

  function findSwatch(id) {
    for (var i = 0; i < SWATCHES.length; i++) if (SWATCHES[i].id === id) return SWATCHES[i];
    return null;
  }

  function buildGrid() {
    SWATCHES.forEach(function (s) {
      var tile = document.createElement("article");
      tile.className = "tile";
      tile.innerHTML =
        '<div class="swatch" style="--g:' + s.g + '"></div>' +
        '<h3></h3><p></p>' +
        '<button class="dream" type="button" data-id="' + s.id + '"><span class="label"></span></button>';
      tile.querySelector("h3").textContent = s.name;
      tile.querySelector("p").textContent = s.note;
      el.grid.appendChild(tile);
    });
  }

  function renderSaved() {
    var ids = savedIds();
    el.count.textContent = ids.length;
    el.saved.innerHTML = "";
    if (ids.length === 0) {
      var empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "Nothing saved yet. Save a swatch to start the set.";
      el.saved.parentNode.insertBefore(empty, el.saved.nextSibling);
      el.saved.style.display = "none";
      return;
    }
    el.saved.style.display = "";
    var stale = el.saved.parentNode.querySelector(".empty");
    if (stale) stale.remove();
    ids.forEach(function (id) {
      var s = findSwatch(id);
      var li = document.createElement("li");
      var left = document.createElement("span");
      left.textContent = s.name;
      var hex = document.createElement("span");
      hex.className = "hex";
      hex.textContent = s.hex;
      li.appendChild(left);
      li.appendChild(hex);
      el.saved.appendChild(li);
    });
  }

  function renderTiles() {
    var buttons = el.grid.querySelectorAll("button[data-id]");
    Array.prototype.forEach.call(buttons, function (btn) {
      var id = btn.getAttribute("data-id");
      var s = findSwatch(id);
      var on = !!state.saved[id];
      btn.setAttribute("aria-pressed", on ? "true" : "false");
      btn.setAttribute("aria-label", (on ? "Remove " : "Save ") + s.name);
      btn.querySelector(".label").textContent = on ? "Saved" : "Save";
    });
  }

  function renderStatus() {
    var n = savedIds().length;
    var text = "<strong>" + n + " of " + SWATCHES.length + "</strong> swatches saved.";
    if (state.lastAction) text = state.lastAction + " " + text;
    el.status.innerHTML = text;
    el.clear.disabled = n === 0;
  }

  function renderAll() {
    renderTiles();
    renderSaved();
    renderStatus();
  }

  function pulse(btn) {
    btn.classList.remove("is-pulsing");
    void btn.offsetWidth; // restart the animation
    btn.classList.add("is-pulsing");
    btn.addEventListener("animationend", function done() {
      btn.classList.remove("is-pulsing");
      btn.removeEventListener("animationend", done);
    });
  }

  el.grid.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-id]");
    if (!btn) return;
    var id = btn.getAttribute("data-id");
    var s = findSwatch(id);
    if (state.saved[id]) {
      delete state.saved[id];
      state.lastAction = "Removed " + s.name + ".";
    } else {
      state.saved[id] = true;
      state.lastAction = "Saved " + s.name + ".";
    }
    renderAll();
    pulse(btn);
  });

  el.clear.addEventListener("click", function () {
    state.saved = {};
    state.lastAction = "Cleared the set.";
    renderAll();
  });

  el.email.addEventListener("input", function () {
    if (el.email.getAttribute("aria-invalid") === "true") {
      el.email.removeAttribute("aria-invalid");
      el.error.textContent = "";
    }
  });

  el.form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (state.sending || state.subscribed) return;

    var value = el.email.value.trim();
    var valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    if (!valid) {
      el.email.setAttribute("aria-invalid", "true");
      el.error.textContent = "Enter an email address like you@studio.com.";
      el.email.focus();
      return;
    }

    if (savedIds().length === 0) {
      el.note.textContent = "Save at least one swatch first, so the notes have something to cover.";
      return;
    }

    state.sending = true;
    el.submit.setAttribute("aria-busy", "true");
    el.submit.disabled = true;
    el.submit.querySelector(".label").textContent = "Sending";
    el.note.textContent = "";

    setTimeout(function () {
      state.sending = false;
      state.subscribed = true;
      el.submit.removeAttribute("aria-busy");
      el.submit.querySelector(".label").textContent = "Notes on the way";
      el.email.disabled = true;
      el.note.textContent = "Sent to " + value + " with " + savedIds().length + " swatches. Check your inbox.";
    }, 1200);
  });

  buildGrid();
  renderAll();
})();
</script>
</body>
</html>
