<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parcel Tracker Toast</title>
<style>
:root{
  --bg:#0c0e12;
  --panel:#161920;
  --panel-2:#1d212a;
  --line:#2a303b;
  --text:#e6e9ef;
  --muted:#8891a3;
  --accent:#8ab4ff;
  --s0:#fbbf24;
  --s1:#60a5fa;
  --s2:#a78bfa;
  --s3:#4ade80;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
.page{padding:24px 16px;color:var(--muted);font-size:12px;max-width:640px}
.page h1{font-size:15px;color:var(--text);margin:0 0 6px}

/* toast shell */
.toast{
  position:fixed;right:16px;bottom:16px;
  width:min(320px,calc(100vw - 32px));
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 12px 32px rgba(0,0,0,.5);
  overflow:hidden;
}
.head{
  width:100%;display:flex;align-items:center;gap:8px;
  padding:9px 10px 9px 12px;
  background:none;border:0;color:inherit;font:inherit;cursor:pointer;text-align:left;
}
.head .title{font-weight:600}
.head .count{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.chev{color:var(--muted);transition:transform .2s ease;flex:none}
.toast[data-open="false"] .chev{transform:rotate(-90deg)}
.toast[data-open="false"] .body{display:none}
.body{border-top:1px solid var(--line)}

button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* rows */
.list{max-height:240px;overflow-y:auto}
.row{
  display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px;
  padding:8px 8px 8px 12px;border-bottom:1px solid var(--line);
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
.info{min-width:0}
.name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.done .name{color:var(--muted)}
.pill{
  border:1px solid var(--c);color:var(--c);background:transparent;
  border-radius:999px;padding:2px 8px;font:inherit;font-size:11px;cursor:pointer;white-space:nowrap;
}
.pill:hover:not(:disabled){background:color-mix(in srgb,var(--c) 14%,transparent)}
.pill:disabled{cursor:default;opacity:.75}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:3px 5px;border-radius:6px}
.x:hover{color:var(--text);background:var(--panel-2)}
.empty{padding:14px 12px;color:var(--muted);font-size:12px}

/* add form */
.add{
  display:grid;grid-template-columns:1fr 1fr auto;gap:6px;
  padding:10px 12px;background:var(--panel-2);border-top:1px solid var(--line);
}
.add input{
  background:var(--bg);border:1px solid var(--line);color:var(--text);
  border-radius:7px;padding:6px 8px;font:inherit;min-width:0;width:100%;
}
.add input::placeholder{color:#7c8496}
.add button{
  background:var(--accent);color:#0b1220;border:0;border-radius:7px;
  padding:6px 10px;font:inherit;font-weight:600;cursor:pointer;
}

/* footer */
.foot{
  display:flex;align-items:center;gap:8px;min-height:34px;
  padding:6px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);
}
.foot .flash{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.foot .clear{
  margin-left:auto;background:none;border:0;color:var(--accent);cursor:pointer;
  font:inherit;font-size:12px;padding:2px 4px;white-space:nowrap;
}
.foot .clear:disabled{color:#6b7385;cursor:default}
</style>
</head>
<body>

<div class="page">
  <h1>Parcel tracker</h1>
  <p>A compact tracking toast sits in the bottom-right corner. Expand it to see packages, advance a status, add a tracking code, or remove a package. State is kept in this browser.</p>
</div>

<section class="toast" id="toast" data-open="true" aria-label="Package tracker">
  <button class="head" id="head" data-action="toggle" aria-expanded="true" aria-controls="body">
    <span class="title">Packages</span>
    <span class="count" id="count"></span>
    <svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div class="body" id="body">
    <div class="list" id="list"></div>

    <form class="add" id="addForm" autocomplete="off">
      <input id="newName" placeholder="Item name" maxlength="60" aria-label="Item name">
      <input id="newCode" placeholder="Tracking code" maxlength="40" aria-label="Tracking code">
      <button type="submit">Add</button>
    </form>

    <div class="foot">
      <span class="flash" id="flash" hidden></span>
      <button class="clear" id="clearBtn" data-action="clear">Clear delivered</button>
    </div>
  </div>
</section>

<script>
(function () {
  var KEY = 'parcel-toast-v1';
  var STATUSES = [
    { label: 'Label created',    c: 'var(--s0)' },
    { label: 'In transit',       c: 'var(--s1)' },
    { label: 'Out for delivery', c: 'var(--s2)' },
    { label: 'Delivered',        c: 'var(--s3)' }
  ];

  var SAMPLE = {
    open: true,
    packages: [
      { id: 'p1', name: 'Walnut desk lamp',        carrier: 'Northwind Post', code: 'NW4471082259', status: 1, eta: 'Thu, Nov 6' },
      { id: 'p2', name: 'Ceramic pour-over set',   carrier: 'Parcelly',       code: 'PL-88230164',  status: 2, eta: 'Today by 8 pm' },
      { id: 'p3', name: 'USB-C hub, 7-port',       carrier: 'Quill Freight',  code: 'QF770912',     status: 3, eta: 'Delivered Mon' },
      { id: 'p4', name: 'Field notebook 3-pack',   carrier: 'Northwind Post', code: 'NW9920714',    status: 0, eta: 'Sat, Nov 8' }
    ]
  };

  var state = load();
  var flashTimer = null;

  var $ = function (id) { return document.getElementById(id); };

  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.packages)) return s;
    } catch (e) { /* storage unavailable or corrupt: fall back to sample */ }
    return JSON.parse(JSON.stringify(SAMPLE));
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* non-essential */ }
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function flash(msg) {
    var el = $('flash');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { el.hidden = true; }, 2600);
  }

  function render() {
    var root = $('toast');
    var open = !!state.open;
    root.setAttribute('data-open', String(open));
    $('head').setAttribute('aria-expanded', String(open));

    var total = state.packages.length;
    var active = state.packages.filter(function (p) { return p.status < 3; }).length;
    $('count').textContent = total === 0 ? 'nothing tracked' : (active ? active + ' active' : 'all delivered');

    var list = $('list');
    if (total === 0) {
      list.innerHTML = '<div class="empty">No packages yet. Add a tracking code below.</div>';
    } else {
      list.innerHTML = state.packages.map(function (p) {
        var st = STATUSES[p.status];
        var done = p.status === 3;
        var meta = done ? 'Delivered' : p.eta;
        return '<div class="row' + (done ? ' done' : '') + '" style="--c:' + st.c + '">' +
          '<span class="dot" aria-hidden="true"></span>' +
          '<div class="info">' +
            '<div class="name" title="' + esc(p.name) + '">' + esc(p.name) + '</div>' +
            '<div class="meta" title="' + esc(p.carrier + ' · ' + p.code) + '">' + esc(p.carrier) + ' · ' + esc(meta) + '</div>' +
          '</div>' +
          '<button class="pill" data-action="advance" data-id="' + esc(p.id) + '"' + (done ? ' disabled' : '') +
            ' title="' + (done ? 'Delivered' : 'Advance status') + '">' + esc(st.label) + '</button>' +
          '<button class="x" data-action="remove" data-id="' + esc(p.id) + '" aria-label="Remove ' + esc(p.name) + '">&times;</button>' +
        '</div>';
      }).join('');
    }

    $('clearBtn').disabled = !state.packages.some(function (p) { return p.status === 3; });
  }

  function update(fn) {
    fn();
    save();
    render();
  }

  $('toast').addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    var action = el.getAttribute('data-action');
    var id = el.getAttribute('data-id');

    if (action === 'toggle') {
      update(function () { state.open = !state.open; });
    } else if (action === 'advance') {
      var p = state.packages.find(function (x) { return x.id === id; });
      if (!p || p.status >= 3) return;
      update(function () { p.status += 1; });
      flash(p.status === 3 ? p.name + ' delivered' : p.name + ': ' + STATUSES[p.status].label);
    } else if (action === 'remove') {
      var gone = state.packages.find(function (x) { return x.id === id; });
      update(function () {
        state.packages = state.packages.filter(function (x) { return x.id !== id; });
      });
      if (gone) flash('Removed ' + gone.name);
    } else if (action === 'clear') {
      var n = state.packages.filter(function (x) { return x.status === 3; }).length;
      update(function () {
        state.packages = state.packages.filter(function (x) { return x.status !== 3; });
      });
      flash('Cleared ' + n + ' delivered');
    }
  });

  $('addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('newName').value.trim();
    var code = $('newCode').value.trim().replace(/\s+/g, '');
    if (!name || !code) {
      flash('Enter an item name and a tracking code');
      (name ? $('newCode') : $('newName')).focus();
      return;
    }
    update(function () {
      state.open = true;
      state.packages.unshift({
        id: 'p' + Date.now().toString(36),
        name: name,
        carrier: 'Manual entry',
        code: code,
        status: 0,
        eta: 'ETA pending'
      });
    });
    $('newName').value = '';
    $('newCode').value = '';
    flash('Tracking ' + name);
  });

  render();
})();
</script>
</body>
</html>
