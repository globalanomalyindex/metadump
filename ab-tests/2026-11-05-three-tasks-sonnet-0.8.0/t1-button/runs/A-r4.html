<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halo Button</title>
<style>
  :root {
    --ink: #1d1a33;
    --ink-soft: #4a4668;
    --paper: #f6f3fb;
    --lilac: #b9a7ff;
    --periwinkle: #8fb4ff;
    --mist: #bff0e6;
    --blush: #ffc9e0;

    /* Custom curves. Names describe the feel. */
    --exhale: cubic-bezier(.19, .82, .24, 1);        /* long soft landing */
    --bloom: cubic-bezier(.16, .9, .3, 1.18);         /* gentle overshoot, opens like a flower */
    --drift: cubic-bezier(.4, .05, .15, .98);         /* slow start, slow end */
    --settle: cubic-bezier(.33, 0, .12, 1);           /* quick lift, lazy return */
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#efeaff; --ink-soft:#a9a4c8; --paper:#0f0d1e; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(60rem 40rem at 15% -10%, color-mix(in srgb, var(--lilac) 40%, transparent), transparent 60%),
      radial-gradient(50rem 36rem at 95% 10%, color-mix(in srgb, var(--mist) 35%, transparent), transparent 60%),
      var(--paper);
    display: grid; place-items: center; padding: 32px 16px;
  }
  .card {
    width: min(100%, 560px);
    padding: clamp(24px, 5vw, 44px);
    border-radius: 28px;
    background: color-mix(in srgb, var(--paper) 70%, white 30%);
    border: 1px solid color-mix(in srgb, var(--ink) 10%, transparent);
    box-shadow: 0 30px 80px -40px color-mix(in srgb, var(--lilac) 80%, transparent);
  }
  .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 12px; }
  h1 { font: 600 clamp(28px, 6vw, 38px)/1.12 Georgia, "Iowan Old Style", serif; margin: 0 0 12px; letter-spacing: -.01em; }
  p.lede { margin: 0 0 24px; color: var(--ink-soft); }

  fieldset { border: 0; margin: 0 0 24px; padding: 0; display: grid; gap: 10px; }
  legend { font-size: 13px; color: var(--ink-soft); margin-bottom: 8px; padding: 0; }
  .plan {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 14px 16px; border-radius: 16px; cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--ink) 14%, transparent);
    transition: border-color .5s var(--exhale), background-color .5s var(--exhale), transform .6s var(--bloom);
  }
  .plan:has(input:checked) {
    border-color: var(--lilac);
    background: color-mix(in srgb, var(--lilac) 16%, transparent);
  }
  .plan:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 3px; }
  @media (hover:hover) { .plan:hover { transform: translateY(-1px); } }
  .plan input { position: absolute; opacity: 0; pointer-events: none; }
  .plan b { font-weight: 600; }
  .plan span.s { color: var(--ink-soft); font-size: 14px; }
  .price { font-variant-numeric: tabular-nums; font-weight: 600; }

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 22px; }

  /* ---------- The button ---------- */
  .halo {
    --mx: 50%; --my: 50%;
    position: relative; isolation: isolate;
    display: inline-flex; align-items: center; justify-content: center; gap: .7em;
    min-height: 56px; padding: 0 2rem;
    border: 0; border-radius: 999px; cursor: pointer;
    font: 600 1rem/1 inherit; font-family: inherit; letter-spacing: .01em;
    color: #1d1a33;
    background: transparent;
    -webkit-tap-highlight-color: transparent;
    transition: transform .9s var(--settle), letter-spacing .9s var(--exhale);
  }
  /* soft aura behind the button; blurred once, only opacity/transform animate */
  .halo::before {
    content: ""; position: absolute; inset: -14px -22px; z-index: -2; border-radius: 999px;
    background: radial-gradient(closest-side, var(--lilac), var(--periwinkle) 55%, transparent 100%);
    filter: blur(22px);
    opacity: .28; transform: scale(.82);
    transition: opacity 1.1s var(--exhale), transform 1.3s var(--bloom);
  }
  /* the body: pearly gradient that slowly drifts */
  .halo .body {
    position: absolute; inset: 0; z-index: -1; border-radius: inherit; overflow: hidden;
    background:
      radial-gradient(120px 90px at var(--mx) var(--my), rgba(255,255,255,.85), transparent 70%),
      linear-gradient(115deg, #e6dcff, #cfe3ff 35%, #d4f6ee 65%, #ffe0ee);
    background-size: 100% 100%, 220% 100%;
    background-position: 0 0, 0% 0;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.7), 0 10px 30px -14px rgba(120,100,220,.6);
    transition: background-position 1.6s var(--drift), box-shadow 1s var(--exhale);
  }
  /* a slow veil of light that passes across on hover */
  .halo .body::after {
    content: ""; position: absolute; inset: -20% 0; width: 55%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent);
    transform: translateX(-130%) skewX(-18deg); opacity: 0;
    transition: transform 1.4s var(--drift), opacity .6s var(--exhale);
  }
  .halo .label { position: relative; display: inline-block; }
  .halo .arrow {
    display: inline-block; width: 1.1em; height: 1.1em;
    transition: transform .9s var(--bloom), opacity .6s var(--exhale);
    opacity: .75;
  }
  .halo .spinner, .halo .check { display: none; }

  @media (hover: hover) {
    .halo:hover { transform: translateY(-3px); letter-spacing: .035em; transition-duration: .7s, 1.1s; }
    .halo:hover::before { opacity: .8; transform: scale(1.05); }
    .halo:hover .body { background-position: 0 0, 100% 0; box-shadow: inset 0 0 0 1px #fff, 0 18px 40px -14px rgba(120,100,220,.75); }
    .halo:hover .body::after { transform: translateX(300%) skewX(-18deg); opacity: 1; }
    .halo:hover .arrow { transform: translateX(5px); opacity: 1; }
  }
  .halo:active { transform: translateY(0) scale(.975); transition-duration: .25s, .4s; }
  .halo:active::before { transform: scale(.9); opacity: .55; transition-duration: .3s; }
  .halo:focus-visible { outline: 2px solid var(--ink); outline-offset: 6px; }

  /* states */
  .halo[data-state="loading"] { cursor: progress; }
  .halo[data-state="loading"] .arrow, .halo[data-state="done"] .arrow { display: none; }
  .halo[data-state="loading"] .spinner { display: inline-block; }
  .halo[data-state="done"] .check { display: inline-block; }
  .halo[data-state="loading"]::before { animation: breathe 2.4s var(--drift) infinite; }
  .halo[data-state="done"]::before { background: radial-gradient(closest-side, var(--mist), var(--periwinkle) 60%, transparent); opacity: .75; transform: scale(1.02); }
  .spinner, .check { width: 1.1em; height: 1.1em; }
  .spinner { border-radius: 50%; border: 2px solid rgba(29,26,51,.2); border-top-color: #1d1a33; animation: spin 1.1s linear infinite; }
  .check { stroke: #1d1a33; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .8s var(--exhale) .05s forwards; }
  .halo .label { transition: opacity .5s var(--exhale), transform .7s var(--bloom); }
  .halo .label.swap { opacity: 0; transform: translateY(6px); }

  @keyframes breathe { 0%,100% { opacity: .35; transform: scale(.9);} 50% { opacity: .85; transform: scale(1.08);} }
  @keyframes spin { to { transform: rotate(360deg);} }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* secondary text button */
  .quiet {
    font: inherit; color: var(--ink-soft); background: none; border: 0; cursor: pointer; padding: 10px 2px;
    background-image: linear-gradient(currentColor, currentColor);
    background-size: 0% 1px; background-repeat: no-repeat; background-position: 0 100%;
    transition: background-size .8s var(--exhale), color .5s var(--exhale);
  }
  .quiet:hover, .quiet:focus-visible { background-size: 100% 1px; color: var(--ink); }
  .quiet:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 4px; }

  .status { margin: 22px 0 0; min-height: 1.6em; font-size: 14px; color: var(--ink-soft); }
  .status b { color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    .halo, .halo::before, .halo .body, .halo .body::after, .halo .arrow, .halo .label, .plan, .quiet {
      transition-duration: .01s !important; animation-duration: .01s !important;
    }
    .halo[data-state="loading"]::before { animation: none; }
    .spinner { animation-duration: 2s !important; }
    .halo:hover { transform: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Dormant &middot; sleep soundscapes</p>
    <h1>Fall asleep to something softer than silence.</h1>
    <p class="lede">Layered rain, low strings and slow breathing guides, tuned to wind you down in about twenty minutes. Try it free for 14 days.</p>

    <fieldset>
      <legend>Choose a plan</legend>
      <label class="plan"><span><b>Monthly</b> <span class="s">&middot; cancel anytime</span></span><span class="price">$8</span><input type="radio" name="plan" value="Monthly" data-price="$8 / month" checked></label>
      <label class="plan"><span><b>Yearly</b> <span class="s">&middot; two months free</span></span><span class="price">$80</span><input type="radio" name="plan" value="Yearly" data-price="$80 / year"></label>
    </fieldset>

    <div class="actions">
      <button class="halo" id="cta" type="button" data-state="idle">
        <span class="body" aria-hidden="true"></span>
        <span class="label" id="ctaLabel">Start free trial</span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <span class="spinner" aria-hidden="true"></span>
        <svg class="check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </button>
      <button class="quiet" id="reset" type="button">Maybe later</button>
    </div>

    <p class="status" id="status" role="status" aria-live="polite">Monthly plan selected. Free for 14 days, then $8 / month.</p>
  </main>

<script>
(function () {
  var btn = document.getElementById('cta');
  var label = document.getElementById('ctaLabel');
  var status = document.getElementById('status');
  var reset = document.getElementById('reset');
  var plans = document.querySelectorAll('input[name="plan"]');
  var timer = null;
  var count = 0;

  function plan() { return document.querySelector('input[name="plan"]:checked'); }

  function setLabel(text) {
    label.classList.add('swap');
    setTimeout(function () { label.textContent = text; label.classList.remove('swap'); }, 220);
  }
  function setState(s) { btn.dataset.state = s; btn.setAttribute('aria-busy', s === 'loading'); }

  // pointer-follow light on the pearl body
  btn.addEventListener('pointermove', function (e) {
    var r = btn.getBoundingClientRect();
    btn.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    btn.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });
  btn.addEventListener('pointerleave', function () {
    btn.style.setProperty('--mx', '50%'); btn.style.setProperty('--my', '50%');
  });

  plans.forEach(function (p) {
    p.addEventListener('change', function () {
      if (btn.dataset.state !== 'idle') return;
      status.innerHTML = '<b>' + p.value + '</b> plan selected. Free for 14 days, then ' + p.dataset.price + '.';
    });
  });

  btn.addEventListener('click', function () {
    if (btn.dataset.state !== 'idle') return;
    var chosen = plan();
    setState('loading');
    setLabel('Preparing your night');
    status.textContent = 'Setting up your ' + chosen.value.toLowerCase() + ' trial...';
    plans.forEach(function (p) { p.disabled = true; });
    timer = setTimeout(function () {
      count++;
      setState('done');
      setLabel("You're in");
      status.innerHTML = '<b>Trial started</b> (' + chosen.value + '). First soundscape is ready for tonight. Trials started this session: ' + count + '.';
    }, 1800);
  });

  reset.addEventListener('click', function () {
    clearTimeout(timer);
    setState('idle');
    setLabel('Start free trial');
    plans.forEach(function (p) { p.disabled = false; });
    var c = plan();
    status.innerHTML = 'Reset. <b>' + c.value + '</b> plan selected. Free for 14 days, then ' + c.dataset.price + '.';
  });
})();
</script>
</body>
</html>
