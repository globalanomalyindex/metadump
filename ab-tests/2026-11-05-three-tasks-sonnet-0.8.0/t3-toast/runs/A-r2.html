<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Package Toast</title>
<style>
:root{
  --bg:#0b0d10; --panel:#14171c; --panel2:#1b1f26; --line:#262b34;
  --text:#e8ebf0; --mute:#8a93a3; --dim:#8590a2;
  --accent:#4ade80; --accent2:#22c55e; --warn:#fbbf24;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background-image:radial-gradient(circle at 20% 10%,#151a22 0,transparent 50%),radial-gradient(circle at 90% 90%,#101820 0,transparent 45%);}
.stage{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(320px,calc(100vw - 24px))}
.hint{position:fixed;top:16px;left:16px;color:var(--dim);font-size:12px}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.55);overflow:hidden;
  animation:in .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.97)}}
.head{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;background:none;border:0;color:inherit;cursor:pointer;text-align:left;font:inherit}
.head:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ico{width:26px;height:26px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;flex:none}
.ico svg{width:15px;height:15px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sum{flex:1;min-width:0}
.sum b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum span{display:block;color:var(--mute);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:14px;height:14px;stroke:var(--mute);fill:none;stroke-width:2;transition:transform .25s;flex:none}
.toast.open .chev{transform:rotate(180deg)}
.bar{height:3px;background:var(--panel2)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .5s}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.toast.open .body{grid-template-rows:1fr}
.inner{overflow:hidden}
.pad{padding:10px 11px 11px}
.sel{display:flex;gap:6px;margin-bottom:9px}
.sel select{flex:1;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:4px 6px;font:inherit;font-size:12px}
.meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);margin-bottom:8px}
.meta b{color:var(--text);font-weight:600}
ol{list-style:none;padding:0;position:relative}
li{display:flex;gap:9px;padding:0 0 8px;position:relative;font-size:12px;color:var(--mute)}
li:last-child{padding-bottom:0}
li::before{content:"";position:absolute;left:4px;top:11px;bottom:-1px;width:1px;background:var(--line)}
li:last-child::before{display:none}
li .dot{width:9px;height:9px;border-radius:50%;background:var(--line);margin-top:3px;flex:none;position:relative;z-index:1}
li.done .dot{background:var(--accent)} li.cur .dot{background:var(--accent);box-shadow:0 0 0 3px rgba(74,222,128,.2)}
li.cur{color:var(--text)} li.done{color:#b8c0cc}
li small{display:block;color:var(--dim);font-size:10.5px}
.act{display:flex;gap:6px;margin-top:10px}
.act button{flex:1;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:5px 4px;font:inherit;font-size:11.5px;cursor:pointer;transition:background .15s}
.act button:hover{background:#242a33}
.act button.on{border-color:var(--accent);color:var(--accent)}
.snack{position:fixed;left:50%;bottom:78px;transform:translate(-50%,10px);background:#242a33;color:var(--text);padding:5px 11px;border-radius:99px;font-size:11.5px;opacity:0;pointer-events:none;transition:.25s}
.snack.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="hint">Click the toast to expand. Try the buttons.</div>
<div class="stage">
  <div class="toast" id="toast">
    <button class="head" id="head" aria-expanded="false" aria-controls="body">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></span>
      <span class="sum"><b id="sTitle"></b><span id="sSub"></span></span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="bar"><i id="fill"></i></div>
    <div class="body" id="body"><div class="inner"><div class="pad">
      <div class="sel"><select id="pick" aria-label="Package"></select></div>
      <div class="meta"><span id="carrier"></span><span>ETA <b id="eta"></b></span></div>
      <ol id="steps"></ol>
      <div class="act">
        <button id="adv">Advance</button>
        <button id="mute">Notify: on</button>
        <button id="copy">Copy #</button>
      </div>
    </div></div></div>
  </div>
</div>
<div class="snack" id="snack"></div>
<script>
(function(){
  var pk=[
    {name:"Mechanical keyboard",carrier:"UPS",num:"1Z84A9020391827364",eta:"Thu, Nov 6",stage:3,notify:true,
     steps:[["Label created","Nov 3, 4:12 PM","Austin, TX"],["Picked up","Nov 3, 8:40 PM","Austin, TX"],["Departed hub","Nov 4, 2:05 AM","Dallas, TX"],["Out for delivery","Nov 5, 7:18 AM","San Marcos, TX"],["Delivered","",""]]},
    {name:"Running shoes",carrier:"FedEx",num:"781204493017",eta:"Sat, Nov 8",stage:1,notify:true,
     steps:[["Label created","Nov 4, 1:30 PM","Portland, OR"],["In transit","Nov 5, 6:02 AM","Boise, ID"],["Arrived at facility","",""],["Out for delivery","",""],["Delivered","",""]]},
    {name:"Coffee beans 2kg",carrier:"USPS",num:"9400111899223344556677",eta:"Delivered",stage:4,notify:false,
     steps:[["Label created","Nov 1, 9:00 AM","Seattle, WA"],["Accepted","Nov 1, 5:44 PM","Seattle, WA"],["In transit","Nov 2, 11:20 AM","Spokane, WA"],["Out for delivery","Nov 4, 8:05 AM","Austin, TX"],["Delivered","Nov 4, 1:52 PM","Front porch"]]}
  ];
  var cur=0,$=function(i){return document.getElementById(i)};
  var toast=$("toast"),head=$("head"),snackT;
  function snack(t){var s=$("snack");s.textContent=t;s.classList.add("show");clearTimeout(snackT);snackT=setTimeout(function(){s.classList.remove("show")},1400)}
  function render(){
    var p=pk[cur],last=p.steps.length-1,done=p.stage>=last;
    $("sTitle").textContent=p.name;
    $("sSub").textContent=(done?"Delivered":p.steps[p.stage][0])+" · "+p.carrier;
    $("fill").style.width=(p.stage/last*100)+"%";
    $("carrier").textContent=p.carrier+" · …"+p.num.slice(-6);
    $("eta").textContent=done?"Delivered":p.eta;
    $("steps").innerHTML=p.steps.map(function(s,i){
      var c=i<p.stage||(done&&i===last)?"done":i===p.stage?"cur":"";
      return '<li class="'+c+'"><span class="dot"></span><span>'+s[0]+(s[1]?'<small>'+s[1]+' · '+s[2]+'</small>':'')+'</span></li>';
    }).join("");
    $("adv").disabled=done;$("adv").style.opacity=done?.4:1;
    var m=$("mute");m.textContent="Notify: "+(p.notify?"on":"off");m.classList.toggle("on",p.notify);
  }
  head.onclick=function(){var o=toast.classList.toggle("open");head.setAttribute("aria-expanded",o)};
  var sel=$("pick");
  pk.forEach(function(p,i){var o=document.createElement("option");o.value=i;o.textContent=p.name;sel.appendChild(o)});
  sel.onchange=function(){cur=+sel.value;render()};
  $("adv").onclick=function(){
    var p=pk[cur],last=p.steps.length-1;if(p.stage>=last)return;
    p.stage++;
    var t=new Date(),s=p.steps[p.stage];
    s[1]=t.toLocaleDateString("en-US",{month:"short",day:"numeric"})+", "+t.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
    s[2]=s[2]||"Austin, TX";
    if(p.stage===last)p.eta="Delivered";
    render();snack(p.stage===last?"Delivered":"Now: "+s[0]);
  };
  $("mute").onclick=function(){var p=pk[cur];p.notify=!p.notify;render();snack(p.notify?"Notifications on":"Notifications off")};
  $("copy").onclick=function(){
    var n=pk[cur].num;
    function ok(){snack("Copied "+n.slice(0,8)+"…")}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(n).then(ok,ok)}else ok();
  };
  render();
  setTimeout(function(){toast.classList.add("open");head.setAttribute("aria-expanded","true")},600);
})();
</script>
</body>
</html>
