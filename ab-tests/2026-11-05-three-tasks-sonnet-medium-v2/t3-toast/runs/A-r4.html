<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Package Toast</title>
<style>
:root{
  --bg:#0b0d10; --toast:#14171c; --line:#232830; --text:#e8ebf0; --mute:#8b93a1; --dim:#7d8695;
  --accent:#4ade80; --accent-d:#143a25; --warn:#fbbf24;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background-image:radial-gradient(circle at 20% 10%,#12161c,transparent 60%);}
.stage{height:100%;display:flex;align-items:flex-end;justify-content:flex-end;padding:20px}
.stage p{position:fixed;left:20px;top:18px;color:var(--dim);font-size:12px}

.toast{width:292px;background:var(--toast);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);overflow:hidden;transition:width .25s}
.head{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;background:none;border:0;color:inherit;font:inherit;cursor:pointer;text-align:left}
.head:focus-visible,.btn:focus-visible,.pkg:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ico{width:22px;height:22px;border-radius:6px;background:var(--accent-d);color:var(--accent);display:grid;place-items:center;flex:none}
.ico svg{width:13px;height:13px}
.title{flex:1;min-width:0}
.title b{display:block;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title span{display:block;color:var(--mute);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:14px;height:14px;color:var(--mute);transition:transform .25s;flex:none}
.toast.open .chev{transform:rotate(180deg)}
.pbar{height:3px;background:var(--line)}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}

.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s}
.toast.open .body{grid-template-rows:1fr}
.body>div{overflow:hidden}
.inner{padding:8px 10px 10px}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.pkg{flex:1;background:none;border:1px solid var(--line);border-radius:6px;color:var(--mute);font:inherit;font-size:11px;padding:3px 0;cursor:pointer}
.pkg[aria-pressed=true]{background:var(--accent-d);border-color:#1f5a38;color:var(--accent)}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:11px;margin-bottom:8px}
.meta b{color:var(--text);font-weight:500}
ol{list-style:none;padding:0;position:relative}
li{display:flex;gap:8px;padding:0 0 7px;position:relative;color:var(--dim);font-size:11.5px}
li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line);border:1px solid var(--dim);margin-top:4px;flex:none;position:relative;z-index:1}
li::after{content:"";position:absolute;left:3px;top:11px;bottom:-4px;width:1px;background:var(--line)}
li:last-child::after{display:none}
li.done{color:var(--mute)}
li.done::before{background:var(--accent);border-color:var(--accent)}
li.cur{color:var(--text)}
li.cur::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,222,128,.2)}
li em{font-style:normal;margin-left:auto;color:var(--dim);font-size:10.5px;white-space:nowrap}
li div{min-width:0;flex:1;display:flex;gap:6px}
.actions{display:flex;gap:6px;margin-top:4px}
.btn{flex:1;background:#1b2027;border:1px solid var(--line);border-radius:6px;color:var(--text);font:inherit;font-size:11px;padding:5px 0;cursor:pointer}
.btn:hover{background:#222831}
.btn.on{background:var(--accent-d);border-color:#1f5a38;color:var(--accent)}
.note{color:var(--warn);font-size:11px;margin-top:6px;min-height:14px}
.toast.dismissed{display:none}
.restore{display:none;background:var(--toast);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:999px;font:inherit;font-size:12px;cursor:pointer}
.restore.show{display:block}
</style>
</head>
<body>
<div class="stage">
  <p>Tracking demo. Click the toast to expand.</p>
  <section class="toast" id="toast" aria-label="Package tracker">
    <button class="head" id="head" aria-expanded="false" aria-controls="body">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></span>
      <span class="title"><b id="t1"></b><span id="t2"></span></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
    </button>
    <div class="pbar"><i id="bar"></i></div>
    <div class="body" id="body"><div><div class="inner">
      <div class="tabs" id="tabs"></div>
      <div class="meta"><span id="carrier"></span><span>ETA <b id="eta"></b></span></div>
      <ol id="steps"></ol>
      <div class="actions">
        <button class="btn" id="refresh">Refresh</button>
        <button class="btn" id="notify" aria-pressed="false">Notify me</button>
        <button class="btn" id="dismiss">Dismiss</button>
      </div>
      <div class="note" id="note"></div>
    </div></div></div>
  </section>
  <button class="restore" id="restore">Show tracker</button>
</div>
<script>
const pkgs=[
 {name:"Mechanical keyboard",carrier:"UPS",num:"1Z84A9 0392",eta:"Today, 6 PM",
  steps:[["Label created","Nov 3, 9:12 AM"],["Picked up","Nov 3, 5:40 PM"],["Arrived at Oakland, CA hub","Nov 4, 2:05 AM"],["Out for delivery","Nov 5, 7:48 AM"],["Delivered",""]],cur:3},
 {name:"Linen duvet cover",carrier:"USPS",num:"9400 1118 9922",eta:"Nov 7",
  steps:[["Label created","Nov 4, 11:30 AM"],["Accepted at origin","Nov 4, 6:15 PM"],["In transit to Denver, CO","Nov 5, 4:20 AM"],["Out for delivery",""],["Delivered",""]],cur:2},
 {name:"Film camera lens",carrier:"FedEx",num:"7712 4408 3150",eta:"Nov 6",
  steps:[["Label created","Nov 2, 8:00 AM"],["Picked up","Nov 2, 3:10 PM"],["Departed Memphis, TN","Nov 4, 11:55 PM"],["Out for delivery",""],["Delivered",""]],cur:2}
];
const $=id=>document.getElementById(id);
let sel=0, notify={}, hidden=false;
const extra=[
 ["Out for delivery","Nov 5, 8:30 AM"],
];
function render(){
  const p=pkgs[sel], last=p.steps.length-1;
  const delivered=p.cur>=last;
  $("t1").textContent=p.name;
  $("t2").textContent=delivered?"Delivered":p.steps[p.cur][0]+" · ETA "+p.eta;
  $("carrier").textContent=p.carrier+" "+p.num;
  $("eta").textContent=delivered?"Done":p.eta;
  $("bar").style.width=Math.round((p.cur+1)/p.steps.length*100)+"%";
  $("steps").innerHTML=p.steps.map((s,i)=>
    `<li class="${i<p.cur||(delivered&&i<=p.cur)?"done":i===p.cur?"cur":""}"><div><span>${s[0]}</span><em>${s[1]}</em></div></li>`).join("");
  $("tabs").innerHTML=pkgs.map((q,i)=>`<button class="pkg" aria-pressed="${i===sel}" data-i="${i}">${q.carrier}</button>`).join("");
  const n=$("notify"); n.classList.toggle("on",!!notify[sel]); n.setAttribute("aria-pressed",!!notify[sel]);
  n.textContent=notify[sel]?"Notifying":"Notify me";
  $("refresh").disabled=delivered; $("refresh").style.opacity=delivered?.5:1;
}
$("head").onclick=()=>{
  const t=$("toast"), o=!t.classList.contains("open");
  t.classList.toggle("open",o); $("head").setAttribute("aria-expanded",o);
};
$("tabs").onclick=e=>{const b=e.target.closest(".pkg");if(!b)return;sel=+b.dataset.i;$("note").textContent="";render();};
$("refresh").onclick=()=>{
  const p=pkgs[sel], last=p.steps.length-1;
  if(p.cur>=last)return;
  p.cur++;
  const d=new Date();
  p.steps[p.cur][1]="Nov 5, "+d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  $("note").textContent=p.cur>=last?"Delivered. Enjoy!":"Updated: "+p.steps[p.cur][0];
  render();
};
$("notify").onclick=()=>{notify[sel]=!notify[sel];$("note").textContent=notify[sel]?"You'll be alerted on each update.":"Alerts off.";render();};
$("dismiss").onclick=()=>{$("toast").classList.add("dismissed");$("restore").classList.add("show");};
$("restore").onclick=()=>{$("toast").classList.remove("dismissed");$("restore").classList.remove("show");};
render();
</script>
</body>
</html>
