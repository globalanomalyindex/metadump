<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Package toast</title>
<style>
:root{
  --page:#141519; --pill:#1C1D22; --raise1:#22232A; --raise2:#2C2D36; --line:#34353f;
  --t1:#F2F3F5; --t2:#B9BDC7; --t3:#959BA6;
  --transit:#5AA3FF; --ofd:#F5A524; --done:#3DDC97; --exc:#F87171;
  --accent:var(--transit);
  --spring:cubic-bezier(.34,1.45,.5,1); --ease:cubic-bezier(.4,0,.2,1);
  --dur:360ms;
}
:root[data-theme="light-off"]{}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--page);color:var(--t1);font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.fake{padding:28px;max-width:560px;color:var(--t3)}
.fake h1{font-size:15px;color:var(--t2);font-weight:600;margin-bottom:14px}
.fake .row{height:10px;border-radius:5px;background:#1c1d22;margin:10px 0}
.fake .row:nth-child(3n){width:70%}.fake .row:nth-child(4n){width:45%}
.fake p{font-size:12px;margin-top:22px}
.fake kbd{background:var(--raise1);border:1px solid var(--line);border-radius:4px;padding:0 5px;font:11px ui-monospace,Menlo,monospace;color:var(--t2)}

/* the toast: one surface, pill header + folding body */
.toast{
  position:fixed; right:16px; bottom:16px; width:min(300px,calc(100vw - 32px));
  background:var(--pill); border:1px solid var(--line); border-radius:20px; overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
  transform-origin:bottom right;
  transition:background var(--dur) var(--ease), border-radius var(--dur) var(--ease), width var(--dur) var(--spring), transform var(--dur) var(--spring), opacity 200ms var(--ease);
}
.toast.enter{animation:in 420ms var(--spring) both}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
.toast.leaving{opacity:0;transform:translateY(10px) scale(.92);pointer-events:none}
.toast[data-open="false"]{width:min(236px,calc(100vw - 32px))}
.toast[data-open="true"]{background:var(--raise1);border-radius:14px}
.toast[hidden]{display:none}

.head{
  all:unset; box-sizing:border-box; display:flex; align-items:center; gap:9px; width:100%; height:36px; padding:0 10px 0 11px; cursor:pointer;
}
.head:focus-visible,.btn:focus-visible,.x:focus-visible{outline:2px solid var(--t1);outline-offset:-3px;border-radius:inherit}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.toast[data-state="transit"] .dot{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 6%,transparent)}}
.stage{font-weight:600;color:var(--t1);white-space:nowrap}
.eta{color:var(--t2);white-space:nowrap;margin-left:auto;font-variant-numeric:tabular-nums}
.chev{width:14px;height:14px;flex:none;color:var(--t3);transition:transform var(--dur) var(--spring)}
.toast[data-open="true"] .chev{transform:rotate(180deg)}

.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dur) var(--spring)}
.toast[data-open="true"] .body{grid-template-rows:1fr}
.inner{overflow:hidden;min-height:0}
.pad{padding:2px 12px 12px;opacity:0;transform:translateY(-4px);transition:opacity 200ms var(--ease),transform 280ms var(--ease)}
.toast[data-open="true"] .pad{opacity:1;transform:none;transition-delay:70ms}

.meta{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:8px 0 9px;border-top:1px solid var(--line);color:var(--t2);font-size:12px}
.meta b{color:var(--t1);font-weight:500;font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.01em}
.bar{display:flex;gap:3px;margin-bottom:10px}
.bar i{flex:1;height:3px;border-radius:2px;background:var(--raise2);transition:background 300ms}
.bar i.on{background:var(--accent)}

.tl{list-style:none;padding:0;max-height:132px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--raise2) transparent}
.tl li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:start;padding:4px 0;color:var(--t2);font-size:12.5px;position:relative}
.tl li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--raise2);border:1.5px solid var(--t3);margin-top:4px;justify-self:center;position:relative;z-index:1}
.tl li::after{content:"";position:absolute;left:5.5px;top:15px;bottom:-5px;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.now{color:var(--t1)}
.tl li.now::before{background:var(--accent);border-color:var(--accent)}
.tl li.bad::before{background:var(--exc);border-color:var(--exc)}
.tl li.bad{color:var(--exc)}
.tl .when{color:var(--t3);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tl .where{display:block;color:var(--t3);font-size:11.5px}
.tl li.new{animation:slide 380ms var(--spring) both}
@keyframes slide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

.acts{display:flex;gap:6px;margin-top:10px}
.btn{all:unset;box-sizing:border-box;flex:1;text-align:center;height:28px;line-height:28px;border-radius:8px;background:var(--raise2);color:var(--t1);font-size:12px;cursor:pointer;white-space:nowrap;transition:background 150ms,transform 120ms}
.btn:hover{background:#363744}.btn:active{transform:scale(.96)}
.btn.icon{flex:0 0 28px}
.btn svg{width:14px;height:14px;vertical-align:-2px}
.note{margin-top:8px;font-size:11.5px;color:var(--t2);min-height:15px}

/* state accents */
.toast[data-state="ofd"]{--accent:var(--ofd)}
.toast[data-state="done"]{--accent:var(--done)}
.toast[data-state="exc"]{--accent:var(--exc)}
.toast[data-state="load"]{--accent:var(--t3)}

/* demo controls (page, not widget) */
.demo{position:fixed;left:28px;bottom:20px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100vw - 340px)}
.demo button{all:unset;cursor:pointer;font-size:11.5px;color:var(--t2);background:var(--pill);border:1px solid var(--line);border-radius:7px;padding:4px 9px}
.demo button:hover{color:var(--t1)}
.demo button:focus-visible{outline:2px solid var(--t2)}
@media (max-width:620px){.demo{max-width:none;bottom:auto;top:12px;left:12px;right:12px}.fake{padding-top:56px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:1ms!important}}
</style>
</head>
<body>
<main class="fake">
  <h1>Orders</h1>
  <div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div>
  <p>Floating toast at bottom right. Click it or press <kbd>T</kbd> to open and close; <kbd>Esc</kbd> collapses.</p>
</main>

<div class="demo" role="group" aria-label="Demo controls">
  <button id="d-next">Next scan</button>
  <button id="d-exc">Trigger delay</button>
  <button id="d-reset">Reset</button>
</div>

<section class="toast enter" id="toast" data-open="false" data-state="transit" aria-label="Package tracking">
  <button class="head" id="head" aria-expanded="false" aria-controls="menu">
    <span class="dot" aria-hidden="true"></span>
    <span class="stage" id="stage">In transit</span>
    <span class="eta" id="eta">Thu, 4 pm</span>
    <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5l4 4 4-4"/></svg>
  </button>
  <div class="body" id="menu">
    <div class="inner"><div class="pad">
      <div class="meta"><span id="carrier">Parcelway Express</span><b id="num">PW 4821 0937 55</b></div>
      <div class="bar" id="bar" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <ol class="tl" id="tl" aria-label="Scan history, newest first"></ol>
      <div class="acts">
        <button class="btn" id="copy">Copy number</button>
        <button class="btn" id="open">Carrier page</button>
        <button class="btn icon" id="refresh" aria-label="Refresh status" title="Refresh"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v3h-3"/></svg></button>
        <button class="btn icon x" id="close" aria-label="Dismiss" title="Dismiss"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      </div>
      <div class="note" id="note"></div>
    </div></div>
  </div>
  <div class="sr" id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></div>
</section>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var toast=$('toast'),head=$('head'),tl=$('tl'),note=$('note');
  var STAGES=[
    {k:'transit',label:'Label created',stg:0},
    {k:'transit',label:'Picked up',stg:1},
    {k:'transit',label:'In transit',stg:1},
    {k:'ofd',label:'Out for delivery',stg:2},
    {k:'done',label:'Delivered',stg:3}
  ];
  var BASE=[
    {t:'Label created',w:'Portland, OR',when:'Mon 9:12 am'},
    {t:'Picked up',w:'Portland, OR',when:'Mon 5:40 pm'},
    {t:'Departed hub',w:'Salt Lake City, UT',when:'Tue 2:05 am'},
    {t:'Arrived at regional facility',w:'Denver, CO',when:'Wed 8:31 am'}
  ];
  var S;
  function fresh(){S={scans:BASE.slice(),stage:'In transit',kind:'transit',eta:'Thu, 4 pm',bar:1,exc:false,step:0,open:false,gone:false}}
  fresh();

  var future=[
    {t:'Departed regional facility',w:'Denver, CO',when:'Wed 11:50 pm',stage:'In transit',kind:'transit',eta:'Thu, 4 pm',bar:1},
    {t:'Out for delivery',w:'Boulder, CO',when:'Thu 7:48 am',stage:'Out for delivery',kind:'ofd',eta:'by 1 pm',bar:2},
    {t:'Delivered, front porch',w:'Boulder, CO',when:'Thu 12:26 pm',stage:'Delivered',kind:'done',eta:'12:26 pm',bar:3}
  ];

  function announce(m){var l=$('live');l.textContent='';setTimeout(function(){l.textContent=m},30)}
  function say(m){note.textContent=m;clearTimeout(say.t);say.t=setTimeout(function(){note.textContent=''},2600)}

  function render(newTop){
    toast.dataset.state=S.kind;
    $('stage').textContent=S.stage;
    $('eta').textContent=S.eta;
    head.setAttribute('aria-label',S.stage+', '+S.eta+'. '+(S.open?'Collapse':'Expand')+' tracking details');
    var bars=$('bar').children;
    for(var i=0;i<bars.length;i++)bars[i].classList.toggle('on',i<=S.bar);
    tl.innerHTML='';
    S.scans.slice().reverse().forEach(function(s,i){
      var li=document.createElement('li');
      if(i===0)li.className='now'+(S.exc?' bad':'')+(newTop?' new':'');
      li.innerHTML='<span></span><span>'+s.t+'<span class="where">'+s.w+'</span></span><span class="when">'+s.when+'</span>';
      tl.appendChild(li);
    });
    tl.scrollTop=0;
  }

  function setOpen(o){
    S.open=o;
    toast.dataset.open=o;
    head.setAttribute('aria-expanded',o);
    render(false);
  }
  head.addEventListener('click',function(){setOpen(!S.open)});

  function advance(){
    if(S.exc){S.exc=false}
    if(S.step>=future.length){say('Already delivered');return}
    var f=future[S.step++];
    S.scans.push({t:f.t,w:f.w,when:f.when});
    S.stage=f.stage;S.kind=f.kind;S.eta=f.eta;S.bar=f.bar;
    render(true);
    announce('Package update: '+f.stage+', '+f.t);
  }
  function delay(){
    if(S.kind==='done')return;
    S.exc=true;S.kind='exc';S.stage='Delay';S.eta='new ETA Fri';
    S.scans.push({t:'Weather delay, hub closed',w:'Denver, CO',when:'Thu 6:02 am'});
    render(true);
    announce('Package delayed. New estimate Friday. Use refresh or open the carrier page.');
    say('Delayed: refresh, or open the carrier page');
  }

  $('d-next').onclick=advance;
  $('d-exc').onclick=delay;
  $('d-reset').onclick=function(){
    fresh();toast.hidden=false;toast.classList.remove('leaving');toast.dataset.open='false';head.setAttribute('aria-expanded','false');
    toast.classList.remove('enter');void toast.offsetWidth;toast.classList.add('enter');render(false);announce('Tracking restored');
  };

  $('copy').onclick=function(){
    var n=$('num').textContent;
    var done=function(){say('Copied '+n);$('copy').textContent='Copied';setTimeout(function(){$('copy').textContent='Copy number'},1400);announce('Tracking number copied')};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(n).then(done,done)}
    else{try{var t=document.createElement('textarea');t.value=n;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}catch(e){}done()}
  };
  $('open').onclick=function(){say('Would open parcelway.example/track (offline demo)')};
  $('refresh').onclick=function(){
    var b=$('refresh');b.disabled=true;toast.dataset.state='load';$('stage').textContent='Checking';
    setTimeout(function(){
      b.disabled=false;
      if(S.exc){S.exc=false;S.kind='transit';S.stage='In transit';S.eta='Fri, 5 pm';S.scans.push({t:'Back on route',w:'Denver, CO',when:'Thu 9:14 am'});render(true);announce('Status refreshed: back in transit, arriving Friday');say('Back on route')}
      else{render(false);say('Up to date, '+S.stage.toLowerCase());announce('Status refreshed: '+S.stage)}
    },700);
  };
  $('close').onclick=function(){
    toast.classList.add('leaving');
    setTimeout(function(){toast.hidden=true;S.gone=true},220);
    announce('Tracking dismissed');
  };

  document.addEventListener('keydown',function(e){
    if(e.target.closest&&e.target.closest('input,textarea'))return;
    if(e.key==='Escape'&&S.open){setOpen(false);head.focus()}
    else if((e.key==='t'||e.key==='T')&&!e.metaKey&&!e.ctrlKey&&!toast.hidden){setOpen(!S.open)}
  });

  render(false);
  /* demo: a scan arrives a few seconds in, announced politely */
  setTimeout(function(){if(!S.gone&&S.step===0)advance()},6000);
})();
</script>
</body>
</html>
