<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veil Button - Lumen Retreat</title>
<style>
:root{
  --bg:#0e0b1a; --ink:#f1ecff; --muted:#b4abd3;
  --lilac:#c9b8ff; --rose:#ffc4e1; --mint:#b8f3e6; --sky:#a9d4ff;
  /* custom beziers: slow-in drift, soft overshoot bloom, long exhale */
  --drift:cubic-bezier(.19,.82,.27,1.04);
  --exhale:cubic-bezier(.08,.6,.2,1);
  --bloom:cubic-bezier(.34,1.56,.5,1);
  --ebb:cubic-bezier(.6,.02,.3,.98);
}
@media (prefers-color-scheme: light){
  :root{--bg:#f6f1ff;--ink:#241c44;--muted:#5e5585}
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;
  background:
    radial-gradient(60% 50% at 20% 10%, color-mix(in srgb,var(--lilac) 28%,transparent), transparent 70%),
    radial-gradient(50% 50% at 85% 90%, color-mix(in srgb,var(--sky) 24%,transparent), transparent 70%),
    var(--bg);
  color:var(--ink);font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
}
.card{max-width:520px;width:100%;text-align:center}
.eyebrow{font:600 12px/1 system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
h1{font-weight:400;font-size:clamp(32px,6vw,46px);line-height:1.1;margin:16px 0 14px;letter-spacing:-.01em}
p.lede{font:17px/1.6 system-ui,sans-serif;color:var(--muted);margin:0 auto 34px;max-width:42ch}
.meta{margin-top:22px;font:14px/1.5 system-ui,sans-serif;color:var(--muted);min-height:1.5em}
.meta b{color:var(--ink);font-weight:600}

.veil{
  --x:50%;--y:50%;
  position:relative;isolation:isolate;display:inline-flex;align-items:center;gap:12px;
  padding:18px 34px;border:0;border-radius:999px;cursor:pointer;
  font:600 16px/1 system-ui,sans-serif;letter-spacing:.02em;color:#2a1f55;
  background:linear-gradient(135deg,#f3ecff,#ffe9f4 55%,#e6fbf5);
  box-shadow:0 1px 0 #fff inset,0 10px 30px -12px rgba(150,120,255,.55),0 0 0 1px rgba(255,255,255,.5);
  transition:transform .9s var(--exhale),box-shadow 1.1s var(--exhale),letter-spacing .9s var(--exhale),color .6s var(--ebb);
  -webkit-tap-highlight-color:transparent;
}
/* drifting aura behind */
.veil::before{
  content:"";position:absolute;inset:-14px;border-radius:inherit;z-index:-1;
  background:conic-gradient(from 0deg,var(--lilac),var(--rose),var(--mint),var(--sky),var(--lilac));
  filter:blur(22px);opacity:0;transform:scale(.82);
  transition:opacity 1.2s var(--exhale),transform 1.4s var(--bloom);
  animation:spin 14s linear infinite;animation-play-state:paused;
}
/* light that follows the pointer */
.veil::after{
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;
  background:radial-gradient(120px circle at var(--x) var(--y),rgba(255,255,255,.95),rgba(255,255,255,0) 70%);
  opacity:0;transition:opacity .8s var(--ebb);
}
.veil .label{display:inline-block;transition:transform .9s var(--exhale),filter .9s var(--exhale)}
.veil .arrow{width:18px;height:18px;transition:transform 1s var(--bloom)}
.veil:hover,.veil:focus-visible{
  transform:translateY(-3px) scale(1.035);letter-spacing:.06em;
  box-shadow:0 1px 0 #fff inset,0 22px 50px -14px rgba(170,130,255,.7),0 0 0 1px rgba(255,255,255,.8);
}
.veil:hover::before,.veil:focus-visible::before{opacity:.75;transform:scale(1);animation-play-state:running}
.veil:hover::after,.veil:focus-visible::after{opacity:.8}
.veil:hover .arrow,.veil:focus-visible .arrow{transform:translateX(5px)}
.veil:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
.veil:active{transform:translateY(0) scale(.985);transition-duration:.25s;transition-timing-function:var(--ebb)}
.veil[data-state="loading"]{pointer-events:none}
.veil[data-state="loading"] .label{filter:blur(.6px);animation:breathe 1.6s var(--ebb) infinite}
.veil[data-state="done"]{background:linear-gradient(135deg,#e6fbf5,#f3ecff)}
.veil .ripple{
  position:absolute;border-radius:50%;pointer-events:none;z-index:-1;
  width:20px;height:20px;margin:-10px 0 0 -10px;
  background:radial-gradient(circle,rgba(255,255,255,.9),rgba(201,184,255,.35) 60%,transparent 70%);
  animation:ripple 1.4s var(--exhale) forwards;
}
@keyframes ripple{from{transform:scale(0);opacity:1}to{transform:scale(16);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}

@media (prefers-reduced-motion:reduce){
  .veil,.veil::before,.veil::after,.veil .label,.veil .arrow{transition-duration:.01s!important;animation:none!important}
  .veil:hover,.veil:focus-visible{transform:none;letter-spacing:.02em}
  .veil .ripple{display:none}
}
</style>
</head>
<body>
<main class="card">
  <div class="eyebrow">Lumen Retreat · Autumn sessions</div>
  <h1>Twelve quiet evenings of guided sound bathing</h1>
  <p class="lede">Small groups, warm light, and a gong that lingers. Seats are limited to 14 per evening.</p>
  <button class="veil" id="btn" type="button" aria-live="polite">
    <span class="label" id="label">Reserve a seat</span>
    <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
  <div class="meta" id="meta" role="status">Seats left: <b id="seats">14</b></div>
</main>
<script>
(function(){
  var btn=document.getElementById('btn'),label=document.getElementById('label'),
      seats=document.getElementById('seats'),meta=document.getElementById('meta');
  var left=14,reserved=false;

  btn.addEventListener('pointermove',function(e){
    var r=btn.getBoundingClientRect();
    btn.style.setProperty('--x',(e.clientX-r.left)+'px');
    btn.style.setProperty('--y',(e.clientY-r.top)+'px');
  });

  btn.addEventListener('click',function(e){
    var r=btn.getBoundingClientRect();
    var rp=document.createElement('span');rp.className='ripple';
    rp.style.left=(e.clientX?e.clientX-r.left:r.width/2)+'px';
    rp.style.top=(e.clientX?e.clientY-r.top:r.height/2)+'px';
    btn.appendChild(rp);setTimeout(function(){rp.remove()},1500);

    if(btn.dataset.state==='loading')return;
    if(reserved){ // undo
      reserved=false;left++;
      btn.dataset.state='';label.textContent='Reserve a seat';
      seats.textContent=left;meta.firstChild.textContent='Seats left: ';
      return;
    }
    btn.dataset.state='loading';label.textContent='Holding your seat…';
    setTimeout(function(){
      reserved=true;left--;
      btn.dataset.state='done';label.textContent='Seat held · tap to release';
      seats.textContent=left;
      meta.firstChild.textContent='Confirmation sent. Seats left: ';
    },1300);
  });
})();
</script>
</body>
</html>
