<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Package Tracker Toast</title>
<style>
:root{
  --bg:#0b0d10; --panel:#14171c; --panel2:#1b1f26; --line:#262b34;
  --text:#e8ebf0; --mute:#8b93a1; --accent:#5eead4; --warn:#fbbf24; --ok:#4ade80;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  background-image:radial-gradient(circle at 20% 10%,#151a22 0,transparent 50%);}
.page{padding:28px;color:var(--mute);max-width:520px}
.page h1{font-size:15px;color:var(--text);font-weight:600;margin-bottom:6px}
.page p{font-size:12px}
.toast{position:fixed;right:16px;bottom:16px;width:300px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.55);overflow:hidden;
  transition:width .2s ease}
.toast.min{width:228px}
.hd{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;background:none;border:0;color:inherit;
  cursor:pointer;text-align:left;font:inherit}
.hd:focus-visible,.btn:focus-visible,.step:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 0 var(--accent);animation:p 2s infinite}
.delivered .dot{background:var(--ok);animation:none}
@keyframes p{70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{display:block;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--mute);transition:transform .2s;flex:none}
.toast.open .chev{transform:rotate(180deg)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
.toast.open .body{grid-template-rows:1fr}
.inner{overflow:hidden;min-height:0}
.in{padding:2px 10px 10px;border-top:1px solid var(--line)}
.bar{height:3px;background:var(--panel2);border-radius:2px;margin:8px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-bottom:6px}
.meta strong{color:var(--text);font-weight:600}
.steps{list-style:none;padding:0}
.step{display:flex;gap:8px;align-items:center;width:100%;background:none;border:0;color:var(--mute);padding:3px 0;font:inherit;font-size:11.5px;cursor:pointer;text-align:left}
.step .n{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.step.done{color:var(--text)} .step.done .n{background:var(--accent);border-color:var(--accent)}
.step.cur .n{border-color:var(--accent);background:var(--panel)}
.step time{margin-left:auto;font-size:10.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.step:hover{color:var(--text)}
.detail{font-size:11px;color:var(--mute);background:var(--panel2);border-radius:6px;padding:5px 7px;margin:4px 0 2px}
.row{display:flex;gap:6px;margin-top:8px}
.btn{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 6px;font:inherit;font-size:11px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}
.live{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="page"><h1>Orders</h1><p>Your toast tracker sits bottom-right. Click the header to expand or collapse it, tap steps for details, and use the buttons to simulate progress.</p></div>

<aside class="toast open" id="toast" aria-label="Package tracking">
  <button class="hd" id="hd" aria-expanded="true" aria-controls="body">
    <span class="dot"></span>
    <span class="ttl"><b id="t1">Out for delivery</b><span id="t2">Arriving today by 6 PM</span></span>
    <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
  </button>
  <div class="body" id="body"><div class="inner"><div class="in">
    <div class="bar"><i id="bar"></i></div>
    <div class="meta"><span>UPS &middot; <strong>1Z84A9 4X03 7721</strong></span><span id="stops">3 stops away</span></div>
    <ul class="steps" id="steps"></ul>
    <div class="detail" id="detail" hidden></div>
    <div class="row">
      <button class="btn" id="adv">Advance</button>
      <button class="btn" id="bell" aria-pressed="true">Alerts on</button>
      <button class="btn" id="copy">Copy no.</button>
    </div>
  </div></div></div>
  <div class="live" aria-live="polite" id="live"></div>
</aside>

<script>
(function(){
  var S=[
    {l:"Label created",t:"Mon 9:12",d:"Shipper: Northwind Goods, Portland OR"},
    {l:"Picked up",t:"Mon 5:40",d:"Collected from Portland OR"},
    {l:"Arrived at hub",t:"Tue 2:05",d:"Sacramento CA sort facility"},
    {l:"Out for delivery",t:"Wed 7:48",d:"Driver route 14, 3 stops before you"},
    {l:"Delivered",t:"—",d:"Left at front door (pending)"}
  ];
  var sub=["Label created","Picked up","In transit","Arriving today by 6 PM","Delivered to front door"];
  var stopsTxt=["Not yet shipped","Awaiting pickup","In transit","3 stops away","Delivered"];
  var cur=3, alerts=true, openIdx=-1;
  var $=function(i){return document.getElementById(i)};
  var toast=$("toast"),hd=$("hd"),stepsEl=$("steps"),detail=$("detail");
  function render(){
    stepsEl.innerHTML="";
    S.forEach(function(s,i){
      var li=document.createElement("li"),b=document.createElement("button");
      b.className="step"+(i<cur||cur===S.length-1&&i===cur?" done":i===cur?" cur":"");
      b.innerHTML='<span class="n"></span><span></span><time></time>';
      b.children[1].textContent=s.l; b.children[2].textContent=i<=cur?s.t:"";
      b.onclick=function(){openIdx=openIdx===i?-1:i;render()};
      li.appendChild(b);stepsEl.appendChild(li);
    });
    if(openIdx>=0){detail.hidden=false;detail.textContent=S[openIdx].d}else detail.hidden=true;
    $("bar").style.width=(cur/(S.length-1)*100)+"%";
    $("t1").textContent=S[cur].l;
    $("t2").textContent=sub[cur];
    $("stops").textContent=stopsTxt[cur];
    toast.classList.toggle("delivered",cur===S.length-1);
    $("adv").textContent=cur===S.length-1?"Reset demo":"Advance";
    if(alerts)$("live").textContent="Package status: "+S[cur].l;
  }
  hd.onclick=function(){
    var o=toast.classList.toggle("open");
    toast.classList.toggle("min",!o);
    hd.setAttribute("aria-expanded",o);
  };
  $("adv").onclick=function(){
    if(cur===S.length-1){cur=0;S[4].t="—"}
    else{cur++; if(cur===4)S[4].t="Wed 4:31"}
    openIdx=-1;render();
  };
  $("bell").onclick=function(){
    alerts=!alerts;this.setAttribute("aria-pressed",alerts);
    this.textContent=alerts?"Alerts on":"Alerts off";
  };
  $("copy").onclick=function(){
    var n="1Z84A94X037721",b=this;
    function ok(){b.textContent="Copied";setTimeout(function(){b.textContent="Copy no."},1200)}
    try{navigator.clipboard.writeText(n).then(ok,ok)}catch(e){ok()}
  };
  toast.classList.remove("min");
  render();
})();
</script>
</body>
</html>
