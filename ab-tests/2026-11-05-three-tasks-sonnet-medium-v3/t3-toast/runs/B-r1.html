<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parcel toast</title>
<style>
:root{
  --base:#141519; --raised:#1f2027; --raised2:#272831; --line:#34353f;
  --text:#ecedf2; --muted:#a4a7b5;
  --transit:#7db8ff; --ofd:#ffc561; --done:#6ee7a0; --exc:#ff8c8c;
  --accent:var(--transit);
  --open-ms:300ms; --close-ms:180ms;
  --spring:cubic-bezier(.34,1.32,.5,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0b0c0f;color:var(--text);font:13px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  background-image:radial-gradient(circle at 20% 15%,#15171d 0,transparent 55%)}
.page{max-width:520px;padding:28px 20px;color:var(--muted)}
.page h1{font-size:15px;color:var(--text);margin:0 0 6px;font-weight:600}
.page p{margin:0 0 10px}
.page button{font:inherit}
.demo-bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.demo-bar button{background:var(--raised);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:32px;cursor:pointer}
.demo-bar button:hover{background:var(--raised2)}

/* toast */
.dock{position:fixed;right:16px;bottom:16px;width:min(320px,calc(100vw - 32px));display:flex;justify-content:flex-end;
  pointer-events:none}
.stack{position:relative;pointer-events:auto;transition:width var(--close-ms) ease-out,
  opacity 220ms ease-out,transform 220ms var(--spring);width:208px;max-width:100%}
.stack.open{width:100%;transition:width var(--open-ms) var(--spring),opacity 220ms,transform 220ms}
.stack.gone{opacity:0;transform:translateY(14px) scale(.96);pointer-events:none;transition:opacity 150ms ease-out,transform 150ms ease-out}
.stack.enter{opacity:0;transform:translateY(14px) scale(.96)}
.ghost{position:absolute;left:0;right:0;bottom:0;height:36px;border-radius:18px;background:var(--raised);
  border:1px solid var(--line);transform-origin:bottom center;
  transition:transform 400ms ease,opacity 200ms,height var(--close-ms)}
.ghost.g1{transform:translateY(-7px) scale(.95);z-index:-1}
.ghost.g2{transform:translateY(-14px) scale(.9);z-index:-2;opacity:.8}
.stack.open .ghost{opacity:0;transform:translateY(0) scale(.96);pointer-events:none}
.stack.one .ghost{display:none}
.stack.two .g2{display:none}

.surface{background:var(--base);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.55);transition:background var(--close-ms),border-radius var(--open-ms) var(--spring)}
.stack.open .surface{background:var(--raised);border-radius:14px}

.pill{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 6px 0 12px;border:0;background:none;color:inherit;
  font:inherit;text-align:left;cursor:pointer;border-radius:18px}
.pill:focus-visible,.btn:focus-visible,.chip:focus-visible,.x:focus-visible,.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.stage{font-weight:600;color:var(--accent);white-space:nowrap}
.eta{color:var(--muted);white-space:nowrap;margin-left:auto;font-variant-numeric:tabular-nums}
.count{flex:none;min-width:26px;height:24px;border-radius:12px;background:var(--raised2);color:var(--muted);display:grid;place-items:center;font-size:11px;font-variant-numeric:tabular-nums}
.chev{flex:none;width:12px;height:12px;color:var(--muted);transition:transform var(--close-ms) ease-out}
.stack.open .chev{transform:rotate(180deg)}

.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--close-ms) ease-out}
.stack.open .body{grid-template-rows:1fr;transition:grid-template-rows var(--open-ms) var(--spring)}
.inner{overflow:hidden;min-height:0}
.content{padding:2px 12px 12px;opacity:0;transform:translateY(-4px);transition:opacity 120ms ease-out,transform 120ms}
.stack.open .content{opacity:1;transform:none;transition:opacity 200ms 90ms ease-out,transform 200ms 90ms ease-out}

.meta{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.num{white-space:nowrap;font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);letter-spacing:.02em}
.carrier{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.x{margin-left:auto;width:28px;height:28px;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.x:hover{background:var(--raised2);color:var(--text)}

.chips{display:flex;gap:4px;margin-bottom:8px}
.chip{flex:1;min-height:28px;border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;font:inherit;font-size:12px;cursor:pointer;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:hover{background:var(--raised2)}
.chip[aria-selected=true]{background:var(--raised2);color:var(--text);border-color:#4a4b58}

.log{list-style:none;margin:0;padding:0;max-height:132px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.log li{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:start;padding:5px 0;position:relative}
.log li:not(:last-child)::before{content:"";position:absolute;left:7.5px;top:21px;bottom:-5px;width:1px;background:var(--line)}
.g{width:14px;height:14px;margin-top:1px;border-radius:50%;display:grid;place-items:center;font-size:9px;color:var(--base);font-weight:800}
.s-done .g{background:var(--done)}
.s-now .g{border:2px solid var(--accent);background:var(--base);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.s-next .g{border:1.5px dashed var(--muted);background:none}
.s-exc .g{background:var(--exc)}
.what{color:var(--text)}
.what small{display:block;color:var(--muted);font-size:12px}
.s-next .what{color:var(--muted)}
.when{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.s-now .when{color:var(--text)}

.actions{display:flex;gap:6px;flex-wrap:nowrap;align-items:center;margin-top:10px}
.btn{min-height:32px;padding:0 9px;border-radius:8px;border:1px solid var(--line);background:var(--raised2);color:var(--text);font:inherit;cursor:pointer;white-space:nowrap}
.btn:hover{background:#31323d}
.btn:active{transform:scale(.97)}
.btn.primary{background:color-mix(in srgb,var(--accent) 18%,var(--raised2));border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.sw{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;background:none;border:0;font:inherit;font-size:12px;cursor:pointer;min-height:32px;padding:0 2px}
.sw i{width:26px;height:16px;border-radius:8px;background:var(--line);position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--text);transition:transform .15s}
.sw[aria-checked=true] i{background:var(--accent)}
.sw[aria-checked=true] i::after{transform:translateX(10px);background:var(--base)}
.note:empty{display:none}.note{margin-top:6px;font-size:12px;color:var(--muted)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

[data-stage=exception]{--accent:var(--exc)}
[data-stage=ofd]{--accent:var(--ofd)}
[data-stage=delivered]{--accent:var(--done)}
[data-stage=transit]{--accent:var(--transit)}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
@media (max-width:360px){.dock{right:8px;bottom:8px}}
</style>
</head>
<body>
<main class="page">
  <h1>Orders</h1>
  <p>Your parcels are tracked in the toast at the bottom right. Tap it to open the scan timeline.</p>
  <div class="demo-bar">
    <button id="advance" type="button">Next scan (demo)</button>
    <button id="fail" type="button">Delivery exception (demo)</button>
    <button id="restore" type="button">Bring back toast</button>
  </div>
</main>

<div class="dock">
  <section class="stack enter three" id="stack" aria-label="Package tracking">
    <div class="ghost g1"></div><div class="ghost g2"></div>
    <div class="surface" id="surface" data-stage="transit">
      <button class="pill" id="pill" aria-expanded="false" aria-controls="body">
        <span class="dot"></span>
        <span class="stage" id="pStage">In transit</span>
        <span class="eta" id="pEta">Thu</span>
        <span class="count" id="pCount" title="Parcels">1/3</span>
        <svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5 6 4l3.5 3.5"/></svg>
      </button>
      <div class="body" id="body">
        <div class="inner"><div class="content" id="content">
          <div class="meta">
            <span class="num" id="num"></span><span class="carrier" id="carrier"></span>
            <button class="x" id="close" aria-label="Dismiss tracker"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
          </div>
          <div class="chips" role="tablist" aria-label="Parcels" id="chips"></div>
          <ol class="log" id="log" aria-label="Scan history"></ol>
          <div class="actions">
            <button class="btn primary" id="copy">Copy number</button>
            <button class="btn" id="carrierBtn">Carrier</button>
            <button class="sw" id="notify" role="switch" aria-checked="false"><i></i>Notify</button>
          </div>
          <div class="note" id="note"></div>
        </div></div>
      </div>
    </div>
    <div class="sr" aria-live="polite" id="live"></div>
  </section>
</div>

<script>
(function(){
  var STAGES={label:{w:"Label created",k:"transit"},pick:{w:"Picked up",k:"transit"},transit:{w:"In transit",k:"transit"},
    ofd:{w:"Out for delivery",k:"ofd"},done:{w:"Delivered",k:"delivered"},exc:{w:"Exception",k:"exception"}};
  var order=["label","pick","transit","ofd","done"];
  var parcels=[
    {name:"Headphones",num:"1Z84A9020355184471",carrier:"UPS Ground",eta:"Thu",stage:2,exc:false,notify:false,
     scans:[["Label created","Portland, OR","Mon 8:12 am"],["Picked up","Portland, OR","Mon 5:40 pm"],["Departed facility","Boise, ID","Tue 2:05 am"],["Arrived at hub","Salt Lake City, UT","Tue 11:48 am"]]},
    {name:"Desk lamp",num:"9400 1118 9922 3050 66",carrier:"USPS Priority",eta:"Today",stage:3,exc:false,notify:true,
     scans:[["Label created","Austin, TX","Sun 9:30 am"],["Picked up","Austin, TX","Sun 4:10 pm"],["Departed facility","Dallas, TX","Mon 1:22 am"],["Arrived at local post office","Denver, CO","Wed 6:02 am"],["Out for delivery","Denver, CO","Wed 8:15 am"]]},
    {name:"Ceramic mug",num:"JD01 4600 2381 77",carrier:"DHL Express",eta:"Fri",stage:1,exc:false,notify:false,
     scans:[["Label created","Leipzig, DE","Tue 10:00 am"],["Picked up","Leipzig, DE","Tue 6:25 pm"]]}
  ];
  var cur=0,open=false,gone=false;
  var $=function(i){return document.getElementById(i)};
  var stack=$("stack"),pill=$("pill"),surface=$("surface"),log=$("log"),chips=$("chips"),note=$("note"),live=$("live");
  var tNote;

  function stageOf(p){return p.exc?STAGES.exc:STAGES[order[p.stage]]}
  function say(t){live.textContent="";setTimeout(function(){live.textContent=t},30)}
  function msg(t){note.textContent=t;clearTimeout(tNote);tNote=setTimeout(function(){note.textContent=""},2600)}

  function renderChips(){
    chips.innerHTML="";
    parcels.forEach(function(p,i){
      var b=document.createElement("button");b.className="chip";b.type="button";b.setAttribute("role","tab");
      b.setAttribute("aria-selected",i===cur);b.textContent=p.name;
      b.onclick=function(){cur=i;render();};
      chips.appendChild(b);
    });
  }
  function render(){
    var p=parcels[cur],st=stageOf(p);
    surface.dataset.stage=st.k;
    $("pStage").textContent=st.w;
    $("pEta").textContent=p.exc?"Action needed":(p.stage===4?"Done":"ETA "+p.eta);
    $("pCount").textContent=(cur+1)+"/"+parcels.length;
    $("num").textContent=p.num;$("carrier").textContent=p.carrier;
    $("notify").setAttribute("aria-checked",p.notify);
    renderChips();
    log.innerHTML="";
    var rows=[];
    p.scans.forEach(function(s,i){rows.push({w:s[0],l:s[1],t:s[2],c:"s-done",g:"✓"})});
    var last=rows[rows.length-1];
    if(p.exc){rows.push({w:"Delivery exception",l:"Recipient unavailable",t:"Now",c:"s-exc",g:"!"});}
    else if(p.stage===4){rows.push({w:"Delivered",l:"Front door",t:"Now",c:"s-done",g:"✓"});}
    else{last.c="s-now";last.g="";last.t="Now";}
    if(!p.exc&&p.stage<4){rows.push({w:p.stage<3?"Out for delivery":"Delivered",l:"",t:"Expected "+p.eta,c:"s-next",g:""});}
    if(p.exc){rows.push({w:"Delivered",l:"",t:"Expected "+p.eta,c:"s-next",g:""});}
    rows.reverse().forEach(function(r){
      var li=document.createElement("li");li.className=r.c;
      if(r.c==="s-now")li.setAttribute("aria-current","step");
      li.innerHTML='<span class="g">'+r.g+'</span><span class="what"></span><span class="when"></span>';
      var w=li.querySelector(".what");w.textContent=r.w;
      if(r.l){var s=document.createElement("small");s.textContent=r.l;w.appendChild(s)}
      li.querySelector(".when").textContent=r.t;
      log.appendChild(li);
    });
    var n=parcels.length;stack.classList.toggle("one",n===1);stack.classList.toggle("two",n===2);stack.classList.toggle("three",n>=3);
    $("fail").textContent=p.exc?"Reschedule delivery (demo)":"Delivery exception (demo)";
  }
  function setOpen(v){
    open=v;stack.classList.toggle("open",v);pill.setAttribute("aria-expanded",v);
    if(!v)pill.focus({preventScroll:true});
  }
  pill.onclick=function(){setOpen(!open)};
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&open)setOpen(false)});
  function dismiss(){
    open=false;stack.classList.remove("open");pill.setAttribute("aria-expanded","false");
    stack.classList.add("gone");gone=true;say("Tracker dismissed");
  }
  function show(){
    gone=false;stack.classList.remove("gone");stack.classList.add("enter");
    requestAnimationFrame(function(){requestAnimationFrame(function(){stack.classList.remove("enter")})});
  }
  $("close").onclick=dismiss;
  $("restore").onclick=function(){if(gone)show()};

  $("copy").onclick=function(){
    var t=parcels[cur].num.replace(/\s/g,""),b=$("copy");
    function ok(){b.textContent="Copied";msg("Number copied: "+t);setTimeout(function(){b.textContent="Copy number"},1600)}
    try{navigator.clipboard.writeText(t).then(ok,function(){fb()})}catch(e){fb()}
    function fb(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();ok()}
  };
  $("carrierBtn").onclick=function(){msg("Would open "+parcels[cur].carrier+" tracking (demo, offline).")};
  $("notify").onclick=function(){
    var p=parcels[cur];p.notify=!p.notify;$("notify").setAttribute("aria-checked",p.notify);
    msg(p.notify?"You will be notified of new scans.":"Notifications off.");
  };

  function advance(){
    var p=parcels[cur];
    if(p.exc||p.stage>=4){msg("No further scans.");return}
    p.stage++;var s=STAGES[order[p.stage]].w;
    var loc=["Reno, NV","Denver, CO","Omaha, NE","Local depot"][p.stage-1]||"Local depot";
    p.scans.push([s,loc,"Just now"]);
    if(p.stage===3)p.eta="Today";
    render();say(p.name+": "+s+(p.stage<4?", arriving "+p.eta:""));
    if(!gone&&!open){surface.animate([{transform:"scale(1)"},{transform:"scale(1.04)"},{transform:"scale(1)"}],{duration:300,easing:"ease-out"})}
    if(gone)show();
  }
  $("advance").onclick=advance;
  $("fail").onclick=function(){
    var p=parcels[cur];
    if(!p.exc){p.exc=true;render();say(p.name+": delivery exception, action needed");if(gone)show();}
    else{p.exc=false;p.eta="Tomorrow";p.stage=3;p.scans.push(["Redelivery scheduled","Local depot","Just now"]);render();say(p.name+": rescheduled, arriving tomorrow");}
  };

  render();
  setTimeout(function(){stack.classList.remove("enter")},60);
})();
</script>
</body>
</html>
