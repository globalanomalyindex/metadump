<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halcyon Sleep – Ethereal Button</title>
<style>
:root{
  --bg:#0d0f1f; --ink:#eef0ff; --muted:#9aa0c8;
  --a:#b9a4ff; --b:#8fd3ff; --c:#ffc6e6;
  /* custom curves */
  --drift:cubic-bezier(.16,.84,.24,1);        /* long soft landing */
  --bloom:cubic-bezier(.34,1.38,.5,1);         /* gentle overshoot */
  --exhale:cubic-bezier(.6,.02,.2,.98);        /* slow release */
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; background:radial-gradient(120% 90% at 20% 0%,#1b1a3d 0%,var(--bg) 55%,#07080f 100%);
  color:var(--ink); font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; align-items:center; justify-content:center; padding:48px 20px;
}
main{max-width:560px; width:100%; text-align:center}
.eyebrow{letter-spacing:.22em; text-transform:uppercase; font-size:12px; color:var(--muted)}
h1{font:400 clamp(32px,6vw,48px)/1.12 ui-serif,Georgia,"Times New Roman",serif; margin:14px 0 16px}
h1 em{font-style:italic; color:var(--a)}
p.lead{color:var(--muted); margin:0 auto 32px; max-width:46ch}

.plans{display:flex; gap:10px; justify-content:center; margin-bottom:34px; flex-wrap:wrap}
.plan{
  appearance:none; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.04);
  color:var(--muted); padding:9px 18px; border-radius:99px; font:inherit; font-size:14px; cursor:pointer;
  transition:color .5s var(--drift), border-color .5s var(--drift), background .5s var(--drift), transform .6s var(--bloom);
}
.plan:hover{color:var(--ink); transform:translateY(-2px)}
.plan[aria-pressed="true"]{color:var(--ink); border-color:rgba(185,164,255,.7); background:rgba(185,164,255,.14)}
.plan:focus-visible,.ether:focus-visible{outline:2px solid var(--b); outline-offset:5px}

/* ---------- the button ---------- */
.ether-wrap{position:relative; display:inline-block; isolation:isolate}
.ether{
  --mx:50%; --my:50%; --glow:0;
  position:relative; appearance:none; border:0; cursor:pointer; color:#fff;
  font:500 17px/1 inherit; font-family:inherit; letter-spacing:.04em;
  padding:20px 44px; min-width:260px; border-radius:999px; overflow:hidden;
  background:linear-gradient(135deg,#5a4bd6,#7b66f0 45%,#4f8fe0);
  box-shadow:0 10px 30px -12px rgba(123,102,240,.55), inset 0 1px 0 rgba(255,255,255,.28);
  transform:translateY(0) scale(1);
  transition:
    transform .9s var(--drift),
    box-shadow 1.1s var(--drift),
    letter-spacing 1s var(--drift),
    filter 1s var(--exhale);
  -webkit-tap-highlight-color:transparent;
}
/* drifting aurora layer */
.ether::before{
  content:""; position:absolute; inset:-60%; z-index:0;
  background:
    radial-gradient(40% 40% at 30% 40%, var(--c) 0%, transparent 70%),
    radial-gradient(45% 45% at 70% 60%, var(--b) 0%, transparent 70%),
    radial-gradient(40% 40% at 50% 30%, var(--a) 0%, transparent 70%);
  filter:blur(22px); opacity:0; transform:translate3d(-8%,6%,0) rotate(0deg) scale(.8);
  transition:opacity 1.2s var(--exhale), transform 2.2s var(--drift);
}
/* cursor-following light */
.ether::after{
  content:""; position:absolute; inset:0; z-index:1; border-radius:inherit; pointer-events:none;
  background:radial-gradient(160px circle at var(--mx) var(--my), rgba(255,255,255,.55), rgba(255,255,255,0) 65%);
  opacity:0; transition:opacity .8s var(--drift);
  mix-blend-mode:soft-light;
}
.ether > .label{position:relative; z-index:2; display:inline-flex; align-items:center; gap:10px;
  transition:transform .9s var(--drift), opacity .5s var(--drift), filter .9s var(--drift)}
.ether .arrow{display:inline-block; transform:translateX(-6px); opacity:0;
  transition:transform .9s var(--bloom), opacity .7s var(--drift)}

/* outer halo, outside the clip */
.halo{
  position:absolute; inset:-14px; z-index:-1; border-radius:999px; pointer-events:none;
  background:conic-gradient(from 0deg, var(--a), var(--b), var(--c), var(--a));
  filter:blur(26px); opacity:0; transform:scale(.88);
  transition:opacity 1.2s var(--exhale), transform 1.4s var(--drift);
}

@media (hover:hover){
  .ether:hover{
    transform:translateY(-3px) scale(1.025);
    letter-spacing:.075em;
    box-shadow:0 22px 50px -14px rgba(143,211,255,.55), 0 0 0 1px rgba(255,255,255,.18), inset 0 1px 0 rgba(255,255,255,.4);
    filter:saturate(1.15) brightness(1.05);
  }
  .ether:hover::before{opacity:.75; transform:translate3d(6%,-4%,0) rotate(40deg) scale(1.05); animation:float 7s ease-in-out 1.2s infinite alternate}
  .ether:hover::after{opacity:1}
  .ether:hover .arrow{transform:translateX(0); opacity:1}
  .ether-wrap:hover .halo{opacity:.55; transform:scale(1); animation:spin 14s linear infinite}
}
.ether:active{transform:translateY(0) scale(.985); transition-duration:.35s}
.ether:focus-visible::before{opacity:.6}

@keyframes float{
  from{transform:translate3d(6%,-4%,0) rotate(40deg) scale(1.05)}
  to{transform:translate3d(-6%,5%,0) rotate(120deg) scale(1.15)}
}
@keyframes spin{to{transform:rotate(360deg) scale(1)}}

/* states */
.ether[data-state="loading"]{cursor:progress}
.ether[data-state="loading"] .label{opacity:.8}
.ether .dots{display:none; gap:5px}
.ether[data-state="loading"] .dots{display:inline-flex}
.ether[data-state="loading"] .arrow, .ether[data-state="done"] .arrow{display:none}
.dots i{width:6px;height:6px;border-radius:50%;background:#fff;animation:breathe 1.4s var(--exhale) infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes breathe{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
.ether[data-state="done"]{background:linear-gradient(135deg,#2f9d8f,#4fb8c9 50%,#6aa4ee)}

.status{margin-top:26px; min-height:3.2em; color:var(--muted); font-size:14px}
.status strong{color:var(--ink); font-weight:600}
.count{margin-top:34px; font-size:13px; color:var(--muted)}
.count b{color:var(--ink); font-variant-numeric:tabular-nums}
.undo{background:none;border:0;color:var(--b);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0 2px}
.undo:focus-visible{outline:2px solid var(--b); outline-offset:3px}

@media (prefers-reduced-motion:reduce){
  .ether,.ether::before,.ether::after,.halo,.ether .arrow,.ether .label,.plan{transition-duration:.01ms !important}
  .ether::before,.halo,.dots i{animation:none !important}
}
@media (hover:none){ .ether .arrow{opacity:1; transform:none} }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Halcyon Sleep</div>
  <h1>Fall asleep inside a <em>softer</em> night</h1>
  <p class="lead">Guided soundscapes, a gentle wind-down routine and a wake-up light that arrives like dawn. Pick a plan and reserve your place in the March cohort.</p>

  <div class="plans" role="group" aria-label="Plan">
    <button class="plan" type="button" data-plan="Monthly" data-price="$9 / month" aria-pressed="false">Monthly &middot; $9</button>
    <button class="plan" type="button" data-plan="Yearly" data-price="$72 / year" aria-pressed="true">Yearly &middot; $72</button>
  </div>

  <div class="ether-wrap">
    <span class="halo" aria-hidden="true"></span>
    <button class="ether" id="cta" type="button" data-state="idle">
      <span class="label">
        <span class="text">Reserve my place</span>
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="arrow" aria-hidden="true">&rarr;</span>
      </span>
    </button>
  </div>

  <div class="status" id="status" role="status" aria-live="polite">Yearly plan selected &mdash; 14-day free trial, cancel anytime.</div>
  <div class="count"><b id="seats">38</b> of 250 places left in this cohort</div>
</main>

<script>
(function(){
  var btn=document.getElementById('cta'),
      text=btn.querySelector('.text'),
      status=document.getElementById('status'),
      seatsEl=document.getElementById('seats'),
      plans=[].slice.call(document.querySelectorAll('.plan')),
      state={plan:'Yearly',price:'$72 / year',seats:38,phase:'idle',timer:null};

  function setPhase(p){state.phase=p;btn.dataset.state=p;btn.setAttribute('aria-busy',p==='loading')}
  function render(){
    seatsEl.textContent=state.seats;
    if(state.phase==='idle'){
      text.textContent='Reserve my place';
      status.textContent=state.plan+' plan selected — 14-day free trial, cancel anytime.';
    }
  }

  plans.forEach(function(p){
    p.addEventListener('click',function(){
      if(state.phase!=='idle')return;
      plans.forEach(function(o){o.setAttribute('aria-pressed',o===p)});
      state.plan=p.dataset.plan;state.price=p.dataset.price;render();
    });
  });

  btn.addEventListener('pointermove',function(e){
    var r=btn.getBoundingClientRect();
    btn.style.setProperty('--mx',(e.clientX-r.left)+'px');
    btn.style.setProperty('--my',(e.clientY-r.top)+'px');
  });

  function reset(){
    clearTimeout(state.timer);
    if(state.phase==='done')state.seats++;
    setPhase('idle');render();
  }

  btn.addEventListener('click',function(){
    if(state.phase==='loading')return;
    if(state.phase==='done'){return;}
    setPhase('loading');
    text.textContent='Saving your place';
    status.textContent='One moment…';
    state.timer=setTimeout(function(){
      state.seats--;
      setPhase('done');
      text.textContent='Place reserved ✓';
      seatsEl.textContent=state.seats;
      status.innerHTML='<strong>You’re in.</strong> '+state.plan+' plan ('+state.price+'), trial starts March 3. <button class="undo" type="button">Undo</button>';
      status.querySelector('.undo').addEventListener('click',reset);
    },1600);
  });
})();
</script>
</body>
</html>
