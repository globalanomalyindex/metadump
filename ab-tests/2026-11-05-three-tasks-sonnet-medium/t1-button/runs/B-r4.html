<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halo button - Lumen</title>
<style>
  :root {
    --bg: #0c0a22;
    --ink: #f4f1ff;
    --ink-soft: #c9c3ea;
    --face: #2b2470;
    --face-hi: #3a3191;
    --edge: rgba(190, 180, 255, .6);
    --glow-a: #8f7bff;
    --glow-b: #5fd0ff;
    --ring: #ffffff;

    /* custom curves: a quick landing for the face, longer tails for the light */
    --land:  cubic-bezier(0.33, 1, 0.68, 1);      /* face: fast, soft stop */
    --tail:  cubic-bezier(0.22, 1, 0.36, 1);      /* glow in: steep, very long landing */
    --drift: cubic-bezier(0.45, 0, 0.55, 1);      /* glow out: symmetric, unhurried */
    --sheen: cubic-bezier(0.16, 0.84, 0.3, 1);    /* light band sweep */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(60vmax 40vmax at 15% 10%, rgba(120, 90, 255, .35), transparent 60%),
      radial-gradient(50vmax 40vmax at 90% 80%, rgba(60, 190, 255, .22), transparent 60%),
      var(--bg);
    color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  .card {
    width: min(100%, 520px);
    padding: 36px 32px 28px;
    border-radius: 24px;
    background: rgba(22, 18, 58, .6);
    border: 1px solid rgba(190, 180, 255, .18);
  }
  .eyebrow { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 10px; }
  h1 { font-size: clamp(26px, 5vw, 34px); line-height: 1.15; margin: 0 0 12px; font-weight: 650; }
  p.lede { margin: 0 0 24px; color: var(--ink-soft); }
  .row { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; }
  .status { margin: 18px 0 0; min-height: 1.6em; color: var(--ink-soft); font-size: 14px; }
  .status strong { color: var(--ink); font-variant-numeric: tabular-nums; }
  .undo { background: none; border: 0; color: var(--ink); text-decoration: underline; font: inherit; cursor: pointer; padding: 4px 2px; margin-left: 6px; }
  .undo:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; border-radius: 4px; }

  /* ---------- the button ---------- */
  .halo {
    --gx: 0px; --gy: 0px;
    position: relative;
    isolation: isolate;
    display: inline-flex;
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    color: var(--ink);
    cursor: pointer;
    border-radius: 999px;
    min-height: 48px;
    -webkit-tap-highlight-color: transparent;
    transform: translate3d(0, 0, 0);
    transition: transform 360ms var(--drift);        /* release back to rest */
  }
  .halo .glow {                                       /* blurred once; only opacity + transform change */
    position: absolute;
    inset: -10px -14px;
    z-index: -1;
    border-radius: 999px;
    background:
      radial-gradient(60% 120% at 30% 50%, var(--glow-a), transparent 70%),
      radial-gradient(50% 110% at 75% 50%, var(--glow-b), transparent 70%);
    filter: blur(16px);
    opacity: 0;
    transform: translate3d(var(--gx), var(--gy), 0) scale(.94);
    transition: opacity 480ms var(--drift), transform 700ms var(--drift);
    pointer-events: none;
  }
  .halo .face {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    overflow: hidden;
    padding: 12px 28px;
    min-width: 11.5rem;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--face-hi), var(--face));
    border: 1px solid var(--edge);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22);
    font-weight: 600;
    letter-spacing: .01em;
  }
  .halo .face::after {                                /* a band of light that sweeps across */
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 55%;
    background: linear-gradient(100deg, transparent 0%, rgba(255, 255, 255, .22) 50%, transparent 100%);
    transform: translate3d(-130%, 0, 0) skewX(-14deg);
    opacity: 0;
    transition: transform 520ms var(--drift), opacity 300ms var(--drift);
    pointer-events: none;
  }
  .halo .label { position: relative; white-space: nowrap; }
  .halo .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: none; }

  /* hover (only where hover exists, so touch devices never get a stuck state) */
  @media (hover: hover) {
    .halo:not(:disabled):hover {
      transform: translate3d(0, -3px, 0);
      transition: transform 240ms var(--land);
    }
    .halo:not(:disabled):hover .glow {
      opacity: .85;
      transform: translate3d(var(--gx), var(--gy), 0) scale(1.04);
      transition: opacity 700ms var(--tail), transform 900ms var(--tail);
    }
    .halo:not(:disabled):hover .face::after {
      opacity: 1;
      transform: translate3d(240%, 0, 0) skewX(-14deg);
      transition: transform 900ms var(--sheen), opacity 200ms var(--land);
    }
  }

  /* keyboard: same motion, quieter (about half the lift, no sheen travel) */
  .halo:focus-visible { outline: none; transform: translate3d(0, -1.5px, 0); transition: transform 240ms var(--land); }
  .halo:focus-visible .face { box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 0 0 3px var(--bg), 0 0 0 5px var(--ring); }
  .halo:focus-visible .glow { opacity: .55; transform: translate3d(0, 0, 0) scale(1); transition: opacity 600ms var(--tail), transform 700ms var(--tail); }

  /* press: answers at once, no overshoot (also covers touch) */
  .halo:not(:disabled):active { transform: translate3d(0, 0, 0) scale(.975); transition: transform 90ms var(--land); }
  .halo:not(:disabled):active .glow { opacity: 1; transition: opacity 120ms var(--land); }

  /* busy + done */
  .halo[aria-busy="true"] { cursor: progress; }
  .halo[aria-busy="true"] .dot { display: inline-block; animation: breathe 1.1s var(--drift) 3; }  /* bounded loop */
  .halo[data-state="done"] { --face: #14584f; --face-hi: #1d7366; --glow-a: #5fe3c0; --glow-b: #9bf0ff; --edge: rgba(160, 255, 230, .65); }

  /* secondary + disabled */
  .halo.quiet .face { background: rgba(255, 255, 255, .06); box-shadow: none; min-width: 0; }
  .halo:disabled { cursor: not-allowed; }
  .halo:disabled .face { opacity: .55; }
  .halo:disabled .glow { display: none; }

  @keyframes breathe { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }

  /* reduced motion: keep a gentle opacity/colour response, drop travel, sweep and loops */
  @media (prefers-reduced-motion: reduce) {
    .halo, .halo:hover, .halo:focus-visible, .halo:active { transform: none !important; }
    .halo .glow { transform: none !important; transition: opacity 200ms linear !important; }
    .halo .face::after { display: none; }
    .halo[aria-busy="true"] .dot { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Lumen Notes &middot; early access</p>
    <h1>A quieter way to keep your reading list</h1>
    <p class="lede">Lumen saves articles, highlights and voice memos in one calm place. The first 500 readers get a year of Pro free.</p>

    <div class="row">
      <button class="halo" id="reserve" type="button" data-state="idle" aria-describedby="status">
        <span class="glow" aria-hidden="true"></span>
        <span class="face"><span class="dot" aria-hidden="true"></span><span class="label">Reserve my place</span></span>
      </button>
      <button class="halo quiet" id="tour" type="button">
        <span class="glow" aria-hidden="true"></span>
        <span class="face"><span class="label">Take the tour</span></span>
      </button>
      <button class="halo quiet" type="button" disabled>
        <span class="glow" aria-hidden="true"></span>
        <span class="face"><span class="label">Sold out</span></span>
      </button>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"><strong id="left">412</strong> of 500 places left</p>
  </main>

<script>
(function () {
  var reserve = document.getElementById('reserve');
  var label = reserve.querySelector('.label');
  var status = document.getElementById('status');
  var left = 412;
  var timer = null;

  function render(text) { status.innerHTML = text; }
  function counter() { return '<strong id="left">' + left + '</strong> of 500 places left'; }

  // the glow drifts a few px toward the pointer; its long transition is the "tail"
  document.querySelectorAll('.halo').forEach(function (b) {
    b.addEventListener('pointermove', function (e) {
      if (e.pointerType === 'touch') return;
      var r = b.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width - .5;
      var y = (e.clientY - r.top) / r.height - .5;
      b.style.setProperty('--gx', (x * 14).toFixed(1) + 'px');
      b.style.setProperty('--gy', (y * 6).toFixed(1) + 'px');
    });
    b.addEventListener('pointerleave', function () {
      b.style.setProperty('--gx', '0px'); b.style.setProperty('--gy', '0px');
    });
  });

  reserve.addEventListener('click', function () {
    var state = reserve.dataset.state;
    if (state === 'busy') return;
    if (state === 'done') { return; }
    reserve.dataset.state = 'busy';
    reserve.setAttribute('aria-busy', 'true');
    label.textContent = 'Saving your place';
    timer = setTimeout(function () {
      left -= 1;
      reserve.removeAttribute('aria-busy');
      reserve.dataset.state = 'done';
      label.textContent = 'You’re on the list';
      render(counter() + ' <button class="undo" type="button" id="undo">Undo</button>');
      document.getElementById('undo').addEventListener('click', undo);
    }, 1100);
  });

  function undo() {
    left += 1;
    reserve.dataset.state = 'idle';
    label.textContent = 'Reserve my place';
    render(counter());
    reserve.focus();
  }

  document.getElementById('tour').addEventListener('click', function () {
    var t = this.querySelector('.label');
    var on = t.textContent === 'Take the tour';
    t.textContent = on ? 'Tour started (3 min)' : 'Take the tour';
  });
})();
</script>
</body>
</html>
