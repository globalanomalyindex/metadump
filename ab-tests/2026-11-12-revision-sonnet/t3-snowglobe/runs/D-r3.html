<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snow Globe</title>
<style>
:root{
  --bg0:#0b1730; --bg1:#16294f; --ink:#e8f1ff; --muted:#9db4d8; --line:#2c4375;
  --panel:#12214227; --accent:#bfe0ff; --accent-ink:#0b1730;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; color:var(--ink);
  font:16px/1.45 Georgia,"Iowan Old Style","Palatino Linotype",serif;
  background:radial-gradient(120% 90% at 50% 25%,var(--bg1) 0%,var(--bg0) 70%) fixed;
}
main{
  max-width:1060px; margin:0 auto; padding:20px 16px 28px;
  display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:24px; align-items:center;
}
h1{margin:0 0 2px;font-weight:400;font-size:1.5rem;letter-spacing:.04em}
.sub{margin:0;color:var(--muted);font-size:.9rem}
.stage{display:flex;justify-content:center}
canvas{
  width:min(100%,520px); aspect-ratio:520/600; height:auto; display:block;
  touch-action:none; cursor:grab; border-radius:18px; outline-offset:4px;
}
canvas.drag{cursor:grabbing}
canvas:focus-visible{outline:3px solid var(--accent)}
aside{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button,select{
  font:inherit; color:var(--ink); background:#1b315f; border:1px solid var(--line);
  border-radius:10px; padding:10px 16px; min-height:44px; cursor:pointer;
}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;flex:1}
button:hover{filter:brightness(1.15)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:#2d5190;border-color:var(--accent)}
fieldset{border:1px solid var(--line);border-radius:12px;margin:0;padding:10px 12px 12px}
legend{padding:0 6px;color:var(--muted);font-size:.85rem}
label{display:block;font-size:.9rem;color:var(--muted)}
label b{color:var(--ink);font-weight:400;float:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:6px 0 10px;accent-color:var(--accent);min-height:28px}
.scenes{display:flex;gap:8px}
.scenes button{flex:1;padding:8px 6px}
.status{
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#0d1b3a;
  font-variant-numeric:tabular-nums;
}
.status strong{display:block;font-size:1.05rem;font-weight:400;margin-bottom:6px}
.bar{height:6px;border-radius:3px;background:#1d2f5a;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fb6ff,#fff)}
.small{font-size:.8rem;color:var(--muted);margin:8px 0 0}
@media (max-width:820px){
  main{grid-template-columns:1fr;gap:14px;padding-top:14px}
  .head{text-align:center}
}
@media (prefers-reduced-motion:reduce){ button{transition:none} }
</style>
</head>
<body>
<main>
  <div class="stage">
    <canvas id="globe" width="520" height="600" tabindex="0" role="button"
      aria-label="Snow globe. Press Space or Enter to shake it, arrow keys to tilt it, or drag it with the pointer."></canvas>
  </div>
  <aside>
    <div class="head">
      <h1>Winter Hollow</h1>
      <p class="sub">Drag the globe, or shake it, then watch it settle.</p>
    </div>
    <div class="row">
      <button class="primary" id="shake" type="button">Shake</button>
      <button id="tilt" type="button">Slow tilt</button>
    </div>
    <div class="status" aria-live="polite">
      <strong id="state">Settled</strong>
      <div class="bar" aria-hidden="true"><i id="haze"></i></div>
      <p class="small" id="detail">0 of 0 flakes afloat</p>
    </div>
    <fieldset>
      <legend>Inside</legend>
      <div class="scenes" role="group" aria-label="Scene">
        <button type="button" data-scene="cabin" aria-pressed="true">Cabin</button>
        <button type="button" data-scene="snowman" aria-pressed="false">Snowman</button>
        <button type="button" data-scene="pines" aria-pressed="false">Pines</button>
      </div>
    </fieldset>
    <fieldset>
      <legend>Glitter and liquid</legend>
      <label for="count">Flakes <b id="countV">500</b></label>
      <input id="count" type="range" min="100" max="1000" step="50" value="500">
      <label for="visc">Liquid <b id="viscV">light glycerin</b></label>
      <input id="visc" type="range" min="0.6" max="2.4" step="0.1" value="1.2">
    </fieldset>
  </aside>
</main>

<script>
(function(){
"use strict";
var W=520,H=600, CX=260, CY=250, R=200, FLOOR=418;
var cv=document.getElementById('globe'), ctx=cv.getContext('2d');
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var motionK=reduce?0.5:1;

var scene='cabin', count=500, visc=1.2;
var flakes=[], T=0, swirl=1, bulkX=0, bulkY=0, tSince=0, clock=0, lastKick=-99;
var offX=0, offY=0, offVX=0, offVY=0, tiltA=0, tiltV=0;
var dragging=false, px=0, py=0, pvx=0, pvy=0, ptime=0;

function rnd(a,b){return a+Math.random()*(b-a);}
function mound(x){var u=(x-CX)/118; return u*u<1? 20*(1-u*u):0;}
function groundY(x){return FLOOR-mound(x);}

function makeFlakes(){
  flakes=[];
  for(var i=0;i<count;i++){
    var chunky=Math.random()<0.1;
    var x,tries=0;
    do{x=CX+rnd(-112,112);tries++;}while(Math.hypot(x-CX,FLOOR-CY)>R-8&&tries<20);
    flakes.push({
      x:x, y:groundY(x)-rnd(0,6), vx:0, vy:0,
      r:chunky?rnd(2.4,3.6):rnd(1.0,2.2),
      vt:chunky?rnd(48,70):rnd(18,36),
      ph:rnd(0,6.28), tw:rnd(1.5,4), a:rnd(.6,1),
      pile:rnd(0,7), rest:true, back:Math.random()<.45
    });
  }
}

function kick(s,lift){
  T=Math.max(T,s); swirl=(Math.random()<.5?-1:1)*rnd(.6,1.1);
  lastKick=clock; tSince=0;
  var p=Math.min(1,s*1.25);
  for(var i=0;i<flakes.length;i++){
    var f=flakes[i];
    if(f.rest){ if(Math.random()<p){f.rest=false;f.vy=-rnd(20,120)*s*lift;f.vx=rnd(-60,60)*s;f.y-=2;} }
    else{ f.vx+=rnd(-80,80)*s; f.vy+=rnd(-120,40)*s*lift; }
  }
}
function shake(){ kick(1,1.6*motionK+.0); offVX+=rnd(-260,260)*motionK; offVY+=rnd(-420,-200)*motionK; tiltV+=rnd(-4,4)*motionK; }
function tilt(dir){ kick(.32,.9); tiltV+=(dir||(Math.random()<.5?-1:1))*2.2*motionK; bulkX+=-(dir||1)*30; }

/* ---------- physics ---------- */
function step(dt){
  clock+=dt;
  var tau=2.0*visc; T*=Math.exp(-dt/tau); if(T<.002)T=0;
  var bd=Math.exp(-dt/(.9*visc)); bulkX*=bd; bulkY*=bd;
  var drag=3.2/visc, k=1-Math.exp(-dt*drag), vtScale=1/visc;
  var amp=T*210;
  for(var i=0;i<flakes.length;i++){
    var f=flakes[i];
    if(f.rest) continue;
    var dx=f.x-CX, dy=f.y-CY;
    var fx=bulkX+Math.sin(f.y*.021+clock*1.7+f.ph*.2)*amp+(-dy)*swirl*T*.9;
    var fy=bulkY+Math.cos(f.x*.019-clock*1.3)*amp*.7+dx*swirl*T*.9;
    var tx=fx, ty=fy+f.vt*vtScale+Math.sin(clock*f.tw+f.ph)*4*(1-T*.5);
    f.vx+=(tx-f.vx)*k; f.vy+=(ty-f.vy)*k;
    f.x+=f.vx*dt; f.y+=f.vy*dt;
    var d=Math.hypot(f.x-CX,f.y-CY), lim=R-7;
    if(d>lim){
      var nx=(f.x-CX)/d, ny=(f.y-CY)/d;
      f.x=CX+nx*lim; f.y=CY+ny*lim;
      var vn=f.vx*nx+f.vy*ny; if(vn>0){f.vx-=vn*1.4*nx; f.vy-=vn*1.4*ny;}
    }
    var gy=groundY(f.x)-f.pile;
    if(f.y>=gy){
      if(T>.12){ f.y=gy-1; f.vy=-Math.abs(f.vy)*.3; }
      else{ f.y=gy; f.rest=true; f.vx=f.vy=0; }
    }
  }
  /* outer object motion: springs back after a shake or drag */
  if(!dragging){
    offVX+=(-offX*90-offVX*9)*dt; offVY+=(-offY*90-offVY*9)*dt;
    offX+=offVX*dt; offY+=offVY*dt;
  }
  tiltV+=(-tiltA*70-tiltV*7)*dt; tiltA+=tiltV*dt;
  offX=Math.max(-70,Math.min(70,offX)); offY=Math.max(-50,Math.min(50,offY));
}

/* ---------- drawing ---------- */
function drawRoom(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0e1d3c'); g.addColorStop(1,'#091329');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  var s=ctx.createRadialGradient(CX,300,40,CX,300,330);
  s.addColorStop(0,'rgba(120,170,255,.20)'); s.addColorStop(1,'rgba(120,170,255,0)');
  ctx.fillStyle=s; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0a1530'; ctx.fillRect(0,548,W,H-548);
  ctx.fillStyle='rgba(150,190,255,.18)'; ctx.fillRect(0,548,W,1.5);
}

function drawScene(){
  ctx.save();
  ctx.translate(CX,FLOOR);
  /* snow mound */
  var mg=ctx.createLinearGradient(0,-24,0,4);
  mg.addColorStop(0,'#f4f9ff'); mg.addColorStop(1,'#b9d2f0');
  ctx.fillStyle=mg;
  ctx.beginPath(); ctx.moveTo(-120,2);
  for(var x=-120;x<=120;x+=4){ctx.lineTo(x,-mound(CX+x));}
  ctx.lineTo(120,2); ctx.closePath(); ctx.fill();
  if(scene==='cabin') cabin();
  else if(scene==='snowman') snowman();
  else pines();
  ctx.restore();
}
function pine(x,y,h,w){
  ctx.fillStyle='#1b3358'; ctx.fillRect(x-3,y-8,6,10);
  for(var i=0;i<3;i++){
    var yy=y-8-i*h*.28, ww=w*(1-i*.24);
    ctx.fillStyle=i%2?'#27508a':'#1f4377';
    ctx.beginPath(); ctx.moveTo(x,yy-h*.42); ctx.lineTo(x+ww/2,yy); ctx.lineTo(x-ww/2,yy); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(245,250,255,.9)';
    ctx.beginPath(); ctx.moveTo(x,yy-h*.42); ctx.lineTo(x+ww*.2,yy-h*.42+h*.15); ctx.quadraticCurveTo(x,yy-h*.42+h*.10,x-ww*.2,yy-h*.42+h*.15); ctx.closePath(); ctx.fill();
  }
}
function cabin(){
  pine(-82,-6,96,52); pine(86,-8,74,42);
  ctx.fillStyle='#233f6e'; ctx.fillRect(-38,-62,76,52);
  ctx.fillStyle='#2e528a';
  for(var i=1;i<5;i++) ctx.fillRect(-38,-62+i*10.4,76,1.4);
  ctx.fillStyle='#1c3560'; ctx.fillRect(18,-96,12,26);
  ctx.fillStyle='#f4f9ff'; ctx.fillRect(16,-100,16,6);
  ctx.fillStyle='#1a3059';
  ctx.beginPath(); ctx.moveTo(-50,-60); ctx.lineTo(0,-98); ctx.lineTo(50,-60); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#f4f9ff';
  ctx.beginPath(); ctx.moveTo(-54,-58); ctx.lineTo(0,-102); ctx.lineTo(54,-58); ctx.quadraticCurveTo(40,-62,30,-66);
  ctx.quadraticCurveTo(14,-60,0,-70); ctx.quadraticCurveTo(-14,-60,-30,-68); ctx.quadraticCurveTo(-42,-62,-54,-58); ctx.fill();
  var gl=ctx.createRadialGradient(-16,-34,2,-16,-34,36);
  gl.addColorStop(0,'rgba(255,244,214,.55)'); gl.addColorStop(1,'rgba(255,244,214,0)');
  ctx.fillStyle=gl; ctx.fillRect(-56,-70,80,70);
  ctx.fillStyle='#fff3cf'; ctx.fillRect(-26,-44,18,16);
  ctx.fillStyle='#233f6e'; ctx.fillRect(-18.5,-44,2.5,16); ctx.fillRect(-26,-37,18,2.2);
  ctx.fillStyle='#10244a'; ctx.fillRect(10,-40,14,30);
}
function snowman(){
  pine(-84,-6,86,46); pine(88,-6,64,36);
  ctx.fillStyle='#f6faff';
  ctx.beginPath(); ctx.arc(0,-26,27,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(0,-66,20,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(0,-96,14,0,7); ctx.fill();
  ctx.fillStyle='rgba(120,160,215,.28)';
  ctx.beginPath(); ctx.arc(8,-24,22,-1,1.2); ctx.lineTo(8,-24); ctx.fill();
  ctx.fillStyle='#16294f';
  ctx.beginPath(); ctx.arc(-5,-99,1.9,0,7); ctx.arc(5,-99,1.9,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(0,-60,2,0,7); ctx.arc(0,-48,2,0,7); ctx.arc(0,-36,2,0,7); ctx.fill();
  ctx.fillStyle='#4a86d6';
  ctx.beginPath(); ctx.moveTo(0,-95); ctx.lineTo(16,-92); ctx.lineTo(0,-90); ctx.fill();
  ctx.fillRect(-16,-84,32,6);
  ctx.fillRect(10,-80,7,20);
  ctx.fillStyle='#16294f'; ctx.fillRect(-14,-120,28,18); ctx.fillRect(-20,-104,40,4);
  ctx.strokeStyle='#2a4a7e'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-18,-68); ctx.lineTo(-46,-84); ctx.moveTo(18,-68); ctx.lineTo(44,-82); ctx.stroke();
}
function pines(){
  pine(-70,-6,112,60); pine(-8,-4,144,76); pine(62,-8,98,52); pine(-108,-4,52,28);
  ctx.fillStyle='#bfe0ff';
  [[-30,-70],[30,-40],[-6,-120],[70,-70]].forEach(function(p){ctx.beginPath();ctx.arc(p[0],p[1],2.2,0,7);ctx.fill();});
}

function drawFlakes(back){
  for(var i=0;i<flakes.length;i++){
    var f=flakes[i]; if(f.back!==back) continue;
    var a=f.a*(f.rest?.95:(.55+.45*Math.sin(clock*f.tw+f.ph)));
    var depth=f.back?.7:1;
    ctx.globalAlpha=Math.max(.15,a*depth);
    ctx.fillStyle='#fff';
    var r=f.r*(f.back?.85:1.05);
    if(r>2.2){ ctx.beginPath(); ctx.moveTo(f.x,f.y-r); ctx.lineTo(f.x+r,f.y); ctx.lineTo(f.x,f.y+r); ctx.lineTo(f.x-r,f.y); ctx.fill(); }
    else{ ctx.beginPath(); ctx.arc(f.x,f.y,r,0,6.3); ctx.fill(); }
  }
  ctx.globalAlpha=1;
}

function waterPath(){
  var a=Math.acos((FLOOR-CY)/R);
  ctx.beginPath();
  ctx.arc(CX,CY,R,Math.PI/2+a*0 - (Math.PI/2 - a) , 0, false);
}
function clipWater(){
  var ang=Math.asin((FLOOR-CY)/R);
  ctx.beginPath();
  ctx.arc(CX,CY,R-3,Math.PI-ang,2*Math.PI+ang,false);
  ctx.closePath();
  ctx.clip();
}

var aloftFrac=0;
function draw(){
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  ctx.clearRect(0,0,W,H);
  drawRoom();

  /* shadow */
  ctx.fillStyle='rgba(0,0,0,.45)';
  ctx.beginPath(); ctx.ellipse(CX+offX*.2,556,185,16,0,0,7); ctx.fill();

  ctx.save();
  ctx.translate(offX,offY*.5);
  ctx.translate(CX,560); ctx.rotate(tiltA*.03); ctx.translate(-CX,-560);

  /* water */
  ctx.save(); clipWater();
  var wg=ctx.createRadialGradient(CX-40,CY-60,10,CX,CY,R);
  wg.addColorStop(0,'#3a6fb8'); wg.addColorStop(.6,'#254f93'); wg.addColorStop(1,'#16356d');
  ctx.fillStyle=wg; ctx.fillRect(CX-R,CY-R,2*R,2*R);
  drawFlakes(true);
  /* magnified scene */
  ctx.save();
  ctx.translate(CX,FLOOR); ctx.scale(1.12,1.12); ctx.translate(-CX,-FLOOR);
  drawScene();
  ctx.restore();
  drawFlakes(false);
  /* haze */
  var hz=ctx.createLinearGradient(0,CY-R,0,FLOOR);
  hz.addColorStop(0,'rgba(220,235,255,'+(aloftFrac*.10).toFixed(3)+')');
  hz.addColorStop(1,'rgba(220,235,255,'+(aloftFrac*.34).toFixed(3)+')');
  ctx.fillStyle=hz; ctx.fillRect(CX-R,CY-R,2*R,2*R);
  ctx.restore();

  /* glass */
  ctx.save();
  var ang=Math.asin((FLOOR-CY)/R);
  ctx.beginPath(); ctx.arc(CX,CY,R,Math.PI-ang,2*Math.PI+ang,false); ctx.closePath(); ctx.clip();
  var eg=ctx.createRadialGradient(CX,CY,R*.72,CX,CY,R);
  eg.addColorStop(0,'rgba(190,225,255,0)'); eg.addColorStop(.88,'rgba(190,225,255,.10)'); eg.addColorStop(1,'rgba(230,245,255,.5)');
  ctx.fillStyle=eg; ctx.fillRect(CX-R,CY-R,2*R,2*R);
  /* window highlight */
  ctx.save(); ctx.translate(CX-96,CY-108); ctx.rotate(-.62);
  var hg=ctx.createLinearGradient(0,0,0,70);
  hg.addColorStop(0,'rgba(255,255,255,.80)'); hg.addColorStop(1,'rgba(255,255,255,.04)');
  ctx.fillStyle=hg;
  ctx.beginPath(); ctx.moveTo(-30,0); ctx.quadraticCurveTo(0,-14,30,0); ctx.lineTo(26,64); ctx.quadraticCurveTo(0,52,-26,64); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.ellipse(CX-134,CY-40,5,18,-.35,0,7); ctx.fill();
  /* bottom bounce light */
  var bl=ctx.createRadialGradient(CX+70,CY+150,2,CX+70,CY+150,80);
  bl.addColorStop(0,'rgba(170,210,255,.35)'); bl.addColorStop(1,'rgba(170,210,255,0)');
  ctx.fillStyle=bl; ctx.fillRect(CX-R,CY-R,2*R,2*R);
  ctx.restore();
  ctx.strokeStyle='rgba(215,236,255,.55)'; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.arc(CX,CY,R,Math.PI-ang,2*Math.PI+ang,false); ctx.stroke();

  /* collar and base */
  var collarW=Math.sqrt(R*R-(FLOOR-CY)*(FLOOR-CY));
  var cg=ctx.createLinearGradient(CX-150,0,CX+150,0);
  cg.addColorStop(0,'#5a4a2c'); cg.addColorStop(.3,'#e7cf8c'); cg.addColorStop(.55,'#9d8445'); cg.addColorStop(1,'#4a3c22');
  ctx.fillStyle=cg;
  ctx.beginPath(); ctx.moveTo(CX-collarW-14,FLOOR-4); ctx.lineTo(CX+collarW+14,FLOOR-4);
  ctx.lineTo(CX+collarW+30,FLOOR+22); ctx.lineTo(CX-collarW-30,FLOOR+22); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fillRect(CX-collarW-14,FLOOR-4,2*collarW+28,2);
  var bg=ctx.createLinearGradient(0,FLOOR+22,0,562);
  bg.addColorStop(0,'#1d3b72'); bg.addColorStop(1,'#0f2147');
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.moveTo(CX-186,FLOOR+22); ctx.lineTo(CX+186,FLOOR+22);
  ctx.lineTo(CX+200,552); ctx.quadraticCurveTo(CX+200,562,CX+188,562); ctx.lineTo(CX-188,562);
  ctx.quadraticCurveTo(CX-200,562,CX-200,552); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.clip();
  var sh=ctx.createLinearGradient(CX-200,0,CX+200,0);
  sh.addColorStop(0,'rgba(255,255,255,.14)'); sh.addColorStop(.25,'rgba(255,255,255,0)'); sh.addColorStop(1,'rgba(0,0,0,.35)');
  ctx.fillStyle=sh; ctx.fillRect(CX-200,FLOOR+22,400,140);
  ctx.fillStyle='rgba(190,220,255,.35)'; ctx.fillRect(CX-186,FLOOR+22,372,2);
  ctx.restore();
  /* plate */
  var pg=ctx.createLinearGradient(0,490,0,530);
  pg.addColorStop(0,'#f1dd9f'); pg.addColorStop(1,'#a98f4f');
  ctx.fillStyle=pg; roundRect(CX-70,492,140,34,6); ctx.fill();
  ctx.fillStyle='#3a2f15'; ctx.font='600 13px Georgia,serif'; ctx.textAlign='center';
  ctx.fillText('WINTER HOLLOW',CX,513);
  ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* ---------- HUD ---------- */
var elState=document.getElementById('state'), elHaze=document.getElementById('haze'), elDetail=document.getElementById('detail');
var hudT=0;
function hud(){
  var up=0, top=0;
  for(var i=0;i<flakes.length;i++){ if(!flakes[i].rest){up++; if(flakes[i].y<CY-40) top++;} }
  aloftFrac+=((up/Math.max(1,flakes.length))-aloftFrac)*.08;
  var frac=up/Math.max(1,flakes.length);
  elHaze.style.width=Math.round(frac*100)+'%';
  var s;
  if(dragging) s='Swirling';
  else if(up===0) s='Settled';
  else if(T>.35) s='Storm in the dome';
  else if(top>0) s='Snow drifting down';
  else s='Top clear, bottom still hazy';
  elState.textContent=s;
  var ago=(clock-lastKick);
  elDetail.textContent=up+' of '+flakes.length+' flakes afloat'+(lastKick>0?' · last shake '+ago.toFixed(1)+' s ago':'');
}

/* ---------- loop ---------- */
var last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000); last=now;
  step(dt);
  hudT+=dt;
  draw();
  if(hudT>.1){hudT=0;hud();}
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
function toLocal(e){
  var r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height};
}
cv.addEventListener('pointerdown',function(e){
  dragging=true; cv.classList.add('drag'); cv.setPointerCapture(e.pointerId);
  var p=toLocal(e); px=p.x; py=p.y; ptime=performance.now(); pvx=pvy=0;
  offVX=offVY=0;
});
cv.addEventListener('pointermove',function(e){
  if(!dragging) return;
  var p=toLocal(e), now=performance.now(), dt=Math.max(.008,(now-ptime)/1000);
  var vx=(p.x-px)/dt, vy=(p.y-py)/dt;
  var ax=vx-pvx, ay=vy-pvy; pvx=vx; pvy=vy; px=p.x; py=p.y; ptime=now;
  offX+=(p.x-px)*0; /* follow handled below */
  offX=Math.max(-70,Math.min(70,offX+vx*dt*.6));
  offY=Math.max(-50,Math.min(50,offY+vy*dt*.6));
  var sp=Math.hypot(vx,vy);
  bulkX+=-vx*dt*.9; bulkY+=-vy*dt*.9;
  tiltA=Math.max(-3,Math.min(3,tiltA+vx*dt*.01));
  var s=Math.min(1,sp/1800);
  if(s>.05){
    kick(s*.9*motionK+.05,.7);
    lastKick=clock;
  }
});
function endDrag(e){
  if(!dragging) return; dragging=false; cv.classList.remove('drag');
  offVX=pvx*.4; offVY=pvy*.4;
  try{cv.releasePointerCapture(e.pointerId);}catch(_){}
}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('keydown',function(e){
  if(e.key===' '||e.key==='Enter'){e.preventDefault();shake();}
  else if(e.key==='ArrowLeft'){e.preventDefault();tilt(-1);}
  else if(e.key==='ArrowRight'){e.preventDefault();tilt(1);}
  else if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();kick(.5,1);}
});
cv.addEventListener('click',function(e){ if(e.detail===0) shake(); });

document.getElementById('shake').addEventListener('click',shake);
document.getElementById('tilt').addEventListener('click',function(){tilt();});

var sceneBtns=document.querySelectorAll('[data-scene]');
Array.prototype.forEach.call(sceneBtns,function(b){
  b.addEventListener('click',function(){
    scene=b.getAttribute('data-scene');
    Array.prototype.forEach.call(sceneBtns,function(o){o.setAttribute('aria-pressed',o===b?'true':'false');});
    kick(.45,1);
  });
});
var cnt=document.getElementById('count'), cntV=document.getElementById('countV');
cnt.addEventListener('input',function(){ count=+cnt.value; cntV.textContent=count; makeFlakes(); kick(.8,1.2); });
var vs=document.getElementById('visc'), vsV=document.getElementById('viscV');
function viscLabel(v){ return v<.9?'thin, like water':v<1.5?'light glycerin':v<2?'syrupy':'slow as honey'; }
vs.addEventListener('input',function(){ visc=+vs.value; vsV.textContent=viscLabel(visc); kick(.7,1.2); });
vsV.textContent=viscLabel(visc);

/* phone shake */
var lastMag=0;
window.addEventListener('devicemotion',function(e){
  var a=e.accelerationIncludingGravity; if(!a) return;
  var m=Math.abs(a.x||0)+Math.abs(a.y||0)+Math.abs(a.z||0);
  if(Math.abs(m-lastMag)>24 && clock-lastKick>.6) shake();
  lastMag=m;
});

function fit(){
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var w=Math.round(cv.clientWidth*dpr)||W;
  if(cv.width!==w){cv.width=w;cv.height=Math.round(w*H/W);}
}
window.addEventListener('resize',fit);

fit(); makeFlakes();
setTimeout(function(){kick(1,1.5);},350);
requestAnimationFrame(function(t){last=t;frame(t);});
})();
</script>
</body>
