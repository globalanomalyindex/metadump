<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snow Globe</title>
<style>
:root{
  --bg:#12141d; --panel:#1b1f2c; --panel-line:#343b52; --ink:#f1ece2; --muted:#b4b9c9;
  --amber:#ffc56b; --amber-deep:#e9a23b; --focus:#8fd0ff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:radial-gradient(120% 90% at 30% 10%,#232842 0%,var(--bg) 60%);
  color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;
}
.wrap{max-width:1040px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font:600 28px/1.1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:.01em}
header p{margin:0;color:var(--muted);font-size:15px}
.stage{position:relative;border-radius:18px;overflow:hidden;background:#0e1018;box-shadow:0 20px 50px #0008, inset 0 0 0 1px #ffffff12}
canvas{display:block;width:100%;height:auto;aspect-ratio:640/700;touch-action:none;cursor:grab;outline:none}
canvas:active{cursor:grabbing}
canvas:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:13px;color:#d6d3cc;pointer-events:none;text-shadow:0 1px 3px #000}
.panel{background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;padding:16px;display:grid;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
.shake{min-height:52px;border-radius:12px;border:0;background:linear-gradient(#ffd68a,var(--amber-deep));color:#2b1d05;font-weight:700;font-size:18px;letter-spacing:.02em;box-shadow:0 2px 0 #8a5a12}
.shake:hover{filter:brightness(1.08)}
.shake:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend,.lab{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:0;margin-bottom:6px;display:block}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{min-height:44px;border-radius:10px;border:1px solid var(--panel-line);background:#242a3c;color:var(--ink);padding:4px 6px}
.seg button:hover{background:#2e3550}
.seg button[aria-pressed="true"]{background:#f1ece2;color:#1a1d29;border-color:#f1ece2;font-weight:600}
input[type=range]{width:100%;min-height:36px;accent-color:var(--amber)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.row b{color:var(--ink);font-weight:600}
.switch{display:flex;align-items:center;gap:10px;min-height:44px}
.switch input{width:26px;height:26px;accent-color:var(--amber)}
.read{display:grid;gap:8px;border-top:1px solid var(--panel-line);padding-top:14px}
.read .big{font:600 22px/1.1 Georgia,serif;color:var(--ink)}
.meter{height:10px;border-radius:6px;background:#10131c;overflow:hidden;border:1px solid var(--panel-line)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9fb8e6,#fff);transition:width .15s}
#status{margin:0;font-size:15px;min-height:44px}
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr);padding:12px}
  h1{font-size:24px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Snow Globe</h1>
    <p>Grab the glass and shake it, or press the button. Watch the settle.</p>
  </header>

  <div class="stage">
    <canvas id="c" width="640" height="700" tabindex="0" role="img"
      aria-label="A glass snow globe holding a tiny scene. Press Space or Enter to shake it; arrow keys tilt it."></canvas>
    <div class="hint" id="hint">drag the glass, or press Space</div>
  </div>

  <aside class="panel" aria-label="Controls">
    <button class="shake" id="shake" type="button">Shake it</button>

    <fieldset>
      <legend>Scene inside</legend>
      <div class="seg" id="scenes">
        <button type="button" data-scene="lighthouse" aria-pressed="true">Lighthouse</button>
        <button type="button" data-scene="cabin" aria-pressed="false">Cabin</button>
        <button type="button" data-scene="town" aria-pressed="false">Chapel</button>
      </div>
    </fieldset>

    <div>
      <label class="lab" for="visc">Liquid: water to glycerin</label>
      <input id="visc" type="range" min="0" max="100" value="62">
      <div class="row"><span>snow hangs for about</span><b id="hang">12 s</b></div>
    </div>

    <div>
      <label class="lab" for="count">Flakes</label>
      <input id="count" type="range" min="80" max="900" step="10" value="380">
      <div class="row"><span>glitter in the dome</span><b id="countv">380</b></div>
    </div>

    <fieldset>
      <legend>Glitter grain</legend>
      <div class="seg" id="mix">
        <button type="button" data-mix="fine" aria-pressed="false">Fine</button>
        <button type="button" data-mix="mixed" aria-pressed="true">Mixed</button>
        <button type="button" data-mix="chunky" aria-pressed="false">Chunky</button>
      </div>
    </fieldset>

    <label class="switch"><input id="lights" type="checkbox" checked> <span>Lights on inside</span></label>

    <div class="read">
      <div class="row"><span>since last shake</span><b id="since">rest</b></div>
      <div class="big" id="air">0% in the air</div>
      <div class="meter" aria-hidden="true"><i id="bar"></i></div>
      <div class="row"><span>shakes</span><b id="shakes">0</b></div>
      <p id="status" role="status" aria-live="polite">Snow at rest on the hill.</p>
    </div>
  </aside>
</div>

<script>
(function(){
"use strict";
var R=262, K=2, W=640, H=700, CX=320, CY=316;
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var dpr=Math.min(2,window.devicePixelRatio||1);
cv.width=W*dpr; cv.height=H*dpr;
var reduce=false; try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}

/* ---------- state ---------- */
var S={scene:'lighthouse',lights:true,visc:0.62,count:380,mix:'mixed'};
try{var sv=JSON.parse(localStorage.getItem('snowglobe-c2')||'null'); if(sv){for(var k in S) if(k in sv) S[k]=sv[k];}}catch(e){}
function save(){try{localStorage.setItem('snowglobe-c2',JSON.stringify(S));}catch(e){}}
var t=0, stir=0, spin=1, tShake=null, shakes=0, flakes=[], pile=new Float32Array(49), running=false, last=0, lastStatus='';
var dome={x:0,y:0,vx:0,vy:0,tx:0,ty:0,drag:false,px:0,py:0}, pendingKick=0;

/* ---------- lens ---------- */
function lensF(r){return r*(0.60+0.40*r*r);}
var NT=512, gTab=new Float32Array(NT+1);
(function(){for(var j=0;j<=NT;j++){var s=j/NT,lo=0,hi=1;for(var i=0;i<22;i++){var m=(lo+hi)/2;if(lensF(m)<s)lo=m;else hi=m;}gTab[j]=(lo+hi)/2;}})();
function disp(x,y){ // source -> display offset from centre, with local scale
  var s=Math.sqrt(x*x+y*y); if(s<1e-6) return [x/0.6,y/0.6,1/0.6];
  var u=Math.min(1,s/R)*NT, i=Math.floor(u), fr=u-i, g=gTab[i]*(1-fr)+gTab[Math.min(NT,i+1)]*fr;
  var sc=g*R/s; return [x*sc,y*sc,sc];

function gy(x){var q=x/R;return R*(0.30+0.17*q*q);}

/* ---------- scene painting (source space, origin = dome centre) ---------- */
function poly(c,pts,fill){c.beginPath();c.moveTo(pts[0],pts[1]);for(var i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.closePath();c.fillStyle=fill;c.fill();}
function pine(c,x,h,w,tone){
  var y=gy(x)+3;
  c.fillStyle='#3a2a22';c.fillRect(x-2,y-8,4,8);
  var tiers=4,cols=tone?['#1c4a42','#25604f','#2f7360']:['#173f3a','#215346','#2a6454'];
  for(var i=0;i<tiers;i++){
    var by=y-8-i*h/tiers*0.72, tw=w*(1-i*0.2), th=h/tiers*1.25;
    poly(c,[x-tw/2,by,x+tw/2,by,x,by-th],cols[i%3]);
    poly(c,[x-tw*0.27,by-th*0.45,x+tw*0.27,by-th*0.45,x,by-th],'#eef4fb');
    poly(c,[x-tw*0.2,by-th*0.45,x-tw*0.05,by-th*0.3,x+tw*0.2,by-th*0.45,x,by-th*0.35],'#c9dbee');
  }
}
function win(c,x,y,w,h,lit){
  c.fillStyle=lit?'#ffc56b':'#2e3754';c.fillRect(x,y,w,h);
  if(lit){var g=c.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'#fff0b8');g.addColorStop(1,'#f2a23a');c.fillStyle=g;c.fillRect(x,y,w,h);}
  c.strokeStyle='#4a3326';c.lineWidth=1.5;c.strokeRect(x,y,w,h);
  c.beginPath();c.moveTo(x+w/2,y);c.lineTo(x+w/2,y+h);c.moveTo(x,y+h/2);c.lineTo(x+w,y+h/2);c.stroke();
}
function ground(c){
  c.save();c.beginPath();c.arc(0,0,R*0.99,0,Math.PI*2);c.clip();
  var p=new Path2D();p.moveTo(-R,gy(-R));
  for(var x=-R;x<=R;x+=8)p.lineTo(x,gy(x));
  p.lineTo(R,R);p.lineTo(-R,R);p.closePath();
  var g=c.createLinearGradient(0,gy(0),0,R);g.addColorStop(0,'#3a4466');g.addColorStop(0.5,'#242a45');g.addColorStop(1,'#14172b');
  c.fillStyle=g;c.fill(p);
  c.strokeStyle='rgba(255,255,255,.05)';c.lineWidth=1;
  for(var i=1;i<6;i++){c.beginPath();for(var x2=-R;x2<=R;x2+=10){var yy=gy(x2)+i*22+Math.sin(x2*.04+i)*3;if(x2===-R)c.moveTo(x2,yy);else c.lineTo(x2,yy);}c.stroke();}
  // snow cap
  var cap=new Path2D();cap.moveTo(-R,gy(-R)-4);
  for(var x3=-R;x3<=R;x3+=6)cap.lineTo(x3,gy(x3)-5-Math.sin(x3*.09)*1.8);
  for(var x4=R;x4>=-R;x4-=6)cap.lineTo(x4,gy(x4)+9+Math.sin(x4*.13)*3.5);
  cap.closePath();
  var sg=c.createLinearGradient(0,gy(0)-6,0,gy(0)+14);sg.addColorStop(0,'#fbfdff');sg.addColorStop(1,'#bdd0ea');
  c.fillStyle=sg;c.fill(cap);
  c.restore();

var scenes={
  lighthouse:function(c,L){
    ground(c);
    pine(c,-150,96,50,false);pine(c,-112,70,38,true);pine(c,138,84,44,false);
    // rock
    var bx=-8,by=gy(bx)+4;
    poly(c,[bx-70,by,bx-52,by-26,bx-24,by-38,bx+22,by-34,bx+54,by-20,bx+74,by],'#4a4f68');
    poly(c,[bx-52,by-26,bx-24,by-38,bx-14,by-22,bx-40,by-8],'#5d6381');
    poly(c,[bx-24,by-39,bx+22,by-35,bx+10,by-30,bx-14,by-31],'#f2f7ff');
    // tower with stripes
    var ty=by-34, h=150, w0=44, w1=28;
    c.save();c.beginPath();c.moveTo(bx-w0/2,ty);c.lineTo(bx+w0/2,ty);c.lineTo(bx+w1/2,ty-h);c.lineTo(bx-w1/2,ty-h);c.closePath();c.clip();
    for(var i=0;i<6;i++){c.fillStyle=i%2?'#f3efe6':'#c8453d';c.fillRect(bx-30,ty-h+i*h/6,60,h/6+1);}
    var sh=c.createLinearGradient(bx-24,0,bx+24,0);sh.addColorStop(0,'rgba(255,255,255,.18)');sh.addColorStop(.55,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(10,10,40,.35)');
    c.fillStyle=sh;c.fillRect(bx-30,ty-h,60,h);c.restore();
    win(c,bx-4,ty-60,8,13,L);
    c.fillStyle='#2c2f45';c.fillRect(bx-22,ty-h-3,44,6);
    c.fillStyle='#2c2f45';c.fillRect(bx-19,ty-h-6,38,3);
    var lg=c.createLinearGradient(0,ty-h-28,0,ty-h-4);
    if(L){lg.addColorStop(0,'#fff6c8');lg.addColorStop(1,'#ffb347');}else{lg.addColorStop(0,'#aeb9d6');lg.addColorStop(1,'#7c88a8');}
    c.fillStyle=lg;c.fillRect(bx-11,ty-h-27,22,22);
    c.strokeStyle='#2c2f45';c.lineWidth=2;c.strokeRect(bx-11,ty-h-27,22,22);c.beginPath();c.moveTo(bx,ty-h-27);c.lineTo(bx,ty-h-5);c.stroke();
    poly(c,[bx-15,ty-h-27,bx+15,ty-h-27,bx,ty-h-46],'#a8322d');
    c.fillStyle='#2c2f45';c.beginPath();c.arc(bx,ty-h-48,2.5,0,6.3);c.fill();
    // little hut
    var hx=62,hy=gy(hx)+2;
    c.fillStyle='#8a5a3b';c.fillRect(hx,hy-24,34,24);
    poly(c,[hx-5,hy-24,hx+39,hy-24,hx+17,hy-42],'#eef4fb');poly(c,[hx-2,hy-24,hx+36,hy-24,hx+17,hy-37],'#9b3a35');
    win(c,hx+5,hy-18,9,9,L);c.fillStyle='#4a3326';c.fillRect(hx+21,hy-17,8,17);
    lamp.x=bx;lamp.y=ty-h-16;
  },
  cabin:function(c,L){
    ground(c);
    pine(c,-160,110,54,false);pine(c,-118,76,40,true);pine(c,150,92,48,false);pine(c,118,60,32,true);
    var cx=-22,cy=gy(cx)+4;
    c.fillStyle='#7a4d31';c.fillRect(cx-56,cy-58,112,58);
    c.strokeStyle='rgba(30,15,8,.45)';c.lineWidth=1.4;for(var i=1;i<6;i++){c.beginPath();c.moveTo(cx-56,cy-58+i*9.7);c.lineTo(cx+56,cy-58+i*9.7);c.stroke();}
    c.fillStyle='#5b3722';for(var j=0;j<7;j++){c.beginPath();c.arc(cx-56,cy-54+j*9.7,3.2,0,6.3);c.arc(cx+56,cy-54+j*9.7,3.2,0,6.3);c.fill();}
    c.fillStyle='#6b4a3a';c.fillRect(cx+24,cy-98,14,34);
    c.fillStyle='#eef4fb';c.fillRect(cx+22,cy-102,18,7);
    poly(c,[cx-70,cy-56,cx+70,cy-56,cx+38,cy-98,cx-38,cy-98],'#4a2f2a');
    poly(c,[cx-72,cy-54,cx+72,cy-54,cx+66,cy-62,cx+40,cy-102,cx-40,cy-102,cx-66,cy-62],'#f4f8ff');
    poly(c,[cx-46,cy-58,cx+46,cy-58,cx+34,cy-92,cx-34,cy-92],'#5a3a35');
    win(c,cx-42,cy-42,22,20,L);win(c,cx+20,cy-42,22,20,L);
    c.fillStyle='#3d2416';c.fillRect(cx-10,cy-34,20,34);c.fillStyle='#ffc56b';c.beginPath();c.arc(cx+6,cy-16,1.6,0,6.3);c.fill();
    // smoke
    c.fillStyle='rgba(235,240,250,.55)';c.beginPath();c.arc(cx+33,cy-112,7,0,6.3);c.arc(cx+41,cy-126,9,0,6.3);c.arc(cx+52,cy-142,11,0,6.3);c.fill();
    // fence
    for(var f=0;f<5;f++){var fx=-120+f*16,fy=gy(fx)+2;c.fillStyle='#6a4a35';c.fillRect(fx,fy-20,5,20);poly(c,[fx,fy-20,fx+5,fy-20,fx+2.5,fy-25],'#6a4a35');c.fillStyle='#eef4fb';c.fillRect(fx-1,fy-23,7,3);}
    c.fillStyle='#6a4a35';c.fillRect(-120,gy(-120)-14,68,3.5);
    // snowman
    var sx=84,sy=gy(sx)+2;
    c.fillStyle='#fbfdff';c.beginPath();c.arc(sx,sy-9,10,0,6.3);c.arc(sx,sy-25,7.5,0,6.3);c.arc(sx,sy-37,5.5,0,6.3);c.fill();
    c.fillStyle='#1b1d28';c.fillRect(sx-4,sy-47,8,6);c.fillRect(sx-6,sy-41,12,2);
    poly(c,[sx,sy-37,sx+9,sy-35,sx,sy-34],'#f08a3c');
    c.fillStyle='#1b1d28';c.fillRect(sx-2.5,sy-39,1.5,1.5);c.fillRect(sx+1.2,sy-39,1.5,1.5);
    lamp.x=cx;lamp.y=cy-30;
  },
  town:function(c,L){
    ground(c);
    pine(c,-158,86,44,false);pine(c,160,100,50,false);pine(c,126,66,34,true);
    // houses
    function house(x,w,hh,wall,roof,lit){
      var y=gy(x)+2;
      c.fillStyle=wall;c.fillRect(x-w/2,y-hh,w,hh);
      poly(c,[x-w/2-5,y-hh,x+w/2+5,y-hh,x,y-hh-w*0.55],'#eef4fb');
      poly(c,[x-w/2-2,y-hh+1,x+w/2+2,y-hh+1,x,y-hh-w*0.55+7],roof);
      win(c,x-w*0.28,y-hh*0.62,w*0.2,hh*0.26,lit);win(c,x+w*0.08,y-hh*0.62,w*0.2,hh*0.26,lit);
    }
    house(-92,48,46,'#d9c7a4','#8f3b3a',L);
    house(96,54,54,'#b7c4cf','#2f4f6f',L);
    // chapel
    var x=0,y=gy(x)+3;
    c.fillStyle='#e8dcc2';c.fillRect(x-34,y-62,68,62);
    var sg=c.createLinearGradient(x-34,0,x+34,0);sg.addColorStop(0,'rgba(255,255,255,.2)');sg.addColorStop(.5,'rgba(0,0,0,0)');sg.addColorStop(1,'rgba(10,10,50,.3)');
    c.fillStyle=sg;c.fillRect(x-34,y-62,68,62);
    poly(c,[x-40,y-62,x+40,y-62,x,y-98],'#eef4fb');poly(c,[x-37,y-63,x+37,y-63,x,y-93],'#6b3a3a');
    c.fillStyle='#e8dcc2';c.fillRect(x-15,y-142,30,52);
    poly(c,[x-19,y-142,x+19,y-142,x,y-190],'#eef4fb');poly(c,[x-16,y-143,x+16,y-143,x,y-184],'#2f4f6f');
    c.fillStyle='#e9b84a';c.fillRect(x-1,y-208,2,20);c.fillRect(x-5,y-202,10,2);
    c.fillStyle='#fbf3da';c.beginPath();c.arc(x,y-124,8,0,6.3);c.fill();c.strokeStyle='#4a3326';c.lineWidth=1.3;c.stroke();
    c.beginPath();c.moveTo(x,y-124);c.lineTo(x,y-130);c.moveTo(x,y-124);c.lineTo(x+4,y-122);c.stroke();
    c.fillStyle=L?'#ffc56b':'#2e3754';c.beginPath();c.moveTo(x-8,y-78);c.lineTo(x-8,y-96);c.arc(x,y-96,8,Math.PI,0);c.lineTo(x+8,y-78);c.closePath();c.fill();
    c.strokeStyle='#4a3326';c.stroke();
    c.fillStyle='#3d2416';c.beginPath();c.moveTo(x-10,y);c.lineTo(x-10,y-26);c.arc(x,y-26,10,Math.PI,0);c.lineTo(x+10,y);c.closePath();c.fill();
    // lamp post
    var lx=-48,ly=gy(lx)+2;
    c.fillStyle='#22263a';c.fillRect(lx-1.5,ly-48,3,48);c.fillRect(lx-5,ly-52,10,4);
    c.fillStyle=L?'#fff0b8':'#8c97b6';c.fillRect(lx-4,ly-62,8,10);
    poly(c,[lx-6,ly-62,lx+6,ly-62,lx,ly-69],'#22263a');
    lamp.x=lx;lamp.y=ly-57;
  }
};
var lamp={x:0,y:0};

/* ---------- warped scene layer ---------- */
var warped=document.createElement('canvas');
function buildScene(){
  var n=2*R*K, src=document.createElement('canvas');src.width=src.height=n;
  var c=src.getContext('2d');c.scale(K,K);c.translate(R,R);
  scenes[S.scene](c,S.lights);
  var sd=c.getTransform?(function(){c.setTransform(1,0,0,1,0,0);return c.getImageData(0,0,n,n).data;})():null;
  warped.width=warped.height=n;
  var wc=warped.getContext('2d'), out=wc.createImageData(n,n), od=out.data, m=R*K;
  for(var y=0;y<n;y++){
    var dy=(y+.5-m)/m;
    for(var x=0;x<n;x++){
      var dx=(x+.5-m)/m, r=Math.sqrt(dx*dx+dy*dy);
      if(r>=1)continue;
      var s=lensF(r), k=r>0?s/r:0.6, sx=m+dx*k*m-.5, sy=m+dy*k*m-.5;
      var x0=Math.floor(sx), y0=Math.floor(sy), fx=sx-x0, fy=sy-y0;
      if(x0<0||y0<0||x0>=n-1||y0>=n-1)continue;
      var i00=(y0*n+x0)*4,i10=i00+4,i01=i00+n*4,i11=i01+4;
      var w00=(1-fx)*(1-fy),w10=fx*(1-fy),w01=(1-fx)*fy,w11=fx*fy;
      var a00=sd[i00+3]*w00,a10=sd[i10+3]*w10,a01=sd[i01+3]*w01,a11=sd[i11+3]*w11, a=a00+a10+a01+a11;

/* ---------- flakes ---------- */
function rnd(a,b){return a+Math.random()*(b-a);}
function sizeFor(){
  if(S.mix==='fine')return rnd(0.9,1.7);
  if(S.mix==='chunky')return rnd(1.9,3.6);
  var q=Math.random();return q<0.65?rnd(0.9,1.8):rnd(1.8,3.3);
}
function colOf(x){return Math.max(0,Math.min(48,Math.round((x+R)/(2*R)*48)));}
function floorAt(x){
  var q=(x+R)/(2*R)*48, i=Math.max(0,Math.min(47,Math.floor(q))), fr=q-i;
  return gy(x)-(pile[i]*(1-fr)+pile[i+1]*fr);
}
function land(f){
  var c=colOf(f.x), add=f.sz*0.2*(380/S.count);
  pile[c]=Math.min(15,pile[c]+add);
  if(c>0)pile[c-1]=Math.max(pile[c-1],pile[c]*0.78);
  if(c<48)pile[c+1]=Math.max(pile[c+1],pile[c]*0.78);
  f.s=true;f.vx=f.vy=0;
  f.y=Math.min(f.y,floorAt(f.x))+rnd(-1.5,0.5);
}
function makeFlakes(){
  flakes=[];pile.fill(0);
  for(var i=0;i<S.count;i++){
    var f={x:0,y:0,vx:0,vy:0,sz:sizeFor(),p1:rnd(0,6.28),p2:rnd(0,6.28),s:false,gl:rnd(0,6.28)};
    var tries=0;
    do{f.x=rnd(-0.88*R,0.88*R);f.y=gy(f.x);tries++;}while(Math.sqrt(f.x*f.x+f.y*f.y)>0.93*R&&tries<20);
    land(f);flakes.push(f);
  }
}
function airborne(){var n=0;for(var i=0;i<flakes.length;i++)if(!flakes[i].s)n++;return n;}

function shakeEvent(strength,src){
  strength=Math.max(0.12,Math.min(1,strength));
  var released=0;
  for(var i=0;i<flakes.length;i++){
    var f=flakes[i];
    if(f.s&&Math.random()<Math.min(1,strength*1.5+0.1)){
      f.s=false;f.vy=-rnd(60,300)*strength;f.vx=rnd(-120,120)*strength;f.y-=2;released++;
    }else if(!f.s){f.vx+=rnd(-160,160)*strength;f.vy+=rnd(-120,120)*strength;}
  }
  if(released||strength>0.2){
    // rebuild the pile from what is still resting
    pile.fill(0);
    for(var j=0;j<flakes.length;j++)if(flakes[j].s){var c=colOf(flakes[j].x);pile[c]=Math.min(15,pile[c]+flakes[j].sz*0.2*(380/S.count));}
    for(var k=1;k<48;k++)pile[k]=Math.max(pile[k],0.5*Math.max(pile[k-1],pile[k+1]));
  }
  stir=Math.max(stir,0.35+0.95*strength);
  spin=Math.random()<0.5?-1:1;
  if(strength>0.25){tShake=t;shakes++;}
  if(src==='button'||src==='key'){dome.vx+=(Math.random()<.5?-1:1)*900*strength;dome.vy+=-500*strength;}
  start();
}

/* ---------- physics ---------- */
function Vbase(){return 140*Math.pow(10,-1.1*S.visc);}
function step(dt){
  t+=dt;
  stir*=Math.exp(-dt/(1.7+0.8*S.visc));
  if(stir<0.004)stir=0;
  // dome spring (drag target or rest)
  var tx=dome.drag?dome.tx:0, ty=dome.drag?dome.ty:0, ovx=dome.vx, ovy=dome.vy;
  var k=dome.drag?260:140, cdamp=dome.drag?26:9;
  dome.vx+=((tx-dome.x)*k-dome.vx*cdamp)*dt;
  dome.vy+=((ty-dome.y)*k-dome.vy*cdamp)*dt;
  dome.x+=dome.vx*dt;dome.y+=dome.vy*dt;
  var ax=(dome.vx-ovx)/dt, ay=(dome.vy-ovy)/dt, a=Math.sqrt(ax*ax+ay*ay);
  if(a>6000)pendingKick=Math.max(pendingKick,Math.min(1,(a-6000)/22000));
  if(pendingKick>0.05&&a<3000){shakeEvent(pendingKick,'drag');pendingKick=0;}
  var vb=Vbase(), tau=0.22+0.55*S.visc;
  var relax=1-Math.exp(-dt/tau);
  var rr=0.955*R;
  for(var i=0;i<flakes.length;i++){
    var f=flakes[i]; if(f.s)continue;
    var vt=vb*(0.45+0.33*f.sz);
    var sx=stir*(150*Math.sin(f.y*0.021+t*1.7+f.p1)+40*Math.sin(t*3+f.p2));
    var sy=stir*(110*Math.cos(f.x*0.019-t*1.3+f.p2));
    sx+=-spin*stir*0.9*f.y; sy+=spin*stir*0.55*f.x;
    sy-=stir*230*Math.max(0,1-Math.abs(f.x)/(0.62*R));
    var jit=Math.sin(t*0.9+f.p1)*6; // slow lazy sway while falling
    f.vx+=(sx+jit-f.vx)*relax;
    f.vy+=(vt+sy-f.vy)*relax;
    f.x+=f.vx*dt;f.y+=f.vy*dt;
    var r=Math.sqrt(f.x*f.x+f.y*f.y);
    if(r>rr){
      f.x*=rr/r;f.y*=rr/r;
      f.vx*=-0.2;if(f.vy<0)f.vy*=-0.2;
      if(f.y>0.14*R&&f.vy>=0){land(f);continue;}
    }
    if(f.y>=floorAt(f.x)-0.5){land(f);}
  }
}

/* ---------- drawing ---------- */
function groundClip(c){
  c.beginPath();
  for(var x=-R;x<=R;x+=10){var d=disp(x,gy(x));if(x===-R)c.moveTo(CX+d[0],CY+d[1]);else c.lineTo(CX+d[0],CY+d[1]);}
  c.lineTo(CX+R,CY-R);c.lineTo(CX-R,CY-R);c.closePath();
}
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(room,0,0,W,H);
  ctx.save();
  var ox=dome.x, oy=dome.y*0.6;
  ctx.translate(CX,CY);ctx.rotate(ox*0.0016);ctx.translate(-CX+ox,-CY+oy);
  // dome interior
  ctx.save();ctx.beginPath();ctx.arc(CX,CY,R,0,6.3);ctx.clip();
  ctx.drawImage(warped,CX-R,CY-R,2*R,2*R);
  // lamp glow
  if(S.lights){
    var d=disp(lamp.x,lamp.y), gx=CX+d[0], gyy=CY+d[1];
    var lg=ctx.createRadialGradient(gx,gyy,2,gx,gyy,92);lg.addColorStop(0,'rgba(255,214,140,.55)');lg.addColorStop(.4,'rgba(255,190,100,.18)');lg.addColorStop(1,'rgba(255,170,80,0)');
    ctx.fillStyle=lg;ctx.fillRect(gx-100,gyy-100,200,200);
  }
  // haze (denser low, clears from the top)
  var air=airborne(), nb=12, bands=new Float32Array(nb), y0=-0.95*R, y1=0.55*R;
  for(var i=0;i<flakes.length;i++){var f=flakes[i];if(f.s)continue;var b=Math.floor((f.y-y0)/(y1-y0)*nb);if(b<0)b=0;if(b>=nb)b=nb-1;bands[b]+=f.sz*0.6;}
  ctx.save();groundClip(ctx);ctx.clip();
  var hz=ctx.createLinearGradient(0,CY+disp(0,y0)[1],0,CY+disp(0,y1)[1]);
  for(var q=0;q<nb;q++){
    var sm=(bands[q]+(q>0?bands[q-1]:0)*0.5+(q<nb-1?bands[q+1]:0)*0.5)/2;
    var al=Math.min(0.5,sm/(S.count/nb)*0.55);
    hz.addColorStop((q+0.5)/nb,'rgba(232,240,255,'+al.toFixed(3)+')');
  }
  ctx.fillStyle=hz;ctx.fillRect(CX-R,CY-R,2*R,2*R);
  ctx.restore();
  // snow pile on the hill
  ctx.beginPath();
  var first=true;
  for(var x=-0.9*R;x<=0.9*R;x+=9){
    var h=gy(x)-floorAt(x), dd=disp(x,gy(x)-h-1.5);
    if(first){ctx.moveTo(CX+dd[0],CY+dd[1]);first=false;}else ctx.lineTo(CX+dd[0],CY+dd[1]);
  }
  for(var x2=0.9*R;x2>=-0.9*R;x2-=9){var d2=disp(x2,gy(x2)+3);ctx.lineTo(CX+d2[0],CY+d2[1]);}
  ctx.closePath();ctx.fillStyle='rgba(250,252,255,.96)';ctx.fill();
  // flakes
  for(var j=0;j<flakes.length;j++){
    var fl=flakes[j], dp=disp(fl.x,fl.y), px=CX+dp[0], py=CY+dp[1], rad=fl.sz*(0.75+0.45*dp[2]);
    var gl=Math.sin(t*2.6+fl.gl);
    if(!fl.s&&fl.sz<1.9){
      ctx.fillStyle='rgba(235,242,255,.10)';ctx.beginPath();ctx.arc(px,py,rad*2.4,0,6.3);ctx.fill();
    }
    ctx.fillStyle=(!fl.s&&gl>0.93)?'rgba(255,248,214,1)':'rgba(255,255,255,'+(fl.s?0.95:0.88)+')';
    ctx.beginPath();ctx.arc(px,py,(!fl.s&&gl>0.93)?rad*1.35:rad,0,6.3);ctx.fill();
  }
  // air bubble at the top
  var bx=CX+Math.sin(t*1.8)*stir*7, by=CY-R+22;
  ctx.fillStyle='rgba(235,248,255,.10)';ctx.beginPath();ctx.ellipse(bx,by,14,6,0,0,6.3);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(bx,by,14,6,0,0,6.3);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.ellipse(bx-5,by-2,3.5,1.3,0,0,6.3);ctx.fill();
  ctx.restore();
  ctx.drawImage(glass,0,0,W,H);
  ctx.restore();
  return air;
}

/* ---------- loop + readouts ---------- */
var el={since:document.getElementById('since'),air:document.getElementById('air'),bar:document.getElementById('bar'),shakes:document.getElementById('shakes'),status:document.getElementById('status'),hint:document.getElementById('hint')};
var lastRead=0;
function readouts(force){
  var n=flakes.length, air=airborne(), pct=Math.round(air/n*100);
  var since=tShake===null?'rest':((t-tShake).toFixed(1)+' s');
  if(air===0&&tShake!==null&&!running)since='rest';
  el.since.textContent=since;
  el.air.textContent=pct+'% in the air';
  el.bar.style.width=pct+'%';
  el.shakes.textContent=String(shakes);
  var msg;
  if(air===0)msg=shakes?('Settled. All '+n+' flakes at rest on the hill.'):'Snow at rest on the hill.';
  else if(stir>0.25)msg='Churning. The water is still turning.';
  else if(pct>60)msg='Hanging in the water: '+pct+'% still up.';
  else msg='Settling: '+pct+'% still in the air, the top is clearing.';
  var key=air===0?'rest'+shakes:(stir>0.25?'churn':(pct>60?'hang':'settle'));
  if(force||key!==lastStatus){el.status.textContent=msg;lastStatus=key;}
}
function frame(now){
  var dt=Math.min(1/30,(now-last)/1000||1/60);last=now;
  step(dt);
  var air=render();
  if(now-lastRead>100){readouts(false);lastRead=now;}
  var moving=air>0||stir>0||Math.abs(dome.x)>0.05||Math.abs(dome.y)>0.05||Math.abs(dome.vx)>0.5||Math.abs(dome.vy)>0.5||dome.drag;
  if(moving){requestAnimationFrame(frame);}
  else{running=false;dome.x=dome.y=dome.vx=dome.vy=0;render();readouts(true);}
}
function start(){
  if(!running){running=true;last=performance.now();requestAnimationFrame(frame);}
  if(el.hint)el.hint.style.opacity='0';
}

/* ---------- controls ---------- */
function setPressed(group,attr,val){
  var bs=group.querySelectorAll('button');
  for(var i=0;i<bs.length;i++)bs[i].setAttribute('aria-pressed',bs[i].getAttribute(attr)===val?'true':'false');
}
function hangText(){
  var v=Vbase()*0.78, secs=(1.25*R)/v; // an average flake falling from near the top
  return secs<10?secs.toFixed(1)+' s':Math.round(secs)+' s';
}
document.getElementById('shake').addEventListener('click',function(){shakeEvent(reduce?0.55:1,'button');});
var scenesEl=document.getElementById('scenes');
scenesEl.addEventListener('click',function(e){
  var b=e.target.closest('button[data-scene]');if(!b)return;
  S.scene=b.getAttribute('data-scene');setPressed(scenesEl,'data-scene',S.scene);save();

mixEl.addEventListener('click',function(e){

var viscEl=document.getElementById('visc'), hangEl=document.getElementById('hang');
viscEl.addEventListener('input',function(){S.visc=viscEl.value/100;hangEl.textContent=hangText();save();});
var countEl=document.getElementById('count'), countV=document.getElementById('countv');

lightsEl.addEventListener('change',function(){

/* pointer drag */
var startPt=null, scaleX=1;
cv.addEventListener('pointerdown',function(e){
  try{cv.setPointerCapture(e.pointerId);}catch(x){}
  var r=cv.getBoundingClientRect();scaleX=W/r.width;
  startPt={x:e.clientX,y:e.clientY};dome.drag=true;dome.tx=dome.ty=0;pendingKick=0;start();cv.focus({preventScroll:true});
});
cv.addEventListener('pointermove',function(e){
  if(!dome.drag||!startPt)return;
  dome.tx=Math.max(-60,Math.min(60,(e.clientX-startPt.x)*scaleX*0.7));
  dome.ty=Math.max(-60,Math.min(60,(e.clientY-startPt.y)*scaleX*0.7));
});
function endDrag(){
  if(!dome.drag)return;
  var moved=Math.abs(dome.x)+Math.abs(dome.y), v=Math.sqrt(dome.vx*dome.vx+dome.vy*dome.vy);
  dome.drag=false;startPt=null;
  var s=Math.min(1,(moved/50)*0.5+v/1500);
  if(moved>8||v>200)pendingKick=Math.max(pendingKick,Math.max(0.3,s));
  if(pendingKick>0.05){shakeEvent(pendingKick,'drag');pendingKick=0;}
  start();
}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('lostpointercapture',endDrag);
cv.addEventListener('keydown',function(e){
  if(e.key===' '||e.key==='Enter'){e.preventDefault();shakeEvent(reduce?0.55:1,'key');}
  else if(e.key.indexOf('Arrow')===0){
    e.preventDefault();
    var m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
    dome.vx+=m[0]*1400;dome.vy+=m[1]*1400;shakeEvent(0.3,'nudge');
  }
});
window.addEventListener('devicemotion',function(e){
  var a=e.accelerationIncludingGravity;if(!a)return;
  var m=Math.sqrt((a.x||0)*(a.x||0)+(a.y||0)*(a.y||0)+(a.z||0)*(a.z||0));
  if(m>24)shakeEvent(Math.min(1,(m-18)/20),'motion');
});

/* ---------- init ---------- */
setPressed(scenesEl,'data-scene',S.scene);setPressed(mixEl,'data-mix',S.mix);
viscEl.value=Math.round(S.visc*100);countEl.value=S.count;countV.textContent=S.count;lightsEl.checked=!!S.lights;hangEl.textContent=hangText();
buildRoom();buildGlass();buildScene();makeFlakes();render();readouts(true);
if(!reduce){setTimeout(function(){shakeEvent(0.85,'auto');},500);}
})();
</script>
