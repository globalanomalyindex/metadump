<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snow Globe on the Shelf</title>
<style>
  :root{
    --ink:#e9eef3; --muted:#9fb0bf; --panel:rgba(14,22,30,.82); --line:rgba(255,255,255,.14);
    --accent:#f0c36a; --accent-ink:#2b1c08; --bg:#0f171e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
  #stage.drag{cursor:grabbing}
  #stage:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
  .title{position:fixed;left:16px;top:14px;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .title h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.04em}
  .title p{margin:2px 0 0;font-size:13px;color:var(--muted)}
  .panel{position:fixed;left:16px;right:16px;bottom:16px;margin:0 auto;max-width:760px;background:var(--panel);
    border:1px solid var(--line);border-radius:16px;padding:12px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    display:grid;gap:10px}
  .status{display:grid;gap:6px}
  #status{margin:0;font-size:15px;line-height:1.35;min-height:2.7em}
  .meter{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9fd0ff,#fff);border-radius:3px}
  .row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
  button,select{font:inherit;font-size:15px;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);
    border-radius:10px;min-height:44px;padding:0 16px;cursor:pointer}
  button:hover,select:hover{background:rgba(255,255,255,.15)}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
  button.primary:hover{background:#ffd685}
  button[aria-pressed="true"]{background:rgba(240,195,106,.22);border-color:var(--accent)}
  label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
  input[type=range]{width:150px;min-height:44px;accent-color:var(--accent)}
  .val{color:var(--ink);min-width:9.5em;font-size:14px}
  @media (max-width:560px){
    .panel{left:10px;right:10px;bottom:10px;padding:10px}
    input[type=range]{width:110px}
    .val{min-width:0}
    .title p{display:none}
  }
</style>
</head>
<body>
<canvas id="stage" tabindex="0" role="img" aria-label="A snow globe on a wooden shelf in a dim room. Press Space to shake it, or drag it."></canvas>
<div class="title"><h1>Snow globe</h1><p>Winter pines, on the shelf by the window</p></div>

<section class="panel" aria-label="Snow globe controls">
  <div class="status">
    <p id="status" aria-live="polite">Settled. Drag the globe, tap it, or press Shake.</p>
    <div class="meter" aria-hidden="true"><i id="bar"></i></div>
  </div>
  <div class="row">
    <button id="shake" class="primary" type="button">Shake</button>
    <button id="lean" type="button" aria-pressed="false">Lean in</button>
    <label>Flakes
      <select id="count" aria-label="Amount of glitter">
        <option value="140">Sparse</option>
        <option value="260" selected>Classic</option>
        <option value="520">Blizzard</option>
      </select>
    </label>
    <label>Liquid
      <input id="thick" type="range" min="0" max="100" value="50" aria-label="Glycerin in the water">
      <span class="val" id="thickVal">glycerin 25% (about 1:3)</span>
    </label>
  </div>
</section>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};

var psz=new Float32Array(MAX), pvt=new Float32Array(MAX), pph=new Float32Array(MAX), prest=new Uint8Array(MAX), pglit=new Uint8Array(MAX);
var pk=new Float32Array(MAX); // random 0..1 per flake
var thick=.5;
function ground(x){return .50+.16*x*x}
function initFlakes(){
  for(var i=0;i<MAX;i++){
    pk[i]=Math.random();
    psz[i]=.011+Math.random()*.014;
    pph[i]=Math.random()*6.28;
    pglit[i]=Math.random()<.2?1+((Math.random()*3)|0):0;
  }
  assignFall();
  for(i=0;i<N;i++) restFlake(i);
}
function assignFall(){
  var base=.65*Math.exp(-2.6*thick);
  for(var i=0;i<MAX;i++) pvt[i]=base*(.55+.9*pk[i]);
}
function restFlake(i){
  var a=Math.random()*3.14159, r=Math.sqrt(Math.random())*.72;
  var x=Math.cos(a)*r*(Math.random()<.5?-1:1);
  px[i]=x; py[i]=ground(x)-psz[i]*(.2+Math.random()*1.2); pvx[i]=0; pvy[i]=0; prest[i]=1;

/* ---------- fluid + globe state ---------- */
var E=0, W=0, t=0, lastShakeT=-1, settledDur=null, hadShake=false, afloat=0;
var bandTop=0, bandMid=0, bandLow=0;
var ox=0, oy=0, ovx=0, ovy=0, rot=0, pVx=0, pVy=0;
var dragging=false, grabDX=0, grabDY=0, moved=0, downT=0, lastPtr=null;
var shk=null;

/* ---------- camera ---------- */
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  cw=window.innerWidth; ch=window.innerHeight;

  room.width=cv.width; room.height=cv.height;

  viewH=Math.max(ch*.5, ch-panel.offsetHeight-14);

function ease(c){return c*c*(3-2*c)}
function camXf(){
  var e=ease(cam), z=1+(zT-1)*e, fx=GX, fy=450+(GY+.25*R-450)*e;

function toWorld(sx,sy){var c=camXf();return {x:(sx-c.cx)/c.css,y:(sy-c.cy)/c.css}}

  // books

}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawScene(c){
  var g;
  // snowy mound

  c.fillStyle="#4a2a1d";c.fillRect(.4,.04,.05,.12);c.fillStyle="#f4f9ff";c.fillRect(.395,.03,.06,.025);
  g=c.createLinearGradient(0,.3,0,.42);g.addColorStop(0,"#fff0b8");g.addColorStop(1,"#ffb85a");
  c.fillStyle=g;c.fillRect(.2,.3,.1,.1);
  c.fillStyle="#3a2014";c.fillRect(.248,.3,.006,.1);c.fillRect(.2,.347,.1,.006);
  c.fillStyle="#2c1810";c.fillRect(.37,.33,.08,.19);
  c.fillStyle="#e8b660";c.beginPath();c.arc(.435,.43,.007,0,6.3);c.fill();
  // trees
  tree(c,-.30,.52,.78,.26);
  tree(c,-.58,.585,.52,.18);
  tree(c,-.06,.545,.4,.15);
  tree(c,.72,.58,.34,.12);
}
function tree(c,x,y,h,w){
  c.fillStyle="#3b2a20";c.fillRect(x-.012,y-.04,.024,.07);
  var tiers=4, i, th=h/tiers*1.35;
  for(i=0;i<tiers;i++){
    var ty=y-.03-i*(h/tiers)*.8, tw=w*(1-i*.2);
    c.fillStyle=i%2?"#1f4b3c":"#245441";
    c.beginPath();c.moveTo(x-tw,ty);c.lineTo(x,ty-th);c.lineTo(x+tw,ty);c.closePath();c.fill();
    c.fillStyle="#f4f9ff";
    c.beginPath();c.moveTo(x-tw*.72,ty-th*.28);c.lineTo(x,ty-th);c.lineTo(x+tw*.72,ty-th*.28);
    c.quadraticCurveTo(x+tw*.3,ty-th*.18,x,ty-th*.3);c.quadraticCurveTo(x-tw*.3,ty-th*.18,x-tw*.72,ty-th*.28);c.fill();
  }
}
function drawFlakes(c){
  var i;
  c.fillStyle="rgba(255,255,255,.88)";
  c.beginPath();
  for(i=0;i<N;i++){ if(pglit[i])continue; c.moveTo(px[i]+psz[i],py[i]); c.arc(px[i],py[i],psz[i],0,6.2832); }
  c.fill();
  var cols=["","#ffe9a8","#cfe8ff","#ffffff"];
  for(i=0;i<N;i++){
    var gl=pglit[i]; if(!gl)continue;
    var tw=.5+.5*Math.sin(t*(prest[i]?1.2:4)+pph[i]*3);
    c.globalAlpha=.45+.55*tw;
    c.fillStyle=cols[gl];
    c.beginPath();c.arc(px[i],py[i],psz[i]*1.25,0,6.2832);c.fill();
    if(tw>.86){
      c.strokeStyle=cols[gl];c.lineWidth=.005;var L=psz[i]*3;
      c.beginPath();c.moveTo(px[i]-L,py[i]);c.lineTo(px[i]+L,py[i]);c.moveTo(px[i],py[i]-L);c.lineTo(px[i],py[i]+L);c.stroke();
    }
  }
  c.globalAlpha=1;
}
function drawBase(c){
  c.save();c.scale(R,R);
  var g=c.createLinearGradient(-1.1,0,1.1,0);
  g.addColorStop(0,"#7d2d33");g.addColorStop(.3,"#541820");g.addColorStop(.7,"#3a0f15");g.addColorStop(1,"#6a2420");
  c.fillStyle=g;
  c.beginPath();c.moveTo(-.88,.8);c.bezierCurveTo(-.88,.94,.88,.94,.88,.8);
  c.bezierCurveTo(.98,1.02,1.08,1.2,1.12,1.44);c.quadraticCurveTo(1.12,1.52,1.04,1.52);c.lineTo(-1.04,1.52);c.quadraticCurveTo(-1.12,1.52,-1.12,1.44);
  c.bezierCurveTo(-1.08,1.2,-.98,1.02,-.88,.8);c.closePath();c.fill();
  // gold lip and band
  var gg=c.createLinearGradient(-1,0,1,0);gg.addColorStop(0,"#e8c872");gg.addColorStop(.5,"#9a7a30");gg.addColorStop(1,"#f0d684");
  c.strokeStyle=gg;c.lineWidth=.035;c.lineCap="round";
  c.beginPath();c.moveTo(-.88,.8);c.bezierCurveTo(-.88,.94,.88,.94,.88,.8);c.stroke();
  c.lineWidth=.03;c.beginPath();c.moveTo(-1.1,1.4);c.lineTo(1.1,1.4);c.stroke();
  c.lineWidth=.012;c.beginPath();c.moveTo(-1.11,1.34);c.lineTo(1.11,1.34);c.stroke();
  // plaque
  c.fillStyle=gg;rr(c,-.34,1.0,.68,.25,.04);c.fill();
  c.fillStyle="rgba(60,34,8,.8)";
  c.beginPath();c.moveTo(0,1.04);c.lineTo(-.08,1.14);c.lineTo(-.04,1.14);c.lineTo(-.1,1.21);c.lineTo(.1,1.21);c.lineTo(.04,1.14);c.lineTo(.08,1.14);c.closePath();c.fill();
  // sheen
  g=c.createLinearGradient(0,.9,0,1.5);g.addColorStop(0,"rgba(255,255,255,.12)");g.addColorStop(1,"rgba(255,255,255,0)");
  c.fillStyle=g;
  c.beginPath();c.moveTo(-.88,.8);c.bezierCurveTo(-.88,.94,.88,.94,.88,.8);
  c.bezierCurveTo(.98,1.02,1.08,1.2,1.12,1.44);c.quadraticCurveTo(1.12,1.52,1.04,1.52);c.lineTo(-1.04,1.52);c.quadraticCurveTo(-1.12,1.52,-1.12,1.44);
  c.bezierCurveTo(-1.08,1.2,-.98,1.02,-.88,.8);c.closePath();c.fill();
  c.restore();
}

/* ---------- physics ---------- */
function shakeImpulse(dvm,ax,ay){
  var i;
  E=Math.min(1.5,E+dvm*.03);
  W+=(Math.random()<.5?-1:1)*dvm*.02; W=Math.max(-1.6,Math.min(1.6,W));
  var wp=Math.min(1,dvm*.12);
  for(i=0;i<N;i++){
    if(prest[i]){
      if(Math.random()<wp){prest[i]=0;pvy[i]=-(.3+Math.random()*1.3)*Math.min(1.4,.4+E);pvx[i]=(Math.random()-.5)*.8*Math.min(1.4,.4+E);}
    }else{
      pvx[i]-=ax*.35;pvy[i]-=ay*.35;
    }
  }
  if(dvm>.15){lastShakeT=t;settledDur=null;hadShake=true}
}
function step(dt){
  var i, tauE=1.1+5.2*thick;
  // globe motion
  if(shk){
    var s=t-shk.t0, p=s/shk.dur;
    if(p>=1){shk=null}else{
      var env=Math.min(1,s/.08)*Math.sqrt(1-p);
      var nx=shk.amp*Math.sin(s*34)*env, ny=shk.amp*.45*Math.sin(s*29+1)*env;
      ovx=(nx-ox)/dt; ovy=(ny-oy)/dt; ox=nx; oy=ny;
    }
  }
  if(dragging){
    // position set by pointer handler; velocity measured here
  }else if(!shk){
    var K=140, C=10;
    ovx+=(-K*ox-C*ovx)*dt; ovy+=(-K*oy-C*ovy)*dt;
    ox+=ovx*dt; oy+=ovy*dt;
    if(Math.abs(ox)<.02&&Math.abs(oy)<.02&&Math.abs(ovx)<.3&&Math.abs(ovy)<.3){ox=oy=ovx=ovy=0}
  }
  var Vx=dragging?(ox-pOx)/dt:ovx, Vy=dragging?(oy-pOy)/dt:ovy;
  var ax=(Vx-pVx)/R, ay=(Vy-pVy)/R, dvm=Math.hypot(ax,ay);
  pVx=Vx;pVy=Vy;pOx=ox;pOy=oy;
  if(dvm>.02) shakeImpulse(dvm,ax,ay);
  rot=ox*.0035;

  E*=Math.exp(-dt/tauE); W*=Math.exp(-dt/(tauE*1.3));
  var sw=E*.55, dr=1-Math.exp(-dt*2.2);
  var nTop=0,nMid=0,nLow=0; afloat=0;
  for(i=0;i<N;i++){
    if(prest[i])continue;
    var x=px[i],y=py[i],ph=pph[i];
    var tx=sw*(Math.sin(y*3.3+t*1.7+ph)+.7*Math.sin(x*2.1-t*1.1))-W*y*.5;
    var ty=pvt[i]+sw*(Math.cos(x*3+t*1.4+ph)+.5*Math.sin(y*2.4+t*.8))+W*x*.5;
    pvx[i]+=(tx-pvx[i])*dr; pvy[i]+=(ty-pvy[i])*dr;
    x+=pvx[i]*dt; y+=pvy[i]*dt;
    var r=Math.hypot(x,y), lim=.985-psz[i];
    if(r>lim){var nx=x/r,ny=y/r,vn=pvx[i]*nx+pvy[i]*ny;x=nx*lim;y=ny*lim;if(vn>0){pvx[i]-=vn*nx;pvy[i]-=vn*ny}}
    var gy=ground(x)-psz[i]*.5;
    if(y>=gy){y=ground(x)-psz[i]*(.2+pk[i]*1.1);prest[i]=1;pvx[i]=pvy[i]=0}
    else{
      afloat++;
      if(y<-.35)nTop++;else if(y<.12)nMid++;else nLow++;
    }
    px[i]=x;py[i]=y;
  }
  // bands: uniform share of a full cloud is about .3 / .35 / .35 of N
  var tg=function(n,share){return Math.min(1,n/(N*share)*1.05)};
  var a=1-Math.exp(-dt*5);
  bandTop+=(tg(nTop,.28)-bandTop)*a; bandMid+=(tg(nMid,.34)-bandMid)*a; bandLow+=(tg(nLow,.38)-bandLow)*a;
  if(hadShake&&settledDur===null&&afloat===0&&E<.03&&!shk&&!dragging){settledDur=t-lastShakeT;announce()}
}
var pOx=0,pOy=0;

/* ---------- ui ---------- */
var lastMsg="", lastUi=0;
function announce(force){
  var msg;
  if(afloat>0||E>.05||shk||dragging){
    var since=Math.max(0,t-lastShakeT);
    msg="Snow in the water: "+since.toFixed(1)+" s since the shake, "+afloat+" of "+N+" flakes still afloat.";
  }else if(settledDur!==null){
    msg="Settled "+settledDur.toFixed(1)+" s after the shake. The top cleared first, the base last. Shake again?";
  }else{
    msg="Settled. Drag the globe, tap it, or press Shake.";
  }
  if(msg!==lastMsg||force){statusEl.textContent=msg;lastMsg=msg}
  bar.style.width=(N?afloat/N*100:0).toFixed(1)+"%";
}
function startShake(amp){
  shk={t0:t,dur:.9,amp:amp||22};
  wake();
}
$("#shake").addEventListener("click",function(){startShake(22)});
var leanBtn=$("#lean");
function setLean(on){
  camT=on?1:0;leanBtn.setAttribute("aria-pressed",on?"true":"false");leanBtn.textContent=on?"Step back":"Lean in";
  if(reduce){cam=camT;roomDirty=true}
  wake();
}
leanBtn.addEventListener("click",function(){setLean(camT<.5)});
$("#count").addEventListener("change",function(e){
  N=parseInt(e.target.value,10)||260;
  E=0;W=0;for(var i=0;i<MAX;i++){} for(i=0;i<N;i++)restFlake(i);
  settledDur=null;hadShake=false;afloat=0;bandTop=bandMid=bandLow=0;
  announce(true);
  startShake(22);
});
var thickEl=$("#thick"), thickVal=$("#thickVal");
function updThick(){
  thick=thickEl.value/100;assignFall();
  var g=Math.round(thick*50);
  thickVal.textContent=g===0?"plain water":"glycerin "+g+"%"+(g>=23&&g<=27?" (about 1:3)":g>=40?" (syrupy)":"");
  wake();
}
thickEl.addEventListener("input",updThick);

/* ---------- input ---------- */
function hit(wx,wy){
  var dx=wx-(GX+ox), dy=wy-(GY+oy);
  if(dx*dx+dy*dy<=R*R*1.1)return true;
  return Math.abs(dx)<R*1.1&&dy>R*.7&&dy<R*1.6;
}
cv.addEventListener("pointerdown",function(e){
  var w=toWorld(e.clientX,e.clientY);
  if(!hit(w.x,w.y))return;
  dragging=true;moved=0;downT=t;shk=null;
  grabDX=w.x-(GX+ox);grabDY=w.y-(GY+oy);lastPtr={x:e.clientX,y:e.clientY};
  cv.classList.add("drag");
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  pOx=ox;pOy=oy;wake();e.preventDefault();
});
cv.addEventListener("pointermove",function(e){
  if(!dragging){var w0=toWorld(e.clientX,e.clientY);cv.style.cursor=hit(w0.x,w0.y)?"grab":"default";return}
  var w=toWorld(e.clientX,e.clientY);
  var dx=w.x-grabDX-GX, dy=w.y-grabDY-GY, M=46;
  ox=M*Math.tanh(dx/M);oy=M*Math.tanh(dy/M);
  moved+=Math.hypot(e.clientX-lastPtr.x,e.clientY-lastPtr.y);lastPtr={x:e.clientX,y:e.clientY};
  wake();
});
function endDrag(e){
  if(!dragging)return;
  dragging=false;cv.classList.remove("drag");
  ovx=pVx;ovy=pVy;
  if(moved<6){ovy=-360;ovx=(Math.random()-.5)*120} // a tap: nudge the globe
  try{cv.releasePointerCapture(e.pointerId)}catch(_){}
  wake();
}
cv.addEventListener("pointerup",endDrag);
cv.addEventListener("pointercancel",endDrag);
cv.addEventListener("keydown",function(e){
  if(e.key===" "||e.key==="Enter"){e.preventDefault();startShake(22)}
  else if(e.key==="l"||e.key==="L"){setLean(camT<.5)}
});
cv.addEventListener("wheel",function(e){
  if(e.deltaY<0&&camT<.5)setLean(true);else if(e.deltaY>0&&camT>.5)setLean(false);
},{passive:true});
window.addEventListener("resize",resize);

/* ---------- loop ---------- */
var raf=0,prev=0;
function wake(){if(!raf){prev=0;raf=requestAnimationFrame(frame)}}
function render(){
  var xf=camXf();
  if(roomDirty){
    rctx.setTransform(1,0,0,1,0,0);rctx.clearRect(0,0,room.width,room.height);
    rctx.setTransform(xf.k,0,0,xf.k,xf.tx,xf.ty);
    rnd=(function(){var s=7;return function(){s=(s*16807)%2147483647;return (s-1)/2147483646}})();
    drawRoom(rctx);roomDirty=false;
  }
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(room,0,0);
  ctx.setTransform(xf.k,0,0,xf.k,xf.tx,xf.ty);
  drawShadow(ctx);
  drawGlobe(ctx,xf);
}
function frame(now){
  raf=0;
  var dt=prev?Math.min(.05,(now-prev)/1000):.016;prev=now;
  t+=dt;
  var busy=false;
  if(cam!==camT){
    if(reduce)cam=camT;else{var d=camT-cam;cam+=Math.sign(d)*Math.min(Math.abs(d),dt*1.6)}
    roomDirty=true;busy=true;
  }
  step(dt);
  render();
  if(now-lastUi>110){lastUi=now;announce()}
  if(busy||afloat>0||E>.004||shk||dragging||Math.abs(ox)+Math.abs(oy)>.02||Math.abs(ovx)+Math.abs(ovy)>.3){raf=requestAnimationFrame(frame)}
  else{announce();}
}

initFlakes();
updThick();
resize();
render();
announce(true);
setTimeout(function(){startShake(22)},500);
})();
</script>
