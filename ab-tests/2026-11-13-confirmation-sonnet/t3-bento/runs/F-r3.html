<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tinwell Coffee Bento Menu</title>
<style>
:root{
  --ground:#1d1715; --ground2:#2c2826; --cream:#e4d6db; --cream2:#efe3d0; --ink:#1d1715;
  --accent:#c8742f; --muted:#b9a99f; --gap:8px; --r:18px;
  --open-ms:320ms; --close-ms:130ms;
  --display:"Arial Narrow","Helvetica Neue Condensed","Roboto Condensed","Franklin Gothic Medium Cond",Impact,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#efe6da;color:var(--ink);font-family:var(--body);min-height:100vh}
.page{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.site-bar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.page-copy{padding-top:12px}
.page-copy small{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;color:#7a5a45}
.page-copy h1{font-family:var(--display);text-transform:uppercase;font-size:clamp(40px,8vw,84px);line-height:.92;margin:6px 0 10px;max-width:9ch}
.page-copy p{max-width:36ch;color:#4a3a30;margin:0}
.readout{margin-top:22px;font-size:14px;display:flex;gap:10px;flex-wrap:wrap}
.readout span{background:#fff8;border:1px solid #0002;border-radius:999px;padding:6px 12px}
.readout b{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em}

/* component */
.bento{position:relative;width:min(440px,100%);flex:none}
.bar{display:flex;align-items:center;justify-content:space-between;background:var(--ground);color:var(--cream);border-radius:var(--r);padding:8px 8px 8px 16px;height:56px;position:relative;z-index:3}
.brand{font-family:var(--display);text-transform:uppercase;font-size:22px;letter-spacing:.08em}
.brand i{font-style:normal;color:var(--accent)}
.trigger{appearance:none;border:0;cursor:pointer;display:flex;align-items:center;gap:10px;height:40px;padding:0 14px 0 12px;border-radius:12px;background:var(--cream);color:var(--ink);font:600 15px/1 var(--display);text-transform:uppercase;letter-spacing:.1em;min-width:48px}
.trigger{transition:background .15s,transform .15s}.trigger:hover{background:#fff;transform:translateY(-1px)}
.trigger:focus-visible,.cell:focus-visible,.cta:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tins{position:relative;width:22px;height:22px;display:block}
.tins i{position:absolute;left:2px;right:2px;height:7px;border-radius:3px;background:var(--ink);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.tins i:nth-child(1){top:0}.tins i:nth-child(2){top:7.5px;opacity:.75}.tins i:nth-child(3){top:15px;opacity:.5}
.bento.open .tins i:nth-child(1){transform:translate(-2px,0) rotate(-6deg)}
.bento.open .tins i:nth-child(3){transform:translate(2px,0) rotate(6deg)}
.count{font:600 12px var(--body);background:var(--accent);color:#fff;border-radius:999px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px;letter-spacing:0}

.grid{position:relative;z-index:1;margin-top:var(--gap);display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:92px;gap:var(--gap)}
.cell{position:relative;overflow:hidden;border-radius:var(--r);border:0;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;color:var(--cream);font:inherit;
  transform:translate(var(--dx,0),var(--dy,0)) scale(var(--s,1)) rotate(var(--rot,0deg));
  transition:transform var(--open-ms) cubic-bezier(.16,.84,.3,1) calc(var(--i)*45ms),opacity 200ms ease calc(var(--i)*45ms),filter 200ms;
  will-change:transform}
.bento:not(.open) .cell{--s:.25;opacity:0;pointer-events:none;transition:transform var(--close-ms) ease-in,opacity var(--close-ms) ease-in,visibility 0s linear var(--close-ms);visibility:hidden}
.cell:hover{filter:brightness(1.12)}
.cell[aria-current="true"]{box-shadow:inset 0 0 0 3px var(--accent)}
.cell .k{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;font-size:17px;line-height:1;overflow-wrap:anywhere}
.cell{min-width:0}
.cell small{font-size:12px;opacity:.85;margin-top:4px;line-height:1.25}
.cell .tag{position:absolute;top:10px;right:12px;font:600 11px var(--display);letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.c-hero{grid-column:span 2;grid-row:span 2;background:radial-gradient(circle at 70% 30%,#7a4a2a 0,#3a241a 45%,#1d1715 80%);}
.c-hero .k{font-size:32px;max-width:8ch;overflow-wrap:normal}
.c-hero::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#e4d6db 0,#c9a98e 22%,#4b2f20 24%,#2c2826 60%);opacity:.9;box-shadow:0 0 0 10px #ffffff10}
.c-beans{grid-column:span 2;background:linear-gradient(135deg,#2c2826,#4a3226 60%,#6a4a35)}
.c-cream{background:var(--cream);color:var(--ink)}
.c-cream2{background:var(--cream2);color:var(--ink)}
.c-dark{background:var(--ground2)}
.c-accent{background:var(--accent);color:#1d1715}
.c-wide{grid-column:span 2;background:linear-gradient(160deg,#e4d6db,#c9a98e);color:var(--ink)}
.cta{grid-column:span 4;appearance:none;border:0;border-radius:var(--r);background:var(--cream);color:var(--ink);cursor:pointer;font:700 20px var(--display);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  transform:translate(var(--dx,0),var(--dy,0)) scale(var(--s,1));transition:transform var(--open-ms) cubic-bezier(.16,.84,.3,1) calc(var(--i)*45ms),opacity 200ms ease calc(var(--i)*45ms)}
.bento:not(.open) .cta{--s:.25;opacity:0;visibility:hidden;pointer-events:none;transition:transform var(--close-ms) ease-in,opacity var(--close-ms),visibility 0s linear var(--close-ms)}
.cta:hover{background:#fff}
.cta .count{background:var(--ink)}
.toast{font-size:13px;color:#4a3a30;margin-top:10px;min-height:1.4em}

@media (max-width:640px){
  .site-bar{flex-direction:column}
  .bento{width:100%}
  .grid{grid-auto-rows:84px}
  .cell .k{font-size:15px}.c-hero .k{font-size:26px}.cell{padding:10px}.cell small{font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  .cell,.cta{transition:opacity 90ms linear!important;transform:none!important}
  .bento:not(.open) .cell,.bento:not(.open) .cta{transition:opacity 60ms linear,visibility 0s linear 60ms!important}
  .tins i{transition:none}
}
</style>
</head>
<body>
<div class="page">
  <div class="site-bar">
    <div class="page-copy">
      <small>Roasted in small tins since 1987</small>
      <h1>Tinwell Coffee</h1>
      <p>Open the menu and the tins lift out of the stack into one tidy grid. Close it and they stack back up.</p>
      <div class="readout" aria-live="polite">
        <span>Menu: <b id="st-menu">closed</b></span>
        <span>Page: <b id="st-page">Home</b></span>
        <span>Bag: <b id="st-bag">0 tins</b></span>
      </div>
      <div class="toast" id="toast" role="status"></div>
    </div>

    <nav class="bento" id="bento" aria-label="Tinwell Coffee">
      <div class="bar">
        <span class="brand">Tin<i>well</i></span>
        <button class="trigger" id="trigger" aria-expanded="false" aria-controls="grid">
          <span class="tins" aria-hidden="true"><i></i><i></i><i></i></span>
          <span id="tlabel">Menu</span>
        </button>
      </div>
      <div class="grid" id="grid">
        <button class="cell c-hero" data-page="Shop beans" data-note="Browsing single-origin beans."><span class="tag">New</span><span class="k">Shop beans</span><small>Single-origin, roasted this week</small></button>
        <button class="cell c-cream" data-page="Subscribe" data-note="Subscription plans opened."><span class="k">Plans</span><small>Biweekly</small></button>
        <button class="cell c-dark" data-page="Brew guides" data-note="Brew guides opened."><span class="k">Brew guides</span><small>V60, moka</small></button>
        <button class="cell c-wide" data-page="Cafés" data-note="Finding a café near you."><span class="k">Our cafés</span><small>14 counters, open 7 to 4</small></button>
        <button class="cell c-accent" data-page="Gifts" data-note="Gift tins opened."><span class="k">Gifts</span><small>Tins, tied</small></button>
        <button class="cell c-beans" data-page="Our story" data-note="Reading our story."><span class="k">Our story</span><small>Farm to tin in five steps</small></button>
        <button class="cell c-cream2" data-page="Journal" data-note="Journal opened."><span class="k">Journal</span><small>Notes</small></button>
        <button class="cta" id="add"><span>Add a tin</span><span class="count" id="count">0</span></button>
      </div>
    </nav>
  </div>
</div>

<script>
(function(){
  var bento=document.getElementById('bento'), trigger=document.getElementById('trigger'),
      grid=document.getElementById('grid'), tlabel=document.getElementById('tlabel'),
      stMenu=document.getElementById('st-menu'), stPage=document.getElementById('st-page'),
      stBag=document.getElementById('st-bag'), count=document.getElementById('count'),
      toast=document.getElementById('toast');
  var items=[].slice.call(grid.children), bag=0, open=false;
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)');

  items.forEach(function(el,i){el.style.setProperty('--i',i)});

  // Every cell lifts out of the stack sitting under the trigger.
  function place(){
    var t=trigger.getBoundingClientRect(), tx=t.left+t.width/2, ty=t.top+t.height/2;
    items.forEach(function(el,i){
      var saved=el.style.transform; el.style.transform='none';
      var r=el.getBoundingClientRect();
      el.style.transform=saved;
      el.style.setProperty('--dx',(tx-(r.left+r.width/2)).toFixed(1)+'px');
      el.style.setProperty('--dy',(ty-(r.top+r.height/2)+i*2).toFixed(1)+'px');
      el.style.setProperty('--rot',((i%3-1)*3)+'deg');
    });
  }
  function set(state){
    open=state;
    if(state && !reduce.matches){ place(); }
    bento.classList.toggle('open',state);
    trigger.setAttribute('aria-expanded',state);
    tlabel.textContent=state?'Close':'Menu';
    stMenu.textContent=state?'open':'closed';
    grid.inert=!state;
    if(!state) items.forEach(function(el){el.style.setProperty('--dx','0px');el.style.setProperty('--dy','0px')});
  }
  grid.inert=true; place();
  // closed positions must be the stack; compute once on load too
  items.forEach(function(el){el.style.setProperty('--dx','0px')});
  place();
  // set stack offsets for the closed state
  function stack(){ if(!open){ place(); } }
  window.addEventListener('resize',function(){ if(open) place(); else stack(); });
  stack();

  trigger.addEventListener('click',function(){ set(!open); });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape' && open){ set(false); trigger.focus(); }
  });
  document.addEventListener('click',function(e){
    if(open && !bento.contains(e.target)) set(false);
  });

  items.forEach(function(el){
    if(!el.dataset.page) return;
    el.addEventListener('click',function(){
      items.forEach(function(o){o.removeAttribute('aria-current')});
      el.setAttribute('aria-current','true');
      stPage.textContent=el.dataset.page;
      toast.textContent=el.dataset.note;
      set(false); trigger.focus();
    });
  });
  document.getElementById('add').addEventListener('click',function(){
    bag++; count.textContent=bag;
    stBag.textContent=bag+(bag===1?' tin':' tins');
    toast.textContent='Added a tin to your bag.';
  });
})();
</script>
</body>
</html>
