<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ember &amp; Oak Bento Menu</title>
<style>
:root{
  --espresso:#2a1a12; --roast:#3b2418; --cream:#fbf5e9; --paper:#f1e6d1; --caramel:#d98a3d; --caramel-d:#b8691f;
  --sage:#a3b18a; --ink:#2a1a12; --muted:#7a6350;
  --r:18px; --gap:10px;
  --ease:cubic-bezier(.22,.9,.3,1);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
  font-family:Georgia,"Iowan Old Style","Times New Roman",serif;padding:24px 16px 60px}
button,input{font:inherit;color:inherit}
.site{max-width:760px;margin:0 auto}
.hero-copy{padding:56px 4px 0;color:var(--muted);font-size:15px;line-height:1.5}
.hero-copy h1{font-size:clamp(30px,6vw,46px);margin:0 0 8px;color:var(--espresso);letter-spacing:-.02em}

.menu{position:relative;background:var(--espresso);border-radius:26px;padding:8px;
  box-shadow:0 18px 40px -18px rgba(42,26,18,.6)}
.bar{display:flex;align-items:center;gap:12px;padding:6px 8px 6px 14px;color:var(--cream)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.01em;flex:1;min-width:0}
.brand svg{flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart{font:600 13px system-ui,sans-serif;background:var(--roast);padding:8px 12px;border-radius:999px;color:var(--cream);white-space:nowrap}
.cart b{color:var(--caramel)}
.trigger{display:flex;align-items:center;gap:10px;background:var(--caramel);color:var(--espresso);border:0;
  font:700 14px system-ui,sans-serif;padding:11px 16px;border-radius:999px;cursor:pointer;
  transition:background .2s,transform .15s}
.trigger:hover{background:#e79a4f}
.trigger:active{transform:scale(.96)}
.trigger:focus-visible,.tile:focus-visible,.mini:focus-visible,.news input:focus-visible,.news button:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
.burger{width:16px;height:12px;position:relative}
.burger i{position:absolute;left:0;right:0;height:2px;background:currentColor;border-radius:2px;transition:transform .3s var(--ease),opacity .2s,top .3s var(--ease)}
.burger i:nth-child(1){top:0}.burger i:nth-child(2){top:5px}.burger i:nth-child(3){top:10px}
.menu.open .burger i:nth-child(1){top:5px;transform:rotate(45deg)}
.menu.open .burger i:nth-child(2){opacity:0}
.menu.open .burger i:nth-child(3){top:5px;transform:rotate(-45deg)}

.lid{display:grid;grid-template-rows:0fr;transition:grid-template-rows .42s var(--ease)}
.menu.open .lid{grid-template-rows:1fr}
.lid>.inner{overflow:hidden;min-height:0}
.menu:not(.open) .inner{visibility:hidden;transition:visibility 0s .3s}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(92px,auto);gap:var(--gap);padding:8px 0 0;
  grid-template-rows:repeat(3,minmax(92px,auto)) auto;
  grid-template-areas:"feat feat shop shop" "feat feat roast bag" "learn learn news news" "status status status status"}
.tile{position:relative;border:0;text-align:left;border-radius:var(--r);padding:14px;cursor:pointer;
  background:var(--cream);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;gap:6px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 8px rgba(42,26,18,.12);
  opacity:0;transform:translateY(14px) scale(.97);
  transition:opacity .25s,transform .25s var(--ease),background .2s,box-shadow .2s}
.menu.open .tile{opacity:1;transform:none;transition-delay:calc(var(--i)*45ms + 60ms),calc(var(--i)*45ms + 60ms),0s,0s}
.tile:hover{transform:translateY(-2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 8px rgba(42,26,18,.12),0 8px 14px -8px rgba(0,0,0,.5)}
.menu.open .tile:hover{transform:translateY(-2px);transition-delay:0s}
.tile .k{font:700 11px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tile .t{font-size:19px;font-weight:700;line-height:1.1}
.tile .d{font:13px/1.35 system-ui,sans-serif;color:var(--muted)}
.tile[aria-current="true"]{outline:3px solid var(--caramel);outline-offset:-3px}
.tile[aria-current="true"]::after{content:"You are here";position:absolute;top:10px;right:12px;font:700 10px system-ui,sans-serif;
  background:var(--caramel);color:var(--espresso);padding:3px 8px;border-radius:999px}
.feat{grid-area:feat;background:var(--caramel);color:var(--espresso);justify-content:flex-end}
.feat .k,.feat .d{color:#4a2c14}
.feat .t{font-size:clamp(24px,4.5vw,34px);letter-spacing:-.02em}
.feat svg{position:absolute;top:14px;right:14px;width:90px;height:90px;opacity:.9}
.feat[aria-current="true"]::after{background:var(--espresso);color:var(--cream);top:auto;bottom:12px}
.shop{grid-area:shop}
.learn{grid-area:learn;background:var(--sage)}
.learn .k,.learn .d{color:#2f3a22}
.roast{grid-area:roast;align-items:flex-start;transition:background .35s}
.roast[data-r="light"]{background:#e6c48a}.roast[data-r="medium"]{background:#b9803f}.roast[data-r="dark"]{background:#5a3520;color:var(--cream)}
.roast[data-r="dark"] .k,.roast[data-r="dark"] .d{color:#e0cdb4}
.bag{grid-area:bag;background:var(--roast);color:var(--cream);cursor:default}
.bag:hover{transform:none}
.bag .k{color:#d8c3a6}
.qty{display:flex;align-items:center;gap:8px}
.mini{width:30px;height:30px;border-radius:50%;border:0;background:var(--caramel);color:var(--espresso);font:700 18px/1 system-ui,sans-serif;cursor:pointer}
.mini:hover{background:#e79a4f}
.qty output{font:700 22px system-ui,sans-serif;min-width:22px;text-align:center}
.news{grid-area:news;background:var(--cream);cursor:default}
.news:hover{transform:none}
.news form{display:flex;gap:6px}
.news input{flex:1;min-width:0;border:2px solid #d8c8ae;background:#fff;border-radius:10px;padding:8px 10px;font:14px system-ui,sans-serif}
.news form button{border:0;background:var(--espresso);color:var(--cream);border-radius:10px;padding:0 12px;font:700 13px system-ui,sans-serif;cursor:pointer}
.news .msg{font:12px system-ui,sans-serif;min-height:16px;color:var(--muted)}
.news .msg.bad{color:#a3361a}
.grid>.status{align-self:start;min-height:0}
.roast[data-r="light"] .d,.roast[data-r="light"] .k,.roast[data-r="medium"] .d,.roast[data-r="medium"] .k{color:#2a1a12}
.status{grid-area:status;color:#e0cdb4;font:13px system-ui,sans-serif;padding:4px 6px 6px;display:flex;justify-content:space-between;gap:10px}
.status b{color:var(--caramel)}

@media (max-width:560px){
  .grid{grid-template-columns:repeat(2,1fr);grid-template-rows:none;
    grid-template-areas:"feat feat" "feat feat" "shop roast" "learn learn" "bag bag" "news news" "status status"}
  .brand span{font-size:14px}
  .cart{padding:7px 10px}
  .trigger span.l{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;transition-delay:0s!important}
  .tile{transform:none!important}
}
</style>
</head>
<body>
<div class="site">
  <nav class="menu" id="menu" aria-label="Ember &amp; Oak">
    <div class="bar">
      <div class="brand">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><ellipse cx="14" cy="14" rx="9" ry="12" fill="#d98a3d" transform="rotate(25 14 14)"/><path d="M8 24C13 16 15 12 20 4" stroke="#2a1a12" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        <span>Ember &amp; Oak</span>
      </div>
      <div class="cart" aria-live="polite">Bags <b id="cartN">0</b></div>
      <button class="trigger" id="trigger" aria-expanded="false" aria-controls="lid"><span class="l" id="trigLabel">Menu</span><span class="burger" aria-hidden="true"><i></i><i></i><i></i></span></button>
    </div>
    <div class="lid" id="lid"><div class="inner">
      <div class="grid" id="grid">
        <button class="tile feat" data-name="Spring Harvest" style="--i:0">
          <svg viewBox="0 0 90 90" aria-hidden="true"><ellipse cx="45" cy="45" rx="28" ry="38" fill="#2a1a12" transform="rotate(25 45 45)"/><path d="M26 78C40 52 48 40 62 12" stroke="#d98a3d" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
          <span class="k">Featured roast</span><span class="t">Spring Harvest</span><span class="d">Honeyed single origin, Huila. Notes of stone fruit and cocoa.</span>
        </button>
        <button class="tile shop" data-name="Shop beans" style="--i:1"><span class="k">Shop</span><span class="t">All beans</span><span class="d">12 roasts</span></button>
        <button class="tile roast" id="roastTile" data-r="medium" data-name="Roast guide" style="--i:2"><span class="k">Roast</span><span class="t" id="roastName">Medium</span><span class="d">Tap to change</span></button>
        <div class="tile bag" style="--i:3"><span class="k">Add a bag</span><div class="qty"><button class="mini" id="minus" aria-label="Fewer bags">&minus;</button><output id="qty" aria-live="polite">0</output><button class="mini" id="plus" aria-label="More bags">+</button></div></div>
        <button class="tile learn" data-name="Brew guides" style="--i:4"><span class="k">Learn</span><span class="t">Brew guides</span><span class="d">Pour-over, press, espresso.</span></button>
        <div class="tile news" style="--i:5"><span class="k">Roast letter</span>
          <form id="form" novalidate><input id="email" type="email" placeholder="you@email.com" aria-label="Email address"><button>Join</button></form>
          <span class="msg" id="msg" role="status"></span></div>
        <div class="status" aria-live="polite"><span>Now at: <b id="cur">Home</b></span><span>Esc to close</span></div>
      </div>
    </div></div>
  </nav>
  <div class="hero-copy"><h1>Small batches. Slow mornings.</h1><p id="page">Home page. Open the menu and pick a compartment.</p></div>
</div>
<script>
(function(){
  var menu=document.getElementById('menu'),trig=document.getElementById('trigger'),inner=menu.querySelector('.inner');
  var state={open:false,current:'Home',qty:0,cart:0,roast:1};
  var roasts=['light','medium','dark'];
  var tiles=[].slice.call(menu.querySelectorAll('button.tile'));
  var focusables=function(){return [].slice.call(menu.querySelectorAll('.inner button,.inner input'))};
  function render(){
    menu.classList.toggle('open',state.open);
    trig.setAttribute('aria-expanded',state.open);
    document.getElementById('trigLabel').textContent=state.open?'Close':'Menu';
    if(state.open){inner.removeAttribute('inert')}else{inner.setAttribute('inert','')}
    tiles.forEach(function(t){
      if(t.dataset.name===state.current)t.setAttribute('aria-current','true');else t.removeAttribute('aria-current');
    });
    document.getElementById('cur').textContent=state.current;
    document.getElementById('page').textContent=state.current==='Home'?'Home page. Open the menu and pick a compartment.':state.current+' page. (Fictional destination.)';
    document.getElementById('qty').textContent=state.qty;
    document.getElementById('cartN').textContent=state.cart;
    var r=roasts[state.roast],rt=document.getElementById('roastTile');
    rt.dataset.r=r;document.getElementById('roastName').textContent=r[0].toUpperCase()+r.slice(1);
  }
  function set(open,refocus){state.open=open;render();if(open){var f=tiles[0];setTimeout(function(){f.focus()},60)}else if(refocus)trig.focus()}
  trig.addEventListener('click',function(){set(!state.open,false)});
  tiles.forEach(function(t){t.addEventListener('click',function(){
    if(t.id==='roastTile'){state.roast=(state.roast+1)%3;render();return}
    state.current=t.dataset.name;state.open=false;render();trig.focus();
  })});
  document.getElementById('plus').addEventListener('click',function(){state.qty=Math.min(9,state.qty+1);state.cart=state.qty;render()});
  document.getElementById('minus').addEventListener('click',function(){state.qty=Math.max(0,state.qty-1);state.cart=state.qty;render()});
  document.getElementById('form').addEventListener('submit',function(e){
    e.preventDefault();var v=document.getElementById('email').value.trim(),m=document.getElementById('msg');
    if(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){m.textContent='Welcome aboard. First letter is on its way.';m.className='msg';document.getElementById('email').value=''}
    else{m.textContent='That email looks off. Try name@host.com';m.className='msg bad'}
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&state.open){set(false,true);return}
    if(state.open&&(e.key==='ArrowRight'||e.key==='ArrowLeft'||e.key==='ArrowDown'||e.key==='ArrowUp')&&!(e.target.tagName==='INPUT')){
      var f=focusables(),i=f.indexOf(document.activeElement);
      if(i<0)return;e.preventDefault();
      var n=(e.key==='ArrowRight'||e.key==='ArrowDown')?i+1:i-1;f[(n+f.length)%f.length].focus();
    }
  });
  document.addEventListener('click',function(e){if(state.open&&!menu.contains(e.target))set(false,false)});
  render();
})();
</script>
</body>
</html>
