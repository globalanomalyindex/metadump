<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blocks 32</title>
<style>
:root{--bg:#1b2230;--panel:#262f42;--ink:#e8ecf4;--mut:#8a95ab;--acc:#ffb347}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px;gap:10px}
h1{margin:0;font-size:18px;letter-spacing:.05em}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;background:var(--panel);padding:8px;border-radius:8px}
.sw{width:34px;height:34px;border-radius:6px;border:3px solid transparent;cursor:pointer;position:relative}
.sw.on{border-color:#fff}
.sw span{position:absolute;bottom:-1px;right:2px;font-size:9px;color:#000;mix-blend-mode:difference;filter:invert(1)}
button{background:#3a4660;color:var(--ink);border:0;border-radius:6px;padding:8px 12px;cursor:pointer;font:inherit}
button:hover{background:#4a5878}button.on{background:var(--acc);color:#222}
canvas{background:#0e121b;border-radius:6px;cursor:crosshair;max-width:100%;touch-action:none;image-rendering:pixelated}
#st{color:var(--mut);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<h1>BLOCKS 32 x 32</h1>
<div id="bar"></div>
<canvas id="c" width="640" height="640"></canvas>
<div id="st"></div>
<script>
const N=32,S=20;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const COLORS=['#5aa64a','#8a5a36','#8d9099','#e5d28a','#3d7fd9','#c9503f','#f2c230','#7a4fb8','#f2f2f2','#2b2b33'];
const NAMES=['Grass','Dirt','Stone','Sand','Water','Brick','Gold','Amethyst','Snow','Obsidian'];
let grid=[],hist=[],cur=0,tool='place',hover=null,down=false,erase=false,showGrid=true;
try{grid=JSON.parse(localStorage.getItem('blocks32')||'null')}catch(e){}
if(!Array.isArray(grid)||grid.length!==N*N){grid=new Array(N*N).fill(-1);for(let i=0;i<N*N;i++)if(Math.floor(i/N)>=24)grid[i]=Math.floor(i/N)>=27?1:0}
const bar=document.getElementById('bar');
COLORS.forEach((c,i)=>{const d=document.createElement('div');d.className='sw';d.style.background=c;d.title=NAMES[i]+' ('+((i+1)%10)+')';d.innerHTML='<span>'+((i+1)%10)+'</span>';d.onclick=()=>{cur=i;setTool('place');ui()};bar.appendChild(d)});
function btn(t,f){const b=document.createElement('button');b.textContent=t;b.onclick=f;bar.appendChild(b);return b}
const bPlace=btn('Place',()=>setTool('place')),bErase=btn('Erase',()=>setTool('erase')),bPick=btn('Pick',()=>setTool('pick')),bFill=btn('Fill',()=>setTool('fill'));
btn('Undo',undo);btn('Grid',()=>{showGrid=!showGrid;draw()});
btn('Clear',()=>{push();grid.fill(-1);save();draw()});
function setTool(t){tool=t;ui()}
function ui(){[...bar.querySelectorAll('.sw')].forEach((e,i)=>e.classList.toggle('on',i===cur));
bPlace.classList.toggle('on',tool==='place');bErase.classList.toggle('on',tool==='erase');bPick.classList.toggle('on',tool==='pick');bFill.classList.toggle('on',tool==='fill');stat()}
function stat(){const n=grid.filter(v=>v>=0).length;document.getElementById('st').textContent=
'Selected: '+NAMES[cur]+' | Blocks: '+n+'/'+N*N+(hover?' | Cell: '+hover.x+','+hover.y:'')+' | Click/drag to build, right-click erases, keys 1-0 pick block, Ctrl+Z undo'}
function save(){try{localStorage.setItem('blocks32',JSON.stringify(grid))}catch(e){}stat()}
function push(){hist.push(grid.slice());if(hist.length>100)hist.shift()}
function undo(){if(hist.length){grid=hist.pop();save();draw()}}
function draw(){ctx.clearRect(0,0,640,640);
for(let y=0;y<N;y++)for(let x=0;x<N;x++){const v=grid[y*N+x];if(v<0)continue;
ctx.fillStyle=COLORS[v];ctx.fillRect(x*S,y*S,S,S);
ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(x*S,y*S,S,3);ctx.fillRect(x*S,y*S,3,S);
ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(x*S,y*S+S-3,S,3);ctx.fillRect(x*S+S-3,y*S,3,S)}
if(showGrid){ctx.strokeStyle='rgba(255,255,255,.07)';ctx.beginPath();for(let i=0;i<=N;i++){ctx.moveTo(i*S+.5,0);ctx.lineTo(i*S+.5,640);ctx.moveTo(0,i*S+.5);ctx.lineTo(640,i*S+.5)}ctx.stroke()}
if(hover){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(hover.x*S+1,hover.y*S+1,S-2,S-2);ctx.lineWidth=1}}
function cell(e){const r=cv.getBoundingClientRect();const x=Math.floor((e.clientX-r.left)/r.width*N),y=Math.floor((e.clientY-r.top)/r.height*N);
return x>=0&&y>=0&&x<N&&y<N?{x,y}:null}
function flood(x,y,to){const from=grid[y*N+x];if(from===to)return;const st=[[x,y]];
while(st.length){const[a,b]=st.pop();if(a<0||b<0||a>=N||b>=N||grid[b*N+a]!==from)continue;grid[b*N+a]=to;st.push([a+1,b],[a-1,b],[a,b+1],[a,b-1])}}
function act(c,first){if(!c)return;const i=c.y*N+c.x;
if(erase||tool==='erase'){if(grid[i]!==-1){grid[i]=-1}}
else if(tool==='place'){grid[i]=cur}
else if(tool==='pick'){if(grid[i]>=0){cur=grid[i];tool='place'}ui()}
else if(tool==='fill'&&first){flood(c.x,c.y,cur)}
}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);down=true;erase=e.button===2;push();hover=cell(e);act(hover,true);save();draw()});
cv.addEventListener('pointermove',e=>{hover=cell(e);if(down)act(hover,false);if(down)save();draw();stat()});
cv.addEventListener('pointerup',()=>{down=false;erase=false});
cv.addEventListener('pointerleave',()=>{hover=null;draw();stat()});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();return}
if(/^[0-9]$/.test(e.key)){cur=(+e.key+9)%10;setTool('place')}
else if(e.key==='e')setTool('erase');else if(e.key==='b')setTool('place');else if(e.key==='f')setTool('fill');else if(e.key==='p')setTool('pick')});
ui();draw();
</script>
</body>
</html>
