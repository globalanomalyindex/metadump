<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lava Lamp</title>
<style>
:root{--ink:#f3e6d8;--dim:#a89484;--accent:#ff7a3c;--glow:255,110,50}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(ellipse at 50% 70%,rgba(var(--glow),calc(.22*var(--heat,0))) 0,transparent 55%),#0b0709;
  color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
}
.wrap{display:flex;flex-wrap:wrap;gap:40px 64px;align-items:center;justify-content:center;max-width:900px}
.lamp{position:relative;width:270px;display:flex;flex-direction:column;align-items:center;flex:none}
.bloom{position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;
  background:radial-gradient(circle,rgba(var(--glow),.5),transparent 65%);opacity:calc(var(--heat,0)*.7);pointer-events:none;transition:opacity .3s}
.cap{width:150px;height:56px;position:relative;z-index:2;margin-bottom:-6px;
  background:linear-gradient(90deg,#4a3a32,#c9b49e 22%,#f4e6d2 32%,#8a7566 55%,#2b211c 100%);
  clip-path:polygon(38% 0,62% 0,70% 14%,100% 100%,0 100%,30% 14%);border-radius:30px 30px 0 0}
.glass{position:relative;width:240px;height:480px;z-index:1;cursor:pointer}
.glass canvas{display:block;width:100%;height:100%}
.glass .shine{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,.0) 8%,rgba(255,255,255,.28) 17%,rgba(255,255,255,0) 27%,rgba(255,255,255,0) 78%,rgba(255,255,255,.12) 86%,rgba(255,255,255,0) 94%),
  linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 18%)}
.base{position:relative;width:270px;height:160px;margin-top:-6px;z-index:2;
  background:linear-gradient(90deg,#2b211c,#8a7566 12%,#f4e6d2 24%,#c9b49e 38%,#5a483d 70%,#20170f);
  clip-path:polygon(32% 0,68% 0,76% 8%,100% 100%,0 100%,24% 8%);border-radius:0 0 18px 18px}
.base:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,rgba(0,0,0,.4));pointer-events:none}
.power{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:3;width:54px;height:54px;border-radius:50%;
  border:3px solid #1a120d;background:radial-gradient(circle at 35% 30%,#555,#1c1613);color:#7b6a5d;cursor:pointer;font-size:22px;
  box-shadow:0 3px 8px #0009;display:flex;align-items:center;justify-content:center;padding:0}
.power[aria-pressed=true]{color:#ffb089;box-shadow:0 0 18px rgba(var(--glow),.8),0 3px 8px #0009}
.panel{width:min(340px,100%);display:flex;flex-direction:column;gap:20px}
h1{font-size:28px;margin:0;font-weight:600;letter-spacing:-.01em}
.status{color:var(--dim);font-size:14px;font-variant-numeric:tabular-nums;min-height:2.6em}
.status b{color:var(--ink)}
label,.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);display:block;margin-bottom:8px}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw button[aria-pressed=true]{border-color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:#241a16;color:var(--ink);border:1px solid #4a3a32;border-radius:10px;padding:11px 16px;font-size:15px;cursor:pointer;min-height:44px}
.btn:hover{background:#33251f}
.btn[aria-pressed=true]{background:var(--accent);color:#1a0d06;border-color:var(--accent)}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hint{font-size:13px;color:var(--dim)}
@media(max-width:640px){.wrap{gap:28px}.lamp{transform-origin:top center}}
</style>
</head>
<body>
<main class="wrap">
  <div class="lamp" id="lamp">
    <div class="bloom"></div>
    <div class="cap"></div>
    <div class="glass" id="glass"><canvas id="cv" width="480" height="960" aria-label="Lava lamp wax" role="img"></canvas><div class="shine"></div></div>
    <div class="base"></div>
    <button class="power" id="pw" aria-pressed="true" aria-label="Lamp power" title="Power">&#x23FB;</button>
  </div>
  <section class="panel">
    <h1>Lava Lamp</h1>
    <div class="status" id="status" aria-live="polite"></div>
    <div><label for="heat">Heat <span id="hv"></span></label><input id="heat" type="range" min="0" max="100" value="70"></div>
    <div><span class="lbl">Wax</span><div class="sw" id="sw"></div></div>
    <div class="row">
      <button class="btn" id="ptog" aria-pressed="true">Power on</button>
      <button class="btn" id="stir">Stir</button>
      <button class="btn" id="reset">Reset</button>
    </div>
    <div class="hint">Click or tap the wax to poke it. Turn the heat down or switch off and the wax cools and sinks.</div>
  </section>
</main>
<script>
(function(){
  var W=240,H=480,GW=96,GH=192;
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var small=document.createElement('canvas');small.width=GW;small.height=GH;
  var sctx=small.getContext('2d'),img=sctx.createImageData(GW,GH);
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  var palettes=[
    {n:'Ember',hot:[255,170,70],cool:[235,60,40],l1:[70,12,22],l2:[150,40,25],glow:'255,110,50'},
    {n:'Magenta',hot:[255,130,220],cool:[200,30,150],l1:[30,10,70],l2:[110,30,140],glow:'230,70,200'},
    {n:'Lime',hot:[220,255,100],cool:[60,200,70],l1:[6,38,40],l2:[20,110,80],glow:'110,230,90'},
    {n:'Aqua',hot:[150,255,240],cool:[40,150,230],l1:[8,20,70],l2:[20,80,150],glow:'60,190,255'},
    {n:'Violet',hot:[210,170,255],cool:[130,60,230],l1:[16,8,50],l2:[60,30,130],glow:'150,100,255'}
  ];
  var S={on:true,heat:.7,lamp:0,pal:0,blobs:[],t:0};
  S.lamp=.85;

  // taper of the glass interior
  function edgeL(y){return 44*(1-y/H)+4}
  function edgeR(y){return W-edgeL(y)}

  // glass outline clip
  (function(){
    var pts=[],i,a;
    for(i=0;i<=12;i++){a=Math.PI+i/12*Math.PI;pts.push([(W/2+(W/2-44)*Math.cos(a)),(30+30*Math.sin(a))])}
    pts.push([W,H]);pts.push([0,H]);
    var s=pts.map(function(p){return (p[0]/W*100).toFixed(2)+'% '+(p[1]/H*100).toFixed(2)+'%'}).join(',');
    document.getElementById('glass').style.clipPath='polygon('+s+')';
  })();

  function mk(i,n){
    var r=17+Math.random()*20;
    return {x:W/2+(Math.random()-.5)*80,y:H-r-Math.random()*(H*.9)*(i/n),r:r,vx:0,vy:0,T:Math.random()*.6,ph:Math.random()*6.28};
  }
  function init(){S.blobs=[];var n=9;for(var i=0;i<n;i++)S.blobs.push(mk(i,n))}
  init();

  var $=function(id){return document.getElementById(id)};
  var sw=$('sw');
  palettes.forEach(function(p,i){
    var b=document.createElement('button');b.type='button';b.title=p.n;b.setAttribute('aria-label',p.n+' wax');
    b.style.background='linear-gradient(135deg,rgb('+p.hot+'),rgb('+p.cool+'))';
    b.setAttribute('aria-pressed',i===0);
    b.onclick=function(){setPal(i)};sw.appendChild(b);
  });
  function setPal(i){
    S.pal=i;[].forEach.call(sw.children,function(b,j){b.setAttribute('aria-pressed',j===i)});
    document.documentElement.style.setProperty('--glow',palettes[i].glow);
    var c=palettes[i].hot;document.documentElement.style.setProperty('--accent','rgb('+c+')');
  }
  function setOn(v){
    S.on=v;$('pw').setAttribute('aria-pressed',v);$('ptog').setAttribute('aria-pressed',v);
    $('ptog').textContent=v?'Power on':'Power off';
  }
  $('pw').onclick=$('ptog').onclick=function(){setOn(!S.on)};
  $('heat').oninput=function(){S.heat=this.value/100;$('hv').textContent=this.value+'%'};
  $('hv').textContent='70%';
  $('stir').onclick=function(){S.blobs.forEach(function(b){b.vx+=(Math.random()-.5)*60;b.vy+=(Math.random()-.5)*60;b.T=Math.min(1.2,b.T+.25)})};
  $('reset').onclick=function(){init();S.lamp=S.on?.5:0};
  $('glass').addEventListener('pointerdown',function(e){
    var r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
    S.blobs.forEach(function(b){
      var dx=b.x-x,dy=b.y-y,d=Math.sqrt(dx*dx+dy*dy)+1;
      if(d<110){var k=(1-d/110)*90/d;b.vx+=dx*k;b.vy+=dy*k-30*(1-d/110);b.T=Math.min(1.2,b.T+.3*(1-d/110))}
    });
  });

  function step(dt){
    var target=S.on?S.heat:0;
    S.lamp+=(target-S.lamp)*Math.min(1,dt*(target>S.lamp?.12:.2));
    var L=S.lamp;
    S.blobs.forEach(function(b){
      // temperature target depends on height: hot near the bulb
      var h=1-b.y/H;                       // 0 bottom .. 1 top (actually 1 at top)
      var tt=L*(1.25-1.05*b.y/H*1.0)+0*h;  // L=1: 1.25 at bottom, 0.2 at top
      b.T+=(tt-b.T)*dt*.28;
      var buoy=(b.T-.62)*38;               // positive rises
      b.vy+=-buoy*dt*1.0;
      b.vx+=Math.sin(S.t*.4+b.ph)*3*dt*(.3+L);
      var damp=Math.pow(.93,dt*10);
      b.vx*=damp;b.vy*=damp;
      // gentle mutual repulsion keeps blobs from stacking exactly
      S.blobs.forEach(function(o){
        if(o===b)return;var dx=b.x-o.x,dy=b.y-o.y,d=Math.sqrt(dx*dx+dy*dy)+.01,m=(b.r+o.r)*.55;
        if(d<m){b.vx+=dx/d*dt*14;b.vy+=dy/d*dt*6}
      });
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      var l=edgeL(b.y)+b.r*.75,r=edgeR(b.y)-b.r*.75;
      if(b.x<l){b.x=l;b.vx=Math.abs(b.vx)*.3}
      if(b.x>r){b.x=r;b.vx=-Math.abs(b.vx)*.3}
      var floor=H-b.r*.55;
      if(b.y>floor){b.y=floor;b.vy=Math.min(b.vy,0)*.2}
      if(b.y<b.r*.9+10){b.y=b.r*.9+10;b.vy=Math.abs(b.vy)*.2}
    });
  }

  var lerp=function(a,b,t){return a+(b-a)*t};
  function render(){
    var p=palettes[S.pal],L=S.lamp;
    // liquid
    var g=ctx.createLinearGradient(0,0,0,cv.height);
    var dim=.35+.65*L;
    function c(a,k){return 'rgb('+Math.round(a[0]*k)+','+Math.round(a[1]*k)+','+Math.round(a[2]*k)+')'}
    g.addColorStop(0,c(p.l1,dim*.8));g.addColorStop(1,c(p.l2,dim));
    ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
    var rg=ctx.createRadialGradient(cv.width/2,cv.height*1.02,10,cv.width/2,cv.height*1.02,cv.height*.7);
    rg.addColorStop(0,'rgba('+p.glow+','+(.7*L)+')');rg.addColorStop(1,'rgba('+p.glow+',0)');
    ctx.fillStyle=rg;ctx.fillRect(0,0,cv.width,cv.height);

    // field
    var d=img.data,sx=W/GW,sy=H/GH,bl=S.blobs,n=bl.length,i,j,k=0;
    var warm=.45+.55*L;
    for(j=0;j<GH;j++){
      var y=(j+.5)*sy,py=Math.max(0,(y-(H-26))/26);
      var pool=py*py*1.6+ (y>H-26?0:0);
      for(i=0;i<GW;i++){
        var x=(i+.5)*sx,f=pool,q;
        for(q=0;q<n;q++){var b=bl[q],dx=x-b.x,dy=y-b.y*1+0;dy*=0.82;f+=b.r*b.r/(dx*dx+dy*dy+1)}
        var o=(j*GW+i)*4;
        var a=(f-.92)/.16;a=a<0?0:a>1?1:a;
        if(a<=0){d[o+3]=0;continue}
        var hy=y/H;                         // 1 bottom
        var t=Math.min(1,Math.max(0,hy*.7+(f>2.2?.0:0)+L*.3-.2));
        var core=Math.min(1,(f-1)/2.2);
        var rr=lerp(p.cool[0],p.hot[0],t),gg=lerp(p.cool[1],p.hot[1],t),bb=lerp(p.cool[2],p.hot[2],t);
        var sh=(.62+.38*core)*warm;
        d[o]=rr*sh;d[o+1]=gg*sh;d[o+2]=bb*sh;d[o+3]=a*255;
      }
    }
    sctx.putImageData(img,0,0);
    ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
    ctx.drawImage(small,0,0,cv.width,cv.height);
  }

  var last=performance.now(),acc=0;
  function status(){
    var L=S.lamp,txt;
    if(!S.on&&L<.05)txt='<b>Off</b> &middot; wax is cold and settled';
    else if(!S.on)txt='<b>Cooling</b> &middot; wax is sinking';
    else if(S.heat<.25)txt='<b>Too cool</b> &middot; raise the heat to wake it';
    else if(L<S.heat*.85)txt='<b>Warming up</b> &middot; wax is loosening';
    else txt='<b>Flowing</b> &middot; convection running';
    $('status').innerHTML=txt+'<br>Bulb '+Math.round(L*100)+'% &middot; '+S.blobs.length+' blobs';
    document.documentElement.style.setProperty('--heat',L.toFixed(3));
  }
  var sc=0;
  function frame(now){
    var dt=Math.min(.05,(now-last)/1000);last=now;
    var sp=reduce?.4:1;
    S.t+=dt;step(dt*sp*1.6);render();
    if((sc++%10)===0)status();
    requestAnimationFrame(frame);
  }
  // pre-roll so the lamp is mid-flow on load
  for(var z=0;z<600;z++)step(.05);
  status();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
