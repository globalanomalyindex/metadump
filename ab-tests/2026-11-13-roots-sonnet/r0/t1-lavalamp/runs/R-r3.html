<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lava Lamp</title>
<style>
  :root {
    --glow: 0.75;
    --glowRGB: 255,140,50;
    --liqT: #5a0f1c;
    --liqB: #8f2a22;
    --ink: #f2e4d6;
    --muted: #a8917f;
    --panel: rgba(24,12,18,0.72);
    --line: rgba(255,200,160,0.16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(ellipse 60% 55% at 50% 62%, rgba(var(--glowRGB), calc(var(--glow) * 0.28)), transparent 70%),
      linear-gradient(#0c0710, #170a12 70%, #0a0508);
    background-color: #0c0710;
    color: var(--ink);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 28px 56px; padding: 16px; min-height: 100vh;
    overflow-x: hidden;
  }
  #lampWrap { position: relative; flex: 0 0 auto; }
  #lamp { position: absolute; left: 0; top: 0; width: 260px; height: 640px; transform-origin: 0 0; }
  #lamp.shake { animation: shake .55s linear; }
  @keyframes shake {
    0%,100% { translate: 0 0; } 15% { translate: -6px 2px; } 30% { translate: 7px -2px; }
    45% { translate: -5px 1px; } 60% { translate: 5px 0; } 80% { translate: -2px 0; }
  }
  #floorGlow {
    position: absolute; left: -60px; top: 560px; width: 380px; height: 110px; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(var(--glowRGB), calc(var(--glow) * 0.55)), transparent 68%);
    pointer-events: none;
  }
  #cap, #base { position: absolute; left: 0; width: 260px; display: block; }
  #cap { top: 0; height: 56px; z-index: 3; }
  #base { top: 458px; height: 176px; z-index: 3; }
  #glass {
    position: absolute; left: 20px; top: 44px; width: 220px; height: 420px; z-index: 2;
    touch-action: none; cursor: grab;
  }
  #glass.grabbing { cursor: grabbing; }
  #liquid {
    position: absolute; inset: 0;
    background: linear-gradient(to top, var(--liqB), var(--liqT));
  }
  #bulb {
    position: absolute; inset: 0; opacity: var(--glow);
    background:
      radial-gradient(ellipse 55% 34% at 50% 100%, rgba(255,235,170,0.95), rgba(255,170,70,0.45) 45%, transparent 75%),
      radial-gradient(ellipse 90% 70% at 50% 100%, rgba(var(--glowRGB),0.55), transparent 80%);
  }
  #wax { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #sheen { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #controls {
    flex: 0 1 330px; min-width: 260px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 18px 20px 20px; backdrop-filter: blur(6px);
  }
  h1 { margin: 0 0 2px; font-size: 18px; font-weight: 650; letter-spacing: .02em; }
  #status { color: var(--muted); font-size: 13px; margin-bottom: 14px; min-height: 18px; }
  #status b { color: var(--ink); font-weight: 600; }
  .row { margin: 13px 0; }
  .row label, .row .lab { display: flex; justify-content: space-between; font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin-bottom: 6px; }
  .row output { color: var(--ink); letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: #ff9a3c; height: 24px; margin: 0; }
  #power {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 14px; cursor: pointer;
    background: rgba(255,255,255,0.05); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; font: inherit; font-weight: 600;
  }
  #power .sw { position: relative; width: 44px; height: 24px; border-radius: 12px; background: #3a2a30; transition: background .3s; flex: none; }
  #power .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #d9c8bb; transition: transform .25s, background .3s; }
  #power[aria-pressed=true] .sw { background: #c8501f; }
  #power[aria-pressed=true] .sw::after { transform: translateX(20px); background: #ffe7b0; }
  #swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw-btn {
    width: 40px; height: 40px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0;
    outline-offset: 3px;
  }
  .sw-btn[aria-checked=true] { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.25); }
  button.act {
    flex: 1; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,0.05);
    color: var(--ink); font: inherit; cursor: pointer;
  }
  button.act:hover, #power:hover { background: rgba(255,255,255,0.1); }
  button:focus-visible, input:focus-visible { outline: 2px solid #ffb86b; outline-offset: 2px; }
  .btns { display: flex; gap: 10px; }
  .hint { color: var(--muted); font-size: 12px; margin: 14px 0 0; }
  @media (max-width: 720px) { body { gap: 12px; padding: 10px; } #controls { padding: 14px 16px 16px; flex-basis: 100%; } }
</style>
</head>
<body>
<div id="lampWrap">
  <div id="lamp">
    <div id="floorGlow"></div>
    <svg id="base" viewBox="0 0 260 176" aria-hidden="true">
      <defs>
        <linearGradient id="metal" x1="0" x2="1">
          <stop offset="0" stop-color="#2a1d20"/><stop offset=".25" stop-color="#8b6a58"/>
          <stop offset=".42" stop-color="#e2c1a2"/><stop offset=".6" stop-color="#7a5a4b"/><stop offset="1" stop-color="#1e1316"/>
        </linearGradient>
        <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="rgba(0,0,0,0)"/><stop offset="1" stop-color="rgba(0,0,0,0.5)"/>
        </linearGradient>
      </defs>
      <path d="M22 4 H238 C238 34 176 52 168 92 C164 122 196 152 252 170 H8 C64 152 96 122 92 92 C84 52 22 34 22 4 Z" fill="url(#metal)"/>
      <path d="M22 4 H238 C238 34 176 52 168 92 C164 122 196 152 252 170 H8 C64 152 96 122 92 92 C84 52 22 34 22 4 Z" fill="url(#metalDark)"/>
      <ellipse cx="130" cy="6" rx="108" ry="5" fill="rgba(var(--glowRGB),0.35)"/>
    </svg>
    <div id="glass">
      <div id="liquid"></div>
      <div id="bulb"></div>
      <canvas id="wax"></canvas>
      <svg id="sheen" viewBox="0 0 220 420" aria-hidden="true">
        <defs>
          <linearGradient id="streak" x1="0" x2="1">
            <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".32"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path id="sheenStreak" fill="url(#streak)"/>
        <path id="sheenRim" fill="none" stroke="rgba(255,235,215,0.38)" stroke-width="2"/>
      </svg>
    </div>
    <svg id="cap" viewBox="0 0 260 56" aria-hidden="true">
      <defs>
        <linearGradient id="capMetal" x1="0" x2="1">
          <stop offset="0" stop-color="#2a1d20"/><stop offset=".3" stop-color="#a98168"/>
          <stop offset=".45" stop-color="#f0d3b4"/><stop offset=".7" stop-color="#6e5042"/><stop offset="1" stop-color="#1e1316"/>
        </linearGradient>
      </defs>
      <path d="M62 54 C62 22 92 4 130 4 C168 4 198 22 198 54 Z" fill="url(#capMetal)"/>
      <rect x="58" y="46" width="144" height="10" rx="4" fill="url(#capMetal)"/>
    </svg>
  </div>
</div>

<section id="controls" aria-label="Lamp controls">
  <h1>Lava lamp</h1>
  <div id="status" aria-live="polite"></div>

  <div class="row">
    <button id="power" type="button" aria-pressed="true"><span class="sw"></span><span id="powerLabel">Lamp on</span></button>
  </div>
  <div class="row">
    <label for="heat">Heat <output id="heatOut"></output></label>
    <input id="heat" type="range" min="40" max="160" value="100">
  </div>
  <div class="row">
    <label for="count">Blobs <output id="countOut"></output></label>
    <input id="count" type="range" min="4" max="16" value="9">
  </div>
  <div class="row">
    <label for="size">Blob size <output id="sizeOut"></output></label>
    <input id="size" type="range" min="70" max="140" value="100">
  </div>
  <div class="row">
    <div class="lab" id="colourLab">Colour <output id="colourOut"></output></div>
    <div id="swatches" role="radiogroup" aria-labelledby="colourLab"></div>
  </div>
  <div class="row btns">
    <button class="act" id="shake" type="button">Shake</button>
    <button class="act" id="reset" type="button">Cool and settle</button>
  </div>
  <p class="hint">Drag a blob, sweep the glass to stir, double-click to drop a new blob.</p>
</section>

<script>
(function () {
  "use strict";
  var W = 220, H = 420, CX = W / 2, FS = 2; // glass size, field step (sim px per sample)

  // ---------- glass shape ----------
  function hw(y) { var u = Math.min(1, Math.max(0, y / H)); return 52 + 58 * Math.pow(1 - u, 1.2); }
  function glassPoints() {
    var pts = [], i, a, r = 18, rt = 14;
    // top edge left->right (screen coords, y down)
    for (a = 180; a <= 270; a += 15) pts.push([CX - hw(H) + rt + rt * Math.cos(a * Math.PI / 180), rt + rt * Math.sin(a * Math.PI / 180)]);
    for (a = 270; a <= 360; a += 15) pts.push([CX + hw(H) - rt + rt * Math.cos(a * Math.PI / 180), rt + rt * Math.sin(a * Math.PI / 180)]);
    for (i = 14; i <= H - 18; i += 14) pts.push([CX + hw(H - i), i]);
    for (a = 0; a <= 90; a += 15) pts.push([W - r + r * Math.cos(a * Math.PI / 180), H - r + r * Math.sin(a * Math.PI / 180)]);
    for (a = 90; a <= 180; a += 15) pts.push([r + r * Math.cos(a * Math.PI / 180), H - r + r * Math.sin(a * Math.PI / 180)]);
    for (i = H - 18; i >= 14; i -= 14) pts.push([CX - hw(H - i), i]);
    return pts;
  }
  var gp = glassPoints();
  var glass = document.getElementById("glass");
  glass.style.clipPath = "polygon(" + gp.map(function (p) { return (p[0] / W * 100).toFixed(2) + "% " + (p[1] / H * 100).toFixed(2) + "%"; }).join(",") + ")";
  document.getElementById("sheenRim").setAttribute("d", "M" + gp.map(function (p) { return p[0].toFixed(1) + " " + p[1].toFixed(1); }).join("L") + "Z");
  (function () {
    var l = [], r = [], y;
    for (y = 30; y <= 380; y += 20) { var x = CX - hw(H - y) + 14 + (y / H) * 8; l.push([x, y]); r.push([x + 11 - (y / H) * 3, y]); }
    document.getElementById("sheenStreak").setAttribute("d", "M" + l.concat(r.reverse()).map(function (p) { return p[0].toFixed(1) + " " + p[1].toFixed(1); }).join("L") + "Z");
  })();

  // ---------- palettes ----------
  var PALETTES = [
    { name: "Magma",  core: [255, 168, 64],  rim: [226, 52, 30],  liqT: [74, 12, 24],  liqB: [130, 40, 26],  glow: [255, 140, 50] },
    { name: "Orchid", core: [255, 140, 220], rim: [196, 40, 150], liqT: [38, 12, 80],  liqB: [86, 30, 130],  glow: [210, 90, 255] },
    { name: "Lime",   core: [210, 255, 110], rim: [90, 200, 60],  liqT: [4, 52, 60],   liqB: [10, 98, 92],   glow: [110, 255, 170] },
    { name: "Ice",    core: [170, 245, 255], rim: [50, 160, 235], liqT: [8, 20, 70],   liqB: [16, 48, 120],  glow: [100, 190, 255] },
    { name: "Ember",  core: [255, 232, 120], rim: [255, 120, 30], liqT: [100, 10, 30], liqB: [170, 34, 40],  glow: [255, 120, 60] }
  ];
  var cur = { core: PALETTES[0].core.slice(), rim: PALETTES[0].rim.slice(), liqT: PALETTES[0].liqT.slice(), liqB: PALETTES[0].liqB.slice(), glow: PALETTES[0].glow.slice() };

  // ---------- state ----------
  var state = { on: true, heat: 1.0, count: 9, size: 1.0, palette: 0, B: 0.75 };
  var blobs = [], grabbed = null, time = 0;
  var rand = Math.random;
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(a, b, v) { var t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }

  function makeBlob(x, y, t) {
    return {
      x: x == null ? CX + (rand() - 0.5) * 80 : x,
      y: y == null ? 30 + rand() * 120 : y,
      vx: 0, vy: 0,
      r: (13 + rand() * 13) * state.size,
      t: t == null ? rand() * 0.8 : t,
      w: 0.8 + rand() * 0.45,
      ph: rand() * 6.28
    };
  }
  function seed() {
    blobs.length = 0;
    for (var i = 0; i < state.count; i++) blobs.push(makeBlob(null, 25 + rand() * 330, 0.25 + rand() * 0.7));
  }
  function setCount(n) {
    state.count = n;
    while (blobs.length < n) blobs.push(makeBlob(CX + (rand() - 0.5) * 70, 28, 0.9));
    while (blobs.length > n) blobs.splice(Math.floor(rand() * blobs.length), 1);
  }
  seed();

  // pool: fixed flat wax puddle at the bottom
  var pool = [{ x: -60, rx: 66 }, { x: 0, rx: 78 }, { x: 60, rx: 66 }];

  // ---------- physics ----------
  function step(dt) {
    var target = state.on ? 1 : 0;
    state.B += (target - state.B) * (1 - Math.exp(-dt / (state.on ? 5.5 : 7)));
    var B = state.B, heat = state.heat, n = blobs.length, i, j, b, o;
    for (i = 0; i < n; i++) {
      b = blobs[i];
      var yn = clamp(b.y / H, 0, 1);
      // temperature: heated near the bulb, cooled toward the top
      var gain = B * heat * clamp(1 - b.y / (0.42 * H), 0, 1) * 0.34 * b.w;
      var loss = (0.045 + 0.2 * yn * yn) * b.t + (state.on ? 0 : 0.05 * b.t);
      b.t = clamp(b.t + (gain - loss) * dt, 0, 1.2);
      if (b === grabbed) continue;
      // buoyancy
      var ay = (b.t - 0.46) * 78 / Math.sqrt(state.size);
      b.vy += ay * dt;
      b.vx += Math.sin(time * 0.7 + b.ph) * 9 * dt + (CX - b.x) * 0.02 * dt * (0.4 + yn);
      // blob to blob: keep apart a little when overlapped
      for (j = i + 1; j < n; j++) {
        o = blobs[j];
        var dx = o.x - b.x, dy = o.y - b.y, d = Math.sqrt(dx * dx + dy * dy) + 0.001, m = (b.r + o.r) * 0.85;
        if (d < m) { var f = (m - d) * 1.1 * dt; dx /= d; dy /= d; b.vx -= dx * f * 6; b.vy -= dy * f * 3; o.vx += dx * f * 6; o.vy += dy * f * 3; }
      }
      var drag = Math.exp(-1.25 * dt);
      b.vx *= drag; b.vy *= drag;
      b.x += b.vx * dt; b.y += b.vy * dt;
    }
    for (i = 0; i < n; i++) {
      b = blobs[i];
      var lim = hw(b.y) - b.r * 0.75;
      if (b.x < CX - lim) { b.x = CX - lim; b.vx = Math.abs(b.vx) * 0.2; }
      if (b.x > CX + lim) { b.x = CX + lim; b.vx = -Math.abs(b.vx) * 0.2; }
      var fl = b.r * 0.55 + 4;
      if (b.y < fl) { b.y = fl; if (b.vy < 0) b.vy = 0; }
      var ce = H - b.r * 0.8 - 6;
      if (b.y > ce) { b.y = ce; if (b.vy > 0) b.vy = -b.vy * 0.2; b.t = Math.min(b.t, 0.42); }
    }
  }

  // ---------- rendering ----------
  var canvas = document.getElementById("wax"), ctx = canvas.getContext("2d");
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = W * dpr; canvas.height = H * dpr;
  var FW = Math.ceil(W / FS), FH = Math.ceil(H / FS);
  var off = document.createElement("canvas"); off.width = FW; off.height = FH;
  var octx = off.getContext("2d"), img = octx.createImageData(FW, FH), px = img.data;
  var P = new Float32Array(16 * 4 + 12), E;

  function render() {
    var n = blobs.length, k = 0, i, b;
    var ps = lerp(1.0, 0.5, state.B);
    // ellipses: cx, cy (sim, y up), 1/rx^2, 1/ry^2
    for (i = 0; i < n; i++) {
      b = blobs[i];
      var st = clamp(Math.abs(b.vy) / 90, 0, 0.3) + 0.05 * Math.sin(time * 1.3 + b.ph);
      var rx = b.r * (1 - st * 0.55), ry = b.r * (1 + st);
      P[k++] = b.x; P[k++] = b.y; P[k++] = 1 / (rx * rx); P[k++] = 1 / (ry * ry);
    }
    for (i = 0; i < pool.length; i++) {
      var ry2 = (26 + i % 2 * 4) * ps * (0.8 + 0.4 * (i === 1 ? 1 : 0.7)) * Math.sqrt(state.size);
      var rx2 = pool[i].rx;
      P[k++] = CX + pool[i].x; P[k++] = -6; P[k++] = 1 / (rx2 * rx2); P[k++] = 1 / (ry2 * ry2);
    }
    var m = k / 4, c = cur, j, x, y, f, v, a, kk, idx = 0, r, g, bl, dx, dy, n2, q, t;
    for (j = 0; j < FH; j++) {
      y = H - (j + 0.5) * FS;
      var yn = 1 - j / FH;
      for (i = 0; i < FW; i++) {
        x = (i + 0.5) * FS; f = 0;
        for (q = 0; q < m; q++) {
          dx = x - P[q * 4]; dy = y - P[q * 4 + 1];
          n2 = dx * dx * P[q * 4 + 2] + dy * dy * P[q * 4 + 3];
          if (n2 < 60) f += 1 / (n2 * Math.sqrt(n2) + 0.0001);
        }
        if (f < 0.98) { px[idx + 3] = 0; idx += 4; continue; }
        a = smooth(1.0, 1.12, f);
        kk = Math.pow(clamp((f - 1) / 2.6, 0, 1), 0.7);
        t = clamp((1 - yn) * 0 + (0.35 - yn * 0.35) * state.B, 0, 0.4); // hotter near the bottom
        r = lerp(c.rim[0], c.core[0], kk); g = lerp(c.rim[1], c.core[1], kk); bl = lerp(c.rim[2], c.core[2], kk);
        r = lerp(r, 255, t); g = lerp(g, 235, t * 0.8); bl = lerp(bl, 190, t * 0.6);
        var dim = 0.62 + 0.38 * state.B;
        px[idx] = r * dim; px[idx + 1] = g * dim; px[idx + 2] = bl * dim; px[idx + 3] = a * 255;
        idx += 4;
      }
    }
    octx.putImageData(img, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    ctx.drawImage(off, 0, 0, canvas.width, canvas.height);
  }

  function rgb(a) { return Math.round(a[0]) + "," + Math.round(a[1]) + "," + Math.round(a[2]); }
  var rootStyle = document.documentElement.style;
  function applyColours(dt) {
    var tgt = PALETTES[state.palette], s = 1 - Math.exp(-dt * 3), key, i;
    for (key in cur) for (i = 0; i < 3; i++) cur[key][i] = lerp(cur[key][i], tgt[key][i], s);
    rootStyle.setProperty("--liqT", "rgb(" + rgb(cur.liqT) + ")");
    rootStyle.setProperty("--liqB", "rgb(" + rgb(cur.liqB) + ")");
    rootStyle.setProperty("--glowRGB", rgb(cur.glow));
    rootStyle.setProperty("--glow", (0.08 + 0.92 * state.B).toFixed(3));
  }

  // ---------- UI ----------
  var $ = function (id) { return document.getElementById(id); };
  function avgRisen() { var c = 0; blobs.forEach(function (b) { if (b.y > H * 0.3) c++; }); return c; }
  function updateStatus() {
    var B = state.B, label, temp = Math.round(20 + B * 62);
    if (state.on) label = B < 0.85 ? "Warming up" : "Running";
    else label = B > 0.08 ? "Cooling down" : "Off, cold";
    $("status").innerHTML = "<b>" + label + "</b> &middot; bulb " + temp + " &deg;C &middot; " + avgRisen() + " of " + blobs.length + " blobs risen";
    $("power").setAttribute("aria-pressed", state.on);
    $("powerLabel").textContent = state.on ? "Lamp on" : "Lamp off";
  }
  $("power").addEventListener("click", function () { state.on = !state.on; updateStatus(); });
  $("heat").addEventListener("input", function (e) { state.heat = e.target.value / 100; $("heatOut").textContent = e.target.value + "%"; });
  $("count").addEventListener("input", function (e) { setCount(+e.target.value); $("countOut").textContent = e.target.value; });
  $("size").addEventListener("input", function (e) {
    var ns = e.target.value / 100, ratio = ns / state.size; state.size = ns;
    blobs.forEach(function (b) { b.r *= ratio; });
    $("sizeOut").textContent = e.target.value + "%";
  });
  PALETTES.forEach(function (p, i) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "sw-btn"; b.setAttribute("role", "radio"); b.setAttribute("aria-label", p.name);
    b.setAttribute("aria-checked", i === 0); b.title = p.name;
    b.style.background = "linear-gradient(135deg, rgb(" + p.core.join(",") + "), rgb(" + p.rim.join(",") + ") 55%, rgb(" + p.liqB.join(",") + "))";
    b.addEventListener("click", function () { choose(i); });
    $("swatches").appendChild(b);
  });
  function choose(i) {
    state.palette = i;
    Array.prototype.forEach.call($("swatches").children, function (el, k) { el.setAttribute("aria-checked", k === i); });
    $("colourOut").textContent = PALETTES[i].name;
  }
  $("swatches").addEventListener("keydown", function (e) {
    var d = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 0;
    if (!d) return; e.preventDefault();
    var i = (state.palette + d + PALETTES.length) % PALETTES.length; choose(i); $("swatches").children[i].focus();
  });
  function shake() {
    blobs.forEach(function (b) { b.vx += (rand() - 0.5) * 260; b.vy += (rand() - 0.5) * 200; b.t = clamp(b.t + (rand() - 0.5) * 0.5, 0, 1); });
    var l = $("lamp"); l.classList.remove("shake"); void l.offsetWidth; l.classList.add("shake");
  }
  $("shake").addEventListener("click", shake);
  $("reset").addEventListener("click", function () { state.on = false; blobs.forEach(function (b) { b.t = Math.min(b.t, 0.2); }); updateStatus(); });

  // pointer interaction on the glass
  var last = null;
  function simPos(e) {
    var r = glass.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: H - (e.clientY - r.top) / r.height * H };
  }
  glass.addEventListener("pointerdown", function (e) {
    var p = simPos(e), best = null, bd = 1e9;
    blobs.forEach(function (b) { var d = Math.hypot(b.x - p.x, b.y - p.y) - b.r; if (d < bd) { bd = d; best = b; } });
    if (best && bd < 22) { grabbed = best; glass.classList.add("grabbing"); glass.setPointerCapture(e.pointerId); best.t = Math.max(best.t, 0.5); }
    last = p;
  });
  glass.addEventListener("pointermove", function (e) {
    var p = simPos(e);
    if (grabbed) {
      grabbed.vx = clamp((p.x - grabbed.x) * 9, -260, 260); grabbed.vy = clamp((p.y - grabbed.y) * 9, -260, 260);
      grabbed.x += grabbed.vx * 0.016; grabbed.y += grabbed.vy * 0.016;
    } else if (last) {
      var sx = p.x - last.x, sy = p.y - last.y;
      blobs.forEach(function (b) {
        var dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy);
        if (d < b.r + 36) { var f = 1 - d / (b.r + 36); b.vx += sx * f * 2.2; b.vy += sy * f * 2.2; }
      });
    }
    last = p;
  });
  function release() { if (grabbed) { grabbed = null; glass.classList.remove("grabbing"); } }
  glass.addEventListener("pointerup", release);
  glass.addEventListener("pointercancel", release);
  glass.addEventListener("pointerleave", function () { if (!grabbed) last = null; });
  glass.addEventListener("dblclick", function (e) {
    var p = simPos(e);
    if (blobs.length >= 16) return;
    blobs.push(makeBlob(p.x, p.y, 0.8)); state.count = blobs.length;
    $("count").value = state.count; $("countOut").textContent = state.count;
  });

  // fit lamp to viewport
  var LW = 260, LH = 640;
  function fit() {
    var narrow = window.innerWidth <= 720;
    var availH = window.innerHeight - (narrow ? 250 : 40), availW = window.innerWidth - 24;
    var s = Math.max(0.4, Math.min(1, availH / LH, availW / LW));
    $("lamp").style.transform = "scale(" + s + ")";
    $("lampWrap").style.width = LW * s + "px"; $("lampWrap").style.height = LH * s + "px";
  }
  window.addEventListener("resize", fit); fit();

  // init UI text
  $("heatOut").textContent = "100%"; $("countOut").textContent = "9"; $("sizeOut").textContent = "100%"; $("colourOut").textContent = PALETTES[0].name;

  // main loop
  var prev = performance.now(), acc = 0, reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function frame(now) {
    var dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    if (reduce) dt *= 0.5;
    time += dt; step(dt); applyColours(dt); render();
    acc += dt; if (acc > 0.25) { acc = 0; updateStatus(); }
    requestAnimationFrame(frame);
  }
  // pre-roll so the lamp is mid-motion on first sight
  for (var s0 = 0; s0 < 360; s0++) { time += 1 / 30; step(1 / 30); }
  for (var c0 = 0; c0 < 40; c0++) applyColours(0.1);
  updateStatus();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
