<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lava Lamp</title>
<style>
  :root { color-scheme: dark; --ink:#f3e3d0; --dim:#9a8878; --accent:#ff7a2e; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 70%, #1d0f12 0%, #0b0608 60%, #060304 100%);
    color: var(--ink); font: 14px/1.4 ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100%; padding: 8px 16px 12px; gap: 8px; overflow-x: hidden;
  }
  #stage { height: calc(100vh - 118px); height: calc(100dvh - 118px); min-height: 300px; max-height: 760px; aspect-ratio: 420 / 720; max-width: 100%; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .panel { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: center; max-width: 520px; }
  button {
    font: inherit; color: var(--ink); background: #2a1a1c; border: 1px solid #4a3236; border-radius: 999px;
    padding: 8px 16px; min-height: 40px; cursor: pointer;
  }
  button:hover { background: #3a2527; }
  button:focus-visible, input:focus-visible { outline: 2px solid #ffc27a; outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--accent); border-color: #ffb27e; color: #240c02; font-weight: 600; }
  .sw { display: flex; gap: 8px; }
  .sw button { width: 40px; height: 40px; padding: 0; border-radius: 50%; border: 2px solid #4a3236; }
  .sw button[aria-checked="true"] { border-color: #fff3e0; box-shadow: 0 0 0 2px #0b0608, 0 0 12px 2px var(--c); }
  label { display: flex; align-items: center; gap: 8px; color: var(--dim); }
  input[type=range] { width: 110px; accent-color: var(--accent); }
  #status { color: var(--dim); min-width: 190px; text-align: center; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="420" height="720" aria-label="A lava lamp. Drag across the glass to stir the wax."></canvas></div>
<div class="panel">
  <button id="power" aria-pressed="true">Lamp on</button>
  <button id="stir">Stir</button>
  <div class="sw" role="radiogroup" aria-label="Wax colour" id="sw"></div>
  <label>Heat <input id="heat" type="range" min="0.3" max="1.3" step="0.01" value="0.85" aria-label="Heat"></label>
  <div id="status" role="status" aria-live="polite"></div>
</div>
<script>
(function () {
  var W = 420, H = 720, CX = 210;
  var TOP = 128, BOT = 520, HW_T = 36, HW_B = 92;     // vessel interior
  var canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr; canvas.height = H * dpr;

  var PRESETS = [
    { name: 'Orange',  wax: [255, 92, 28],  hi: [255, 190, 90],  liq: [255, 170, 90],  glow: [255, 140, 60] },
    { name: 'Magenta', wax: [236, 40, 140], hi: [255, 150, 210], liq: [150, 90, 255],  glow: [230, 80, 190] },
    { name: 'Lime',    wax: [150, 230, 40], hi: [235, 255, 130], liq: [60, 170, 120],  glow: [160, 240, 80] },
    { name: 'Cyan',    wax: [60, 210, 255], hi: [200, 250, 255], liq: [60, 80, 220],   glow: [80, 200, 255] }
  ];
  var S = {
    on: true, bulb: 0.9, heatSlider: 0.85, preset: 0, t: 0,
    blobs: [], pool: [], stirs: 0, mix: PRESETS[0].wax.concat(PRESETS[0].hi, PRESETS[0].liq, PRESETS[0].glow)
  };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function hw(y) { var k = (y - TOP) / (BOT - TOP); k = Math.max(0, Math.min(1, k)); return HW_T + (HW_B - HW_T) * (0.55 * k + 0.45 * k * k); }
  function rnd(a, b) { return a + Math.random() * (b - a); }

  // blobs
  function makeBlob(i) {
    var r = rnd(20, 30);
    return { x: CX + rnd(-40, 40), y: rnd(TOP + 60, BOT - 40), r: r, br: r, vx: 0, vy: 0,
      t: rnd(0.15, 0.95), rate: rnd(0.6, 1.5), ph: rnd(0, 6.28), s: 1 };
  }
  for (var i = 0; i < 5; i++) S.blobs.push(makeBlob(i));
  for (var j = 0; j < 9; j++) S.pool.push({ x: CX - 88 + j * 22, ph: rnd(0, 6.28), r: 23 + (j % 3) * 3 });

  // swatches
  var sw = document.getElementById('sw');
  PRESETS.forEach(function (p, i) {
    var b = document.createElement('button');
    b.setAttribute('role', 'radio'); b.setAttribute('aria-label', p.name + ' wax');
    b.setAttribute('aria-checked', i === S.preset ? 'true' : 'false');
    var c = 'rgb(' + p.wax.join(',') + ')';
    b.style.background = 'radial-gradient(circle at 35% 30%, rgb(' + p.hi.join(',') + '), ' + c + ' 70%)';
    b.style.setProperty('--c', c);
    b.addEventListener('click', function () { setPreset(i); });
    sw.appendChild(b);
  });
  function setPreset(i) {
    S.preset = i;
    [].forEach.call(sw.children, function (b, k) { b.setAttribute('aria-checked', k === i ? 'true' : 'false'); });
    S.target = PRESETS[i].wax.concat(PRESETS[i].hi, PRESETS[i].liq, PRESETS[i].glow);
  }
  S.target = S.mix.slice();

  var powerBtn = document.getElementById('power');
  powerBtn.addEventListener('click', function () {
    S.on = !S.on;
    powerBtn.setAttribute('aria-pressed', S.on ? 'true' : 'false');
    powerBtn.textContent = S.on ? 'Lamp on' : 'Lamp off';
  });
  document.getElementById('stir').addEventListener('click', function () {
    S.stirs++;
    S.blobs.forEach(function (b) { b.vx += rnd(-60, 60); b.vy += rnd(-70, 30); b.t = Math.min(1, b.t + 0.3); });
    S.bulb = Math.min(1, S.bulb + 0.1);
  });
  var heat = document.getElementById('heat');
  heat.addEventListener('input', function () { S.heatSlider = parseFloat(heat.value); });

  // pointer stir on the glass
  var last = null;
  function pt(e) { var r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
  canvas.addEventListener('pointerdown', function (e) { last = pt(e); canvas.setPointerCapture(e.pointerId); poke(last, 0, 0); });
  canvas.addEventListener('pointermove', function (e) {
    if (!last) return; var p = pt(e); poke(p, p.x - last.x, p.y - last.y); last = p;
  });
  canvas.addEventListener('pointerup', function () { last = null; });
  canvas.addEventListener('pointercancel', function () { last = null; });
  function poke(p, dx, dy) {
    S.blobs.forEach(function (b) {
      var d = Math.hypot(b.x - p.x, b.y - p.y);
      if (d < 80) {
        var k = (1 - d / 80);
        b.vx += dx * 2.2 * k + (b.x - p.x) * 0.25 * k;
        b.vy += dy * 2.2 * k + (b.y - p.y) * 0.25 * k;
        b.t = Math.min(1, b.t + 0.05 * k + 0.02);
      }
    });
  }

  // physics
  function step(dt) {
    S.t += dt;
    var target = S.on ? 1 : 0;
    S.bulb += (target - S.bulb) * (1 - Math.exp(-dt / (S.on ? 6 : 9)));
    var heatK = S.bulb * S.heatSlider;
    var wk = 1 - Math.exp(-dt * 1.5);
    for (var i = 0; i < 12; i++) S.mix[i] += (S.target[i] - S.mix[i]) * wk;

    S.blobs.forEach(function (b) {
      var hp = (BOT - b.y) / (BOT - TOP);
      if (hp < 0.2) b.t += dt * 0.10 * heatK * b.rate * (1.3 - hp * 3);
      else if (hp > 0.6) b.t -= dt * 0.085 * b.rate * (0.5 + hp);
      else b.t -= dt * 0.012;
      b.t -= dt * 0.012 * (1 - heatK);
      b.t = Math.max(0, Math.min(1, b.t));
      var f = (b.t - 0.5) * 100;
      if (f < 0) f *= 1.3;
      var wob = Math.sin(S.t * 0.5 + b.ph) * 14;
      b.vy += (-f - b.vy * 1.8) * dt;
      b.vx += (wob * 0.4 - b.vx * 1.6 + (CX - b.x) * 0.15 * (0.3)) * dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      var lim = hw(b.y) - b.r * 0.55;
      if (b.x < CX - lim) { b.x = CX - lim; b.vx = Math.abs(b.vx) * 0.2; }
      if (b.x > CX + lim) { b.x = CX + lim; b.vx = -Math.abs(b.vx) * 0.2; }
      var floor = BOT - b.r * 0.7 - 6, ceil = TOP + b.r * 0.9;
      if (b.y > floor) { b.y = floor; b.vy = 0; }
      if (b.y < ceil) { b.y = ceil; b.vy *= 0.2; }
      b.s += ((1 + Math.min(0.7, Math.abs(b.vy) * 0.022)) - b.s) * Math.min(1, dt * 2);
      b.br = b.r * (1 + 0.05 * Math.sin(S.t * 0.8 + b.ph));
    });
    // separate near-duplicates slightly so blobs don't stack exactly
    for (var a = 0; a < S.blobs.length; a++) for (var c = a + 1; c < S.blobs.length; c++) {
      var A = S.blobs[a], B = S.blobs[c], dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy) + 0.01, m = (A.r + B.r) * 0.45;
      if (d < m) { var push = (m - d) * 0.5 * dt * 3; A.x -= dx / d * push; B.x += dx / d * push; A.y -= dy / d * push * 0.3; B.y += dy / d * push * 0.3; }
    }
  }

  // field render
  var CELL = 2, GX0 = CX - HW_B - 4, GW = Math.ceil((HW_B * 2 + 8) / CELL), GH = Math.ceil((BOT - TOP + 6) / CELL);
  var off = document.createElement('canvas'); off.width = GW; off.height = GH;
  var octx = off.getContext('2d'), img = octx.createImageData(GW, GH), px = img.data;
  function sstep(a, b, x) { x = (x - a) / (b - a); x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); }

  function renderWax() {
    var m = S.mix, bl = S.blobs, pl = S.pool, nb = bl.length, np = pl.length;
    var bulb = 0.25 + 0.75 * S.bulb;
    var poolY = BOT - 10;
    for (var gy = 0; gy < GH; gy++) {
      var y = TOP + gy * CELL + CELL / 2, hp = (BOT - y) / (BOT - TOP);
      var light = (0.5 + 0.55 * Math.pow(Math.max(0, 1 - hp), 1.6)) * bulb + 0.12;
      for (var gx = 0; gx < GW; gx++) {
        var x = GX0 + gx * CELL + CELL / 2, f = 0, i, dx, dy, d2;
        for (i = 0; i < nb; i++) {
          var b = bl[i]; dx = x - b.x; dy = (y - b.y) / b.s;
          d2 = dx * dx + dy * dy + 1; f += (b.br * b.br) / d2;
        }
        for (i = 0; i < np; i++) {
          var p = pl[i]; var pr = p.r + 3 * Math.sin(S.t * 0.6 + p.ph);
          dx = x - p.x; dy = y - (poolY + 6 * Math.sin(S.t * 0.45 + p.ph));
          d2 = dx * dx + dy * dy + 1; f += (pr * pr) / d2;
        }
        var o = (gy * GW + gx) * 4, a = sstep(0.96, 1.04, f);
        if (a <= 0.003) { px[o + 3] = 0; continue; }
        var k = sstep(1, 3.2, f), rim = 1 - sstep(1.05, 1.5, f);
        var kk = k * 0.55;
        var r = m[0] + (m[3] - m[0]) * kk, g = m[1] + (m[4] - m[1]) * kk, bb = m[2] + (m[5] - m[2]) * kk;
        var l = light * (1 - 0.35 * rim) + rim * 0.12;
        px[o] = Math.min(255, r * l + 28 * rim * bulb); px[o + 1] = Math.min(255, g * l + 12 * rim * bulb); px[o + 2] = Math.min(255, bb * l);
        px[o + 3] = a * 255;
      }
    }
    octx.putImageData(img, 0, 0);
  }

  // shapes
  function vesselPath(c) {
    var yT = TOP - 8, yB = BOT + 4;
    c.beginPath();
    c.moveTo(CX - HW_T - 2, yT);
    c.lineTo(CX + HW_T + 2, yT);
    c.bezierCurveTo(CX + HW_T + 8, TOP + 120, CX + HW_B - 20, TOP + 300, CX + HW_B + 2, yB - 18);
    c.quadraticCurveTo(CX + HW_B + 2, yB, CX + HW_B - 14, yB);
    c.lineTo(CX - HW_B + 14, yB);
    c.quadraticCurveTo(CX - HW_B - 2, yB, CX - HW_B - 2, yB - 18);
    c.bezierCurveTo(CX - HW_B + 20, TOP + 300, CX - HW_T - 8, TOP + 120, CX - HW_T - 2, yT);
    c.closePath();
  }
  function rgb(a, i, al) { return 'rgba(' + (a[i] | 0) + ',' + (a[i + 1] | 0) + ',' + (a[i + 2] | 0) + ',' + al + ')'; }

  function draw() {
    var m = S.mix, bulb = S.bulb;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // room glow behind the lamp
    var rg = ctx.createRadialGradient(CX, 520, 20, CX, 480, 205);
    rg.addColorStop(0, rgb(m, 9, 0.38 * bulb)); rg.addColorStop(0.5, rgb(m, 9, 0.10 * bulb)); rg.addColorStop(1, rgb(m, 9, 0));
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);

    // base (bell) - behind vessel bottom
    var baseTop = BOT + 2, baseBot = 692;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(CX - 96, baseTop);
    ctx.bezierCurveTo(CX - 90, baseTop + 50, CX - 56, baseTop + 80, CX - 100, baseBot);
    ctx.lineTo(CX + 100, baseBot);
    ctx.bezierCurveTo(CX + 56, baseTop + 80, CX + 90, baseTop + 50, CX + 96, baseTop);
    ctx.closePath();
    var bg = ctx.createLinearGradient(CX - 100, 0, CX + 100, 0);
    bg.addColorStop(0, '#1a1214'); bg.addColorStop(0.18, '#7d6f6a'); bg.addColorStop(0.32, '#d9cfc6');
    bg.addColorStop(0.5, '#6d605c'); bg.addColorStop(0.8, '#2a2023'); bg.addColorStop(1, '#0d0809');
    ctx.fillStyle = bg; ctx.fill();
    // glow leaking from the base top onto the metal
    var bgl = ctx.createLinearGradient(0, baseTop, 0, baseTop + 90);
    bgl.addColorStop(0, rgb(m, 9, 0.75 * bulb)); bgl.addColorStop(1, rgb(m, 9, 0));
    ctx.fillStyle = bgl; ctx.fill();
    ctx.restore();
    // base rim bottom
    ctx.fillStyle = '#0e0a0b'; ctx.fillRect(CX - 102, baseBot - 4, 204, 8);

    // vessel contents
    ctx.save();
    vesselPath(ctx); ctx.clip();
    var lg = ctx.createLinearGradient(0, TOP, 0, BOT);
    lg.addColorStop(0, rgb(m, 6, 0.10 + 0.10 * bulb)); lg.addColorStop(0.6, rgb(m, 6, 0.22 + 0.2 * bulb)); lg.addColorStop(1, rgb(m, 9, 0.45 + 0.4 * bulb));
    ctx.fillStyle = 'rgba(10,6,8,0.8)'; ctx.fillRect(0, TOP - 10, W, BOT - TOP + 20);
    ctx.fillStyle = lg; ctx.fillRect(0, TOP - 10, W, BOT - TOP + 20);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(off, GX0, TOP, GW * CELL, GH * CELL);
    // bulb pool of light from below, drawn over the wax
    ctx.globalCompositeOperation = 'lighter';
    var pg = ctx.createRadialGradient(CX, BOT + 10, 6, CX, BOT - 20, 190);
    pg.addColorStop(0, rgb(m, 9, 0.16 * bulb)); pg.addColorStop(0.5, rgb(m, 9, 0.04 * bulb)); pg.addColorStop(1, rgb(m, 9, 0));
    ctx.fillStyle = pg; ctx.fillRect(0, TOP, W, BOT - TOP + 20);
    ctx.globalCompositeOperation = 'source-over';
    // glass shading: edge darkening and highlights
    var eg = ctx.createLinearGradient(CX - HW_B, 0, CX + HW_B, 0);
    eg.addColorStop(0, 'rgba(0,0,0,0.5)'); eg.addColorStop(0.12, 'rgba(0,0,0,0)'); eg.addColorStop(0.88, 'rgba(0,0,0,0)'); eg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = eg; ctx.fillRect(0, TOP - 10, W, BOT - TOP + 20);
    ctx.restore();

    // glass highlights (streaks follow the taper)
    ctx.save(); vesselPath(ctx); ctx.clip();
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(CX - HW_T + 6, TOP + 8); ctx.bezierCurveTo(CX - HW_T + 2, TOP + 120, CX - HW_B + 32, TOP + 270, CX - HW_B + 16, BOT - 30); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(CX - HW_T + 16, TOP + 20); ctx.bezierCurveTo(CX - HW_T + 12, TOP + 120, CX - HW_B + 44, TOP + 260, CX - HW_B + 30, BOT - 50); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(CX + HW_T - 6, TOP + 24); ctx.bezierCurveTo(CX + HW_T, TOP + 140, CX + HW_B - 38, TOP + 280, CX + HW_B - 24, BOT - 40); ctx.stroke();
    ctx.restore();
    ctx.save(); vesselPath(ctx);
    ctx.strokeStyle = 'rgba(255,235,215,0.28)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();

    // cap
    var cy = TOP - 8;
    ctx.beginPath();
    ctx.moveTo(CX - HW_T - 6, cy + 2);
    ctx.lineTo(CX - HW_T - 6, cy - 8);
    ctx.bezierCurveTo(CX - HW_T - 6, cy - 34, CX - 18, cy - 54, CX - 10, cy - 64);
    ctx.quadraticCurveTo(CX, cy - 72, CX + 10, cy - 64);
    ctx.bezierCurveTo(CX + 18, cy - 54, CX + HW_T + 6, cy - 34, CX + HW_T + 6, cy - 8);
    ctx.lineTo(CX + HW_T + 6, cy + 2); ctx.closePath();
    var cg = ctx.createLinearGradient(CX - 44, 0, CX + 44, 0);
    cg.addColorStop(0, '#171011'); cg.addColorStop(0.22, '#8d807a'); cg.addColorStop(0.36, '#e6ddd4'); cg.addColorStop(0.55, '#7a6d69'); cg.addColorStop(1, '#120c0d');
    ctx.fillStyle = cg; ctx.fill();
    // warm light reaching the cap underside from the wax
    var cgl = ctx.createLinearGradient(0, cy + 2, 0, cy - 30);
    cgl.addColorStop(0, rgb(m, 9, 0.25 * bulb)); cgl.addColorStop(1, rgb(m, 9, 0));
    ctx.fillStyle = cgl; ctx.fill();
    // collar ring
    ctx.fillStyle = '#2a2022'; ctx.fillRect(CX - HW_T - 8, cy - 2, 2 * HW_T + 16, 5);
    // collar between vessel and base
    ctx.fillStyle = '#2a2022'; ctx.fillRect(CX - HW_B - 6, BOT + 3, 2 * HW_B + 12, 6);
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(CX - HW_B - 6, BOT + 3, 2 * HW_B + 12, 1.5);

    // glow shows through the lower base seam
    var seam = ctx.createRadialGradient(CX, BOT + 10, 4, CX, BOT + 10, 120);
    seam.addColorStop(0, rgb(m, 9, 0.3 * bulb)); seam.addColorStop(1, rgb(m, 9, 0));
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = seam; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  var statusEl = document.getElementById('status'), lastStatus = '', lastSt = 0;
  function updateStatus() {
    var rising = 0, sinking = 0;
    S.blobs.forEach(function (b) { if (b.vy < -4) rising++; else if (b.vy > 4) sinking++; });
    var s;
    if (!S.on) s = S.bulb > 0.05 ? 'Cooling: ' + Math.round(S.bulb * 100) + '% heat, ' + sinking + ' sinking' : 'Off: wax settled';
    else if (S.bulb < 0.6) s = 'Warming up: ' + Math.round(S.bulb * 100) + '% heat';
    else s = 'Lit: ' + rising + ' rising, ' + sinking + ' sinking' + (S.stirs ? ', stirred x' + S.stirs : '');
    if (s !== lastStatus) { statusEl.textContent = s; lastStatus = s; }
  }

  var prev = 0;
  function frame(ts) {
    var dt = prev ? Math.min(0.05, (ts - prev) / 1000) : 0.016; prev = ts;
    var n = reduce ? 0.5 : 1;
    step(dt * n);
    renderWax(); draw();
    if (ts - lastSt > 250) { lastSt = ts; updateStatus(); }
    requestAnimationFrame(frame);
  }
  // pre-roll so the lamp is already mid-cycle on load
  for (var k = 0; k < 600; k++) step(0.05);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
