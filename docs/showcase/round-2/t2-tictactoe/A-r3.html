<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe</title>
<style>
  :root { --bg:#f4f1ea; --ink:#2b2b2b; --x:#d9482b; --o:#2a7f8e; --line:#2b2b2b; --cell:#fffdf8; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; gap:18px; padding:16px; }
  h1 { margin:0; font-size:2rem; letter-spacing:.05em; }
  #status { font-size:1.2rem; min-height:1.6em; font-weight:600; }
  #board { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:min(90vw,360px); aspect-ratio:1; background:var(--line); padding:8px; border-radius:12px; }
  .cell { background:var(--cell); border:0; border-radius:6px; font-size:min(18vw,5rem); font-weight:700; cursor:pointer; padding:0; font-family:inherit; }
  .cell:hover:not(:disabled) { background:#f0ebdd; }
  .cell:focus-visible { outline:3px solid var(--o); outline-offset:-3px; }
  .cell:disabled { cursor:default; }
  .cell.X { color:var(--x); } .cell.O { color:var(--o); }
  .cell.win { background:#ffe9a8; }
  #scores { display:flex; gap:20px; font-size:1rem; }
  #scores span { padding:4px 12px; border-radius:20px; background:#e6e0d0; }
  button.reset { font:inherit; padding:10px 22px; border:0; border-radius:8px; background:var(--ink); color:#fff; cursor:pointer; }
  button.reset:hover { opacity:.85; }
</style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div id="status" aria-live="polite"></div>
  <div id="board"></div>
  <div id="scores"><span id="sx">X: 0</span><span id="sd">Draws: 0</span><span id="so">O: 0</span></div>
  <button class="reset" id="reset">New game</button>
<script>
(function(){
  var LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  var board, turn, over, scores={X:0,O:0,D:0}, starter='X';
  var boardEl=document.getElementById('board'), statusEl=document.getElementById('status');
  var cells=[];
  for(var i=0;i<9;i++){
    (function(i){
      var b=document.createElement('button');
      b.className='cell'; b.setAttribute('aria-label','Cell '+(i+1));
      b.addEventListener('click',function(){play(i);});
      boardEl.appendChild(b); cells.push(b);
    })(i);
  }
  function start(){
    board=Array(9).fill(''); turn=starter; over=false;
    cells.forEach(function(c){c.textContent='';c.className='cell';c.disabled=false;});
    statusEl.textContent='Player '+turn+"'s turn";
  }
  function play(i){
    if(over||board[i])return;
    board[i]=turn; cells[i].textContent=turn; cells[i].classList.add(turn); cells[i].disabled=true;
    var win=LINES.find(function(l){return board[l[0]]&&board[l[0]]===board[l[1]]&&board[l[1]]===board[l[2]];});
    if(win){
      over=true; scores[turn]++; win.forEach(function(k){cells[k].classList.add('win');});
      statusEl.textContent='Player '+turn+' wins!'; finish();
    } else if(board.every(Boolean)){
      over=true; scores.D++; statusEl.textContent="It's a draw!"; finish();
    } else {
      turn=turn==='X'?'O':'X'; statusEl.textContent='Player '+turn+"'s turn";
    }
  }
  function finish(){
    cells.forEach(function(c){c.disabled=true;});
    document.getElementById('sx').textContent='X: '+scores.X;
    document.getElementById('so').textContent='O: '+scores.O;
    document.getElementById('sd').textContent='Draws: '+scores.D;
    starter=starter==='X'?'O':'X';
  }
  document.getElementById('reset').addEventListener('click',start);
  start();
})();
</script>
</body>
</html>
