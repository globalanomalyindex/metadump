<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe</title>
<style>
  :root { --bg:#f4f1ea; --ink:#2b2b2b; --x:#d9480f; --o:#1c7ed6; --line:#cfc8b8; --win:#ffe8a3; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, Segoe UI, sans-serif; gap:16px; padding:16px; }
  h1 { margin:0; font-size:2rem; }
  #status { font-size:1.2rem; min-height:1.5em; font-weight:600; }
  #board { display:grid; grid-template-columns:repeat(3, min(28vw, 110px)); grid-auto-rows:min(28vw, 110px); gap:8px; }
  .cell { background:#fff; border:2px solid var(--line); border-radius:10px; font-size:3rem; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0; font-family:inherit; }
  .cell:hover:not(:disabled) { background:#faf7ef; }
  .cell:disabled { cursor:default; }
  .cell.X { color:var(--x); } .cell.O { color:var(--o); }
  .cell.win { background:var(--win); }
  #score { display:flex; gap:24px; font-size:1rem; }
  button.reset { font:inherit; padding:8px 18px; border-radius:8px; border:2px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; }
</style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div id="status" aria-live="polite"></div>
  <div id="board"></div>
  <div id="score"><span>X: <b id="sx">0</b></span><span>Draws: <b id="sd">0</b></span><span>O: <b id="so">0</b></span></div>
  <button class="reset" id="reset">New game</button>
<script>
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  let board, turn, over, scores = {X:0, O:0, D:0};
  const cells = [];
  for (let i = 0; i < 9; i++) {
    const b = document.createElement('button');
    b.className = 'cell';
    b.setAttribute('aria-label', 'Cell ' + (i + 1));
    b.addEventListener('click', () => play(i));
    boardEl.appendChild(b);
    cells.push(b);
  }
  function render(winLine) {
    cells.forEach((c, i) => {
      c.textContent = board[i] || '';
      c.className = 'cell' + (board[i] ? ' ' + board[i] : '') + (winLine && winLine.includes(i) ? ' win' : '');
      c.disabled = over || !!board[i];
    });
    document.getElementById('sx').textContent = scores.X;
    document.getElementById('so').textContent = scores.O;
    document.getElementById('sd').textContent = scores.D;
  }
  function play(i) {
    if (over || board[i]) return;
    board[i] = turn;
    const line = LINES.find(l => l.every(k => board[k] === turn));
    if (line) {
      over = true; scores[turn]++;
      statusEl.textContent = turn + ' wins!';
      render(line); return;
    }
    if (board.every(Boolean)) {
      over = true; scores.D++;
      statusEl.textContent = "It's a draw.";
      render(); return;
    }
    turn = turn === 'X' ? 'O' : 'X';
    statusEl.textContent = turn + "'s turn";
    render();
  }
  function reset() {
    board = Array(9).fill(null); turn = 'X'; over = false;
    statusEl.textContent = "X's turn";
    render();
  }
  document.getElementById('reset').addEventListener('click', reset);
  reset();
</script>
</body>
</html>
