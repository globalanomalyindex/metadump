<!doctype html>
<html lang="en">
<head><script>/* showcase copy: storage keys prefixed per build */(function(){var p="t4-blocks/F-r2"+':',S=Storage.prototype,g=S.getItem,s=S.setItem,r=S.removeItem;S.getItem=function(k){return g.call(this,p+k)};S.setItem=function(k,v){return s.call(this,p+k,v)};S.removeItem=function(k){return r.call(this,p+k)};})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Block Box</title>
<style>
:root{--bg:#1d2127;--panel:#272d35;--ink:#e9e4d6;--dim:#9aa0a6;--accent:#f2b84b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 16px}
h1{margin:0;font-size:18px;letter-spacing:.04em}
#bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.sw{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 12px 4px 6px;background:var(--panel);color:var(--ink);border:2px solid transparent;border-radius:8px;font:inherit;cursor:pointer}
.sw i{width:28px;height:28px;border-radius:5px;display:block;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.25)}
.sw.erase i{background:repeating-linear-gradient(45deg,#3a4049 0 5px,#2b3037 5px 10px);box-shadow:none}
.sw kbd{font:12px monospace;background:#0003;border-radius:4px;padding:1px 5px;color:var(--dim)}
.sw b{font-variant-numeric:tabular-nums;min-width:2ch;text-align:right;color:var(--dim);font-weight:600}
.sw:hover,.act:hover{filter:brightness(1.25)}
.sw[aria-pressed=true]{border-color:var(--accent);background:#343b45}
.sw:focus-visible,.act:focus-visible,canvas:focus-visible{outline:3px solid #8cc8ff;outline-offset:2px}
.act{min-height:44px;padding:0 16px;background:#3a2f2f;color:var(--ink);border:2px solid #6b4444;border-radius:8px;font:inherit;cursor:pointer}
.act.plain{background:var(--panel);border-color:#444c57}
.act:disabled{opacity:.4;cursor:default}
#wrap{width:min(100%,calc(100vh - 190px),720px);min-width:280px;aspect-ratio:1}
canvas{width:100%;height:100%;display:block;border-radius:6px;cursor:crosshair;touch-action:none;image-rendering:pixelated;box-shadow:0 4px 18px #0008}
#status{min-height:1.4em;color:var(--dim);text-align:center;font-variant-numeric:tabular-nums}
#hint{font-size:13px;color:var(--dim);text-align:center}
</style>
</head>
<body>
<h1>BLOCK BOX &middot; 32 &times; 32</h1>
<div id="bar" role="toolbar" aria-label="Block kinds"></div>
<div id="wrap"><canvas id="c" width="640" height="640" tabindex="0" aria-label="32 by 32 block world"></canvas></div>
<div id="status" role="status" aria-live="polite">Empty world. Click a cell to place a block.</div>
<div id="hint">Click or drag to place &middot; right-click or drag to remove &middot; keys 1&ndash;4 pick a kind, 0 erases &middot; C clears, Z undoes</div>
<script>
(function(){
var N=32, CELL=20, SIZE=N*CELL;
var KINDS=[
 {name:'Grass',color:'#5fae4e'},
 {name:'Stone',color:'#8a9199'},
 {name:'Wood',color:'#b07a45'},
 {name:'Water',color:'#3f8fd8'}
];
var grid=new Uint8Array(N*N); // 0 empty, 1..4 kind
var sel=1, hover=null, painting=null, undoStack=[], lastCleared=null;
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var bar=document.getElementById('bar'), status=document.getElementById('status');
var flash={}; // idx -> time

function shade(hex,amt){var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
 function f(v){return Math.max(0,Math.min(255,v+amt))}return 'rgb('+f(r)+','+f(g)+','+f(b)+')'}

// palette
var btns=[];
KINDS.forEach(function(k,i){
 var b=document.createElement('button');b.className='sw';b.type='button';
 b.innerHTML='<i style="background:'+k.color+'"></i><span>'+k.name+'</span><kbd>'+(i+1)+'</kbd><b>0</b>';
 b.onclick=function(){pick(i+1)};bar.appendChild(b);btns.push(b);
});
var eb=document.createElement('button');eb.className='sw erase';eb.type='button';
eb.innerHTML='<i></i><span>Erase</span><kbd>0</kbd>';eb.onclick=function(){pick(0)};bar.appendChild(eb);btns.unshift(eb);
// btns index: 0 erase, 1..4 kinds
var undoB=document.createElement('button');undoB.className='act plain';undoB.type='button';undoB.textContent='Undo';undoB.disabled=true;undoB.onclick=undo;bar.appendChild(undoB);
var clr=document.createElement('button');clr.className='act';clr.type='button';clr.textContent='Clear';clr.onclick=clearAll;bar.appendChild(clr);

function pick(k){sel=k;refreshUI();say(k?('Selected '+KINDS[k-1].name):'Erase mode: clicks take blocks out')}
function say(t){status.textContent=t}
function refreshUI(){
 var counts=[0,0,0,0,0];for(var i=0;i<grid.length;i++)counts[grid[i]]++;
 btns.forEach(function(b,i){b.setAttribute('aria-pressed',String(i===sel));if(i>0)b.querySelector('b').textContent=counts[i]});
 undoB.disabled=!undoStack.length;
 draw();
}

function cellAt(e){
 var r=cv.getBoundingClientRect();
 var x=Math.floor((e.clientX-r.left)/r.width*N), y=Math.floor((e.clientY-r.top)/r.height*N);
 if(x<0||y<0||x>=N||y>=N)return null;return {x:x,y:y};
}
function setCell(c,v,rec){
 var i=c.y*N+c.x;if(grid[i]===v)return false;
 rec.push([i,grid[i]]);grid[i]=v;flash[i]=performance.now();return true;
}
function describe(c){
 var v=grid[c.y*N+c.x];
 return 'Column '+(c.x+1)+', row '+(c.y+1)+': '+(v?KINDS[v-1].name:'empty');
}

var stroke=null;
function apply(c,mode){ // mode 'place' or 'remove'
 if(!c)return;
 var changed=setCell(c,mode==='place'?sel:0,stroke);
 if(changed){refreshUI();
  var v=grid[c.y*N+c.x];
  say((v?'Placed '+KINDS[v-1].name:'Removed block')+' at column '+(c.x+1)+', row '+(c.y+1));}
 if(flash)requestAnimationFrame(tick);
}
cv.addEventListener('contextmenu',function(e){e.preventDefault()});
cv.addEventListener('pointerdown',function(e){
 e.preventDefault();cv.focus({preventScroll:true});
 try{cv.setPointerCapture(e.pointerId)}catch(_){}
 painting=(e.button===2)?'remove':'place';
 if(e.button===1)return;
 stroke=[];hover=cellAt(e);apply(hover,painting);
});
cv.addEventListener('pointermove',function(e){
 var c=cellAt(e);
 var moved=!hover||!c||c.x!==hover.x||c.y!==hover.y;
 hover=c;
 if(painting&&moved&&c)apply(c,painting);
 else if(moved){if(c)say(describe(c));draw();}
});
function end(){
 if(painting&&stroke&&stroke.length){undoStack.push(stroke);if(undoStack.length>100)undoStack.shift();}
 painting=null;stroke=null;refreshUI();
}
cv.addEventListener('pointerup',end);
cv.addEventListener('pointercancel',end);
cv.addEventListener('pointerleave',function(){if(!painting){hover=null;draw()}});

function undo(){
 var s=undoStack.pop();if(!s)return;
 for(var i=s.length-1;i>=0;i--){grid[s[i][0]]=s[i][1];}
 say('Undid last action');refreshUI();
}
function clearAll(){
 var any=false;for(var i=0;i<grid.length;i++)if(grid[i]){any=true;break}
 if(!any){say('Already empty');return}
 var s=[];for(var j=0;j<grid.length;j++)if(grid[j]){s.push([j,grid[j]]);grid[j]=0}
 undoStack.push(s);say('World cleared. Press Undo or Z to bring it back.');refreshUI();
}
document.addEventListener('keydown',function(e){
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 var k=e.key;
 if(k>='0'&&k<='4'){pick(+k);}
 else if(k==='c'||k==='C'){clearAll()}
 else if(k==='z'||k==='Z'){undo()}
});

function tick(){
 var now=performance.now(),live=false;
 for(var k in flash){if(now-flash[k]<180)live=true;else delete flash[k]}
 draw();if(live)requestAnimationFrame(tick);
}

function draw(){
 ctx.fillStyle='#22272e';ctx.fillRect(0,0,SIZE,SIZE);
 // subtle checker so the empty world reads as a grid
 ctx.fillStyle='#262c34';
 for(var y=0;y<N;y++)for(var x=0;x<N;x++)if((x+y)&1)ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
 var now=performance.now();
 for(var i=0;i<grid.length;i++){
  var v=grid[i];if(!v)continue;
  var x2=(i%N)*CELL,y2=Math.floor(i/N)*CELL,col=KINDS[v-1].color;
  ctx.fillStyle=col;ctx.fillRect(x2,y2,CELL,CELL);
  ctx.fillStyle=shade(col,40);ctx.fillRect(x2,y2,CELL,3);
  ctx.fillStyle=shade(col,-45);ctx.fillRect(x2,y2+CELL-3,CELL,3);
  if(flash[i]!==undefined){var a=1-(now-flash[i])/180;if(a>0){ctx.fillStyle='rgba(255,255,255,'+(a*.6)+')';ctx.fillRect(x2,y2,CELL,CELL)}}
 }
 // grid lines
 ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;ctx.beginPath();
 for(var g=0;g<=N;g++){var p=g*CELL+.5;ctx.moveTo(p,0);ctx.lineTo(p,SIZE);ctx.moveTo(0,p);ctx.lineTo(SIZE,p)}
 ctx.stroke();
 // every 8 cells a stronger line to find your place
 ctx.strokeStyle='rgba(255,255,255,.13)';ctx.beginPath();
 for(var m=8;m<N;m+=8){var q=m*CELL+.5;ctx.moveTo(q,0);ctx.lineTo(q,SIZE);ctx.moveTo(0,q);ctx.lineTo(SIZE,q)}
 ctx.stroke();
 // hover: ghost of the chosen kind plus outline
 if(hover){
  var hx=hover.x*CELL,hy=hover.y*CELL;
  if(sel){ctx.globalAlpha=.45;ctx.fillStyle=KINDS[sel-1].color;ctx.fillRect(hx,hy,CELL,CELL);ctx.globalAlpha=1}
  ctx.strokeStyle=sel?'#fff':'#ff7a6b';ctx.lineWidth=2;ctx.strokeRect(hx+1,hy+1,CELL-2,CELL-2);
 }
}
refreshUI();
})();
</script>
</body>
</html>
