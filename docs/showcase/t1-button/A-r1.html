<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halcyon Sleep Studio - Reserve a session</title>
<style>
:root{
  --ink:#1d1a33; --ink-soft:#5b5878; --bg1:#f4f0ff; --bg2:#e6f1fb; --bg3:#fbeaf3;
  --violet:#8b7cf6; --sky:#7cc4f0; --rose:#f4a6cf; --mint:#a8ecd8;
  /* custom curves */
  --drift: cubic-bezier(.22,.8,.18,1.02);      /* soft overshoot, like surfacing */
  --exhale: cubic-bezier(.16,1,.3,1);           /* long slow settle */
  --veil: cubic-bezier(.65,.02,.22,.98);        /* slow in, slow out */
  --press: cubic-bezier(.3,0,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family: ui-serif, Georgia, "Times New Roman", serif;
  color:var(--ink); min-height:100vh;
  background:
    radial-gradient(60% 50% at 15% 10%, var(--bg3), transparent 70%),
    radial-gradient(55% 55% at 90% 20%, var(--bg2), transparent 70%),
    linear-gradient(180deg,var(--bg1),#f9f7ff);
  display:grid; place-items:center; padding:32px 16px;
}
.card{
  width:100%; max-width:520px; background:rgba(255,255,255,.65);
  border:1px solid rgba(255,255,255,.9); border-radius:28px; padding:36px 32px 28px;
  box-shadow:0 30px 80px -30px rgba(90,70,170,.35);
  backdrop-filter:blur(10px);
}
.eyebrow{font:600 12px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--violet);margin:0 0 14px}
h1{font-weight:500;font-size:clamp(28px,6vw,36px);line-height:1.15;margin:0 0 12px;letter-spacing:-.01em}
p.lead{font:400 16px/1.6 ui-sans-serif,system-ui,sans-serif;color:var(--ink-soft);margin:0 0 24px}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px;padding:0;border:0}
.slots legend{font:600 13px ui-sans-serif,system-ui,sans-serif;margin-bottom:10px;padding:0}
.slots label{position:relative}
.slots input{position:absolute;opacity:0;inset:0;cursor:pointer}
.slots span{
  display:block;padding:10px 14px;border-radius:999px;font:500 14px ui-sans-serif,system-ui,sans-serif;
  background:#fff;border:1px solid #e3def7;color:var(--ink-soft);
  transition:all .5s var(--exhale);
}
.slots input:hover + span{border-color:var(--violet);transform:translateY(-1px)}
.slots input:checked + span{background:var(--ink);color:#fff;border-color:var(--ink)}
.slots input:focus-visible + span{outline:3px solid var(--violet);outline-offset:2px}
.slots input:disabled + span{opacity:.4;text-decoration:line-through}

/* ---------- The button ---------- */
.dream{
  --mx:50%; --my:50%;
  position:relative; isolation:isolate; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:.7em;
  min-height:56px; width:100%; padding:0 32px;
  border:0; border-radius:999px; color:#fff;
  font:600 17px/1 ui-sans-serif,system-ui,sans-serif; letter-spacing:.02em;
  background:linear-gradient(115deg,#6f62e8,#8b7cf6 40%,#6fb4ec 100%);
  background-size:160% 160%; background-position:0% 50%;
  box-shadow:0 10px 24px -10px rgba(111,98,232,.7), inset 0 1px 0 rgba(255,255,255,.35);
  transition:
    transform .9s var(--drift),
    box-shadow 1.1s var(--exhale),
    background-position 1.4s var(--veil),
    letter-spacing .9s var(--exhale);
  -webkit-tap-highlight-color:transparent;
}
/* soft halo that blooms outside the button */
.dream::before{
  content:""; position:absolute; inset:-14px; border-radius:inherit; z-index:-2;
  background:conic-gradient(from 0deg,var(--violet),var(--sky),var(--mint),var(--rose),var(--violet));
  filter:blur(22px); opacity:0; transform:scale(.88);
  transition:opacity 1.2s var(--exhale), transform 1.4s var(--drift);
  animation:spin 14s linear infinite paused;
}
/* light that follows the pointer + slow veil sweep */
.dream::after{
  content:""; position:absolute; inset:0; border-radius:inherit; z-index:-1; pointer-events:none;
  background:
    radial-gradient(120px 80px at var(--mx) var(--my), rgba(255,255,255,.55), transparent 70%),
    linear-gradient(105deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
  background-size:100% 100%, 250% 100%; background-position:0 0, 160% 0;
  opacity:0; transition:opacity .8s var(--exhale), background-position 1.6s var(--veil);
}
.dream .label{display:inline-block;transition:transform .9s var(--drift)}
.dream .arrow{display:inline-block;width:1.1em;height:1.1em;transition:transform 1s var(--drift), opacity .6s}
.dream:hover, .dream:focus-visible{
  transform:translateY(-3px) scale(1.015); letter-spacing:.045em;
  background-position:100% 50%;
  box-shadow:0 22px 44px -14px rgba(111,98,232,.65), 0 0 0 1px rgba(255,255,255,.4) inset, inset 0 1px 0 rgba(255,255,255,.5);
}
.dream:hover::before,.dream:focus-visible::before{opacity:.55;transform:scale(1);animation-play-state:running}
.dream:hover::after,.dream:focus-visible::after{opacity:1;background-position:0 0, -60% 0}
.dream:hover .arrow,.dream:focus-visible .arrow{transform:translateX(5px)}
.dream:focus-visible{outline:3px solid var(--ink);outline-offset:5px}
.dream:active{
  transform:translateY(0) scale(.985);
  transition-duration:.25s,.4s,1.4s,.9s; transition-timing-function:var(--press);
}
.dream[aria-busy="true"]{cursor:progress;pointer-events:none;letter-spacing:.02em}
.dream[aria-busy="true"] .arrow{opacity:0;transform:translateX(-8px)}
.dream .spinner{width:1.1em;height:1.1em;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;display:none;animation:spin .9s linear infinite}
.dream[aria-busy="true"] .spinner{display:inline-block}
.dream[aria-busy="true"] .arrow{display:none}
.dream[data-state="done"]{background-image:linear-gradient(115deg,#3fb89b,#6fd3b4 50%,#7cc4f0);pointer-events:none;box-shadow:0 14px 30px -12px rgba(63,184,155,.7)}
.dream:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.dream:disabled::before,.dream:disabled::after{opacity:0}
@keyframes spin{to{transform:rotate(360deg)}}
.dream::before{ /* spin the halo without clobbering scale */ }

.status{font:500 14px/1.5 ui-sans-serif,system-ui,sans-serif;color:var(--ink-soft);margin:16px 0 0;min-height:21px;text-align:center}
.status strong{color:var(--ink)}
.reset{display:block;margin:10px auto 0;background:none;border:0;color:var(--violet);font:500 13px ui-sans-serif,system-ui,sans-serif;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:6px}
.reset[hidden]{display:none}
.meta{display:flex;justify-content:space-between;font:400 13px ui-sans-serif,system-ui,sans-serif;color:var(--ink-soft);margin-top:22px;padding-top:18px;border-top:1px solid #e8e4f7}

@media (prefers-reduced-motion:reduce){
  .dream,.dream::before,.dream::after,.dream .arrow{transition-duration:.01ms!important;animation:none!important}
  .dream:hover,.dream:focus-visible{transform:none;letter-spacing:.02em}
}
@media (hover:none){ .dream:hover{transform:none;letter-spacing:.02em} }
</style>
</head>
<body>
<main class="card">
  <p class="eyebrow">Halcyon Sleep Studio</p>
  <h1>A quieter night starts with one evening.</h1>
  <p class="lead">Reserve a 60-minute guided wind-down session: breathwork, soft light and a personal sleep plan. Small groups, no phones, tea included.</p>

  <form id="form" novalidate>
    <fieldset class="slots">
      <legend>Choose an evening</legend>
      <label><input type="radio" name="slot" value="Thu 13 Nov, 7:30 pm"><span>Thu 13 Nov, 7:30 pm</span></label>
      <label><input type="radio" name="slot" value="Sat 15 Nov, 6:00 pm"><span>Sat 15 Nov, 6:00 pm</span></label>
      <label><input type="radio" name="slot" value="Tue 18 Nov, 8:00 pm"><span>Tue 18 Nov, 8:00 pm</span></label>
      <label><input type="radio" name="slot" value="Fri 21 Nov, 7:00 pm" disabled><span>Fri 21 Nov, full</span></label>
    </fieldset>

    <button class="dream" id="reserve" type="submit" aria-describedby="status">
      <span class="spinner" aria-hidden="true"></span>
      <span class="label">Reserve my place</span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <p class="status" id="status" role="status" aria-live="polite">Pick an evening to continue.</p>
    <button type="button" class="reset" id="reset" hidden>Cancel reservation</button>
  </form>

  <div class="meta"><span>$48 per person</span><span>Spots left: <strong id="left">7</strong> of 12</span></div>
</main>

<script>
(function(){
  var form=document.getElementById('form'), btn=document.getElementById('reserve');
  var label=btn.querySelector('.label'), status=document.getElementById('status');
  var reset=document.getElementById('reset'), leftEl=document.getElementById('left');
  var left=7, timer=null, reserved=null;

  // pointer-following light
  btn.addEventListener('pointermove',function(e){
    var r=btn.getBoundingClientRect();
    btn.style.setProperty('--mx',(e.clientX-r.left)+'px');
    btn.style.setProperty('--my',(e.clientY-r.top)+'px');
  });
  btn.addEventListener('pointerleave',function(){
    btn.style.setProperty('--mx','50%');btn.style.setProperty('--my','50%');
  });

  form.addEventListener('change',function(){
    if(btn.dataset.state==='done')return;
    var v=form.slot.value;
    status.innerHTML=v?'Selected: <strong>'+v+'</strong>':'Pick an evening to continue.';
  });

  form.addEventListener('submit',function(e){
    e.preventDefault();
    if(btn.dataset.state==='done'||btn.getAttribute('aria-busy')==='true')return;
    var v=form.slot.value;
    if(!v){
      status.textContent='Please choose an evening first.';
      btn.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:420,easing:'cubic-bezier(.36,.07,.19,.97)'});
      return;
    }
    btn.setAttribute('aria-busy','true');
    label.textContent='Holding your place...';
    status.textContent='One moment.';
    timer=setTimeout(function(){
      btn.removeAttribute('aria-busy');
      btn.dataset.state='done';
      reserved=v; left=Math.max(0,left-1); leftEl.textContent=left;
      label.textContent='Reserved';
      status.innerHTML='You are in. <strong>'+v+'</strong>. A confirmation is on its way.';
      reset.hidden=false;
      Array.prototype.forEach.call(form.slot,function(r){r.disabled=true});
    },1600);
  });

  reset.addEventListener('click',function(){
    clearTimeout(timer);
    btn.dataset.state='';
    label.textContent='Reserve my place';
    left=Math.min(12,left+1); leftEl.textContent=left;
    Array.prototype.forEach.call(form.slot,function(r){r.disabled=r.value.indexOf('21 Nov')>-1;r.checked=false});
    status.textContent='Reservation cancelled. Pick an evening to continue.';
    reset.hidden=true; btn.focus();
  });
})();
</script>
</body>
</html>
