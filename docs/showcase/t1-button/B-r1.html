<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Journal - Dreamlike Button</title>
<style>
:root{
  --ink:#eef0ff;
  --ink-dim:#aab0d6;
  --night:#0b0d1f;
  --moon:#8fb8ff;
  --lilac:#b79cff;
  --rose:#ffb3d9;
  /* curves: hand-written, one per job */
  --c-arrive: cubic-bezier(.16,.84,.28,1);      /* fast landing, long low tail */
  --c-glow-in: cubic-bezier(.22,.6,.12,1);      /* glow keeps arriving after the lift stops */
  --c-exit: cubic-bezier(.4,0,.2,1);
  --c-breath-rise: cubic-bezier(.7,0,.9,.5);    /* slow gather */
  --c-breath-fall: cubic-bezier(.1,.4,.9,.6);   /* looser release */
  --c-float: cubic-bezier(.45,0,.55,1);
  --c-press: cubic-bezier(.3,.7,.4,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;
  font-family: ui-serif, "Iowan Old Style", Georgia, "Times New Roman", serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 15% -10%, #2a2160 0%, transparent 60%),
    radial-gradient(900px 600px at 95% 110%, #12335e 0%, transparent 60%),
    var(--night);
  display:grid;place-items:center;
  padding:48px 16px;
}
/* faint star pattern behind everything so translucency is visible */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:
    radial-gradient(1px 1px at 20px 30px, #fff8, transparent),
    radial-gradient(1px 1px at 90px 80px, #fff6, transparent),
    radial-gradient(1.5px 1.5px at 150px 20px, #cde4ff99, transparent);
  background-size:180px 120px;
}
main{position:relative;width:100%;max-width:520px}
.eyebrow{font:600 12px/1 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--moon);margin:0 0 18px}
h1{font-weight:400;font-size:clamp(32px,7vw,46px);line-height:1.1;margin:0 0 14px;letter-spacing:-.01em}
p.lede{font:400 17px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink-dim);margin:0 0 28px}
form{display:flex;flex-direction:column;gap:14px}
label.field{font:500 13px ui-sans-serif,system-ui,sans-serif;color:var(--ink-dim)}
input[type=email]{
  display:block;width:100%;margin-top:8px;min-height:48px;padding:0 16px;
  font:400 16px ui-sans-serif,system-ui,sans-serif;color:var(--ink);
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:14px;
  transition:border-color .3s var(--c-exit), background .3s var(--c-exit);
}
input[type=email]::placeholder{color:#8088b4}
input[type=email]:focus-visible{outline:2px solid var(--moon);outline-offset:2px;background:rgba(255,255,255,.1)}
.row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:6px}
.status{font:400 14px/1.4 ui-sans-serif,system-ui,sans-serif;color:var(--ink-dim);min-height:20px}
.status b{color:var(--ink);font-weight:600}

/* ---------- the button ---------- */
.dream{
  --mx:50%; --my:50%;
  position:relative;isolation:isolate;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:52px;min-width:180px;padding:0 30px;
  font:600 16px/1 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.02em;
  color:var(--ink);cursor:pointer;
  border:0;border-radius:999px;
  background:linear-gradient(135deg, rgba(143,184,255,.28), rgba(183,156,255,.22) 55%, rgba(255,179,217,.2));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 0 0 1px rgba(200,215,255,.35);
  -webkit-tap-highlight-color:transparent;
  transform:translate3d(0,0,0) scale(1);
  transition:
    transform .55s var(--c-exit),
    box-shadow .55s var(--c-exit);
}
/* contrast plate: holds the label at >= 4.5:1 even where the glow peaks */
.dream::after{
  content:"";position:absolute;inset:3px;border-radius:inherit;z-index:-1;
  background:rgba(12,14,38,.72);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:background .5s var(--c-exit);
}
/* glow layer: opacity-only animation, breathes at rest */
.dream::before{
  content:"";position:absolute;inset:-10px;border-radius:inherit;z-index:-2;pointer-events:none;
  background:
    radial-gradient(120px 80px at var(--mx) var(--my), rgba(255,255,255,.75), transparent 70%),
    linear-gradient(120deg, var(--moon), var(--lilac) 50%, var(--rose));
  filter:blur(14px);
  opacity:.28;
  animation: breath 7s infinite;
  transition: opacity .5s var(--c-exit);
}
@keyframes breath{
  0%{opacity:.2;animation-timing-function:var(--c-breath-rise)}
  62%{opacity:.5;animation-timing-function:var(--c-breath-fall)}
  100%{opacity:.2}
}
.dream .label{position:relative;transition:letter-spacing .9s var(--c-arrive)}
.dream .spark{
  width:14px;height:14px;flex:none;color:var(--moon);
  transition:transform 1.1s var(--c-arrive), color .6s var(--c-glow-in);
}

@media (hover:hover){
  .dream:hover{
    transform:translate3d(0,-3px,0) scale(1.025);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.8), inset 0 0 0 1px rgba(220,230,255,.7);
    transition:
      transform 1.1s var(--c-arrive),
      box-shadow .9s var(--c-glow-in);
    animation: float 4.4s 1.1s infinite var(--c-float);
  }
  .dream:hover::before{
    opacity:.85;
    animation:none;
    transition: opacity 1.4s var(--c-glow-in);   /* long tail: glow keeps arriving */
  }
  .dream:hover .label{letter-spacing:.07em}
  .dream:hover .spark{transform:rotate(90deg) scale(1.25);color:var(--rose)}
}
@keyframes float{
  0%,100%{transform:translate3d(0,-3px,0) scale(1.025)}
  50%{transform:translate3d(0,-6px,0) scale(1.025)}
}
/* keyboard focus: same glow as hover plus a hard ring */
.dream:focus-visible{outline:2px solid #fff;outline-offset:5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.8), inset 0 0 0 1px rgba(220,230,255,.7), 0 0 0 5px rgba(143,184,255,.35)}
.dream:focus-visible::before{opacity:.8;animation:none}
/* press: answers at once, cuts the breath */
.dream:active{
  transform:translate3d(0,1px,0) scale(.965);
  animation:none;
  transition:transform .08s var(--c-press), box-shadow .08s var(--c-press);
}
.dream:active::before{opacity:1;transition:opacity .08s linear;animation:none}
.dream:active::after{background:rgba(12,14,38,.85)}
.dream[disabled],.dream[aria-busy="true"]{cursor:progress}
.dream[aria-busy="true"]::before{animation:none;opacity:.5}
.dream .done{display:none}
.dream[data-state="done"] .idle{display:none}
.dream[data-state="done"] .done{display:inline}
.dream[data-state="done"]::before{animation:none;opacity:.7;background:linear-gradient(120deg,#8ff0c8,var(--moon))}

/* ghost variant sharing the same curves */
.quiet{
  min-height:44px;padding:0 6px;background:none;border:0;color:var(--ink-dim);cursor:pointer;
  font:500 14px ui-sans-serif,system-ui,sans-serif;text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(170,176,214,.4);
  transition:color .5s var(--c-exit), text-decoration-color .9s var(--c-glow-in);
}
.quiet:hover{color:var(--ink);text-decoration-color:var(--lilac)}
.quiet:focus-visible{outline:2px solid var(--moon);outline-offset:3px;border-radius:6px}

@media (prefers-reduced-motion:reduce){
  .dream,.dream::before,.dream::after,.dream .label,.dream .spark{animation:none!important}
  .dream:hover{transform:none;animation:none}
  .dream:hover .spark{transform:none}
  .dream:hover .label{letter-spacing:.02em}
  .dream{transition:box-shadow .3s linear}
  .dream::before{transition:opacity .3s linear!important}
  .dream:active{transform:none}
}
@media (max-width:420px){.dream{width:100%}}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Lumen Journal</p>
  <h1>Letters from the hour before sleep.</h1>
  <p class="lede">One short essay every Sunday night: slow reading, soft light, nothing to reply to. 4,212 people read it with their lamps turned low.</p>
  <form id="f" novalidate>
    <label class="field">Email address
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
    </label>
    <div class="row">
      <button class="dream" id="go" type="submit" data-state="idle">
        <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0c.8 6.2 5.8 11.2 12 12-6.2.8-11.2 5.8-12 12-.8-6.200-5.800-11.200-12-12C6.200 11.200 11.200 6.200 12 0z"/></svg>
        <span class="label idle">Join the letters</span>
        <span class="label done">You're on the list</span>
      </button>
      <button class="quiet" type="button" id="undo" hidden>Undo</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite">Free. Unsubscribe whenever you like.</div>
  </form>
</main>
<script>
(function(){
  var btn=document.getElementById('go'), f=document.getElementById('f'),
      email=document.getElementById('email'), st=document.getElementById('status'),
      undo=document.getElementById('undo'), count=4212, timer=null;
  // light that follows the pointer
  btn.addEventListener('pointermove',function(e){
    var r=btn.getBoundingClientRect();
    btn.style.setProperty('--mx',(e.clientX-r.left)+'px');
    btn.style.setProperty('--my',(e.clientY-r.top)+'px');
  });
  btn.addEventListener('pointerleave',function(){
    btn.style.setProperty('--mx','50%');btn.style.setProperty('--my','50%');
  });
  function reset(){
    clearTimeout(timer);
    btn.dataset.state='idle';btn.removeAttribute('aria-busy');btn.disabled=false;
    undo.hidden=true;
  }
  f.addEventListener('submit',function(e){
    e.preventDefault();
    if(btn.dataset.state==='done'||btn.getAttribute('aria-busy')==='true')return;
    var v=email.value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){
      st.textContent='That address looks incomplete. Try name@domain.com.';
      email.setAttribute('aria-invalid','true');email.focus();return;
    }
    email.removeAttribute('aria-invalid');
    btn.setAttribute('aria-busy','true');btn.disabled=true;
    st.textContent='Sending...';
    timer=setTimeout(function(){
      btn.disabled=false;btn.removeAttribute('aria-busy');
      btn.dataset.state='done';count++;
      st.innerHTML='Welcome. <b>'+count.toLocaleString('en-US')+'</b> readers now. First letter arrives Sunday.';
      undo.hidden=false;
    },900);
  });
  undo.addEventListener('click',function(){
    reset();count--;st.textContent='Removed. Free. Unsubscribe whenever you like.';btn.focus();
  });
})();
</script>
</body>
</html>
